// ── cloud-code (#743): fleet mesh membership ──
// Cordova regenerates platforms/android/settings.gradle on every build, so a
// module cannot be included there; cordova-android 15 applies THIS file from it
// (ProjectBuilder.prepBuildFiles), and config.xml copies it to the platform root.
// The shared modules come from the app's ONE build.json::modules (two levels up:
// platforms/android -> ac_cloud-code), and each dir is resolved against THAT
// directory — the base the ship workflow's triggers and the publish gate resolve
// it against — never against this gradle root. libs:devtools is in the map, not
// optional: core declares `api project(':libs:devtools')`, which resolves against
// THIS settings file.
def cloudAppDir = '../..'
def cloudBuildJson = new groovy.json.JsonSlurper().parse(file("${cloudAppDir}/build.json"))
cloudBuildJson.modules.each { name, _spec ->
    if (name.startsWith('_')) return
    include ":${name}"
    project(":${name}").projectDir = file("${cloudAppDir}/${_spec?.dir ?: name.replace(':', '/')}")
}
// Gradle 9 fails outright on a project directory that does not exist, and the
// implicit ':libs' container resolves to <root>/libs, which this project does
// not have. Point it at the shared root core lives in, as media-center does.
project(':libs').projectDir = project(':libs:core').projectDir.parentFile
