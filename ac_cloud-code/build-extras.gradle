android {
    packagingOptions {
        pickFirst 'META-INF/versions/9/OSGI-INF/MANIFEST.MF'
    }
    buildTypes {
        release {
            //might cause ClassNotFoundException errors
            //to fix those errors you need to either put @Keep on the class/feild or add a entry in progrud rules file
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

configurations {
  all {
      exclude module: 'commons-logging'
      exclude group: 'org.bouncycastle', module: 'bcprov-jdk15on'
      exclude group: 'org.bouncycastle', module: 'bcpkix-jdk15on'
      exclude group: 'org.bouncycastle', module: 'bcpkix-jdk18on'
      exclude group: 'org.bouncycastle', module: 'bcprov-jdk18on'
  }
}
// ── cloud-code (#562): install identity comes from the fleet declaration ──
// build.json::android is the ONE declaration of this app's applicationId and
// version. Cordova derives both from config.xml's widget id/version, and that id
// must STAY com.foxdebug.acode: it is also the Java namespace, and upstream
// plugin sources import com.foxdebug.acode.R. So the namespace is left alone and
// only the install identity is overridden, in onVariants — which runs after the
// android {} block Cordova applies this file BEFORE (a DSL applicationId here
// would be silently overwritten by that block). ${applicationId} manifest
// placeholders resolve to the overridden value.
// #830 the build commit, baked into versionName "(sha-xxxxxxxx)" + BuildConfig.GIT_SHORT_SHA so
// Store Details (libs/appstore BuiltFrom) and About can name the installed build. Same
// derivation as the rest of the fleet (#826): GITHUB_SHA first, `git rev-parse` locally, 8 hex.
// versionCode is untouched.
def shortSha = (System.getenv('GITHUB_SHA')
                ?: providers.exec {
                       commandLine 'git', 'rev-parse', '--short=8', 'HEAD'
                       ignoreExitValue = true
                   }.standardOutput.asText.get().trim())
                .take(8)

def cloudBuildJson = new groovy.json.JsonSlurper().parse(new File(rootProject.projectDir, '../../build.json'))
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.applicationId.set(cloudBuildJson.android.application_id as String)
        variant.outputs.each { output ->
            output.versionCode.set(cloudBuildJson.android.version_code as Integer)
            output.versionName.set("${cloudBuildJson.android.version_name} (sha-${shortSha})")
        }
    }
}

// ── cloud-code (#741): the Alpine shell resolves through Android, not a server of its own ──
// libs/sysdns's SystemDnsBridge is compiled in BY REFERENCE (plain Java, its own source
// dir) so every fleet terminal runs the one bridge; its port is libs/sysdns's to declare.
def cloudDnsBridgeJson = new File(rootProject.projectDir, '../../../ab_cloud-libs-shared/libs/sysdns/data/sysdns.json')
def cloudDnsBridge = new groovy.json.JsonSlurper().parse(cloudDnsBridgeJson)
android {
    buildFeatures { buildConfig true }
    defaultConfig {
        buildConfigField "String", "GIT_SHORT_SHA", "\"${shortSha}\""
        buildConfigField 'int', 'CLOUD_DNS_BRIDGE_PORT', "${cloudDnsBridge.bridge_port as int}"
    }
    sourceSets {
        main {
            java.srcDirs += new File(cloudDnsBridgeJson.parentFile.parentFile, 'src/bridge/java')
        }
    }
}

// ── cloud-code (#743): fleet mesh member ──
// libs:core (+ devtools via `api`) merges the fleet provider, receiver, <queries>
// and the signature permission into this APK; nothing here calls it.
// settings-extras.gradle includes it from build.json::modules.
dependencies {
    implementation project(':libs:core')
}
