plugins {
    id "com.android.application"
}

ext {
    // The packageVariant defines the bootstrap variant that will be included in the app APK.
    // This must be supported by com.termux.shared.termux.TermuxBootstrap.PackageVariant or app will
    // crash at startup.
    // Bootstrap of a different variant must not be manually installed by the user after app installation
    // by replacing $PREFIX since app code is dependant on the variant used to build the APK.
    // Currently supported values are: [ "apt-android-7" "apt-android-5" ]
    packageVariant = System.getenv("TERMUX_PACKAGE_VARIANT") ?: "apt-android-7" // Default: "apt-android-7"
}

android {
    compileSdkVersion project.properties.compileSdkVersion.toInteger()
    ndkVersion = System.getenv("JITPACK_NDK_VERSION") ?: project.properties.ndkVersion
    def appVersionName = System.getenv("TERMUX_APP_VERSION_NAME") ?: ""
    def apkVersionTag = System.getenv("TERMUX_APK_VERSION_TAG") ?: ""
    def splitAPKsForDebugBuilds = System.getenv("TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS") ?: "1"
    def splitAPKsForReleaseBuilds = System.getenv("TERMUX_SPLIT_APKS_FOR_RELEASE_BUILDS") ?: "0" // F-Droid does not support split APKs #1904

    dependencies {
        implementation "androidx.annotation:annotation:1.3.0"
        implementation "androidx.core:core:1.6.0"
        implementation "androidx.drawerlayout:drawerlayout:1.1.1"
        implementation "androidx.preference:preference:1.1.1"
        implementation "androidx.viewpager:viewpager:1.0.0"
        implementation "com.google.android.material:material:1.4.0"
        implementation "com.google.guava:guava:24.1-jre"
        implementation "io.noties.markwon:core:$markwonVersion"
        implementation "io.noties.markwon:ext-strikethrough:$markwonVersion"
        implementation "io.noties.markwon:linkify:$markwonVersion"
        implementation "io.noties.markwon:recycler:$markwonVersion"

        implementation project(":terminal-view")
        implementation project(":termux-shared")
    }

    // NIX-ON-DROID: Downstream version.
    defaultConfig {
        applicationId "cld.termux"
        applicationIdSuffix ".nix"
        versionCode 188037
        versionName "0.118.0_v0.3.7_nix"
        // fdroid checkupdates looks for literal versionCode/versionName,
        // can't get fancy with these and use string interpolation and similar
        ndk {
          abiFilters 'arm64-v8a', 'x86_64'
        }

        minSdkVersion project.properties.minSdkVersion.toInteger()
        targetSdkVersion project.properties.targetSdkVersion.toInteger()

        if (appVersionName) versionName = appVersionName
        //validateVersionName(versionName)

        buildConfigField "String", "TERMUX_PACKAGE_VARIANT", "\"" + project.ext.packageVariant + "\"" // Used by TermuxApplication class

        manifestPlaceholders.TERMUX_PACKAGE_NAME = "cld.termux.nix"
        manifestPlaceholders.TERMUX_APP_NAME = "Cloud Terminal (Nix)"
        manifestPlaceholders.TERMUX_API_APP_NAME = "Termux:API"
        manifestPlaceholders.TERMUX_BOOT_APP_NAME = "Termux:Boot"
        manifestPlaceholders.TERMUX_FLOAT_APP_NAME = "Termux:Float"
        manifestPlaceholders.TERMUX_STYLING_APP_NAME = "Termux:Styling"
        manifestPlaceholders.TERMUX_TASKER_APP_NAME = "Termux:Tasker"
        manifestPlaceholders.TERMUX_WIDGET_APP_NAME = "Termux:Widget"

        /* NIX-ON-DROID: Unused
        // ABI, from the active release.variants[] entry. Same hook as
        // ac_cloud-nav: the engine exports CLOUDNAV_ABIS from the variant it
        // was asked to build, so one matrix job produces the arm64 APK and the
        // other the x86_64 one.
        //
        // Upstream's own `splits` block stays off (F-Droid cannot take split
        // APKs, so it defaults to a single universal build). Filtering here
        // instead is what every other app in this constellation does, and it
        // is why the first build shipped one 115MB APK carrying all four ABIs.
        ndk {
            def abiOverride = System.getenv('CLOUDNAV_ABIS')
            def abis = (abiOverride?.trim()) \
                ? abiOverride.split(',').collect { it.trim() }.findAll { it } \
                : ['arm64-v8a']
            abiFilters.addAll(abis as List)
        }

        externalNativeBuild {
            ndkBuild {
                cFlags "-std=c11", "-Wall", "-Wextra", "-Werror", "-Os", "-fno-stack-protector", "-Wl,--gc-sections"
            }
        }

        splits {
            abi {
                enable ((gradle.startParameter.taskNames.any { it.contains("Debug") } && splitAPKsForDebugBuilds == "1") ||
                    (gradle.startParameter.taskNames.any { it.contains("Release") } && splitAPKsForReleaseBuilds == "1"))
                reset ()
                include 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a'
                universalApk true
            }
        }
        */
        splits {
            abi {
                reset ()
                include 'arm64-v8a'
                universalApk false
            }
        }
    }


    signingConfigs {
        // Release signing, from the ONE shared constellation keystore.
        //
        // Upstream ships only a debug config, so assembleRelease produced an
        // unsigned APK. Ours must carry the same key as every other app here,
        // because CLOUD_EXEC is a signature-level permission: a build signed
        // with anything else is refused the bind exactly as if it were not
        // installed — a silent failure indistinguishable from "not there".
        //
        // Values come from the environment the fork engine writes
        // (signing=vault_jks_env, see build.json::forks.*.build.signing_env),
        // never from a file in the tree and never a literal here.
        release {
            def ksPath = System.getenv('TERMUX_KEYSTORE_PATH')
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv('TERMUX_KEYSTORE_PASSWORD')
                keyAlias System.getenv('TERMUX_KEY_ALIAS')
                keyPassword System.getenv('TERMUX_KEY_PASSWORD')
            }
        }

        debug {
            storeFile file('testkey_untrusted.jks')
            keyAlias 'alias'
            storePassword 'xrj45yWGLbsO7W0v'
            keyPassword 'xrj45yWGLbsO7W0v'
        }
    }

    buildTypes {
        release {
            // Only when the engine supplied a key: an IDE build with no vault
            // signs debug-style rather than failing, and a CI build without it
            // would produce an unsigned APK that cannot bind — which is worth
            // noticing at install time, not at first use.
            if (System.getenv('TERMUX_KEYSTORE_PATH')) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources false // Reproducible builds
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled true

        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    /* NIX-ON-DROID: Unused
    externalNativeBuild {
        ndkBuild {
            path "src/main/cpp/Android.mk"
        }
    }
    */

    lintOptions {
        disable 'ProtectedPermissions'
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            if (variant.buildType.name == "debug") {
                def abi = output.getFilter(com.android.build.OutputFile.ABI)
                outputFileName = new File("termux-app_" + (apkVersionTag ? apkVersionTag : project.ext.packageVariant + "-" + "debug") + "_" + (abi ? abi : "universal") + ".apk")
            } else if (variant.buildType.name == "release") {
                def abi = output.getFilter(com.android.build.OutputFile.ABI)
                outputFileName = new File("termux-app_" + (apkVersionTag ? apkVersionTag : project.ext.packageVariant + "-" + "release") + "_" + (abi ? abi : "universal") + ".apk")
            }
        }
    }

}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.10"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:1.1.5"
}

task versionName {
    doLast {
        print android.defaultConfig.versionName
    }
}

def validateVersionName(String versionName) {
    // https://semver.org/spec/v2.0.0.html#is-there-a-suggested-regular-expression-regex-to-check-a-semver-string
    // ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$
    if (!java.util.regex.Pattern.matches("^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-((?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\\.(?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\\+([0-9a-zA-Z-]+(?:\\.[0-9a-zA-Z-]+)*))?\$", versionName))
        throw new GradleException("The versionName '"  + versionName + "' is not a valid version as per semantic version '2.0.0' spec in the format 'major.minor.patch(-prerelease)(+buildmetadata)'. https://semver.org/spec/v2.0.0.html.")
}

def downloadBootstrap(String arch, String expectedChecksum, String version) {
    def digest = java.security.MessageDigest.getInstance("SHA-256")

    def localUrl = "src/main/cpp/bootstrap-" + arch + ".zip"
    def file = new File(projectDir, localUrl)
    if (file.exists()) {
        def buffer = new byte[8192]
        def input = new FileInputStream(file)
        while (true) {
            def readBytes = input.read(buffer)
            if (readBytes < 0) break
            digest.update(buffer, 0, readBytes)
        }
        def checksum = new BigInteger(1, digest.digest()).toString(16)
        while (checksum.length() < 64) { checksum = "0" + checksum }
        if (checksum == expectedChecksum) {
            return
        } else {
            logger.quiet("Deleting old local file with wrong hash: " + localUrl + ": expected: " + expectedChecksum + ", actual: " + checksum)
            file.delete()
        }
    }

    def remoteUrl = "https://github.com/termux/termux-packages/releases/download/bootstrap-" + version + "/bootstrap-" + arch + ".zip"
    logger.quiet("Downloading " + remoteUrl + " ...")

    file.parentFile.mkdirs()
    def out = new BufferedOutputStream(new FileOutputStream(file))

    def connection = new URL(remoteUrl).openConnection()
    connection.setInstanceFollowRedirects(true)
    def digestStream = new java.security.DigestInputStream(connection.inputStream, digest)
    out << digestStream
    out.close()

    def checksum = new BigInteger(1, digest.digest()).toString(16)
    while (checksum.length() < 64) { checksum = "0" + checksum }
    if (checksum != expectedChecksum) {
        file.delete()
        throw new GradleException("Wrong checksum for " + remoteUrl + ": expected: " + expectedChecksum + ", actual: " + checksum)
    }
}

clean {
    doLast {
        def tree = fileTree(new File(projectDir, 'src/main/cpp'))
        tree.include 'bootstrap-*.zip'
        tree.each { it.delete() }
    }
}

// ---------------------------------------------------------------------------
// #348 — bake the proot + glibc root filesystem into the APK.
//
// This is the RUNTIME, not packaging convenience. The zip carries
// bin/proot-static (built aarch64-unknown-linux-android, so bionic runs it
// natively) and under it glibc-2.37-45 with lib/ld-linux-aarch64.so.1 and
// lib/libc.so.6. #288 proved with ELF evidence that a glibc binary has no
// loader on Android; proot supplies one. Nothing else in this APK makes a
// glibc CLI runnable.
//
// Before this task, TermuxInstaller downloaded the zip on FIRST LAUNCH from a
// url typed into an editable dialog box, with no integrity check whatsoever.
// That is three failures at once: no network means no terminal ever, a host
// nobody here controls sits in the boot path, and unverified bytes get marked
// executable. Fetching once in CI against a pinned sha256 removes all three.
//
// EVERY value below is read from build.json. Nothing about which bootstrap,
// from where, for which ABI, or under which package name is written here --
// extending this to a new ABI or a new release is a JSON edit.
//
// Nothing enters git: *.zip is gitignored and the output lives in
// app/build/generated/bootstrap/.
// ---------------------------------------------------------------------------

def bootstrapSpec() {
    def declaration = new File(projectDir.parentFile, "build.json")
    if (!declaration.exists())
        throw new GradleException("missing " + declaration + " -- the bootstrap pin is declared there, not here")
    def spec = new groovy.json.JsonSlurper().parseText(declaration.getText("UTF-8"))
            ?.forks?.nixdroid?.bootstrap
    if (spec == null)
        throw new GradleException(declaration.toString() + " has no forks.nixdroid.bootstrap block; refusing to "
                + "ship an APK whose terminal would fall back to a first-run download")
    return spec
}

// The ABI this APK is for, from the release.variants[] entry the engine
// selected. Same CLOUDNAV_ABIS hook every other per-ABI app here uses. One
// rootfs per APK: baking all of them would multiply ~38MB by four for three
// root filesystems this APK can never execute.
def bootstrapAbi() {
    def selected = System.getenv("CLOUDNAV_ABIS")
    def abi = (selected?.trim()) ? selected.split(",")[0].trim() : "arm64-v8a"
    def known = bootstrapSpec().archs
    if (!known.containsKey(abi))
        throw new GradleException("CLOUDNAV_ABIS names ABI '" + abi + "', which build.json's "
                + "forks.nixdroid.bootstrap.archs does not declare (known: " + known.keySet().join(", ") + ")")
    return abi
}

def bootstrapAssetsDir = new File(buildDir, "generated/bootstrap/assets")

task bakeBootstrap() {
    outputs.dir bootstrapAssetsDir
    doLast {
        def spec = bootstrapSpec()
        def abi = bootstrapAbi()
        def pin = spec.archs[abi]

        def staging = new File(buildDir, "generated/bootstrap/download")
        staging.mkdirs()
        bootstrapAssetsDir.mkdirs()

        def downloaded = new File(staging, "bootstrap-" + pin.arch + ".zip")
        def remoteUrl = spec.url_base + "/" + spec.release + "/bootstrap-" + pin.arch + ".zip"

        // Re-use a cached download only when it already hashes to the pin.
        if (!downloaded.exists() || sha256Of(downloaded) != pin.sha256) {
            logger.quiet("bakeBootstrap: downloading " + remoteUrl + " ...")
            downloaded.delete()
            def connection = new URL(remoteUrl).openConnection()
            connection.setInstanceFollowRedirects(true)
            def out = new BufferedOutputStream(new FileOutputStream(downloaded))
            out << connection.inputStream
            out.close()
        }

        def actual = sha256Of(downloaded)
        if (actual != pin.sha256) {
            downloaded.delete()
            throw new GradleException("bakeBootstrap: wrong sha256 for " + remoteUrl
                    + "\n  expected " + pin.sha256 + " (build.json::forks.nixdroid.bootstrap.archs['" + abi + "'])"
                    + "\n  actual   " + actual
                    + "\nThe pin is the only thing standing between this APK and whatever that third-party host "
                    + "served today. Verify the new bytes by hand before touching the pin.")
        }

        // The published bootstrap hardcodes the UPSTREAM package id in
        // bin/login and usr/lib/login-inner -- generated shell scripts, not
        // ELF, whose absolute paths no runtime call rewrites. Unpatched, the
        // terminal execs a proot-static under a package directory that is not
        // installed and dies ENOENT naming another app's path. Both ids are
        // the same byte length, which is what the 2026-08-30 rename bought us.
        def rewrite = spec.package_name_rewrite
        def patcher = new File(projectDir, "src/main/cpp/patch_bootstrap_ids.py")
        if (!patcher.exists())
            throw new GradleException("missing " + patcher + " (the app-id rewrite gate)")
        def baked = new File(bootstrapAssetsDir, spec.asset_name)
        def result = exec {
            commandLine "python3", patcher.absolutePath, downloaded.absolutePath, baked.absolutePath,
                    rewrite.from + "=" + rewrite.to
            ignoreExitValue = true
        }
        if (result.exitValue != 0)
            throw new GradleException("patch_bootstrap_ids.py failed for " + downloaded
                    + " (exit " + result.exitValue + "); see log above")

        logger.quiet("bakeBootstrap: " + abi + " -> assets/" + spec.asset_name
                + " (" + baked.length() + " B, from " + downloaded.length() + " B)")
    }
}

def sha256Of(File file) {
    def digest = java.security.MessageDigest.getInstance("SHA-256")
    def buffer = new byte[8192]
    def input = new FileInputStream(file)
    try {
        while (true) {
            def read = input.read(buffer)
            if (read < 0) break
            digest.update(buffer, 0, read)
        }
    } finally {
        input.close()
    }
    def checksum = new BigInteger(1, digest.digest()).toString(16)
    while (checksum.length() < 64) checksum = "0" + checksum
    return checksum
}

android.sourceSets.main.assets.srcDir bootstrapAssetsDir

// Assets are merged long before javaCompile, so depending on javaCompile (the
// hook the sibling termux bootstrap uses for its cpp inputs) would bake
// nothing and still go green.
tasks.matching { it.name ==~ /merge.*Assets/ }.configureEach { dependsOn bakeBootstrap }

