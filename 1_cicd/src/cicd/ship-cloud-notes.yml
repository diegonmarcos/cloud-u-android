name: "Ship → Cloud Notes APK (build + publish to GHCR)"

# Independent per-app workflow for Cloud Notes (a full vendored clone of
# toeverything/AFFiNE at cfda4858d550c46ec1cd0b574801d7becdd6625b, de-clouded).
# ENGINE: 1_cicd/src/scripts/cloud-notes-engine.sh (vendored byte-identical as
# ac_cloud-notes/build.sh; parity enforced by the workflow generator).
#
# Modelled on ship-cloud-chat.yml (the fleet's Node-webapp → Android-APK
# route: setup-node@v4, JDK, Android SDK+NDK, oras, vault checkout). The
# version numbers are AFFiNE's own pinned toolchain, NOT chat's (chat is
# React Native, this is rspack + Capacitor + Rust + Gradle):
#   node 22.23.2  (.nvmrc; engines >=22.12.0 <23.0.0 — node 20 would fail
#                  yarn install, which is why this deviates from chat's 20)
#   yarn 4.18.0   (packageManager + vendored .yarn/releases)
#   JDK 21        (app compileOptions target 21, Gradle 8.14.3)
#   rust 1.97.1   (rust-toolchain.toml) → aarch64-linux-android via the
#                  mozilla-rust-android-gradle 0.9.6 plugin
#   NDK 27.2.12479018 (pinned in app/build.gradle — upstream resolves
#                  "whatever NDK is installed", a floating version this fleet
#                  refuses to ship against)
# The Rust crate is PROVEN not to link packages/common/native at the Cargo
# level (ac_cloud-notes/VENDORING-LICENCE.md) and the licence-boundary guard
# gates the whole repo on every push.
#
# Single universal APK, arm64-v8a (the owner's phone; Markor was also a single
# APK). No ABI matrix — AFFiNE's rust plugin builds one target via
# AFFINE_ANDROID_NATIVE_TARGET and duplicating it doubles a 40+ min build.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      # ── MANAGED-PATHS-HEADER: regenerated by cloud-android-ship-repo-workflow-engine.sh ──
      # MANAGED by cloud-android-ship-repo-workflow-engine.sh: every dir
      # ac_cloud-notes/build.json::modules declares is added automatically, dead
      # entries are dropped, and cloud-android-source-identity.sh hashes
      # this list — so nothing can trigger a build the publish gate does
      # not weigh. Extra entries no module map can express
      # (settings.gradle.kts references, scan roots) are kept: add them
      # here and they stay.
      # ONE path is watched here and deliberately NOT hashed: the
      # tester directory build.json::tests.shell.dir declares. A tester
      # edit must START a run (it is the only pipeline that executes
      # that tester) and must NOT publish an APK (it changed no bytes).
      # The gate skips it, so the run costs the test step alone.
      # ── end MANAGED-PATHS-HEADER ──
      - "1_cicd/src/cicd/ship-cloud-notes.yml"
      - "1_cicd/src/scripts/cloud-notes-engine.sh"
      - "ac_cloud-notes/**"
permissions:
  contents: write   # gh release upload (rolling 'latest')
  packages: write   # ghcr push (oras)

concurrency:
  group: ship-cloud-notes-${{ github.ref }}
  cancel-in-progress: true

env:
  WORK_DIR: ac_cloud-notes
  FORK: notes

jobs:
  build_and_publish:
    name: "Build + publish (notes · arm64-v8a)"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      AFFINE_ANDROID_NATIVE_TARGET: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Same first step as every ship workflow: this application's testers run
      # BEFORE any toolchain is provisioned, so a red tester costs seconds and
      # fails before a 40-minute build starts. Never gated on the publish gate:
      # editing a tester must START a run, and must not publish bytes.
      - name: "Test → this application's testers, and what is not covered"
        run: |
          sh 1_cicd/dist/scripts/cloud-android-test-engine.sh shell "$WORK_DIR"
          sh 1_cicd/dist/scripts/cloud-android-test-engine.sh lint  "$WORK_DIR"
          sh 1_cicd/dist/scripts/cloud-android-test-engine.sh unit  "$WORK_DIR"

      # Publish-if-changed gate (same rationale as every ship workflow): the
      # gate hashes this app's build INPUTS and compares to the <asset>.source
      # sidecar on the release; equal → everything below is skipped.
      - name: Publish gate (skip when source unchanged)
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh 1_cicd/dist/scripts/cloud-android-publish-gate.sh check "$WORK_DIR" "arm64-v8a"

      - name: Set up JDK 21 (AFFiNE Gradle 8.14 / Kotlin 2.2 / Java-21 target)
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Node 22.23.2 (AFFiNE engines >=22.12.0 <23.0.0)
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"

      - name: Set up Rust 1.97.1 + aarch64-linux-android target (pinned by rust-toolchain.toml)
        if: steps.gate.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          targets: aarch64-linux-android

      - name: Set up Android SDK + NDK 27.2.12479018 (pinned in app/build.gradle)
        if: steps.gate.outputs.skip != 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools ndk;27.2.12479018"

      - name: Checkout vault (ONE shared Android signing key)
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: diegonmarcos/cloud-vault
          token: ${{ secrets.ANDROID_SIGNING_VAULT_TOKEN }}
          path: .vault

      - name: Install ORAS + sops + jq
        if: steps.gate.outputs.skip != 'true'
        run: |
          sudo apt-get update -y && sudo apt-get install -y jq
          curl -fsSL https://github.com/oras-project/oras/releases/download/v1.2.0/oras_1.2.0_linux_amd64.tar.gz \
            | sudo tar -C /usr/local/bin -xzf - oras
          oras version
          curl -fsSL https://github.com/getsops/sops/releases/download/v3.9.4/sops-v3.9.4.linux.amd64 \
            | sudo tee /usr/local/bin/sops >/dev/null
          sudo chmod +x /usr/local/bin/sops
          sops --version

      # The vendored tree IS the fork: materialize is a no-op (the engine says
      # so, loudly, instead of cloning upstream into a fresh directory).
      - name: Build AFFiNE APK (yarn bundle → cap sync → gradle + rust → shared-key sign)
        id: build
        if: steps.gate.outputs.skip != 'true'
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
          VAULT_DIR: ${{ github.workspace }}/.vault
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x build.sh
          ./build.sh build-fork "$FORK"
          ls -la dist/

      - name: Upload APK as workflow artifact
        if: steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cloud-notes-arm64-v8a-${{ github.sha }}
          path: ${{ env.WORK_DIR }}/dist/Cloud-Notes.apk
          if-no-files-found: error
          retention-days: 30

      - name: Login to GHCR
        if: steps.gate.outputs.skip != 'true'
        run: |
          echo "${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}" \
            | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish APK to GHCR
        if: steps.gate.outputs.skip != 'true'
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
        run: ./build.sh publish-fork "$FORK"

      # Rolling 'latest' release: upload the APK under its own name so
      # /releases/latest/download/Cloud-Notes.apk is a stable install URL.
      # Engine step reads build.json::release.gh_release (rolling_tag=latest).
      - name: Publish APK to rolling 'latest' release (stable install URL)
        id: publish
        # `success()` removed, not lost: GitHub applies it implicitly to any `if:`
        # that names no status function, so this condition means exactly what it
        # did. It has to go because the published-nothing guard is HANDED this
        # expression as an argument, and a status function is only legal inside an
        # `if:` — leaving it made six ship workflows fail to parse at all, which
        # GitHub reports by showing the run under the FILENAME instead of the name.
        if: ${{ steps.gate.outputs.skip != 'true' }}
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
        run: ./build.sh gh-release-fork "$FORK"

      # ── MANAGED-PUBLISH-GUARD: injected by cloud-android-ship-repo-workflow-engine.sh ──
      # Runs on everything but a cancellation, and is HANDED the two facts it
      # judges: the publish gate's own answer to "did this source move?", and the
      # `id: publish` step's own `if:` rendered to true/false. Putting that `if:`
      # on this step instead — the obvious generalisation — would stop the guard
      # running in exactly the case it exists for, a publish skipped by its own
      # condition. Copied verbatim from that step, so there is one copy in the
      # file and the two cannot drift.
      # Edit 1_cicd/src/scripts/cloud-android-publish-guard.sh, never this block.
      - name: A run that published nothing must not be green
        if: ${{ !cancelled() }}
        run: sh 1_cicd/dist/scripts/cloud-android-publish-guard.sh "ac_cloud-notes" "${{ steps.publish.outcome }}" "${{ steps.gate.outputs.skip }}" "${{ steps.gate.outputs.skip != 'true' }}" "${{ github.event_name }}"
      # ── end MANAGED-PUBLISH-GUARD ──

      - name: Stamp source identity on the published assets
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh 1_cicd/dist/scripts/cloud-android-publish-gate.sh stamp "$WORK_DIR" "arm64-v8a"