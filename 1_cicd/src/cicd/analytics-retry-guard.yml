name: "analytics retry guard — a sink that fails must keep its own events"

# WHY THIS WORKFLOW EXISTS.
# ab_cloud-libs-shared/libs/analytics is embedded in all twelve shipped
# applications, and for as long as it has existed it reduced two delivery
# results to one:
#
#     val ok = sendUmami(name, props) or sendMatomo(name, props)
#
# `or` does not short-circuit, so both sinks really did fire. Nothing was
# skipped — which is precisely why this survived review for so long. The defect
# was that Umami succeeding made `ok` true, so the event left the single shared
# queue and Matomo's failed copy was dropped with nothing left holding it.
# Every application's event stream was silently half-lossy for the whole of any
# outage of either backend, and #353 records one of them being destroyed
# outright, which is when the loss was largest and least visible.
#
# The fix gives each sink its own bounded queue so the two outcomes stay
# separate. That is a behaviour, so this guard EXECUTES it: the test compiles
# against the shipped SinkQueue.kt by path and runs it. Asserting on the source
# text instead would repeat the mistake 0b2cbc5ee had to undo, where two
# assertions were anchored on formatting and so reported on spelling rather
# than on the rule.
#
# WHY NO PATH FILTER. The queue is the shared engine under twelve applications,
# the test costs one compile and no network, and the cost of missing a
# regression here is telemetry that is wrong without ever looking wrong. A
# filter could only ever buy back seconds and lose a miss.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retry-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The runner has no Kotlin compiler. Nix supplies it the same way every
      # other tool in this repo is supplied, rather than an apt-get that drifts
      # from what anyone else runs. `nix shell` is ephemeral — nothing is
      # installed into a profile.
      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: A failed sink keeps and retries its own events
        run: bash 1_cicd/src/scripts/test/analytics-retry.test.sh
