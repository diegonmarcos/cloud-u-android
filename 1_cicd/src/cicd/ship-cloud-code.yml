name: "Ship → Cloud Code APK (build + publish to GHCR)"

# Independent per-app workflow for Cloud Code (#562): a full vendored clone of
# Acode-Foundation/Acode at b7dbe3d69dcf5165e19581fe3927f0838dce09f4 with a
# 7-tab bottom nav over it. ENGINE: 1_cicd/src/scripts/cloud-code-engine.sh
# (vendored byte-identical as ac_cloud-code/build.sh; parity enforced by the
# workflow generator).
#
# Modelled on ship-cloud-notes.yml (the fleet's vendored web-shell route). The
# toolchain is Acode's own, as its nightly-build.yml runs it: JDK 21, Node LTS
# (pinned here to 22), the Android SDK preinstalled on ubuntu-latest, and the
# cordova CLI pinned in Acode's package.json (13.0.0) — never a global one.
#
# The MyTerminal tab's target is DERIVED at build time from
# ac_cloud-myterminal (tools/resolve-targets.py), so that app's declaration and
# launcher manifest are trigger paths here: a rename there rebuilds this APK.

on:
  # ── MANAGED-REFRESH-TRIGGER (#836): fleet-refresh.yml dispatches this app ──
  repository_dispatch:
    types: [fleet-refresh-ac_cloud-code]
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      # ── MANAGED-PATHS-HEADER: regenerated by cloud-android-ship-repo-workflow-engine.sh ──
      # MANAGED by cloud-android-ship-repo-workflow-engine.sh: every dir
      # ac_cloud-code/build.json::modules declares is added automatically, dead
      # entries are dropped, and cloud-android-source-identity.sh hashes
      # this list — so nothing can trigger a build the publish gate does
      # not weigh. Extra entries no module map can express
      # (settings.gradle.kts references, scan roots) are kept: add them
      # here and they stay.
      # ONE path is watched here and deliberately NOT hashed: the
      # tester directory build.json::tests.shell.dir declares. A tester
      # edit must START a run (it is the only pipeline that executes
      # that tester) and must NOT publish an APK (it changed no bytes).
      # The gate skips it, so the run costs the test step alone.
      # #870 build inputs HASHED but NOT watched per push: every engine lib
      # (its Cloud-Lib APK ships alone, apps bind it at runtime), cross-app
      # dirs, shared data manifests and this workflow file. A STATIC lib this
      # app compiles is watched above: any change in it ships every consumer.
      # fleet-refresh.yml (schedule only) ships the app for a moved cross-app dir.
      #   input: "1_cicd/src/cicd/ship-cloud-code.yml"
      #   input: "_dotfiles/apps/src/root/mcp.json"
      #   input: "ac_cloud-account/app/src/main/AndroidManifest.xml"
      #   input: "ac_cloud-account/build.json"
      #   input: "ac_cloud-c3/data/services_private.json"
      #   input: "ac_cloud-myterminal/build.json"
      #   input: "ac_cloud-myterminal/hub/src/main/AndroidManifest.xml"
      # ── end MANAGED-PATHS-HEADER ──
      - "1_cicd/src/scripts/cloud-code-engine.sh"
      - "ab_cloud-libs-shared/libs/ai/**"
      - "ab_cloud-libs-shared/libs/bottomnav/**"
      - "ab_cloud-libs-shared/libs/core/**"
      - "ab_cloud-libs-shared/libs/crash/**"
      - "ab_cloud-libs-shared/libs/devtools/**"
      - "ab_cloud-libs-shared/libs/fleetconfig-model/**"
      - "ab_cloud-libs-shared/libs/model-catalogue/**"
      - "ab_cloud-libs-shared/libs/perms/**"
      - "ab_cloud-libs-shared/libs/sysdns/**"
      - "ab_cloud-libs-shared/libs/text-tools/**"
      - "ab_cloud-libs-shared/libs/theme-background/**"
      - "ab_cloud-libs-shared/libs/ui-icons/**"
      - "ab_cloud-libs-shared/libs/ui-nav-bars/**"
      - "ac_cloud-code/**"
      - "!ac_cloud-code/web/**"
permissions:
  contents: write   # gh release upload (rolling 'latest')
  packages: write   # ghcr push (oras)

concurrency:
  group: ship-cloud-code-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WORK_DIR: ac_cloud-code
  FORK: code

jobs:
  build_and_publish:
    outputs:
      # read by launch_smoke: false when the publish gate skipped the build
      built: ${{ steps.gate.outputs.skip != 'true' }}
    name: "Build + publish (code · universal)"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # test/cloud_bleed.mjs drives headless Chromium (the editor-text-bleeds-through-pages regression
      # test, #1193). Pinned here; the tester FAILS in CI when the browser is missing, it never skips.
      - name: Install Playwright Chromium (for the page-bleed tester)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          npm install playwright@1.48.2
          npx playwright install --with-deps chromium
          echo "PLAYWRIGHT_PATH=$RUNNER_TEMP/pw/node_modules/playwright" >> "$GITHUB_ENV"

      # Same first step as every ship workflow: this application's testers run
      # BEFORE any toolchain is provisioned, so a red tester costs seconds.
      - name: "Test → this application's testers, and what is not covered"
        run: |
          sh 1_cicd/dist/scripts/cloud-android-test-engine.sh shell "$WORK_DIR"
          sh 1_cicd/dist/scripts/cloud-android-test-engine.sh lint  "$WORK_DIR"
          sh 1_cicd/dist/scripts/cloud-android-test-engine.sh unit  "$WORK_DIR"

      - name: Publish gate (skip when source unchanged)
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh 1_cicd/dist/scripts/cloud-android-publish-gate.sh check "$WORK_DIR" "universal"

      - name: Set up JDK 21 (Acode's nightly toolchain)
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Node 22
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Checkout vault (ONE shared Android signing key)
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: diegonmarcos/cloud-me-pvt-vault
          token: ${{ secrets.ANDROID_SIGNING_VAULT_TOKEN }}
          path: .vault

      - name: Install jq
        if: steps.gate.outputs.skip != 'true'
        run: |
          sudo apt-get update -y && sudo apt-get install -y jq

      - name: Install ORAS + sops (pinned, sha256-checked, fails at the download)
        if: steps.gate.outputs.skip != 'true'
        uses: ./.github/actions/install-pinned-tools
        with:
          tools: oras sops

      - name: Build Cloud Code APK (npm → cordova setup → rspack → cordova build → shared-key sign)
        id: build
        if: steps.gate.outputs.skip != 'true'
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
          VAULT_DIR: ${{ github.workspace }}/.vault
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x build.sh
          ./build.sh build-fork "$FORK"
          ls -la dist/

      - name: Upload APK as workflow artifact
        if: steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cloud-code-universal-${{ github.sha }}
          path: ${{ env.WORK_DIR }}/dist/Cloud-Code.apk
          if-no-files-found: error
          retention-days: 30

      - name: Login to GHCR
        if: steps.gate.outputs.skip != 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish APK to GHCR
        if: steps.gate.outputs.skip != 'true'
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
        run: ./build.sh publish-fork "$FORK"

      - name: Publish APK to rolling 'latest' release (stable install URL)
        id: publish
        if: ${{ steps.gate.outputs.skip != 'true' }}
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
        run: ./build.sh gh-release-fork "$FORK"

      # ── MANAGED-PUBLISH-GUARD: injected by cloud-android-ship-repo-workflow-engine.sh ──
      # Runs on everything but a cancellation, and is HANDED the two facts it
      # judges: the publish gate's own answer to "did this source move?", and the
      # `id: publish` step's own `if:` rendered to true/false. Putting that `if:`
      # on this step instead — the obvious generalisation — would stop the guard
      # running in exactly the case it exists for, a publish skipped by its own
      # condition. Copied verbatim from that step, so there is one copy in the
      # file and the two cannot drift.
      # Edit 1_cicd/src/scripts/cloud-android-publish-guard.sh, never this block.
      - name: A run that published nothing must not be green
        if: ${{ !cancelled() }}
        run: sh 1_cicd/dist/scripts/cloud-android-publish-guard.sh "ac_cloud-code" "${{ steps.publish.outcome }}" "${{ steps.gate.outputs.skip }}" "${{ steps.gate.outputs.skip != 'true' }}" "${{ github.event_name }}"
      # ── end MANAGED-PUBLISH-GUARD ──


      - name: Stamp source identity on the published assets
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh 1_cicd/dist/scripts/cloud-android-publish-gate.sh stamp "$WORK_DIR" "universal"

  # Install the APK this run just built on an emulator and launch it: a crash at startup fails
  # Ship (1_cicd/src/cicd/test-launch-smoke.yml). A job of this run, not a workflow_run listener,
  # so it cannot fail to trigger.
  launch_smoke:
    needs: build_and_publish
    if: needs.build_and_publish.outputs.built == 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/test-launch-smoke.yml
    with:
      app: cloud-code
      artifact_prefix: cloud-code-universal-
      api_levels: "[34]"
