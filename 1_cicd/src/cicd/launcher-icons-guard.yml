# Launcher icons guard.
#
# Every fleet app's Android launcher icon is GENERATED by
# 1_cicd/src/scripts/cloud-android-launcher-icons.py from one pattern
# (1_cicd/src/data/launcher-icons.json: glyph placement, cloud badge, category
# colours, glyph library) and each app's build.json::launcher_icon
# {glyph, category}. cloud-search and the SuperApp (cloud-sa) are the exemptions. This guard fails when:
#   - a fleet app declares no launcher_icon, or an unknown glyph/category;
#   - two apps share a glyph (every app has its own symbol);
#   - a generated file drifted (hand edit) or is missing;
#   - hand-made launcher art (raster mipmaps, other ic_launcher_* drawables,
#     source-set overrides) sits next to the generated icon;
#   - an app's category disagrees with the SuperApp Cloud page group listing it;
#   - two Cloud page tiles for different destinations share one plain icon.
# The second step proves the guard is not vacuous.
name: "launcher icons guard — one generated pattern, category colours, unique glyphs"

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# ── MANAGED-GUARD-CONCURRENCY: injected by cloud-android-guard-triggers.py ──
concurrency:
  group: launcher-icons-guard-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# ── end MANAGED-GUARD-CONCURRENCY ──

jobs:
  launcher-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every fleet launcher icon is the generated pattern
        run: python3 1_cicd/src/scripts/cloud-android-launcher-icons.py --check
      - name: The guard still fails on a duplicate glyph and on a hand edit
        run: |
          set -eu
          jq '.launcher_icon.glyph = "mail"' ac_cloud-news/build.json > /tmp/news-build.json
          mv /tmp/news-build.json ac_cloud-news/build.json
          if python3 1_cicd/src/scripts/cloud-android-launcher-icons.py --check; then
            echo "::error::the guard passed with two apps on the mail glyph"; exit 1
          fi
          git checkout -- .
          sed -i 's/#FFFFFFFF/#FFFF0000/' ac_cloud-tasks/app/src/main/res/drawable/ic_launcher_foreground.xml
          if python3 1_cicd/src/scripts/cloud-android-launcher-icons.py --check; then
            echo "::error::the guard passed with a hand-edited foreground"; exit 1
          fi
          echo "the guard went red on both mutations, as it must"
