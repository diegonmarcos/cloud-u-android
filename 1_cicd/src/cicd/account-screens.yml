name: "Account screens — render every Cloud Account section under its island and strips"

# #1081: SectionScreensTest (ac_cloud-account/app/src/test/.../SectionScreensTest) draws the real chrome of Cloud Account
# (the island from the baked NavDecl, the section's strip, the container's second strip) over one page of each of the five
# sections at 384x832dp / 450dpi (Samsung Galaxy A37) and writes app/build/section-screens/<section>-<page>.png. The pages
# the reorganisation added must render (the test is red otherwise); a page that predates it is shot best-effort (<name>.err).
# The PNGs are uploaded as the `account-screens` artifact, red or green.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "1_cicd/src/cicd/account-screens.yml"
      - "ac_cloud-account/app/src/**"
      - "ac_cloud-account/build.json"
      - "ab_cloud-libs-shared/libs/account/**"
      - "ab_cloud-libs-shared/libs/bottomnav/**"
      - "ab_cloud-libs-shared/libs/ui-kit/**"

permissions:
  contents: read

concurrency:
  group: account-screens-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 platforms;android-35 platforms;android-26 build-tools;35.0.0 build-tools;34.0.0 platform-tools"

      - name: Set up Gradle 8.10.2 (cached)
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"
      # ── MANAGED-GRADLE-CACHE-HYGIENE: injected by cloud-android-gradle-cache-hygiene.py ──
      # Edit 1_cicd/src/actions/gradle-cache-hygiene, never this block.
      - name: Gradle cache hygiene (retry failed resolution, never cache a failed lookup)
        uses: ./.github/actions/gradle-cache-hygiene
      # ── end MANAGED-GRADLE-CACHE-HYGIENE ──

      - name: Checkout vault (shared Android signing key)
        uses: actions/checkout@v4
        with:
          repository: diegonmarcos/cloud-me-pvt-vault
          token: ${{ secrets.ANDROID_SIGNING_VAULT_TOKEN }}
          path: .vault

      - name: Install jq
        run: |
          sudo apt-get update -y && sudo apt-get install -y jq

      - name: Install ORAS + sops (pinned, sha256-checked, fails at the download)
        uses: ./.github/actions/install-pinned-tools
        with:
          tools: oras sops

      - name: Render every Cloud Account section (section-screens/*.png)
        working-directory: ac_cloud-account
        env:
          BYPASS_NIX: "1"
          VAULT_DIR: ${{ github.workspace }}/.vault
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UNIT_TEST_FILTER: "com.diegonmarcos.cloudaccount.SectionScreensTest"
        run: bash ./build.sh test

      - name: Summary (what rendered)
        if: always()
        run: |
          d=ac_cloud-account/app/build/section-screens
          [ -d "$d" ] || exit 0
          { echo '```'; ls -1 "$d"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload PNGs + test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account-screens
          path: |
            ac_cloud-account/app/build/section-screens/
            ac_cloud-account/app/build/reports/tests/
          if-no-files-found: warn
