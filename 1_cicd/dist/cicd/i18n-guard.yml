name: "i18n guard — an app that does not come up in English fails the build"

# WHY THIS RUNS ON EVERY PUSH AND EVERY PULL REQUEST, WITH NO PATH FILTER.
# The failure this catches is not "somebody edited a translation", it is
# "somebody dropped the locale filter out of a build file and did not notice".
# That commit touches build.gradle, which a path filter would catch — but it
# also arrives as one file inside a twelve-file feature commit, and the whole
# point is that the person who introduced it finds out the same day rather than
# the owner finding out when the app opens in Spanish on their phone. The guard
# reads gradle text and XML and exits in well under a second, so there is
# nothing to save by narrowing when it runs.
#
# It is deliberately NOT folded into health.yml: that workflow runs on a
# six-hourly cron and on manual dispatch, so a lost base language would sit
# undetected for up to six hours and then fail a run nobody is looking at.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every app that packages an APK filters locales to English
        run: python3 1_cicd/src/scripts/cloud-android-i18n-guard.py
      - name: The guard still fails when an app loses its English locale filter
        run: bash 1_cicd/src/scripts/test/i18n-guard.test.sh
