# ╔═══════════════════════════════════════════════════════════════════════╗
# ║ Test -> linktree in Cloud Browser (emulator, real WebView) (#1140)     ║
# ║ Opens the live linktree in Cloud Browser on a x86_64 API-34 emulator,  ║
# ║ captures the WebView console (cloud_browser_page_log=2) and asserts    ║
# ║ the link cards were mounted. Evidence: `linktree-evidence` artifact.   ║
# ║ Script: ac_cloud-browser/test/emulator-linktree.sh.                    ║
# ╚═══════════════════════════════════════════════════════════════════════╝
name: "Test -> linktree (emulator)"

on:
  workflow_dispatch:
    inputs:
      browser_run_id:
        description: "Ship Cloud Browser run id whose APK artifact to test (empty = release asset)"
        required: false
        default: ""
      release_tag:
        description: "Release to download from when the run id is empty"
        required: false
        default: "latest"
      url:
        description: "Page to open"
        required: false
        default: "https://linktree.diegonmarcos.com/"

permissions:
  contents: read
  actions: read

jobs:
  linktree:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch the Cloud Browser APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          B_RUN: ${{ inputs.browser_run_id }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -eu
          mkdir -p apk
          if [ -n "$B_RUN" ]; then
            gh api "repos/$REPO/actions/runs/$B_RUN/artifacts" --paginate --jq '.artifacts[] | select(.name|startswith("Cloud-Browser-")) | .name' |
            while read -r name; do gh run download "$B_RUN" -R "$REPO" -n "$name" -D "apk/$name"; done
          else
            gh release download "${TAG:-latest}" -R "$REPO" -p Cloud-Browser.apk -D apk
          fi
          pick=""
          for want in x86_64 universal arm64 ''; do
            pick=$(find apk -name '*.apk' | sort | grep -i -- "$want" | head -1 || true)
            [ -n "$pick" ] && break
          done
          [ -n "$pick" ] || { echo "::error::no Cloud Browser APK"; exit 1; }
          cp "$pick" browser.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator + open the linktree (attempt 1)
        id: try1
        continue-on-error: true
        timeout-minutes: 12
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash ac_cloud-browser/test/emulator-linktree.sh browser.apk out ${{ inputs.url }}

      # The runner sometimes hands over an emulator adb reports offline; a second boot is the remedy, not a weaker test.
      - name: Boot emulator + open the linktree (attempt 2)
        if: steps.try1.outcome != 'success'
        timeout-minutes: 12
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash ac_cloud-browser/test/emulator-linktree.sh browser.apk out ${{ inputs.url }}

      - name: Upload evidence (screenshot, ui dump, console, logcat)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linktree-evidence
          path: out/
          if-no-files-found: warn
