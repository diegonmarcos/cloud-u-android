# ╔═══════════════════════════════════════════════════════════════════════╗
# ║ Test → nav runtime walk (emulator: every page of every app on the      ║
# ║ shared nav bars)                                                       ║
# ║                                                                        ║
# ║ The static guards passed pages that did not collapse and pages that    ║
# ║ crashed. This launches each app on a REAL emulator, walks EVERY        ║
# ║ section and page its build.json::ui declares, and on each page asserts ║
# ║ no crash, the title dropdown (breadcrumb) opens and closes, and a      ║
# ║ swipe up collapses the chrome (first row gone, non-selected bottom     ║
# ║ labels gone, bars shrunk) when the page scrolls, and a swipe down      ║
# ║ restores it. Per-app, per-page results are the `nav-walk-<app>`        ║
# ║ artifacts and the run summary. Driver:                                 ║
# ║ 1_cicd/src/scripts/cloud-android-nav-walk.py; apps:                    ║
# ║ 1_cicd/src/data/nav-walk-apps.json.                                    ║
# ║                                                                        ║
# ║ WHICH APK. The walk waits for each app's Ship run of the same commit   ║
# ║ and tests the APK that run built; when that run did not build (the     ║
# ║ publish gate saw unchanged source, or Ship was not triggered) it tests ║
# ║ the APK on the rolling `latest` release, which is that same source.    ║
# ║ A Ship run that FAILED fails the walk of that app: there is nothing    ║
# ║ to drive and the red must not hide.                                    ║
# ╚═══════════════════════════════════════════════════════════════════════╝
name: "Test → nav runtime walk (emulator, every app on the shared nav)"

on:
  workflow_dispatch:
    inputs:
      apps:
        description: "Apps to walk: 'all' or a comma list of directory names (ac_cloud-calc,ac_cloud-drive)"
        required: false
        default: "all"
  push:
    branches: [main]
    paths:
      - "1_cicd/src/cicd/test-nav-runtime.yml"
      - "1_cicd/src/scripts/cloud-android-nav-walk.py"
      - "1_cicd/src/data/nav-walk-apps.json"
      # the shared nav libs
      - "ab_cloud-libs-shared/libs/bottomnav/**"
      - "ab_cloud-libs-shared/libs/ui-nav-bars/**"
      - "ab_cloud-libs-shared/libs/theme-background/**"
      - "ab_cloud-libs-shared/libs/ui-icons/**"
      - "ab_cloud-libs-shared/libs/ui-kit/**"
      # every app's nav declaration and shell/nav/ui sources
      - "ac_cloud-*/build.json"
      - "ac_cloud-*/app/src/main/**/ui/**"
      - "ac_cloud-*/app/src/main/**/*Shell*.kt"
      - "ac_cloud-*/app/src/main/**/*Nav*.kt"
      - "ac_cloud-*/app/src/main/**/Declarations.kt"
      - "ac_cloud-*/app/src/main/**/MainActivity.kt"

permissions:
  contents: read
  actions: read

# Pushes to main share ONE group per ref and a newer push cancels the older walk: a
# per-sha group never superseded anything, so every push stacked a 20-app emulator
# matrix and the queue starved the account's hosted runners for hours (#1198).
# A manual dispatch gets its own group (run_id) and is never cancelled by a push.
concurrency:
  group: test-nav-runtime-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: The walked apps are exactly the apps ChromeScrollGuardTest holds
        run: |
          set -eu
          want=$(grep -m1 -A1 'private val apps = listOf' ab_cloud-libs-shared/libs/ui-nav-bars/src/test/kotlin/com/diegonmarcos/superapp/navbartop1/ChromeScrollGuardTest.kt | grep -o 'ac_cloud-[a-z0-9-]*' | sort -u)
          have=$(jq -r '.apps[].app' 1_cicd/src/data/nav-walk-apps.json | sort -u)
          if [ "$want" != "$have" ]; then
            echo "::error::nav-walk-apps.json and ChromeScrollGuardTest name different apps"
            diff <(echo "$want") <(echo "$have") || true
            exit 1
          fi
      - name: Matrix
        id: m
        env:
          APPS: ${{ github.event_name == 'workflow_dispatch' && inputs.apps || 'all' }}
        run: |
          set -eu
          if [ "$APPS" = all ]; then
            jq -c '.apps' 1_cicd/src/data/nav-walk-apps.json > m.json
          else
            jq -c --arg l "$APPS" '[.apps[] | select(.app as $a | ($l | split(",") | map(gsub(" ";"")) | index($a)))]' 1_cicd/src/data/nav-walk-apps.json > m.json
          fi
          [ "$(jq length m.json)" -gt 0 ] || { echo "::error::no app matches '$APPS'"; exit 1; }
          echo "matrix={\"include\":$(cat m.json)}" >> "$GITHUB_OUTPUT"

  walk:
    needs: plan
    name: "Walk ${{ matrix.app }}"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Get the APK under test (this commit's Ship run, else the release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          SHIP: ${{ matrix.ship }}
          PREFIX: ${{ matrix.artifact }}
          ASSET: ${{ matrix.asset }}
        run: |
          set -u
          mkdir -p apk
          found=""
          for i in $(seq 1 100); do
            row=$(gh run list -R "$REPO" -w "$SHIP" -c "$SHA" -L 1 --json status,conclusion,databaseId --jq '.[0] // empty | "\(.status) \(if (.conclusion // "") == "" then "none" else .conclusion end) \(.databaseId)"' || true)
            if [ -z "$row" ]; then
              # no Ship run for this commit: it was not triggered (no watched path moved). Give it two minutes to appear.
              [ "$i" -ge 4 ] && break
              sleep 30; continue
            fi
            set -- $row
            if [ "$1" != completed ]; then echo "Ship run $3 is $1 ($i)"; sleep 30; continue; fi
            if [ "$2" != success ]; then
              echo "::error title=$SHIP failed on this commit::run $3 concluded $2: nothing to walk, and the red must not hide"
              exit 1
            fi
            found="$3"; break
          done
          if [ -n "$found" ]; then
            gh run download "$found" -R "$REPO" -p "${PREFIX}*" -D apk || echo "run $found uploaded no APK (publish gate: source unchanged)"
          fi
          if ! find apk -name '*.apk' | grep -q .; then
            echo "walking the APK on the rolling release"
            gh release download latest -R "$REPO" -p "${ASSET}-x86_64.apk" -D apk 2>/dev/null \
              || gh release download latest -R "$REPO" -p "${ASSET}.apk" -D apk 2>/dev/null \
              || {
                # an app whose APK is not on the rolling release (Cloud Gallery): the APK its newest successful Ship run built
                last=$(gh run list -R "$REPO" -w "$SHIP" --status success -L 1 --json databaseId --jq '.[0].databaseId // empty')
                echo "no release asset: the APK of the newest successful $SHIP run ($last)"
                [ -n "$last" ] && gh run download "$last" -R "$REPO" -p "${PREFIX}*" -D apk
              }
          fi
          find apk -name '*.apk' | sort > apks.txt; cat apks.txt
          pick=""
          for want in x86_64 universal arm64 ''; do
            pick=$(grep -i -- "$want" apks.txt | head -1 || true)
            [ -n "$pick" ] && break
          done
          [ -n "$pick" ] || { echo "::error::no APK for ${{ matrix.app }}"; exit 1; }
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          echo "APK under test: $pick ($("$aapt2" dump packagename "$pick"))"
          cp "$pick" app-under-test.apk
          echo "PKG=$("$aapt2" dump packagename "$pick")" >> "$GITHUB_ENV"

      # An app that declares `walk_build` in nav-walk-apps.json is walked on a test-only variant that THIS job builds (Mail: the
      # -PtestApp debug build, which alone carries the receiver that poses an offline account so the walk gets past onboarding).
      # The Ship APK above stays the gate (a failed Ship run already stopped this job); the release APK never contains the seed.
      - name: Set up JDK 17 (walk build)
        if: ${{ matrix.walk_build.cmd != null }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build the walk's own APK (test-only variant)
        if: ${{ matrix.walk_build.cmd != null }}
        env:
          DIR: ${{ matrix.walk_build.dir }}
          CMD: ${{ matrix.walk_build.cmd }}
          GLOB: ${{ matrix.walk_build.apk_glob }}
        run: |
          set -eu
          ( cd "$DIR" && chmod +x gradlew && eval "$CMD" )
          shopt -s nullglob globstar
          apks=($GLOB)
          [ "${#apks[@]}" -ge 1 ] || { echo "::error::the walk build produced no APK ($GLOB)"; exit 1; }
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          cp "${apks[0]}" app-under-test.apk
          echo "APK under test (walk build): ${apks[0]} ($("$aapt2" dump packagename app-under-test.apk))"
          echo "PKG=$("$aapt2" dump packagename app-under-test.apk)" >> "$GITHUB_ENV"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Write the walk script
        run: |
          cat > walk.sh <<'EOF'
          #!/bin/bash
          set -u
          mkdir -p walk-out
          adb shell input keyevent KEYCODE_WAKEUP; adb shell wm dismiss-keyguard || true
          adb install -r -g app-under-test.apk || { echo "::error::adb install failed"; exit 2; }
          # nothing between launch and the shared bars: pre-grant what apps ask for on first start
          adb shell appops set "$PKG" MANAGE_EXTERNAL_STORAGE allow || true
          adb shell cmd role add-role-holder --user 0 android.app.role.DIALER "$PKG" || true
          adb shell cmd role add-role-holder --user 0 android.app.role.CALL_SCREENING "$PKG" || true
          adb shell settings put global adb_wifi_enabled 0 || true
          # no WebGL in WebView on the software-GPU emulator: Lnktree's fullscreen WebGL2 shader background killed
          # the whole emulator about 4 s after load (runs 40679943894, 40758904504); pages fall back to their static
          # background. WebView reads this file on a debuggable system image; the walk checks the chrome, not WebGL.
          adb shell "echo '_ --disable-webgl --disable-3d-apis' > /data/local/tmp/webview-command-line" || true
          # stream the log from the start: a dead emulator takes a post-run `logcat -d` with it, the stream keeps what came before
          adb logcat -v threadtime "*:W" ActivityManager:I chromium:I WindowManager:I > walk-out/logcat-stream.txt 2>&1 &
          LOGCAT_PID=$!
          rc=0
          python3 1_cicd/src/scripts/cloud-android-nav-walk.py --app "$APP" --build-json "$APP/build.json" --pkg "$PKG" --out walk-out || rc=$?
          # a dead emulator makes a bare adb call wait for the device forever (run 40679943894 sat 87 min here)
          timeout 60 adb logcat -d -v threadtime > walk-out/logcat.txt || true
          kill "$LOGCAT_PID" 2>/dev/null || true
          exit $rc
          EOF
          chmod +x walk.sh

      - name: Boot emulator + walk
        # a hung emulator must not hold a runner for the whole job budget
        timeout-minutes: 90
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APP: ${{ matrix.app }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_5
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: ./walk.sh

      - name: Per-page results in the run summary
        if: always()
        run: |
          [ -f walk-out/report.md ] && cat walk-out/report.md >> "$GITHUB_STEP_SUMMARY" || echo "### ${{ matrix.app }}: no report (the walk never started)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence (report, screenshots and UI dumps of failures, logcat)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nav-walk-${{ matrix.app }}
          path: walk-out
          if-no-files-found: warn
          retention-days: 30

  report:
    needs: walk
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: nav-walk-ac_cloud-*
          path: results
      - name: Per-app table
        run: |
          {
            echo "## Nav runtime walk: per app"
            echo
            echo "| app | pages | passed | failed | skipped | scrolled | fixed |"
            echo "|---|---|---|---|---|---|---|"
            for f in results/*/report.json; do
              [ -f "$f" ] || continue
              jq -r '[.app, (.results|length), ([.results[]|select(.status=="PASS")]|length), ([.results[]|select(.status=="FAIL")]|length), ([.results[]|select(.status=="SKIP")]|length), ([.results[]|select(.checks.scroll=="scrolled")]|length), ([.results[]|select(.checks.scroll=="fixed")]|length)] | "| " + (map(tostring)|join(" | ")) + " |"' "$f"
            done
          } | tee report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: nav-walk-report
          path: |
            report.md
            results/**/report.json
            results/**/report.md
