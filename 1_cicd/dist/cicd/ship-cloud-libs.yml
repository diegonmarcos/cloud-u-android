name: "Ship → Cloud Libs APKs (one APK per library module + push to GHCR via ORAS + attach to GH Release)"

# Every module in ab_cloud-libs-shared/libs/ shipped as its own installable APK.
# ab_cloud-libs-shared/keyboard-engines bundles five modules into one companion APK; this is the
# general case, one package per module, so a lib can be installed and updated on
# its own. The module set is discovered by build.json::lib_apks (scan + exclude) -
# adding a module under ab_cloud-libs-shared/libs/ ships an APK with no edit here.
#
# Triggers:
#   - push main touching ab_cloud-libs-shared/lib-apks/ or ANY module under ab_cloud-libs-shared/libs/
#   - tag ab_cloud-libs-v* → release build
#   - workflow_dispatch → manual

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Build variant"
        required: false
        type: choice
        default: "debug"
        options: [debug, release]
      push_oras:
        description: "Push APKs to GHCR via ORAS"
        required: false
        type: boolean
        default: true
  push:
    branches: [main]
    tags:
      - "ab_cloud-libs-v*"
    paths:
      # MANAGED by cloud-android-ship-repo-workflow-engine.sh: every dir
      # ab_cloud-libs-shared/lib-apks/build.json::modules declares is added automatically, dead
      # entries are dropped, and cloud-android-source-identity.sh hashes
      # exactly this list — so nothing can trigger a build the publish
      # gate does not weigh. Extra entries no module map can express
      # (settings.gradle.kts references, scan roots) are kept: add them
      # here and they stay.
      - "1_cicd/src/cicd/ship-cloud-libs.yml"
      - "ab_cloud-libs-shared/build.json"
      - "ab_cloud-libs-shared/lib-apks/**"
      - "ab_cloud-libs-shared/libs/**"
      - "ab_cloud-libs-shared/libs/analytics/**"
      - "ab_cloud-libs/**"
permissions:
  contents: write
  packages: write

concurrency:
  group: ship-cloud-libs-${{ github.ref }}
  cancel-in-progress: true

env:
  WORK_DIR: ab_cloud-libs-shared/lib-apks

jobs:
  build_and_publish:
    name: "Build Cloud Libs APKs"
    runs-on: ubuntu-latest
    # 24 APKs from one configuration pass; the NDK-carrying modules (voice-vosk,
    # translate-mlkit) dominate. Higher than the single-APK ship workflows.
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Every application's testers, and — for the 24 that have none — the
      # COVERAGE-GAP line naming exactly what this run did NOT check. Until this
      # step existed, an application with zero testers and one with fifty
      # passing testers produced indistinguishable green ticks, and the ship
      # workflow's only question was "did Gradle exit 0". Needs no JDK, no SDK
      # and no gradle, so it costs seconds and fails before anything is built.
      #
      # DELIBERATELY NOT gated on the publish gate: the gate answers "would
      # these bytes differ?", which is the right question for publishing and the
      # wrong one for testing — editing a tester does not move the APK, and
      # gating here would let a new assertion land without ever running once.
      - name: "Test → this application's testers, and what is not covered"
        run: |
          sh 1_cicd/dist/scripts/cloud-android-test-engine.sh shell "$WORK_DIR"
          sh 1_cicd/dist/scripts/cloud-android-test-engine.sh lint  "$WORK_DIR"
          sh 1_cicd/dist/scripts/cloud-android-test-engine.sh unit  "$WORK_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Same toolchain as superapp (these ARE superapp's modules).
          packages: "platforms;android-36 platforms;android-35 platforms;android-34 platforms;android-26 build-tools;36.0.0 build-tools;35.0.0 build-tools;34.0.0 platform-tools ndk;28.0.13004108 ndk;26.1.10909125"

      - name: Set up Gradle 8.14 (cached)
        # v6, not v3: v3 bundles the old @actions/cache client, which talks to the
        # cache service GitHub retired. Every save AND restore 400s ("Our services
        # aren't available right now"), so the Gradle distribution, the dependency
        # cache and the build cache were all discarded every run — org.gradle.caching
        # was on and had nowhere to persist, and every build ran fully cold.
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14"

      # ── firestack Go module cache ───────────────────────────────────────
      # MITIGATION, not the fix — see the same step in ship-cloud-superapp.yml.
      # The fix is build-firestack.sh seeding from the committed pins and then
      # building with GOPROXY=off. This cache covers the one hole that leaves:
      # gomobile's own `go mod tidy` runs in a throwaway module with no go.sum
      # and re-verifies the whole graph against sum.golang.org. Those checksum
      # tiles live in GOMODCACHE, so a warm cache means no network; a cold one
      # still reaches out. lib-apks builds the SAME aar from the SAME engine, so
      # leaving this workflow uncached would keep the failure alive here alone.
      - name: Cache firestack Go modules + checksum-db tiles
        uses: actions/cache@v4
        with:
          path: ab_cloud-libs-shared/.cache/gomodcache
          key: firestack-gomodcache-${{ runner.os }}-${{ hashFiles('ab_cloud-libs-shared/libs/firewall/firestack/go.sum') }}
          restore-keys: firestack-gomodcache-${{ runner.os }}-

      - name: Checkout vault (shared Android signing key)
        uses: actions/checkout@v4
        with:
          repository: diegonmarcos/cloud-vault
          token: ${{ secrets.ANDROID_SIGNING_VAULT_TOKEN }}
          path: .vault

      - name: Install ORAS + sops + jq
        run: |
          sudo apt-get update -y && sudo apt-get install -y jq
          curl -fsSL https://github.com/oras-project/oras/releases/download/v1.2.0/oras_1.2.0_linux_amd64.tar.gz \
            | sudo tar -C /usr/local/bin -xzf - oras
          curl -fsSL https://github.com/getsops/sops/releases/download/v3.9.4/sops-v3.9.4.linux.amd64 \
            | sudo tee /usr/local/bin/sops >/dev/null && sudo chmod +x /usr/local/bin/sops

      - name: Determine variant
        id: variant
        run: |
          if   [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "variant=${{ inputs.variant }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "variant=release" >> "$GITHUB_OUTPUT"
          else
            echo "variant=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APKs
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
          VAULT_DIR: ${{ github.workspace }}/.vault
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x build.sh
          ./build.sh list
          if [ "${{ steps.variant.outputs.variant }}" = "release" ]; then
            ./build.sh release
          else
            ./build.sh build
          fi
          ls -la dist/

      - name: Upload APKs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cloud-Libs-${{ steps.variant.outputs.variant }}-${{ github.sha }}
          path: ${{ env.WORK_DIR }}/dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Login to GHCR
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.push_oras }}
        run: |
          echo "${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}" \
            | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push APKs to GHCR via ORAS
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.push_oras }}
        working-directory: ${{ env.WORK_DIR }}
        env:
          GITHUB_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_CREATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./build.sh oras-push

      # Whether anyone else can actually pull what we just pushed. The push
      # itself says nothing about it: visibility is decided when the package is
      # CREATED and inherited silently forever after, so this is the one cheap
      # moment to find out. A warning, not a failure — the APK is also on the
      # GH release, which is public by construction, so a private mirror
      # degrades the install route without breaking it.
      - name: Is the GHCR package publicly pullable
        # No `steps.gate` condition here. This job has no gate STEP: it
        # publishes 24 assets and the gate is per asset, so build.sh consults
        # it inside the oras-push and gh-release loops instead. This condition
        # used to read `steps.gate.outputs.skip != 'true'` against a step id
        # that does not exist in this workflow — which evaluates to the empty
        # string, is therefore always true, and made the workflow LOOK gated
        # while nothing weighed a single asset.
        if: ${{ always() }}
        continue-on-error: true
        run: sh 1_cicd/dist/scripts/cloud-android-ghcr-visibility.sh diegonmarcos cloud-libs

      # build.sh gates each of the 24 assets on its own module (plus the
      # modules that module compiles against) and republishes only the ones
      # whose source moved, then stamps <asset>.source for those it published.
      # Needs the full history the checkout above fetches: the identity is the
      # git tree sha of each input path.
      - name: Publish to GitHub Releases
        id: publish
        working-directory: ${{ env.WORK_DIR }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./build.sh gh-release

      # ── MANAGED-PUBLISH-GUARD: injected by cloud-android-ship-repo-workflow-engine.sh ──
      # Runs on everything but a cancellation, and is HANDED the two facts it
      # judges: the publish gate's own answer to "did this source move?", and the
      # `id: publish` step's own `if:` rendered to true/false. Putting that `if:`
      # on this step instead — the obvious generalisation — would stop the guard
      # running in exactly the case it exists for, a publish skipped by its own
      # condition. Copied verbatim from that step, so there is one copy in the
      # file and the two cannot drift.
      # Edit 1_cicd/src/scripts/cloud-android-publish-guard.sh, never this block.
      - name: A run that published nothing must not be green
        if: ${{ !cancelled() }}
        run: sh 1_cicd/dist/scripts/cloud-android-publish-guard.sh "ab_cloud-libs-shared/lib-apks" "${{ steps.publish.outcome }}" "false" "${{ true }}" "${{ github.event_name }}"
      # ── end MANAGED-PUBLISH-GUARD ──

