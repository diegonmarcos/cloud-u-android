name: sync-submodules

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 */12 * * *'
  workflow_dispatch:

# ── MANAGED-GUARD-CONCURRENCY: injected by cloud-android-guard-triggers.py ──
concurrency:
  group: sync-submodules-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# ── end MANAGED-GUARD-CONCURRENCY ──

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update submodules to upstream HEAD
        run: |
          git submodule update --init --recursive --remote --rebase || true
          if ! git diff --quiet; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "chore: sync submodules" || true
            bash 1_cicd/dist/scripts/cloud-android-push-main.sh || true
          fi
