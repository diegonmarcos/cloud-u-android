name: "ghcr secret scan (read-only gate before a package goes public)"

# A package re-linked to a public repository becomes anonymously pullable, and
# that cannot be undone. Before any mismatched package is deleted and re-published
# public, its current image is exported in CI (never on a laptop: the disk is
# small) and scanned for baked-in secrets: trufflehog over the filesystem plus
# .env files, private keys and sops files without their encrypted envelope.
# Read-only: GHCR_TOKEN is used only to pull (private packages), never to push.
# Exempt from the publish-module guard like the audit/delete workflows.

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "space-separated package names under ghcr.io/diegonmarcos/"
        required: true
        type: string
      results:
        description: "trufflehog --results (verified,unknown | verified)"
        default: "verified,unknown"
        type: string
      tag:
        description: "tag to scan"
        default: "latest"
        type: string

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Install crane and trufflehog (pinned)
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_Linux_x86_64.tar.gz | sudo tar -xz -C /usr/local/bin crane
          curl -fsSL https://github.com/trufflesecurity/trufflehog/releases/download/v3.82.13/trufflehog_3.82.13_linux_amd64.tar.gz | sudo tar -xz -C /usr/local/bin trufflehog
      - name: Export and scan each image
        env:
          GH_TOKEN: ${{ secrets.GHCR_TOKEN }}
          PKGS: ${{ inputs.packages }}
          TAG: ${{ inputs.tag }}
          RESULTS: ${{ inputs.results }}
        run: |
          set +e -uo pipefail   # keep scanning past a failed probe; the verdict is the dirty count
          printf '%s' "$GH_TOKEN" | crane auth login ghcr.io -u diegonmarcos --password-stdin >/dev/null
          dirty=0; : > summary.txt
          for p in $PKGS; do
            ref="ghcr.io/diegonmarcos/$p:$TAG"
            plats="$(crane manifest "$ref" 2>/dev/null | jq -r '.manifests[]?.platform | select(.os!="unknown") | "\(.os)/\(.architecture)"' | sort -u)"
            [ -n "$plats" ] || plats="default"
            for pl in $plats; do
              d="$RUNNER_TEMP/fs"; rm -rf "$d"; mkdir -p "$d"
              if [ "$pl" = default ]; then crane export "$ref" - 2>err.txt | tar -x -C "$d" 2>/dev/null
              else crane export --platform "$pl" "$ref" - 2>err.txt | tar -x -C "$d" 2>/dev/null; fi
              if [ -z "$(ls -A "$d")" ]; then echo "ERROR    $p ($pl): export failed: $(head -c 200 err.txt)" | tee -a summary.txt; dirty=$((dirty+1)); continue; fi
              findings=""
              th="$(trufflehog filesystem "$d" --no-update --json --results="$RESULTS" 2>/dev/null | jq -r '"\(.DetectorName) \(.SourceMetadata.Data.Filesystem.file)"' | sed "s#$d##" | sort -u | head -20)"
              [ -z "$th" ] || findings+="trufflehog: $th; "
              envf="$(cd "$d" && find . -xdev -type f \( -name '.env' -o -name '*.env' -o -name '.env.*' \) -not -path './usr/*' -not -path './proc/*' 2>/dev/null | head -20)"
              [ -z "$envf" ] || findings+="env files: $envf; "
              keys="$(cd "$d" && grep -rlIs -- '-----BEGIN [A-Z ]*PRIVATE KEY-----' . --exclude-dir=usr --exclude-dir=proc 2>/dev/null | grep -v -E '^\./(usr|proc)/' | grep -v -E 'test|example|snakeoil' | head -20)"
              [ -z "$keys" ] || findings+="private keys: $keys; "
              sops="$(cd "$d" && grep -rlIsE '(secret|token|password|api_key)s?\s*[:=]\s*["'"'"']?[A-Za-z0-9_\-]{16,}' . --include='*.yaml' --include='*.yml' --include='*.json' --include='*.toml' --include='*.ini' --include='*.conf' --exclude-dir=usr 2>/dev/null | xargs -r grep -LIs 'ENC\[AES256_GCM' | head -20)"
              [ -z "$sops" ] || findings+="plaintext secret-like keys: $sops; "
              if [ -n "$findings" ]; then echo "DIRTY    $p ($pl): $findings" | tee -a summary.txt; dirty=$((dirty+1))
              else echo "CLEAN    $p ($pl)" | tee -a summary.txt; fi
            done
          done
          echo "dirty: $dirty"
          { echo '```'; cat summary.txt; echo "dirty: $dirty"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          [ "$dirty" -eq 0 ]
