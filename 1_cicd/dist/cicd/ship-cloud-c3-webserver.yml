name: "Ship → Cloud-C3-WebServer APK (build + push to GHCR via ORAS + attach to GH Release)"

# The phone's local web server, natively. The APK carries ONE native file: the
# Rust server in ac_cloud-c3-webserver/server/, built here per ABI as a static
# musl executable on a runner of that ABI's architecture (the da_c3-watchdog
# recipe), handed to the gradle job as an artifact, and staged by
# app/build.gradle::stageServer as jniLibs/<abi>/libc3webserver.so — the one
# shape an app may exec from nativeLibraryDir. No rootfs, no proot, no loader,
# no cross-repo pin: everything this workflow builds is under the app directory.
#
# Same data-driven publish path as every other app: the engine reads
# ac_cloud-c3-webserver/build.json::release, so no registry, tag or artifact
# name is written in this file.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Build variant"
        required: false
        type: choice
        default: "debug"
        options:
          - debug
          - release
      push_oras:
        description: "Push APK to GHCR via ORAS"
        required: false
        type: boolean
        default: true
      create_release:
        description: "Create GitHub Release"
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    tags:
      - "ac_cloud-c3-webserver-v*"
    paths:
      # ── MANAGED-PATHS-HEADER: regenerated by cloud-android-ship-repo-workflow-engine.sh ──
      # MANAGED by cloud-android-ship-repo-workflow-engine.sh: every dir
      # ac_cloud-c3-webserver/build.json::modules declares is added automatically, dead
      # entries are dropped, and cloud-android-source-identity.sh hashes
      # this list — so nothing can trigger a build the publish gate does
      # not weigh. Extra entries no module map can express
      # (settings.gradle.kts references, scan roots) are kept: add them
      # here and they stay.
      # ONE path is watched here and deliberately NOT hashed: the
      # tester directory build.json::tests.shell.dir declares. A tester
      # edit must START a run (it is the only pipeline that executes
      # that tester) and must NOT publish an APK (it changed no bytes).
      # The gate skips it, so the run costs the test step alone.
      # ── end MANAGED-PATHS-HEADER ──
      - "1_cicd/src/cicd/ship-cloud-c3-webserver.yml"
      - "ac_cloud-c3-webserver/**"
permissions:
  contents: write   # for gh release create + tag push reads
  packages: write   # for ghcr push (oras)

concurrency:
  group: ship-cloud-c3-webserver-${{ github.ref }}
  cancel-in-progress: true

env:
  WORK_DIR: ac_cloud-c3-webserver

jobs:
  # ── The server, per ABI, on a runner of that architecture ─────────────────
  # aarch64 is built NATIVELY on the arm64 runner rather than cross-linked from
  # x86_64: that is the recipe cloud-u-linux's ship-c3-watchdog.yml already
  # proves green, and its output is the one binary shape the fleet has run from
  # nativeLibraryDir on a phone. `cargo test` runs here too, so the route table's
  # own suite — including the end-to-end run of the real server — executes on
  # the binary's own architecture before anything is packaged.
  server:
    name: "Server (${{ matrix.abi }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64
            android_abi: arm64-v8a
            runner: ubuntu-24.04-arm
          - abi: x86_64
            android_abi: x86_64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ac_cloud-c3-webserver
    steps:
      - uses: actions/checkout@v4

      # The Rust target is DECLARED in build.json::server.targets per Android
      # ABI; this step reads it rather than restating it in the matrix.
      - name: Resolve the declared Rust target
        id: target
        run: |
          set -eu
          target="$(jq -r --arg abi "${{ matrix.android_abi }}" '.server.targets[$abi] // empty' build.json)"
          [ -n "$target" ] || { echo "::error::build.json::server.targets has no Rust target for ${{ matrix.android_abi }}"; exit 1; }
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "bin=$(jq -r '.server.bin_name' build.json)" >> "$GITHUB_OUTPUT"
          echo "crate=$(jq -r '.server.crate_dir' build.json)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ steps.target.outputs.target }}

      - name: musl toolchain (+ binutils and file for the static check below)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools binutils file jq

      - name: Test (the route table's own suite, end to end, on this architecture)
        working-directory: ac_cloud-c3-webserver/${{ steps.target.outputs.crate }}
        run: cargo test --release --target ${{ steps.target.outputs.target }}

      - name: Build
        working-directory: ac_cloud-c3-webserver/${{ steps.target.outputs.crate }}
        run: cargo build --release --target ${{ steps.target.outputs.target }}

      - name: Confirm it is static and carries no PT_INTERP
        working-directory: ac_cloud-c3-webserver/${{ steps.target.outputs.crate }}
        run: |
          set -eu
          f="target/${{ steps.target.outputs.target }}/release/${{ steps.target.outputs.bin }}"
          file "$f"
          file "$f" | grep -q 'static' || { echo "::error::$f is NOT static — it would not run from nativeLibraryDir" >&2; exit 1; }
          if readelf -lW "$f" | grep -q 'INTERP'; then echo "::error::$f requests a program interpreter" >&2; exit 1; fi
          mkdir -p "../server-dist/${{ matrix.android_abi }}"
          cp "$f" "../server-dist/${{ matrix.android_abi }}/${{ steps.target.outputs.bin }}"

      - name: Hand the binary to the packaging job
        uses: actions/upload-artifact@v4
        with:
          name: c3-webserver-${{ matrix.abi }}
          path: ac_cloud-c3-webserver/server-dist/${{ matrix.android_abi }}/${{ steps.target.outputs.bin }}
          if-no-files-found: error
          retention-days: 7

  build_and_publish:
    name: "Build APK + Push (${{ matrix.abi }})"
    needs: server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One job per ABI variant (build.json::release.variants[].id). arm64 is
      # the canonical phone build; x86_64 is for Waydroid / desktop emulators.
      fail-fast: false
      matrix:
        include:
          - abi: arm64
            android_abi: arm64-v8a
          - abi: x86_64
            android_abi: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so build.sh can `git rev-parse`

      # Every application's testers, and — for those that have none — the
      # COVERAGE-GAP line naming exactly what this run did NOT check. Needs no
      # JDK, no SDK and no gradle, so it costs seconds and fails before anything
      # is built.
      #
      # DELIBERATELY NOT gated on the publish gate: the gate answers "would
      # these bytes differ?", which is the right question for publishing and the
      # wrong one for testing — editing a tester does not move the APK, and
      # gating here would let a new assertion land without ever running once.
      - name: "Test → this application's testers, and what is not covered"
        run: |
          sh 1_cicd/dist/scripts/cloud-android-test-engine.sh shell "$WORK_DIR"
          sh 1_cicd/dist/scripts/cloud-android-test-engine.sh lint  "$WORK_DIR"
          sh 1_cicd/dist/scripts/cloud-android-test-engine.sh unit  "$WORK_DIR"

      # Publish-if-changed gate. Android builds are not byte-reproducible, so a
      # rebuild of unchanged source published different bytes, a different
      # sha256 sidecar and a different OCI digest — and the Constellation store
      # compares exactly those, so every cascade rebuild showed up on every
      # phone as an update with nothing in it. The gate hashes this app's build
      # INPUTS (git tree shas of the app dir, the shared lib dirs its build.json
      # module map declares, and this workflow) and compares that identity to
      # the <asset>.source sidecar already on the release. Equal → the whole
      # rest of this job is skipped and the release asset is left untouched.
      - name: Publish gate (skip when source unchanged)
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh 1_cicd/dist/scripts/cloud-android-publish-gate.sh check "$WORK_DIR" "${{ matrix.abi }}"

      # The server built above for this ABI, at the path build.gradle::stageServer
      # reads through C3_WEBSERVER_BIN_DIR/<android abi>/<bin_name>.
      - name: Take the server binary from the server job
        if: steps.gate.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          name: c3-webserver-${{ matrix.abi }}
          path: ${{ env.WORK_DIR }}/server-dist/${{ matrix.android_abi }}

      - name: Set up JDK 17
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        if: steps.gate.outputs.skip != 'true'
        uses: android-actions/setup-android@v3
        with:
          # No cmake/ndk — the native code is the Rust binary built above by
          # cargo for a musl target, never by the NDK. Pins mirror flake.nix.
          packages: "platforms;android-35 platforms;android-34 platforms;android-26 build-tools;35.0.0 build-tools;34.0.0 platform-tools"

      - name: Set up Gradle 8.10.2 (cached)
        if: steps.gate.outputs.skip != 'true'
        # v6, not v3: v3 bundles the old @actions/cache client, which talks to the
        # cache service GitHub retired. Every save AND restore 400s ("Our services
        # aren't available right now"), so the Gradle distribution, the dependency
        # cache and the build cache were all discarded every run — org.gradle.caching
        # was on and had nowhere to persist, and every build ran fully cold.
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      # ── ONE shared Cloud-constellation signing key (vault) ──────────────
      # ALL constellation apps sign with the SAME key so cross-app
      # signature-IPC + the in-app fleet updater never hit a signature
      # mismatch. The raw keystore + its sops-encrypted passwords live ONLY in
      # the private vault repo (A_A0-Providers/D_TOOLS-DEVICES/d2-android/release.jks +
      # signing.secrets.yaml). build.sh::_resolve_signing reads $VAULT_DIR +
      # sops-decrypts (SOPS_AGE_KEY) and exports ANDROID_KEYSTORE_* for gradle.
      # NO fallback: if the key is unavailable build.sh exits 1 (desired).
      - name: Checkout vault (shared Android signing key)
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: diegonmarcos/cloud-me_vault
          token: ${{ secrets.ANDROID_SIGNING_VAULT_TOKEN }}
          path: .vault

      - name: Install ORAS + sops + gh CLI + jq
        if: steps.gate.outputs.skip != 'true'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq
          command -v gh
          curl -fsSL https://github.com/oras-project/oras/releases/download/v1.2.0/oras_1.2.0_linux_amd64.tar.gz \
            | sudo tar -C /usr/local/bin -xzf - oras
          oras version
          curl -fsSL https://github.com/getsops/sops/releases/download/v3.9.4/sops-v3.9.4.linux.amd64 \
            | sudo tee /usr/local/bin/sops >/dev/null
          sudo chmod +x /usr/local/bin/sops
          sops --version

      - name: Determine variant
        if: steps.gate.outputs.skip != 'true'
        id: variant
        run: |
          if   [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "variant=${{ inputs.variant }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "variant=release" >> "$GITHUB_OUTPUT"
          else
            echo "variant=debug" >> "$GITHUB_OUTPUT"
          fi

      # ── Build via build.sh (engine) ─────────────────────────────────
      - name: Build APK (engine)
        if: steps.gate.outputs.skip != 'true'
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
          # Shared Cloud-constellation signing key (vault checkout above).
          VAULT_DIR: ${{ github.workspace }}/.vault
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          # CLOUDNAV_VARIANT selects the ABI variant (build.json::release
          # .variants[].id) → engine overrides ABI filter + artifact name.
          CLOUDNAV_VARIANT: ${{ matrix.abi }}
          # The server job's binary: build.sh server compiles nothing when this
          # is set, and stageServer takes <abi>/<bin_name> from here.
          C3_WEBSERVER_BIN_DIR: ${{ github.workspace }}/ac_cloud-c3-webserver/server-dist
          # Kept for the engine's own `gh` calls.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x build.sh
          if [ "${{ steps.variant.outputs.variant }}" = "release" ]; then
            ./build.sh release
          else
            ./build.sh build
          fi
          ls -la dist/

      - name: Upload APK as workflow artifact
        if: steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Cloud-C3-WebServer-${{ matrix.abi }}-${{ steps.variant.outputs.variant }}-${{ github.sha }}
          path: ${{ env.WORK_DIR }}/dist/*.apk
          if-no-files-found: error
          retention-days: 30

      # ── ORAS push to GHCR (engine reads build.json::release.ghcr) ──
      - name: Login to GHCR
        if: ${{ steps.gate.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || inputs.push_oras) }}
        run: |
          echo "${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}" \
            | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push APK to GHCR via ORAS
        if: ${{ steps.gate.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || inputs.push_oras) }}
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
          CLOUDNAV_VARIANT: ${{ matrix.abi }}
          GITHUB_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_CREATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./build.sh oras-push

      # Whether anyone else can actually pull what we just pushed. The push
      # itself says nothing about it: visibility is decided when the package is
      # CREATED and inherited silently forever after, so this is the one cheap
      # moment to find out. A warning, not a failure — the APK is also on the
      # GH release, which is public by construction, so a private mirror
      # degrades the install route without breaking it.
      - name: Is the GHCR package publicly pullable
        if: ${{ always() && steps.gate.outputs.skip != 'true' }}
        continue-on-error: true
        run: sh 1_cicd/dist/scripts/cloud-android-ghcr-visibility.sh diegonmarcos cloud-c3-webserver

      # ── GitHub Release (engine reads build.json::release.gh_release) ──
      - name: Publish to GitHub Releases
        id: publish
        if: ${{ steps.gate.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || inputs.create_release) }}
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
          CLOUDNAV_VARIANT: ${{ matrix.abi }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
        run: ./build.sh gh-release

      # ── MANAGED-PUBLISH-GUARD: injected by cloud-android-ship-repo-workflow-engine.sh ──
      # Runs on everything but a cancellation, and is HANDED the two facts it
      # judges: the publish gate's own answer to "did this source move?", and the
      # `id: publish` step's own `if:` rendered to true/false. Putting that `if:`
      # on this step instead — the obvious generalisation — would stop the guard
      # running in exactly the case it exists for, a publish skipped by its own
      # condition. Copied verbatim from that step, so there is one copy in the
      # file and the two cannot drift.
      # Edit 1_cicd/src/scripts/cloud-android-publish-guard.sh, never this block.
      - name: A run that published nothing must not be green
        if: ${{ !cancelled() }}
        run: sh 1_cicd/dist/scripts/cloud-android-publish-guard.sh "ac_cloud-c3-webserver" "${{ steps.publish.outcome }}" "${{ steps.gate.outputs.skip }}" "${{ steps.gate.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || inputs.create_release) }}" "${{ github.event_name }}"
      # ── end MANAGED-PUBLISH-GUARD ──


      - name: Stamp source identity on the published assets
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh 1_cicd/dist/scripts/cloud-android-publish-gate.sh stamp "$WORK_DIR" "${{ matrix.abi }}"
