name: "workflow-header-fence guard — the managed paths: header can never strand matters"

# WHY THIS WORKFLOW EXISTS.
# The paths: header of every ship-*.yml is generated by
# cloud-android-ship-repo-workflow-engine.sh. The old engine recognised its own
# header by exact text match against the CURRENT header and re-emitted every
# other comment as the author's, so re-wording the header stranded every
# old-wrapping line below the new header forever — the generator laundering its
# own stale output into hand-written content (task #483, a recurrence of #237).
# The fix fences the managed region with explicit BEGIN/END markers.
#
# This tester is the regression guard. It is NOT a grep of today's generated
# .yml for the stranded string: that string disappears the day the file is
# regenerated while the mechanism would still be there for the next header edit,
# which is exactly the check-that-cannot-fail shape this ticket is about. The
# tester imports the SAME module the engine runs (cloud_android_workflow_paths.py)
# and drives it through the defect's shape and through a header-text mutation,
# asserting nothing strands and authored prose survives. It has been proven to
# fail against a reintroduction of the old logic.
#
# NO PATH FILTER: the header-region logic is one of the things under test, and
# filtering this workflow by the kind of file it audits would let an edit to that
# logic disable the audit of that logic. It needs no gradle, no device, no
# network, so it costs seconds and runs on every push.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  header-fence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: A re-worded paths header strands nothing; authored prose survives; regeneration is idempotent
        run: bash 1_cicd/src/scripts/test/test-workflow-header-fence.test.sh