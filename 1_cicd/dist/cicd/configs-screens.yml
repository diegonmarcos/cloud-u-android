name: "Configs screens — render every SuperApp Configs page at Galaxy A37 density and measure its controls"

# ConfigsScreensTest (aa_cloud-superapp/app/src/test/.../configs) draws the Configs grid and every page/tab under it at
# 384x832dp / 450dpi (Samsung Galaxy A37, SM-A376B) and fontScale 1.0 + 1.3, writes a PNG and a TSV of every
# clickable's dp size per screen, and fails when a button renders over 32dp or a row over 44dp (fontScale 1.0).
# The PNGs + TSVs are uploaded as the `configs-screens` artifact, red or green.
# #1080: ShellTopInsetGuardTest renders Configs, Configs with its search open, ADB Shell and every native Configs / Cloud page
# in the shell's real page container under a moving top row (top-inset-*.png) and fails when any starts under it;
# AdbPeerDotsTest renders the home status with its two ADB dots (home-top-status-adb-dots*.png); Cloud Store's own suite
# renders its Configs > ADB Shell (ac_cloud-store/app/build/configs-screens/store-configs-adb-shell.png).
# HomeOverflowMatrixTest renders the home screen (status strip over the home grid, centre camera cutout) at 420/450/480/508
# dpi (1080 px wide: 411/384/360/340 dp, Samsung Screen zoom) x fontScale 1.0/1.15/1.3, fails when any child leaves the
# screen or the strip's safe width, and writes app/build/home-overflow/ into the same artifact.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "1_cicd/src/cicd/configs-screens.yml"
      - "aa_cloud-superapp/app/src/**"
      - "aa_cloud-superapp/build.json"
      - "ab_cloud-libs-shared/libs/ui-kit/**"
      - "ab_cloud-libs-shared/libs/shizuku-adb-debug-tools/**"
      - "ac_cloud-store/app/src/**"

permissions:
  contents: read

concurrency:
  group: configs-screens-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 platforms;android-35 platforms;android-34 platforms;android-26 build-tools;36.0.0 build-tools;35.0.0 build-tools;34.0.0 platform-tools cmake;3.22.1 ndk;28.0.13004108 ndk;26.1.10909125"

      - name: Set up Gradle 8.14 (cached)
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14"
      # ── MANAGED-GRADLE-CACHE-HYGIENE: injected by cloud-android-gradle-cache-hygiene.py ──
      # Edit 1_cicd/src/actions/gradle-cache-hygiene, never this block.
      - name: Gradle cache hygiene (retry failed resolution, never cache a failed lookup)
        uses: ./.github/actions/gradle-cache-hygiene
      # ── end MANAGED-GRADLE-CACHE-HYGIENE ──

      - name: Cache firestack Go modules + checksum-db tiles
        uses: actions/cache@v4
        with:
          path: ab_cloud-libs-shared/.cache/gomodcache
          key: firestack-gomodcache-${{ runner.os }}-${{ hashFiles('ab_cloud-libs-shared/libs/firewall/firestack/go.sum') }}
          restore-keys: firestack-gomodcache-${{ runner.os }}-

      - name: Checkout vault (shared Android signing key)
        uses: actions/checkout@v4
        with:
          repository: diegonmarcos/cloud-me-pvt-vault
          token: ${{ secrets.ANDROID_SIGNING_VAULT_TOKEN }}
          path: .vault

      - name: Install sops (pinned, sha256-checked, fails at the download)
        uses: ./.github/actions/install-pinned-tools
        with:
          tools: sops

      - name: Render + measure every Configs screen
        working-directory: aa_cloud-superapp
        env:
          BYPASS_NIX: "1"
          VAULT_DIR: ${{ github.workspace }}/.vault
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UNIT_TEST_FILTER: "com.diegonmarcos.superapp.configs.ConfigsScreensTest"
        run: bash ./build.sh test

      - name: Render + guard the home screen over the density x font x zoom matrix
        if: always()
        working-directory: aa_cloud-superapp
        env:
          BYPASS_NIX: "1"
          VAULT_DIR: ${{ github.workspace }}/.vault
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UNIT_TEST_FILTER: "com.diegonmarcos.superapp.launcher.HomeOverflowMatrixTest"
        run: bash ./build.sh test

      - name: Render the Notify page (One UI cards) at A37 size
        if: always()
        working-directory: aa_cloud-superapp
        env:
          BYPASS_NIX: "1"
          VAULT_DIR: ${{ github.workspace }}/.vault
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UNIT_TEST_FILTER: "com.diegonmarcos.superapp.launcher.NotifyScreenTest"
        run: bash ./build.sh test

      - name: Render the Weather card (seeded location, and no location) at A37 size
        if: always()
        working-directory: aa_cloud-superapp
        env:
          BYPASS_NIX: "1"
          VAULT_DIR: ${{ github.workspace }}/.vault
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UNIT_TEST_FILTER: "com.diegonmarcos.superapp.*.Weather*"
        run: bash ./build.sh test

      - name: Weather tests passed BY NAME (4 classes, no failure, none skipped)
        if: always()
        working-directory: aa_cloud-superapp
        run: |
          set -u
          out=app/build/configs-screens/weather-unit-xml; mkdir -p "$out"
          find app/build/test-results -name 'TEST-*Weather*.xml' -exec cp {} "$out"/ \;
          ls "$out"
          rc=0
          for c in notificationcenter.WeatherLocationTest notificationcenter.WeatherFixStoreTest notificationcenter.WeatherFaceTest launcher.WeatherCardScreenTest; do
            f="$out/TEST-com.diegonmarcos.superapp.$c.xml"
            if [ ! -f "$f" ]; then echo "::error::no report for $c"; rc=1; continue; fi
            t=$(grep -o 'tests="[0-9]*"' "$f" | head -1 | tr -dc 0-9)
            bad=$(grep -o -E '(failures|errors|skipped)="[1-9][0-9]*"' "$f" | head -1 || true)
            echo "$c tests=$t ${bad:-failures=0 errors=0 skipped=0}"
            { [ "${t:-0}" -ge 1 ] && [ -z "$bad" ]; } || rc=1
          done
          exit $rc

      - name: Render the Quick Actions and KDE cards next to their notifications; parity + one-source guard
        if: always()
        working-directory: aa_cloud-superapp
        env:
          BYPASS_NIX: "1"
          VAULT_DIR: ${{ github.workspace }}/.vault
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UNIT_TEST_FILTER: "com.diegonmarcos.superapp.launcher.NotifyCard*"
        run: bash ./build.sh test

      # #1120 Cloud Mesh: Status (Connect / Disconnect / Reconnect + Always-on) and Profile (Start-up) per state, PNGs
      # mesh-status-*.png / mesh-profile-*.png, and every Mesh* test class (supervisor rules, Always-on, mesh-down
      # debounce, alert, store, compose) run and then required BY NAME below.
      - name: Render Cloud Mesh Status + Profile per state; run the Mesh tests (#1120)
        if: always()
        working-directory: aa_cloud-superapp
        env:
          BYPASS_NIX: "1"
          VAULT_DIR: ${{ github.workspace }}/.vault
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UNIT_TEST_FILTER: "com.diegonmarcos.superapp.*.*Mesh*"
        run: bash ./build.sh test

      - name: Mesh tests passed BY NAME (no failure, none skipped) (#1120)
        if: always()
        working-directory: aa_cloud-superapp
        run: |
          set -u
          out=app/build/configs-screens/mesh-unit-xml; mkdir -p "$out"
          find app/build/test-results -name 'TEST-*Mesh*.xml' -exec cp {} "$out"/ \;
          rc=0
          for c in network.MeshSupervisorTest network.MeshAlwaysOnVpnTest network.MeshDownModelTest network.MeshIntentTest \
                   network.mesh.MeshDeclTest network.mesh.MeshStoreTest network.mesh.MeshPageComposeTest network.mesh.MeshVpnControlsTest \
                   network.mesh.MeshScreensShotTest notificationcenter.MeshDownAlertTest; do
            f="$out/TEST-com.diegonmarcos.superapp.$c.xml"
            if [ ! -f "$f" ]; then echo "::error::no report for $c"; rc=1; continue; fi
            t=$(grep -o 'tests="[0-9]*"' "$f" | head -1 | tr -dc 0-9)
            bad=$(grep -o -E '(failures|errors|skipped)="[1-9][0-9]*"' "$f" | head -1 || true)
            echo "$c tests=$t ${bad:-failures=0 errors=0 skipped=0}"
            { [ "${t:-0}" -ge 1 ] && [ -z "$bad" ]; } || rc=1
          done
          for p in mesh-status-connected mesh-status-disconnected mesh-status-no-engine mesh-profile-startup mesh-profile-startup-no-channel; do
            [ -s "app/build/configs-screens/$p.png" ] || { echo "::error::no screenshot $p.png"; rc=1; }
          done
          exit $rc

      - name: Render + guard the Configs grid fits one A37 screen (grid-fit@*.png)
        if: always()
        working-directory: aa_cloud-superapp
        env:
          BYPASS_NIX: "1"
          VAULT_DIR: ${{ github.workspace }}/.vault
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UNIT_TEST_FILTER: "com.diegonmarcos.superapp.launcher.ConfigsIconSizeTest"
        run: bash ./build.sh test

      - name: Render + guard the "|" separators sit on the icon line and keep columns (sep1069-*.png)
        if: always()
        working-directory: aa_cloud-superapp
        env:
          BYPASS_NIX: "1"
          VAULT_DIR: ${{ github.workspace }}/.vault
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UNIT_TEST_FILTER: "com.diegonmarcos.superapp.launcher.TileSeparatorAlignTest"
        run: bash ./build.sh test

      - name: Guard + render every page under the top row, at every strip height (top-inset-*.png)
        if: always()
        working-directory: aa_cloud-superapp
        env:
          BYPASS_NIX: "1"
          VAULT_DIR: ${{ github.workspace }}/.vault
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UNIT_TEST_FILTER: "com.diegonmarcos.superapp.launcher.ShellTopInset*"
        run: bash ./build.sh test

      - name: Render the home status with its two ADB dots (home-top-status-adb-dots*.png)
        if: always()
        working-directory: aa_cloud-superapp
        env:
          BYPASS_NIX: "1"
          VAULT_DIR: ${{ github.workspace }}/.vault
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UNIT_TEST_FILTER: "com.diegonmarcos.superapp.launcher.AdbPeerDotsTest"
        run: bash ./build.sh test

      - name: Render Cloud Store Configs > ADB Shell (store-configs-adb-shell.png) and run the Store suites
        if: always()
        working-directory: ac_cloud-store
        env:
          BYPASS_NIX: "1"
          VAULT_DIR: ${{ github.workspace }}/.vault
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ./build.sh test

      - name: Summary (dp per control, every screen)
        if: always()
        run: |
          d=aa_cloud-superapp/app/build/configs-screens
          ls "$d"/*.tsv >/dev/null 2>&1 || exit 0
          { echo '```'; for f in "$d"/*.tsv; do cat "$f"; echo; done; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload PNGs + TSVs + test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: configs-screens
          path: |
            aa_cloud-superapp/app/build/configs-screens/
            aa_cloud-superapp/app/build/home-overflow/
            ac_cloud-store/app/build/configs-screens/
            aa_cloud-superapp/app/build/reports/tests/
          if-no-files-found: warn
