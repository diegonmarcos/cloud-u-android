# ╔═══════════════════════════════════════════════════════════════════════╗
# ║ Test → terminal upgrade unpacks by itself (emulator, reusable) #1121   ║
# ║                                                                        ║
# ║ Install the terminal (the rootfs library APK first when it has one),   ║
# ║ NEVER open it, then replace it in place (`adb install -r`, which sends ║
# ║ MY_PACKAGE_REPLACED). Its UnpackReceiver must start UnpackService and  ║
# ║ the unpacked files must appear: files/unpack-result.json with ok:true  ║
# ║ and files/usr/bin/login. No activity of the app is ever started; the   ║
# ║ screenshot is evidence of that. Called from ship-cloud-termux.yml and  ║
# ║ ship-cloud-nix-on-droid.yml after the fresh-install test.              ║
# ╚═══════════════════════════════════════════════════════════════════════╝
name: "Test → terminal upgrade unpacks by itself (emulator, reusable)"

on:
  workflow_call:
    inputs:
      app:
        type: string
        required: true
      artifact_prefix:
        description: "Name prefix of the x86_64 APK artifact the calling Ship run uploaded"
        type: string
        required: true
      lib_package:
        description: "Package of the rootfs library APK to install first ('' = none)"
        type: string
        default: ""
      lib_release_asset:
        description: "Release asset of that lib (x86_64) when this run did not rebuild it"
        type: string
        default: ""
      release_tag:
        type: string
        default: "latest"
      api_level:
        type: string
        default: "34"
  workflow_dispatch:
    inputs:
      app: {required: true, type: string}
      artifact_prefix: {required: true, type: string}
      lib_package: {type: string, default: ""}
      lib_release_asset: {type: string, default: ""}
      release_tag: {type: string, default: "latest"}
      api_level: {type: string, default: "34"}
      run_id:
        description: "Ship run whose APK artifacts to test"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  upgrade-unpack:
    name: "Upgrade unpacks without opening (${{ inputs.app }} · API ${{ inputs.api_level }})"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Fetch this run's APKs
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.artifact_prefix }}*
          path: apk
          run-id: ${{ inputs.run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pick the app APK (and the lib APK)
        id: apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          LIB_PKG: ${{ inputs.lib_package }}
          LIB_ASSET: ${{ inputs.lib_release_asset }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -eu
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          app=""; lib=""
          for f in $(find apk -name '*.apk' 2>/dev/null | sort); do
            p=$("$aapt2" dump packagename "$f")
            echo "$f -> $p"
            if [ -n "$LIB_PKG" ] && [ "$p" = "$LIB_PKG" ]; then lib="$f"; elif [ -z "$app" ]; then app="$f"; fi
          done
          if [ -z "$app" ]; then
            echo "No APK in this run (the publish gate skipped the build): nothing new to test."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          cp "$app" app.apk
          pkg=$("$aapt2" dump packagename app.apk)
          if [ -n "$LIB_PKG" ]; then
            if [ -n "$lib" ]; then cp "$lib" lib.apk
            else gh release download "$TAG" -R "$REPO" -p "$LIB_ASSET" -O lib.apk; fi
            [ "$("$aapt2" dump packagename lib.apk)" = "$LIB_PKG" ] || { echo "::error::lib.apk is not $LIB_PKG"; exit 1; }
          fi
          { echo "skip=false"; echo "pkg=$pkg"; } >> "$GITHUB_OUTPUT"

      - name: Enable KVM
        if: steps.apk.outputs.skip != 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Write the probe
        if: steps.apk.outputs.skip != 'true'
        env:
          PKG: ${{ steps.apk.outputs.pkg }}
          APP: ${{ inputs.app }}
        run: |
          printf "#!/bin/bash\nPKG='%s'; APP='%s'\n" "$PKG" "$APP" > probe.sh
          cat >> probe.sh <<'EOF'
          set -u
          mkdir -p out
          adb root >/dev/null 2>&1 || true
          sleep 3
          adb wait-for-device
          [ "$(adb shell id -u | tr -d '\r')" = 0 ] || { echo "::error::adb root is not available on this image"; exit 2; }
          D=/data/data/$PKG/files
          if [ -f lib.apk ]; then
            adb install -r lib.apk || { echo "::error::lib APK install failed"; exit 2; }
          fi
          adb install -r -g app.apk || { echo "::error::app APK install failed"; exit 2; }
          # Before the upgrade nothing is unpacked: a fresh install runs no receiver, and the app is never opened.
          if adb shell "[ -e $D/unpack-result.json ]"; then echo "::error::unpack-result.json exists before the upgrade"; exit 1; fi
          if adb shell "[ -x $D/usr/bin/login ]"; then echo "::error::the bootstrap is unpacked before the upgrade: this test proves nothing"; exit 1; fi
          # A package that was never started is in Android's "stopped" state, and the system does not
          # deliver MY_PACKAGE_REPLACED to it (observed: stopped=true notLaunched=true, no unpack). A real
          # phone's terminal has run before, so it is not stopped; Cloud Store's explicit start is what
          # covers a stopped one. Take the state away WITHOUT any UI: start only the receiver's process
          # (root, an action it ignores), then require stopped=false before the upgrade.
          adb shell cmd package set-stopped-state --user 0 "$PKG" false >/dev/null 2>&1 || true
          if adb shell dumpsys package "$PKG" | grep -q "stopped=true"; then
            adb shell am broadcast -n "$PKG/com.termux.app.UnpackReceiver" -a android.intent.action.BOOT_COMPLETED --include-stopped-packages >/dev/null 2>&1 || true
            sleep 5
          fi
          if adb shell dumpsys package "$PKG" | grep -q "stopped=true"; then echo "::error::could not take $PKG out of the stopped state"; exit 2; fi
          adb logcat -c || true
          # The upgrade: same package, replaced in place. The system sends MY_PACKAGE_REPLACED.
          adb install -r -g app.apk || { echo "::error::upgrade install failed"; exit 2; }
          ok=""
          for i in $(seq 1 60); do
            sleep 20
            r=$(adb shell cat $D/unpack-result.json 2>/dev/null | tr -d '\r' || true)
            case "$r" in *'"ok":true'*) ok="$r"; break;; *'"ok":false'*) ok="$r"; break;; esac
            echo "not unpacked yet (${i})"
          done
          adb exec-out screencap -p > out/screen.png || true
          adb logcat -d -v threadtime > out/logcat.txt
          adb shell dumpsys package "$PKG" > out/package.txt || true
          adb shell dumpsys activity activities > out/activities.txt || true
          adb shell "ls -la $D $D/usr/bin/login" > out/files.txt 2>&1 || true
          echo "result: ${ok:-none}"
          case "$ok" in
            *'"ok":true'*) ;;
            *) echo "::error title=$APP upgrade::the upgrade did not unpack by itself (result '${ok:-none}')"
               grep -E "$PKG|Unpack|AndroidRuntime" out/logcat.txt | tail -60; exit 1 ;;
          esac
          adb shell "[ -x $D/usr/bin/login ]" || { echo "::error title=$APP upgrade::bin/login is missing after the unpack"; exit 1; }
          # The app was never opened: none of its activities was ever resumed.
          if grep -E "ResumedActivity|mResumedActivity|topResumedActivity" out/activities.txt | grep -q "$PKG"; then
            echo "::error title=$APP upgrade::an activity of $PKG is in front: the app was opened"; exit 1
          fi
          echo "$APP: the upgrade unpacked its files without being opened."
          EOF
          chmod +x probe.sh

      - name: Boot a clean emulator + probe
        if: steps.apk.outputs.skip != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api_level }}
          arch: x86_64
          target: google_apis
          disk-size: 8G
          ram-size: 4096M
          cores: 4
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -wipe-data -noaudio -no-boot-anim
          disable-animations: true
          script: ./probe.sh

      - name: Upload evidence (screenshot, logcat, files)
        if: always() && steps.apk.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app }}-upgrade-unpack
          path: out/
          if-no-files-found: warn
