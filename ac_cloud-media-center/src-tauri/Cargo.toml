[package]
name = "cloud-media-center"
version = "0.1.0"
edition = "2021"
description = "The cloud-media-center app: a Tauri webview over the bundled web/ pages (music, videos, gallery, books, feed, movies, documentaries). Rust plus static web; the only Kotlin is the glue Tauri generates."

[lib]
# The name Tauri's generated activity loads (System.loadLibrary) and the one
# build.json::tauri.lib_name declares.
name = "cloud_media_center_lib"
crate-type = ["cdylib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
# No default features: compression, dynamic ACL, x11/dbus and the Windows
# controls are for desktop apps. wry is the webview.
tauri = { version = "=2.12.1", default-features = false, features = ["wry"] }
# Every link out (a TIDAL search, a YouTube video, a Pinterest board, an IMDb
# page) leaves the app through the system's own handler, never inside the
# webview.
tauri-plugin-opener = "=2.7.1"

[profile.release]
# The library is the APK: size, not speed, is what a phone downloads.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
