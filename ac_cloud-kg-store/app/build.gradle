plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def buildJson = new groovy.json.JsonSlurper().parse(file('../build.json'))

// Version code: minutes since 2026-01-01 UTC over a 3,000,000 base — the fleet encoding
// (ac_cloud-calc / ac_cloud-c3), so an update is never refused as older.
def codeFinal = { ->
    def base  = java.time.LocalDateTime.of(2026, 1, 1, 0, 0)
    def built = java.time.LocalDateTime.now(java.time.ZoneOffset.UTC)
    def stamp = System.getenv('COMMS_BUILD_TIMESTAMP')
    if (stamp) {
        try {
            built = java.time.LocalDateTime.parse(stamp,
                java.time.format.DateTimeFormatter.ofPattern('yyyyMMdd.HHmmss'))
        } catch (ignored) { }
    }
    long mins = java.time.Duration.between(base, built).toMinutes()
    return mins > 0 ? (int) (3000000L + mins) : 3000000
}()

def shortSha = (System.getenv('GITHUB_SHA')
                ?: providers.exec {
                       commandLine 'git', 'rev-parse', '--short=8', 'HEAD'
                       ignoreExitValue = true
                   }.standardOutput.asText.get().trim())
                .take(8)

def buildTimestamp = new java.text.SimpleDateFormat("yyyy-MM-dd HH:mm:ss 'UTC'").with {
    setTimeZone(java.util.TimeZone.getTimeZone('UTC'))
    format(new java.util.Date())
}

def logSinkUrl    = (buildJson.diagnostics?.log_sink_url    ?: '')
def logSinkStream = (buildJson.diagnostics?.log_sink_stream ?: 'cloud-kg-store')

def b64 = { obj -> groovy.json.JsonOutput.toJson(obj).bytes.encodeBase64().toString() }

// ── the declarations, baked ────────────────────────────────────────────────
// #868 ui.bottom_nav + ui.sections + ui.default_section are THE navigation declaration
// (libs:bottomnav's NavDecl). Decl.kt is the only decoder. The fleet agent gateway's address is baked
// from the fleet catalogue by libs/ai/ai-gateway.gradle (aiGatewayUrl), so no endpoint is spelled here.
apply from: "$rootDir/../ab_cloud-libs-shared/libs/ai/ai-gateway.gradle"
if (!buildJson.ui?.bottom_nav || !buildJson.ui?.sections)
    throw new GradleException("build.json::ui.bottom_nav / ui.sections missing — the island would draw nothing (#868)")
def uiSectionsB64    = b64(buildJson.ui.sections)
def uiBottomNav      = buildJson.ui.bottom_nav.join(',')
def uiDefaultSection = (buildJson.ui.default_section ?: buildJson.ui.bottom_nav[0]).toString()

// #1207 Cloud Search's declaration, by reference (the browser's shape): build.json::search is the ONE declaration of the
// verticals, sources, feeds and the code indexes; search-core (linked in build.json::modules) parses and runs it. It is baked
// whole and decoded by core's SearchConfig; a Java string constant holds at most 65535 bytes.
def searchDecl = new groovy.json.JsonSlurper().parse(file('../../ac_cloud-search/build.json')).search
if (searchDecl == null) throw new GradleException("ac_cloud-search/build.json::search missing - the Web and Repo pages would have nothing to read")
def searchConfigB64 = b64(searchDecl)
// assets/kg/kg.json is this app's own page declaration; the fleet services it names (and the two code indexes') are baked with
// their mesh and public addresses from ac_cloud-account/build.json::fleet_endpoints, never spelled here.
def kgDecl = new groovy.json.JsonSlurper().parse(file('src/main/assets/kg/kg.json'))
def fleetDecl = new groovy.json.JsonSlurper().parse(new File(rootDir, '../ac_cloud-account/build.json')).fleet_endpoints.services
def fleetUsed = (kgDecl.pages.values().collectMany { (it.services ?: []) + (it.service ? [it.service] : []) + (it.rerank ? [it.rerank.service] : []) } +
                 (searchDecl.cgc?.indexes ?: []).collect { it.service }).unique()
def fleetServicesB64 = b64(fleetUsed.collect { id ->
    def sv = fleetDecl.find { it.id == id }
    if (sv == null) throw new GradleException("assets/kg/kg.json names the fleet service '${id}', which ac_cloud-account/build.json::fleet_endpoints does not declare")
    [id: id, kind: sv.kind ?: '', health: sv.health ?: '', route_paths: sv.route_paths ?: [],
     mesh_url: sv.mesh_dns ? "${sv.mesh_scheme ?: 'http'}://${sv.mesh_dns}${sv.mesh_port ? ':' + sv.mesh_port : ''}${sv.mesh_path ?: ''}".toString() : '',
     public_url: sv.public_domain ? "${sv.public_scheme ?: 'https'}://${sv.public_domain}${sv.public_path ?: ''}".toString() : '',
     policy: sv.policy ?: 'mesh_first']
})
// The fleet's apps (Binary, Web/Debug) and their debug ports, from the generated manifest and the port table.
def fleetManifest = new groovy.json.JsonSlurper().parse(new File(rootDir, '../aa_cloud-superapp/data/constellation-fleet.json'))
def fleetAppsB64 = b64(fleetManifest.apps.findAll { it.kind == 'app' }.collect {
    [id: it.id, label: it.label, display_name: it.display_name ?: it.label, package: it.package, version_name: it.version_name ?: '',
     image: it.image ?: '', asset: it.asset ?: '', release_url: it.release_url ?: '', repo_url: it.repo_url ?: '']
})
def debugPortsB64 = b64(new groovy.json.JsonSlurper().parse(new File(rootDir, '../1_cicd/src/data/debug-ports.json')).ports)
[searchConfigB64, fleetServicesB64, fleetAppsB64, debugPortsB64].each {
    if (it.length() > 65000) throw new GradleException("a baked declaration is ${it.length()} bytes: a Java string constant holds 65535")
}

android {
    namespace 'com.diegonmarcos.cloudkgstore'
    compileSdk 36

    defaultConfig {
        // Launcher label = build.json::name, the application's one name (#351).
        resValue "string", "app_name", buildJson.display_name
        applicationId 'com.diegonmarcos.cloudkgstore'
        minSdk 26
        targetSdk 35
        // English is the fleet's base language (#299).
        resConfigs "en"
        versionCode codeFinal
        versionName "${buildJson.android.version_name} (sha-${shortSha})"
        ndk {
            def abiOverride = System.getenv('CLOUDKGSTORE_ABIS')
            def abis = (abiOverride?.trim()) \
                ? abiOverride.split(',').collect { it.trim() }.findAll { it } \
                : (buildJson.android.abi_filters ?: ['arm64-v8a'])
            abiFilters.addAll(abis as List)
        }
        buildConfigField "String", "GIT_SHORT_SHA",      "\"${shortSha}\""
        buildConfigField "String", "BUILD_TIMESTAMP",    "\"${buildTimestamp}\""
        buildConfigField "String", "LOG_SINK_URL",       "\"${logSinkUrl}\""
        buildConfigField "String", "LOG_SINK_STREAM",    "\"${logSinkStream}\""
        buildConfigField "String", "UI_SECTIONS_B64",    "\"${uiSectionsB64}\""
        buildConfigField "String", "UI_BOTTOM_NAV",      "\"${uiBottomNav}\""
        buildConfigField "String", "UI_DEFAULT_SECTION", "\"${uiDefaultSection}\""
        buildConfigField "String", "AI_GATEWAY_URL",     "\"${aiGatewayUrl}\""
        buildConfigField "String", "SEARCH_CONFIG_B64",  "\"${searchConfigB64}\""
        buildConfigField "String", "FLEET_SERVICES_B64", "\"${fleetServicesB64}\""
        buildConfigField "String", "FLEET_APPS_B64",     "\"${fleetAppsB64}\""
        buildConfigField "String", "DEBUG_PORTS_B64",    "\"${debugPortsB64}\""
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures {
        buildConfig = true
        compose = true
    }

    // ONE shared Cloud-constellation key — same key as every other app in the fleet.
    signingConfigs {
        debug {
            def envStore = System.getenv("ANDROID_KEYSTORE_FILE")
            if (envStore == null || envStore.isEmpty() || !file(envStore).exists()) {
                throw new GradleException("ONE shared constellation key required; run via build.sh / set ANDROID_KEYSTORE_FILE; no fallback")
            }
            storeFile     file(envStore)
            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
            keyAlias      System.getenv("ANDROID_KEY_ALIAS")
            keyPassword   System.getenv("ANDROID_KEY_PASSWORD")
        }
    }

    buildTypes {
        debug   { debuggable true;  signingConfig signingConfigs.debug }
        release { debuggable true; minifyEnabled false
                  proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
                  signingConfig signingConfigs.debug }
    }

    packaging {
        resources {
            excludes += ['META-INF/NOTICE.md', 'META-INF/LICENSE.md',
                         'META-INF/NOTICE',    'META-INF/LICENSE']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation project(':libs:core')
    // The fleet's navigation: NavDecl and the top-bar scaffold's drawer (libs:bottomnav), the first row with
    // Profile at the top right, the second row with icons, the bottom nav, the page gradient (#1154).
    implementation project(':libs:bottomnav')
    implementation project(':libs:ui-nav-bars')
    implementation project(':libs:theme-background')
    // The fleet's AI chat: the page, sessions drawer, Markdown and streaming are the lib's.
    implementation project(':libs:ai')
    implementation project(':libs:model-catalogue')
    // #1207 Cloud Search's plain-JVM core, by reference: the declared sources and parsers, the query engine, the CGC and MCP protocol.
    implementation project(':search-core')

    implementation platform('androidx.compose:compose-bom:2025.11.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.core:core-ktx:1.15.0'
    // themes.xml's parent, Theme.Material3.Dark.NoActionBar, lives here.
    implementation 'com.google.android.material:material:1.12.0'

    // Android's own org.json at runtime; the real library for the JVM suite.
    testImplementation 'org.json:json:20240303'
    testImplementation 'junit:junit:4.13.2'
}
