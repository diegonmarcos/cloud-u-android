plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    // #648 the whole chrome is Compose (C3Shell in MainActivity), over the fleet's
    // bottom-nav island — the same toolchain ac_cloud-drive's shell compiles against.
    id 'org.jetbrains.kotlin.plugin.compose'
    // Declarations.kt parses the baked ui.* blobs with kotlinx-serialization-json, so
    // the JVM suite exercises the real parser against this repository's own build.json.
    id 'org.jetbrains.kotlin.plugin.serialization'
}

def gradleScriptStartMs = System.currentTimeMillis()

def buildJson = new groovy.json.JsonSlurper().parse(file('../build.json'))

// Version code: minutes since 2026-01-01 UTC over a 3,000,000 base.
//
// NOT build.json's version_code plus a CI run number: that counter is per-WORKFLOW, so
// the moment an app was built by a different workflow than the one that produced the
// installed APK the number handed out was SMALLER than the last published one and Android
// refused the update with "Update version code N is older than current M". Wall clock only
// ever moves forward and is identical for every workflow, runner and trigger. Same encoding
// as ac_cloud-drive / ac_cloud-wallet / ac_cloud-mail, so the whole fleet is comparable.
// COMMS_BUILD_TIMESTAMP is honoured when CI provides one so the code matches the release tag.
def codeFinal = { ->
    def base  = java.time.LocalDateTime.of(2026, 1, 1, 0, 0)
    def built = java.time.LocalDateTime.now(java.time.ZoneOffset.UTC)
    def stamp = System.getenv('COMMS_BUILD_TIMESTAMP')
    if (stamp) {
        try {
            built = java.time.LocalDateTime.parse(stamp,
                java.time.format.DateTimeFormatter.ofPattern('yyyyMMdd.HHmmss'))
        } catch (ignored) { }
    }
    long mins = java.time.Duration.between(base, built).toMinutes()
    return mins > 0 ? (int) (3000000L + mins) : 3000000
}()

def shortSha = (System.getenv('GITHUB_SHA')
                ?: providers.exec {
                       commandLine 'git', 'rev-parse', '--short=8', 'HEAD'
                       ignoreExitValue = true
                   }.standardOutput.asText.get().trim())
                .take(8)

def buildTimestamp = new java.text.SimpleDateFormat("yyyy-MM-dd HH:mm:ss 'UTC'").with {
    setTimeZone(java.util.TimeZone.getTimeZone('UTC'))
    format(new java.util.Date())
}

def logSinkUrl    = (buildJson.diagnostics?.log_sink_url    ?: '')
def logSinkStream = (buildJson.diagnostics?.log_sink_stream ?: 'cloud-c3')

def b64 = { obj -> groovy.json.JsonOutput.toJson(obj).bytes.encodeBase64().toString() }

// ── the declarations, baked ────────────────────────────────────────────────
// ONE bake per declared list. Declarations.kt is the only decoder; no screen reads
// a BuildConfig blob. #868 ui.bottom_nav + ui.sections + ui.default_section are THE nav declaration
// (libs:bottomnav's NavDecl reads all three).
def uiSectionsB64      = b64(buildJson.ui.sections       ?: [])
def uiBottomNav        = (buildJson.ui.bottom_nav        ?: []).join(',')
def uiDefaultSection   = (buildJson.ui.default_section   ?: '').toString()
def uiIconDefault      = (buildJson.ui.icon_default      ?: 'stack').toString()
def uiExternalAppsB64  = b64(buildJson.ui.external_apps  ?: [])
// The Apps tab's Services/Tools: the declaration (ui.apps_page) and the slice of cloud-infra's
// consolidated export that data/gen_infra_slice.py derived from it. A missing slice would draw
// empty pages that look like working ones (#276), so it is asserted present.
def uiAppsPageB64      = b64(buildJson.ui.apps_page      ?: [:])
def uiTopologyB64      = b64(buildJson.ui.topology       ?: [:])
def infraSliceFile     = file("../data/infra_slice.json")
if (!infraSliceFile.exists()) throw new GradleException("missing data/infra_slice.json - run data/gen_infra_slice.py; the Services and Tools pages would bake empty and look fine")
def infraSliceB64      = infraSliceFile.bytes.encodeBase64().toString()
// The Containers > Table rows and their More-page declarations. Each is baked as an ARRAY of base64 chunks: javac
// caps one string constant at 65,535 bytes and declarations.json alone is ~140 KB once encoded.
def chunkedB64 = { File f ->
    if (!f.exists()) throw new GradleException("missing ${f.name} - run data/gen_infra_slice.py (or data/gen_fleet_slice.py); the Containers Table / Infra pages would bake empty and look fine")
    def all = f.bytes.encodeBase64().toString()
    def parts = []
    for (int i = 0; i < all.length(); i += 30000) parts << all.substring(i, Math.min(all.length(), i + 30000))
    return "{" + parts.collect { "\"${it}\"" }.join(",") + "}"
}
def routesB64Array       = chunkedB64(file("../data/routes.json"))
def declarationsB64Array = chunkedB64(file("../data/declarations.json"))
// #1148 the ONE Containers document (Topology and Table), the bundled fallback of the c3-infra-api copy.
def containersDeclaredB64Array = chunkedB64(file("../data/containers_declared.json"))
// The Infra section's pages (Providers / VMs / Storage / Electronics / Domains): data/fleet_slice.json, derived by
// data/gen_fleet_slice.py from the fleet's own declarations in cloud-infra. A missing slice would draw five empty pages
// that look like working ones (#276), so it is asserted present. Chunked: ~19 KB now, but it grows with the fleet.
def fleetSliceB64Array   = chunkedB64(file("../data/fleet_slice.json"))
def c3OpsBaseUrl       = (buildJson.ui.c3_ops?.base_url  ?: '').toString()

// #648 THE CARRIED C3 SECTION: ui.carried_c3 (not nav: ui.sections is) is the SuperApp's declaration block,
// verbatim. The two stacks it carries ARE the Topology / Observability pages, so they are
// baked from that one copy rather than restated; ui.ntfy and ui.tile_columns travel the
// same way the SuperApp bakes them (UI_NTFY_B64 / UI_TILE_COLUMNS), so NtfyCatalog,
// NtfyScopes and IndexTiles read the identical shapes they read there.
def c3Section = buildJson.ui.carried_c3
if (c3Section == null) throw new GradleException("build.json::ui.carried_c3 is missing — the Topology/Observability stacks would bake empty and the tabs would draw nothing")
if (!c3Section.stack_topology || !c3Section.stack_observability) throw new GradleException("ui.carried_c3 is missing stack_topology / stack_observability — half the c3 surface would silently vanish")
def stackTopologyB64   = b64(c3Section.stack_topology)
def stackObservB64     = b64(c3Section.stack_observability)
// The top bar declaration (libs:bottomnav TopBarDecl): ui.top_bar as base64 JSON, '' when the app declares none.
def uiTopBarB64        = buildJson.ui?.top_bar ? b64(buildJson.ui.top_bar) : ''
def uiAliasesB64       = b64(buildJson.ui.aliases ?: [:])
// The top bar's AI panel: libs:ai's contract names the gateway service, the fleet catalogue (this app's
// data/services_private.json) its mesh address (sets aiGatewayUrl).
apply from: "$rootDir/../ab_cloud-libs-shared/libs/ai/ai-gateway.gradle"
def uiNtfyB64          = b64(buildJson.ui.ntfy ?: [:])
def tileColumns        = (buildJson.ui.tile_columns ?: 5) as int

// #648 the declared service estate, MOVED with the page that renders it. Same encoding the
// SuperApp used (base64 of the raw JSON array) so Services.kt is its parser unchanged. A
// MISSING file would bake the empty string and draw an empty table that looks exactly like a
// working one (#276), so each is asserted present at configuration time instead.
def svcPubFile  = file("../data/services_public.json")
def svcPrivFile = file("../data/services_private.json")
if (!svcPubFile.exists())  throw new GradleException("missing data/services_public.json — the Topology and Observ tables would bake empty and look fine")
if (!svcPrivFile.exists()) throw new GradleException("missing data/services_private.json — the Topology and Observ tables would bake empty and look fine")
def servicesPublicB64  = svcPubFile.bytes.encodeBase64().toString()
def servicesPrivateB64 = svcPrivFile.bytes.encodeBase64().toString()

// #648 the container dashboards and the WG mesh page read the SAME two snapshots the
// SuperApp bakes (data/mesh.json →
// MESH_JSON_B64) — carried as copies, asserted present for the same #276 reason as above.
def meshFile     = file("../data/mesh.json")
if (!meshFile.exists())     throw new GradleException("missing data/mesh.json — the WG mesh page would bake empty and look fine")
def meshJsonB64      = meshFile.bytes.encodeBase64().toString()

// Stack scan — baked into BuildConfig for the About page.
def repoRoot = rootDir
def stackExtMap = [
    "kt": "Kotlin", "java": "Java", "xml": "XML (resources/manifest)",
    "json": "JSON (config)", "gradle": "Gradle (Groovy)", "kts": "Gradle (Kotlin DSL)",
    "sh": "Shell", "md": "Markdown", "nix": "Nix", "pro": "ProGuard",
]
def stackSkipDirs = ["build", ".gradle", ".idea", "dist", ".result"]
def stackStats = [:]
[new File(repoRoot, "app/src/main"),
 new File(repoRoot, "build.json"),   new File(repoRoot, "build.sh"),
 new File(repoRoot, "flake.nix"),    rootDir].each { root ->
    if (!root.exists()) return
    if (root.isFile()) {
        def ext = root.name.tokenize(".").last().toLowerCase()
        def label = stackExtMap[ext]
        if (label != null) {
            def loc = 0; try { loc = root.readLines("UTF-8").size() } catch (Throwable t) {}
            def b = stackStats[label] ?: [files: 0, loc: 0]; b.files += 1; b.loc += loc; stackStats[label] = b
        }
        return
    }
    root.eachFileRecurse { f ->
        if (!f.isFile()) return
        def rel = f.absolutePath.replace(rootDir.absolutePath + "/", "")
        if (stackSkipDirs.any { rel.startsWith(it) || rel.contains("/${it}/") }) return
        def ext = f.name.tokenize(".").last().toLowerCase()
        def label = stackExtMap[ext]; if (label == null) return
        def loc = 0; try { loc = f.readLines("UTF-8").size() } catch (Throwable t) { return }
        def b = stackStats[label] ?: [files: 0, loc: 0]; b.files += 1; b.loc += loc; stackStats[label] = b
    }
}
def stackLanguagesB64 = b64(stackStats)
def stackDeps = new TreeSet()
def depPattern = ~/\b(implementation|api|compileOnly|runtimeOnly)\s*[\(\s]\s*['"]([^'":]+:[^'":]+:[^'"]+)['"]/
[rootDir].findAll { it.exists() }.each { root ->
    root.eachFileRecurse { f ->
        if (!f.isFile() || !(f.name.endsWith(".gradle") || f.name.endsWith(".gradle.kts"))) return
        def text = ""; try { text = f.text } catch (Throwable t) { return }
        depPattern.matcher(text).each { m -> stackDeps.add(m[2]) }
    }
}
def stackFrameworksB64 = b64(stackDeps.toList())
// Deliberately a placeholder, the ac_cloud-drive / ac_cloud-wallet precedent: javac caps a
// single constant at 65,535 bytes and a real folder tree of this repository blows past it.
// The About page shows the language and framework tallies above instead.
def stackTreeB64 = "—".bytes.encodeBase64().toString()

android {
    namespace 'com.diegonmarcos.cloudc3'
    compileSdk 36

    defaultConfig {
        // Launcher label = build.json::name, the application's one name (#351).
        // Never a strings.xml literal: that copy drifts from the fleet roster.
        resValue "string", "app_name", buildJson.display_name
        applicationId 'com.diegonmarcos.cloudc3'
        minSdk 26
        targetSdk 35
        // English is the fleet's base language (#299): package-time filter, so no merged
        // library locale (libs:bottomnav and the rest) can make the app come up in another.
        resConfigs "en"
        versionCode codeFinal
        versionName "${buildJson.android.version_name} (sha-${shortSha})"
        ndk {
            def abiOverride = System.getenv('CLOUDC3_ABIS')
            def abis = (abiOverride?.trim()) \
                ? abiOverride.split(',').collect { it.trim() }.findAll { it } \
                : (buildJson.android.abi_filters ?: ['arm64-v8a'])
            abiFilters.addAll(abis as List)
        }
        buildConfigField "String", "GIT_SHORT_SHA",   "\"${shortSha}\""
        buildConfigField "String", "BUILD_TIMESTAMP", "\"${buildTimestamp}\""
        buildConfigField "String", "LOG_SINK_URL",    "\"${logSinkUrl}\""
        buildConfigField "String", "LOG_SINK_STREAM", "\"${logSinkStream}\""
        buildConfigField "String", "UI_SECTIONS_B64",       "\"${uiSectionsB64}\""
        buildConfigField "String", "UI_BOTTOM_NAV",         "\"${uiBottomNav}\""
        buildConfigField "String", "UI_DEFAULT_SECTION",    "\"${uiDefaultSection}\""
        buildConfigField "String", "UI_ICON_DEFAULT",       "\"${uiIconDefault}\""
        buildConfigField "String", "UI_EXTERNAL_APPS_B64",  "\"${uiExternalAppsB64}\""
        buildConfigField "String", "UI_APPS_PAGE_B64",      "\"${uiAppsPageB64}\""
        buildConfigField "String", "UI_TOPOLOGY_B64",       "\"${uiTopologyB64}\""
        buildConfigField "String", "INFRA_SLICE_B64",       "\"${infraSliceB64}\""
        buildConfigField "String[]", "ROUTES_B64",        routesB64Array
        buildConfigField "String[]", "DECLARATIONS_B64",  declarationsB64Array
        buildConfigField "String[]", "CONTAINERS_DECLARED_B64", containersDeclaredB64Array
        buildConfigField "String[]", "FLEET_SLICE_B64",   fleetSliceB64Array
        buildConfigField "String", "C3_OPS_BASE_URL",       "\"${c3OpsBaseUrl}\""
        buildConfigField "String", "SERVICES_PUBLIC_B64",  "\"${servicesPublicB64}\""
        buildConfigField "String", "SERVICES_PRIVATE_B64", "\"${servicesPrivateB64}\""
        buildConfigField "String", "UI_STACK_TOPOLOGY_B64", "\"${stackTopologyB64}\""
        buildConfigField "String", "UI_STACK_OBSERV_B64",   "\"${stackObservB64}\""
        buildConfigField "String", "UI_TOP_BAR_B64",        "\"${uiTopBarB64}\""
        buildConfigField "String", "UI_ALIASES_B64",        "\"${uiAliasesB64}\""
        buildConfigField "String", "AI_GATEWAY_URL",        "\"${aiGatewayUrl}\""
        buildConfigField "String", "UI_NTFY_B64",           "\"${uiNtfyB64}\""
        buildConfigField "int",    "UI_TILE_COLUMNS",       "${tileColumns}"
        buildConfigField "String", "MESH_JSON_B64",         "\"${meshJsonB64}\""
        buildConfigField "String", "UI_STACK_LANGUAGES_JSON_B64",  "\"${stackLanguagesB64}\""
        buildConfigField "String", "UI_STACK_FRAMEWORKS_JSON_B64", "\"${stackFrameworksB64}\""
        buildConfigField "String", "UI_STACK_FOLDER_TREE_B64",     "\"${stackTreeB64}\""
        buildConfigField "long",   "STACK_GRADLE_CONFIG_MS",  "${System.currentTimeMillis() - gradleScriptStartMs}L"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures {
        buildConfig = true
        compose = true
    }

    // ONE shared Cloud-constellation key — same key as every other app in the fleet.
    signingConfigs {
        debug {
            def envStore = System.getenv("ANDROID_KEYSTORE_FILE")
            if (envStore == null || envStore.isEmpty() || !file(envStore).exists()) {
                throw new GradleException("ONE shared constellation key required; run via build.sh / set ANDROID_KEYSTORE_FILE; no fallback")
            }
            storeFile     file(envStore)
            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
            keyAlias      System.getenv("ANDROID_KEY_ALIAS")
            keyPassword   System.getenv("ANDROID_KEY_PASSWORD")
        }
    }

    buildTypes {
        debug   { debuggable true;  signingConfig signingConfigs.debug }
        release { debuggable true; minifyEnabled false
                  proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  signingConfig signingConfigs.debug }
    }

    packaging {
        resources {
            excludes += ['META-INF/NOTICE.md', 'META-INF/LICENSE.md',
                         'META-INF/NOTICE',    'META-INF/LICENSE']
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation project(':libs:analytics')
    implementation project(':libs:core')
    implementation project(':libs:updater')
    // #648 the fleet's bottom-nav island: the five tabs are the same Compose pill
    // superapp, mail, wallet, me and drive draw. This app supplies its OWN entries
    // from ui.bottom_nav and does not use the module's cloud-mail item table.
    implementation project(':libs:bottomnav')
    implementation project(':libs:ui-nav-bars')
    implementation project(':libs:theme-background')
    // #648 the SuperApp's page:c3/dagu is libs:ops' DaguFragment, and DaguPrefs is the ONE
    // store of the Authelia bearer the feed cards' Re-run buttons and the container sheet's
    // actions send — shared BY REFERENCE, same as every module above.
    implementation project(':libs:ops')
    // 2026-10-15 owner decision: all apps must be Compose. The Agents and Catalog pages are
    // ComposeViews under the fleet's CloudKitTheme, shared BY REFERENCE like the modules above.
    implementation project(':libs:ui-kit')
    // The top bar's AI button opens libs:ai's chat (AiFleetChatPanel), the same shared chat Cloud Code has.
    implementation project(':libs:ai')
    implementation 'androidx.activity:activity-compose:1.9.3'

    // 2026-10-15 owner decision: all apps must be Compose. The bottom island is an
    // AbstractComposeView and the Agents/Catalog pages are ComposeViews; the remaining
    // View pages migrate the same way.
    implementation platform('androidx.compose:compose-bom:2025.11.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'
    implementation 'androidx.core:core-ktx:1.15.0'
    // #648 the shell is VIEWS and hosts Fragments: the pages this app shows are the
    // SuperApp's C3 Fragments, moved rather than reauthored.
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'
    // res/values/themes.xml declares Theme.CloudC3 with parent Theme.Material3.Dark.NoActionBar,
    // and THAT STYLE LIVES HERE. The chrome is pure Compose and needs no View widget from this
    // library, but the launch window still needs a real theme to inherit: without this dependency
    // aapt2 fails the whole app with "Android resource linking failed / error: failed linking
    // references" — which is what run 240522adf died on, at :app:processDebugResources, with every
    // Kotlin file and every shell tester green. Same coordinate ac_cloud-drive and ac_cloud-wallet
    // link for the same theme parent.
    implementation 'com.google.android.material:material:1.12.0'

    // The JVM unit phase (build.json::tests.unit) runs these on every ship.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation platform('androidx.compose:compose-bom:2025.11.01')
    testImplementation 'androidx.compose.ui:ui-test-junit4'

    androidTestImplementation 'androidx.test:runner:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
