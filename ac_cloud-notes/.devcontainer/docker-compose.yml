version: '3.8'

services:
  app:
    security_opt:
      - no-new-privileges:true
    image: mcr.microsoft.com/devcontainers/base:bookworm
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    network_mode: service:db
    environment:
      DATABASE_URL: postgresql://cloud-notes:cloud-notes@db:5432/cloud-notes
      REDIS_SERVER_HOST: redis

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: cloud-notes
      POSTGRES_USER: cloud-notes
      POSTGRES_DB: cloud-notes
  redis:
    image: redis

volumes:
  postgres-data:
