version: '1'

projects:
  - name: cloud-notes
    environments:
      - name: production
        services:
          - type: web
            name: cloud-notes
            runtime: docker
            plan: standard
            # The Dockerfile adds a start script to ghcr.io/diegonmarcos/cloudy-u-android:stable. It runs migrations and the server
            dockerfilePath: ./.render/Dockerfile
            dockerContext: ./.render
            healthCheckPath: /info
            disk:
              # Uploaded blobs (~/.cloud-notes/storage) and the generated private key
              # (~/.cloud-notes/config/private.key) must survive restarts.
              name: cloud-notes-data
              mountPath: /root/.cloud-notes
              sizeGB: 10
            envVars:
              - key: CLOUD_NOTES_SERVER_PORT
                value: 10000
              - key: CLOUD_NOTES_SERVER_HTTPS
                value: true
              - key: DATABASE_URL
                fromDatabase:
                  name: cloud-notes-postgres
                  property: connectionString
              - key: REDIS_SERVER_HOST
                fromService:
                  name: cloud-notes-keyvalue
                  type: keyvalue
                  property: host
              - key: REDIS_SERVER_PORT
                fromService:
                  name: cloud-notes-keyvalue
                  type: keyvalue
                  property: port

          - type: keyvalue
            name: cloud-notes-keyvalue
            plan: starter
            maxmemoryPolicy: noeviction
            ipAllowList: [] # internal connections only

        databases:
          - name: cloud-notes-postgres
            plan: basic-256mb
            postgresMajorVersion: '16'
            ipAllowList: [] # internal connections only
