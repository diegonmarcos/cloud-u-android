pluginManagement {
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.10.0'
}

include ':app'
// DE-CLOUDED (#469): ':service' Apollo module dropped — it ran GraphQL codegen
// from the EE-licensed server schema under the pruned EE directories. This
// app is local-first; no server, no schema, no Apollo.
include ':capacitor-cordova-android-plugins'
apply from: 'capacitor.settings.gradle'

// cloud-notes (#743): fleet mesh membership. The shared modules come from the
// app's ONE build.json::modules (five levels up: App -> ac_cloud-notes), and
// each dir is resolved against THAT directory — the base the ship workflow's
// triggers and the publish gate resolve it against — never against this gradle
// root. libs:devtools is in the map, not optional: core declares
// `api project(':libs:devtools')`, which resolves against THIS settings file.
def appDir = '../../../../..'
def buildJson = new groovy.json.JsonSlurper().parse(file("${appDir}/build.json"))
buildJson.modules.each { name, _spec ->
    if (name.startsWith('_')) return
    include ":${name}"
    project(":${name}").projectDir = file("${appDir}/${_spec?.dir ?: name.replace(':', '/')}")
}
// Gradle 9 fails outright on a project directory that does not exist, and the
// implicit ':libs' container resolves to <root>/libs, which this project does
// not have. Point it at the shared root core lives in, as media-center does.
project(':libs').projectDir = project(':libs:core').projectDir.parentFile
