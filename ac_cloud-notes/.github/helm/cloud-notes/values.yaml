global:
  app:
    buildType: 'stable'
  ingress:
    enabled: false
    className: ''
    # hosts for ingress rules
    # e.g.
    # hosts:
    #  - notes.diegonmarcos.com
    #  - notes.diegonmarcos.com
    hosts:
      - notes.diegonmarcos.com
    tls: []
  secret:
    secretName: 'server-private-key'
    privateKey: ''
    # Name of an externally managed Secret containing the license signing key.
    # The chart never generates this key. Leave empty to disable license issuance.
    licenseSecretName: ''
    licensePrivateKeyKey: 'license-private-key'
  database:
    user: 'postgres'
    host: 'pg-postgresql'
    port: '5432'
    name: 'cloud-notes'
    password: ''
  redis:
    host: 'redis-master'
    port: '6379'
    username: ''
    password: ''
    database: 0
  indexer:
    enabled: false
    provider: embedded
    endpoint: ''
    apiKey: ''
    username: ''
    password: ''
  deployment:
    # change to 'selfhosted' and 'unknown' if this chart is ready to be used for selfhosted deployment
    type: 'cloud-notes'
    platform: 'gcp'

graphql:
  service:
    type: ClusterIP
    port: 3000
    annotations:
      cloud.google.com/backend-config: '{"default": "cloud-notes-api-backendconfig"}'

front:
  services:
    sync:
      name: cloud-notes-sync
      type: ClusterIP
      port: 3010
      backendConfig:
        name: cloud-notes-sync-backendconfig
        timeoutSec: 10800
      annotations: {}
    renderer:
      name: cloud-notes-renderer
      type: ClusterIP
      port: 3000
      annotations:
        cloud.google.com/backend-config: '{"default": "cloud-notes-api-backendconfig"}'
    web:
      name: cloud-notes-web
      type: ClusterIP
      port: 8080

worker:
  replicaCount: 1
  image:
    repository: ghcr.io/diegonmarcos/cloudy-u-android
    tag: ''
  env: 'production'
  nodeOptions: '--max-old-space-size=3072'
  app:
    port: 3002
    host: '0.0.0.0'
    https: true
  podAnnotations: {}
  podSecurityContext:
    fsGroup: 2000
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
  serviceAccount:
    create: true
    annotations: {}
    name: 'cloud-notes-worker'
  resources:
    limits:
      cpu: '1'
      memory: 4Gi
    requests:
      cpu: '1'
      memory: 2Gi
  probe:
    initialDelaySeconds: 20
    timeoutSeconds: 5
    periodSeconds: 10
    failureThreshold: 6
    successThreshold: 1
    liveness:
      initialDelaySeconds: 60
      failureThreshold: 12
    readiness: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
