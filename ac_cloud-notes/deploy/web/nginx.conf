server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # liveness for the container healthcheck; answers without touching the app
  location = /healthz {
    default_type text/plain;
    return 200 "ok\n";
  }

  # the app shell is never cached; content-hashed assets are cached for a year
  location = /index.html {
    add_header Cache-Control "no-store";
  }
  location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico|webp|wasm|map)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # single-page app: every other path is the router's
  location / {
    add_header Cache-Control "no-store";
    try_files $uri $uri/ /index.html;
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;
}
