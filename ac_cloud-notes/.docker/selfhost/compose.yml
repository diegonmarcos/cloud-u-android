name: cloud-notes
services:
  cloud-notes:
    image: ghcr.io/diegonmarcos/cloud-u-android:stable
    container_name: cloud_notes_server
    ports:
      - '3010:3010'
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      cloud_notes_migration:
        condition: service_completed_successfully
    volumes:
      - ./data/storage:/root/.cloud-notes/storage
      - ./config:/root/.cloud-notes/config
    environment:
      - REDIS_SERVER_HOST=redis
      - DATABASE_URL=postgresql://cloud-notes@postgres:5432/cloud-notes
      - DEPLOYMENT_TYPE=selfhosted
    restart: unless-stopped

  cloud_notes_migration:
    image: ghcr.io/diegonmarcos/cloud-u-android:stable
    container_name: cloud_notes_migration_job
    volumes:
      - ./data/storage:/root/.cloud-notes/storage
      - ./config:/root/.cloud-notes/config
    command: ['sh', '-c', 'node ./scripts/self-host-predeploy.js']
    environment:
      - REDIS_SERVER_HOST=redis
      - DATABASE_URL=postgresql://cloud-notes@postgres:5432/cloud-notes
      - DEPLOYMENT_TYPE=selfhosted
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis
    container_name: cloud_notes_redis
    healthcheck:
      test: ['CMD', 'redis-cli', '--raw', 'incr', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: cloud_notes_postgres
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: cloud-notes
      POSTGRES_DB: cloud-notes
      POSTGRES_INITDB_ARGS: '--data-checksums'
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'cloud-notes', '-d', 'cloud-notes']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
