plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def buildJson = new groovy.json.JsonSlurper().parse(file('../build.json'))

// Version code: minutes since 2026-01-01 UTC over a 3,000,000 base — the fleet encoding
// (ac_cloud-calc / ac_cloud-c3), so an update is never refused as older.
def codeFinal = { ->
    def base  = java.time.LocalDateTime.of(2026, 1, 1, 0, 0)
    def built = java.time.LocalDateTime.now(java.time.ZoneOffset.UTC)
    def stamp = System.getenv('COMMS_BUILD_TIMESTAMP')
    if (stamp) {
        try {
            built = java.time.LocalDateTime.parse(stamp,
                java.time.format.DateTimeFormatter.ofPattern('yyyyMMdd.HHmmss'))
        } catch (ignored) { }
    }
    long mins = java.time.Duration.between(base, built).toMinutes()
    return mins > 0 ? (int) (3000000L + mins) : 3000000
}()

def shortSha = (System.getenv('GITHUB_SHA')
                ?: providers.exec {
                       commandLine 'git', 'rev-parse', '--short=8', 'HEAD'
                       ignoreExitValue = true
                   }.standardOutput.asText.get().trim())
                .take(8)

def buildTimestamp = new java.text.SimpleDateFormat("yyyy-MM-dd HH:mm:ss 'UTC'").with {
    setTimeZone(java.util.TimeZone.getTimeZone('UTC'))
    format(new java.util.Date())
}

def logSinkUrl    = (buildJson.diagnostics?.log_sink_url    ?: '')
def logSinkStream = (buildJson.diagnostics?.log_sink_stream ?: 'capital-finterm')

def b64 = { obj -> groovy.json.JsonOutput.toJson(obj).bytes.encodeBase64().toString() }

// ── the declarations, baked ────────────────────────────────────────────────
// #868 ui.bottom_nav + ui.sections + ui.default_section are THE navigation declaration (libs:bottomnav's NavDecl); Decl.kt is the only decoder.
if (!buildJson.ui?.bottom_nav || !buildJson.ui?.sections)
    throw new GradleException("build.json::ui.bottom_nav / ui.sections missing — the island would draw nothing (#868)")
def uiSectionsB64    = b64(buildJson.ui.sections)
def uiBottomNav      = buildJson.ui.bottom_nav.join(',')
def uiDefaultSection = (buildJson.ui.default_section ?: buildJson.ui.bottom_nav[0]).toString()

// #1335 ui.stacks (the entries of each page) and the declared sources their targets are read from. NO address is typed in build.json or in
// Kotlin: an entry names a linktree label (site), a registry code (registry) or a repo under repo_base, and this script resolves each from the
// SuperApp's own declarations at build time (a source that does not resolve fails the build, loudly) and bakes the result as UI_TARGETS_B64.
def uiStacks         = buildJson.ui.stacks ?: [:]
def superappBuild    = new groovy.json.JsonSlurper().parse(file('../../aa_cloud-superapp/build.json'))
def linktreeSnapshot = new groovy.json.JsonSlurper().parse(file('../../aa_cloud-superapp/data/linktree.json'))
def appUrls          = superappBuild.ui?.app_urls ?: [:]
def siteUrlOf = { String label ->
    def found = new TreeSet<String>()
    def walk
    walk = { node ->
        if (node instanceof Map) {
            def u = node['url']
            if (node['label'] == label && u instanceof String && (u.startsWith('https://') || u.startsWith('http://'))) found.add(u)
            node.values().each { walk(it) }
        } else if (node instanceof List) {
            node.each { walk(it) }
        }
    }
    walk(linktreeSnapshot)
    return found.size() == 1 ? found.first() : null
}
def targetSites = new TreeMap<String, String>()
def targetRegistry = new TreeMap<String, String>()
uiStacks.each { sectionId, entries ->
    entries.each { e ->
        if (e.planned) return
        if (e.site) {
            def u = siteUrlOf(e.site as String)
            if (!u) throw new GradleException("build.json::ui.stacks.${sectionId}: site '${e.site}' is not exactly one link of aa_cloud-superapp/data/linktree.json")
            targetSites[e.site as String] = u
        }
        if (e.registry) {
            def u = appUrls.registry_sites?.get(e.registry as String)
            if (!u) throw new GradleException("build.json::ui.stacks.${sectionId}: registry code '${e.registry}' is not in aa_cloud-superapp/build.json ui.app_urls.registry_sites")
            targetRegistry[e.registry as String] = u
        }
        if (e.repo && !appUrls.repo_base)
            throw new GradleException("build.json::ui.stacks.${sectionId}: repo '${e.repo}' needs aa_cloud-superapp/build.json ui.app_urls.repo_base")
    }
}
def uiStacksB64  = b64(uiStacks)
def uiTargetsB64 = b64([sites: targetSites, registry_sites: targetRegistry, repo_base: (appUrls.repo_base ?: '')])

android {
    namespace 'com.diegonmarcos.capitalfinterm'
    compileSdk 36

    defaultConfig {
        // Launcher label = build.json::name, the application's one name (#351).
        resValue "string", "app_name", buildJson.display_name
        applicationId 'com.diegonmarcos.capitalfinterm'
        minSdk 26
        targetSdk 35
        // English is the fleet's base language (#299).
        resConfigs "en"
        versionCode codeFinal
        versionName "${buildJson.android.version_name} (sha-${shortSha})"
        ndk {
            def abiOverride = System.getenv('CAPITALFINTERM_ABIS')
            def abis = (abiOverride?.trim()) \
                ? abiOverride.split(',').collect { it.trim() }.findAll { it } \
                : (buildJson.android.abi_filters ?: ['arm64-v8a'])
            abiFilters.addAll(abis as List)
        }
        buildConfigField "String", "GIT_SHORT_SHA",      "\"${shortSha}\""
        buildConfigField "String", "BUILD_TIMESTAMP",    "\"${buildTimestamp}\""
        buildConfigField "String", "LOG_SINK_URL",       "\"${logSinkUrl}\""
        buildConfigField "String", "LOG_SINK_STREAM",    "\"${logSinkStream}\""
        buildConfigField "String", "UI_SECTIONS_B64",    "\"${uiSectionsB64}\""
        buildConfigField "String", "UI_BOTTOM_NAV",      "\"${uiBottomNav}\""
        buildConfigField "String", "UI_DEFAULT_SECTION", "\"${uiDefaultSection}\""
        buildConfigField "String", "UI_STACKS_B64",      "\"${uiStacksB64}\""
        buildConfigField "String", "UI_TARGETS_B64",     "\"${uiTargetsB64}\""
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures {
        buildConfig = true
        compose = true
    }

    // ONE shared Cloud-constellation key — same key as every other app in the fleet.
    signingConfigs {
        debug {
            def envStore = System.getenv("ANDROID_KEYSTORE_FILE")
            if (envStore == null || envStore.isEmpty() || !file(envStore).exists()) {
                throw new GradleException("ONE shared constellation key required; run via build.sh / set ANDROID_KEYSTORE_FILE; no fallback")
            }
            storeFile     file(envStore)
            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
            keyAlias      System.getenv("ANDROID_KEY_ALIAS")
            keyPassword   System.getenv("ANDROID_KEY_PASSWORD")
        }
    }

    buildTypes {
        debug   { debuggable true;  signingConfig signingConfigs.debug }
        release { debuggable true; minifyEnabled false
                  proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
                  signingConfig signingConfigs.debug }
    }

    packaging {
        resources {
            excludes += ['META-INF/NOTICE.md', 'META-INF/LICENSE.md',
                         'META-INF/NOTICE',    'META-INF/LICENSE']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation project(':libs:core')
    // The fleet's navigation: NavDecl and the top-bar scaffold's drawer (libs:bottomnav), the first row with
    // Profile at the top right, the second row with icons, the bottom nav, the page gradient (#1154).
    implementation project(':libs:bottomnav')
    // The nav icon catalog (name to ImageVector) every nav glyph is drawn from (#1160); libs:bottomnav depends on it too.
    implementation project(':libs:ui-icons')
    implementation project(':libs:ui-nav-bars')
    implementation project(':libs:theme-background')
    // The fleet's tokens and kit: CloudKitTheme, KitPalette, KitCard, KitSettingsRow, KitButton (libs:ui-kit).
    implementation project(':libs:ui-kit')

    implementation platform('androidx.compose:compose-bom:2025.11.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.core:core-ktx:1.15.0'
    // themes.xml's parent, Theme.Material3.Dark.NoActionBar, lives here.
    implementation 'com.google.android.material:material:1.12.0'

    // Android's own org.json at runtime; the real library for the JVM suite.
    testImplementation 'org.json:json:20240303'
    testImplementation 'junit:junit:4.13.2'
}
