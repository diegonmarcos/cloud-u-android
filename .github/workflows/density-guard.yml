name: "density guard — Compose screens stay dense and own window insets once"

# After the Compose conversions many apps swelled: a bare MaterialTheme gives every Text a fixed 24.sp line and
# every Material control a 48dp floor. libs:ui-kit's CloudKitTheme / KitDenseMaterial remove both.
# cloud-android-density-guard.py fails on a bare MaterialTheme(colorScheme) without typography, a Scaffold without
# contentWindowInsets, a page re-applying safeDrawing/systemBars padding, or an owner that lost the dense theme.
# Everything it knows is in 1_cicd/src/data/density-guard.json.
#
# EVERY PUSH, NO PATH FILTER: see 1_cicd/src/data/guard-triggers.json.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# ── MANAGED-GUARD-CONCURRENCY: injected by cloud-android-guard-triggers.py ──
concurrency:
  group: density-guard-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# ── end MANAGED-GUARD-CONCURRENCY ──

jobs:
  density:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The guard still fails on each defect
        run: bash 1_cicd/src/scripts/test/density-guard.test.sh

      - name: Compose screens stay dense and own insets once
        run: python3 1_cicd/src/scripts/cloud-android-density-guard.py .
