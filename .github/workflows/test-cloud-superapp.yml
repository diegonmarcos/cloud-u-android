# ╔═══════════════════════════════════════════════════════════════════════╗
# ║ Test → Cloud SuperApp (emulator: edge-menu touch + gesture test)       ║
# ║                                                                        ║
# ║ The edge menus broke twice in one day on static review alone (a dead   ║
# ║ band that ate taps, then a strip nobody could hit). EdgeOverlayGesture ║
# ║ Test drives the REAL overlay on a REAL x86_64 API-34 emulator in       ║
# ║ gesture navigation, through the real input pipeline, over an activity  ║
# ║ of another package: a tap beside the strip must click the app below;   ║
# ║ tap-hold-then-push inward must open the menu window; the system back   ║
# ║ gesture must not steal the touch. Screenshots + logcat are uploaded.   ║
# ╚═══════════════════════════════════════════════════════════════════════╝
name: "Test → Cloud SuperApp (emulator edge-menu gesture test)"

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      # ── MANAGED-PATHS-HEADER: regenerated by cloud-android-ship-repo-workflow-engine.sh ──
      # MANAGED by cloud-android-ship-repo-workflow-engine.sh: every dir
      # aa_cloud-superapp/build.json::modules declares is added automatically, dead
      # entries are dropped, and cloud-android-source-identity.sh hashes
      # this list — so nothing can trigger a build the publish gate does
      # not weigh. Extra entries no module map can express
      # (settings.gradle.kts references, scan roots) are kept: add them
      # here and they stay.
      # ONE path is watched here and deliberately NOT hashed: the
      # tester directory build.json::tests.shell.dir declares. A tester
      # edit must START a run (it is the only pipeline that executes
      # that tester) and must NOT publish an APK (it changed no bytes).
      # The gate skips it, so the run costs the test step alone.
      # ── end MANAGED-PATHS-HEADER ──
      - "1_cicd/src/cicd/test-cloud-superapp.yml"
      - "aa_cloud-superapp/**"
      - "aa_cloud-superapp/app/build.gradle"
      - "aa_cloud-superapp/app/src/androidTest/**"
      - "aa_cloud-superapp/build.sh"
      - "ab_cloud-libs-shared/libs/account/**"
      - "ab_cloud-libs-shared/libs/analytics/**"
      - "ab_cloud-libs-shared/libs/appstore/**"
      - "ab_cloud-libs-shared/libs/auth/**"
      - "ab_cloud-libs-shared/libs/battery/**"
      - "ab_cloud-libs-shared/libs/bottomnav/**"
      - "ab_cloud-libs-shared/libs/chat/**"
      - "ab_cloud-libs-shared/libs/core/**"
      - "ab_cloud-libs-shared/libs/databackend/**"
      - "ab_cloud-libs-shared/libs/datamanager/**"
      - "ab_cloud-libs-shared/libs/devtools/**"
      - "ab_cloud-libs-shared/libs/firewall/**"
      - "ab_cloud-libs-shared/libs/fleetconfig-model/**"
      - "ab_cloud-libs-shared/libs/health/**"
      - "ab_cloud-libs-shared/libs/kde-connect/**"
      - "ab_cloud-libs-shared/libs/launcher-apptabs/**"
      - "ab_cloud-libs-shared/libs/launcher-onehand/**"
      - "ab_cloud-libs-shared/libs/launcher-zoomies/**"
      - "ab_cloud-libs-shared/libs/mail/**"
      - "ab_cloud-libs-shared/libs/net/**"
      - "ab_cloud-libs-shared/libs/ops/**"
      - "ab_cloud-libs-shared/libs/search/**"
      - "ab_cloud-libs-shared/libs/shizuku-adb-debug-tools/**"
      - "ab_cloud-libs-shared/libs/sysdns/**"
      - "ab_cloud-libs-shared/libs/text-tools/**"
      - "ab_cloud-libs-shared/libs/ui-kit/**"
      - "ab_cloud-libs-shared/libs/updater/**"
      - "ab_cloud-libs-shared/libs/webserver/**"
permissions:
  contents: read

concurrency:
  group: test-cloud-superapp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  edge-menu-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Same toolchain as ship-cloud-superapp.yml (the debug APK is the same build).
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 platforms;android-35 platforms;android-34 platforms;android-26 build-tools;36.0.0 build-tools;35.0.0 build-tools;34.0.0 platform-tools cmake;3.22.1 ndk;28.0.13004108 ndk;26.1.10909125"

      - name: Set up Gradle 8.14 (cached)
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14"

      - name: Checkout vault (shared Android signing key)
        uses: actions/checkout@v4
        with:
          repository: diegonmarcos/cloud-me_vault
          token: ${{ secrets.ANDROID_SIGNING_VAULT_TOKEN }}
          path: .vault

      - name: Install sops (pinned, sha256-checked, fails at the download)
        uses: ./.github/actions/install-pinned-tools
        with:
          tools: sops

      - name: Boot emulator + run the edge-menu gesture test (engine)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          BYPASS_NIX: "1"
          SUPERAPP_VARIANT: "x86_64"
          INSTRUMENT_PREGRANT: "1"
          INSTRUMENT_CLASS: "com.diegonmarcos.superapp.EdgeOverlayGestureTest"
          VAULT_DIR: ${{ github.workspace }}/.vault
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          working-directory: aa_cloud-superapp
          # ONE line: the runner executes each script line in its own `sh -c`, so a variable (the exit
          # status) does not survive a line break. bash, because build.sh is bash (and not executable in git).
          script: bash -c 'rc=0; bash ./build.sh instrument || rc=$?; mkdir -p test-out; adb pull /data/local/tmp/edge-menu-left.png test-out/; adb pull /data/local/tmp/edge-menu-right.png test-out/; adb pull /data/local/tmp/ test-out/tmp/; adb logcat -d > test-out/logcat.txt; adb logcat -d -s EdgeOverlayTest:* OneHand:* > test-out/probe.txt; adb shell dumpsys window windows > test-out/windows.txt; exit $rc'

      - name: Upload evidence (screenshots + logcat + reports)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge-menu-gesture
          path: |
            aa_cloud-superapp/test-out/
            aa_cloud-superapp/app/build/reports/androidTests/
          if-no-files-found: warn

      # emulator-runner masked a failing connectedAndroidTest as exit 0 before (see test-cloud-nav.yml):
      # gate explicitly on the JUnit XML.
      - name: Gate on instrumented test results
        if: always()
        run: |
          shopt -s globstar nullglob
          xmls=(aa_cloud-superapp/app/build/outputs/androidTest-results/**/*.xml)
          if [ ${#xmls[@]} -eq 0 ]; then echo "NO test result XML found — treating as failure"; exit 1; fi
          tests=$(grep -hoE 'tests="[0-9]+"' "${xmls[@]}" | grep -oE '[0-9]+' | awk '{s+=$1} END{print s+0}')
          fails=$(grep -hoE '(failures|errors)="[0-9]+"' "${xmls[@]}" | grep -oE '[0-9]+' | awk '{s+=$1} END{print s+0}')
          echo "instrumented tests = $tests, failures+errors = $fails across ${#xmls[@]} result file(s)"
          python3 - "${xmls[@]}" <<'PY'
          import sys, xml.etree.ElementTree as ET
          for f in sys.argv[1:]:
              try: root = ET.parse(f).getroot()
              except Exception as e: print(f"::error title=instrumented [superapp]::{f}: unreadable ({e})"); continue
              for tc in root.iter("testcase"):
                  for bad in list(tc.findall("failure")) + list(tc.findall("error")):
                      msg = (bad.get("message") or (bad.text or "")).strip().splitlines()[:1] or [""]
                      print(f"::error title=instrumented [superapp]::{tc.get('classname','')}.{tc.get('name','')}: {msg[0][:300]}")
          PY
          [ "$tests" -ge 5 ] || { echo "::error::too few tests ran ($tests)"; exit 1; }
          [ "$fails" = "0" ] || { echo "::error::instrumented tests FAILED ($fails)"; exit 1; }
