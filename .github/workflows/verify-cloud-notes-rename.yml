name: "Verify Cloud Notes rename (dispatch only, no publish)"

# One-off verification of #1091/#1097/#1098 in its own concurrency group: the
# ship workflow is cancelled by every push to a shared library, so it cannot
# finish while other work lands. This builds the web and Android bundles and
# runs the specs the rename touches. It publishes nothing. Deleted once the
# ship workflow is green on the final commit.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: verify-cloud-notes-rename-${{ github.sha }}
  cancel-in-progress: false

jobs:
  specs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
      - name: yarn install (immutable)
        working-directory: ac_cloud-notes
        run: yarn install --immutable
      - name: store spec (old flavour ids)
        working-directory: ac_cloud-notes/blocksuite/framework/store
        run: NO_COLOR=1 yarn vitest run src/__tests__/legacy-flavour.unit.spec.ts
      - name: whole store suite
        working-directory: ac_cloud-notes/blocksuite/framework/store
        run: NO_COLOR=1 yarn vitest run
      - name: reader and infra specs
        working-directory: ac_cloud-notes
        run: NO_COLOR=1 yarn vitest run packages/common/reader packages/common/infra/src/utils
  bundles:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
      - name: yarn install (immutable)
        working-directory: ac_cloud-notes
        run: yarn install --immutable
      - name: web bundle
        working-directory: ac_cloud-notes
        run: |
          yarn cloud-notes @cloud-notes/web build
          test -s packages/frontend/apps/web/dist/index.html
      - name: Android web bundle
        working-directory: ac_cloud-notes
        run: yarn cloud-notes @cloud-notes/android build
