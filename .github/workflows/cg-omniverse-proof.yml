name: "Proof → CG-Omniverse (filter mutants + emulator screens)"

# Two proofs the Ship run cannot give, on demand:
#   mutants  every rule of the Store's filter logic (Store.kt) is held by a JVM test: each job plants ONE mutant and passes only
#            when the suite goes RED (a mutant that stays green fails the run). A baseline job requires the real tree GREEN.
#   screens  installs the x86_64 APK of a Ship run (or the rolling release) on an emulator and walks Avatar (default, personalised),
#            Store (all selected, filtered) and Galaxy (a world loaded, the list), uploading the screenshots as `cg-omniverse-screens`.

on:
  workflow_dispatch:
    inputs:
      ship_run_id:
        description: "Ship → CG-Omniverse run whose x86_64 APK to walk (empty = the rolling release)"
        required: false
        default: ""
      only:
        description: "mutants | screens | both"
        required: false
        default: "both"

permissions:
  contents: read
  actions: read

env:
  WORK_DIR: ad_CG-Omniverse

jobs:
  mutants:
    if: ${{ inputs.only != 'screens' }}
    name: "Mutant ${{ matrix.mutant }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mutant: [baseline, type-map, dim-mixed, vr-yes-flat, vr-no-glass, chip-any, group-all, toggle-one, all-clears, is-all, default-all]
    steps:
      - uses: actions/checkout@v4
      - name: Plant the mutant
        env:
          M: ${{ matrix.mutant }}
        run: |
          python3 - <<'PY'
          import os, sys
          p = "ad_CG-Omniverse/app/src/main/java/com/diegonmarcos/cgomniverse/Store.kt"
          M = {
            "baseline":    None,
            "type-map":    ('"Others" -> setOf(OTHERS)', '"Others" -> setOf(WEBSITES)'),
            "dim-mixed":   ('"2D/3D", "3D/Video" -> setOf(D2, D3)', '"2D/3D", "3D/Video" -> setOf(D3)'),
            "vr-yes-flat": ('if (w.vr) setOf(FLAT, VR_GLASS) else', 'if (w.vr) setOf(VR_GLASS) else'),
            "vr-no-glass": ('else setOf(FLAT)\n', 'else setOf(FLAT, VR_GLASS)\n'),
            "chip-any":    ('tags(w, g).any {', 'tags(w, g).all {'),
            "group-all":   ('FilterGroup.entries.all { g ->', 'FilterGroup.entries.any { g ->'),
            "toggle-one":  ('if (chip in cur) cur - chip else cur + chip', 'if (chip in cur) emptySet() else cur + chip'),
            "all-clears":  ('if (isAll(sel, group)) emptySet() else', 'if (false) emptySet() else'),
            "is-all":      ('sel[group].orEmpty().containsAll(group.chips)', 'sel[group].orEmpty().isNotEmpty()'),
            "default-all": ('associateWith { it.chips.toSet() }', 'associateWith { setOf(it.chips.first()) }'),
          }[os.environ["M"]]
          if M is None: sys.exit(0)
          s = open(p).read()
          if s.count(M[0]) != 1: sys.exit("mutation target not found exactly once: %r" % M[0])
          open(p, "w").write(s.replace(M[0], M[1]))
          PY
          git diff --stat
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 platforms;android-35 platforms;android-26 build-tools;35.0.0 build-tools;34.0.0 platform-tools"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"
      # ── MANAGED-GRADLE-CACHE-HYGIENE: injected by cloud-android-gradle-cache-hygiene.py ──
      # Edit 1_cicd/src/actions/gradle-cache-hygiene, never this block.
      - name: Gradle cache hygiene (retry failed resolution, never cache a failed lookup)
        uses: ./.github/actions/gradle-cache-hygiene
      # ── end MANAGED-GRADLE-CACHE-HYGIENE ──
      - name: Checkout vault (shared signing key, read by app/build.gradle at configuration)
        uses: actions/checkout@v4
        with:
          repository: diegonmarcos/cloud-me-pvt-vault
          token: ${{ secrets.ANDROID_SIGNING_VAULT_TOKEN }}
          path: .vault
      - name: Install jq
        run: sudo apt-get update -y && sudo apt-get install -y jq
      - name: Install ORAS + sops (pinned)
        uses: ./.github/actions/install-pinned-tools
        with:
          tools: oras sops
      - name: JVM suite (baseline GREEN, every mutant RED)
        env:
          BYPASS_NIX: "1"
          VAULT_DIR: ${{ github.workspace }}/.vault
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          M: ${{ matrix.mutant }}
        run: |
          set +e
          sh 1_cicd/dist/scripts/cloud-android-test-engine.sh unit "$WORK_DIR" > unit.log 2>&1
          rc=$?
          tail -60 unit.log
          grep -E "StoreTest > .* FAILED|tests completed" unit.log || true
          if [ "$M" = baseline ]; then
            [ $rc -eq 0 ] || { echo "::error::the real tree is RED"; exit 1; }
            echo "baseline GREEN"
          else
            [ $rc -ne 0 ] || { echo "::error::mutant $M stayed GREEN: no test holds this rule"; exit 1; }
            grep -q "StoreTest" unit.log || { echo "::error::mutant $M is red but not from StoreTest"; exit 1; }
            echo "mutant $M is RED (killed)"
          fi

  screens:
    if: ${{ inputs.only != 'mutants' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Get the x86_64 APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN: ${{ inputs.ship_run_id }}
        run: |
          set -eu
          mkdir -p apk
          if [ -n "$RUN" ]; then gh run download "$RUN" -R "$GITHUB_REPOSITORY" -p 'CG-Omniverse-x86_64-*' -D apk
          else gh release download latest -R "$GITHUB_REPOSITORY" -p 'CG-Omniverse-x86_64.apk' -D apk; fi
          pick=$(find apk -name '*.apk' | head -1); [ -n "$pick" ] || { echo "::error::no APK"; exit 1; }
          cp "$pick" app.apk; ls -la app.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Write the walk
        run: |
          cat > walk.py <<'PY'
          import re, subprocess, sys, time
          OUT = "screens"
          def sh(*a, check=False): return subprocess.run(["adb", *a], capture_output=True, text=True, timeout=90)
          def dump():
              for _ in range(6):
                  sh("shell", "uiautomator", "dump", "/sdcard/u.xml")
                  x = sh("shell", "cat", "/sdcard/u.xml").stdout
                  if "<hierarchy" in x: return x
                  time.sleep(2)
              return ""
          def nodes(x):
              for m in re.finditer(r'<node [^>]*>', x):
                  n = m.group(0)
                  t = re.search(r' text="([^"]*)"', n); d = re.search(r' content-desc="([^"]*)"', n)
                  b = re.search(r'bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"', n)
                  if b: yield (t.group(1) if t else ""), (d.group(1) if d else ""), tuple(map(int, b.groups()))
          def tap(label, nth=0, scroll=0):
              for attempt in range(scroll + 1):
                  hits = [b for t, d, b in nodes(dump()) if label in (t, d)]
                  if len(hits) > nth:
                      x1, y1, x2, y2 = hits[nth]; sh("shell", "input", "tap", str((x1 + x2) // 2), str((y1 + y2) // 2)); time.sleep(1.5); return True
                  sh("shell", "input", "swipe", "540", "1700", "540", "900", "400"); time.sleep(1)
              print("::warning::no '%s' on screen" % label); return False
          def shot(name, wait=0):
              time.sleep(wait)
              with open("%s/%s.png" % (OUT, name), "wb") as f: f.write(subprocess.run(["adb", "exec-out", "screencap", "-p"], capture_output=True, timeout=60).stdout)
              print("shot", name)
          pkg = sys.argv[1]
          sh("shell", "monkey", "-p", pkg, "-c", "android.intent.category.LAUNCHER", "1")
          shot("01-avatar-default", 20)
          sh("shell", "input", "swipe", "700", "900", "350", "900", "600"); shot("02-avatar-rotated", 3)
          tap("Hair"); tap("Bun"); tap("Outfit"); tap("Hoodie"); tap("Accessory"); tap("VR visor"); tap("Pose"); tap("Wave")
          shot("03-avatar-personalised", 4)
          tap("Store"); shot("04-store-all", 3)
          tap("All", 0); tap("Games"); tap("Flat Screen"); shot("05-store-filtered", 2)
          tap("Open in Galaxy"); shot("06-galaxy-world-a-way-to-go", 25)
          tap("Close"); time.sleep(2)
          tap("WebGL Fluid Simulation", scroll=6); shot("07-galaxy-world-fluid", 20)
          sh("shell", "input", "swipe", "300", "1200", "800", "900", "300"); shot("08-galaxy-world-fluid-touched", 2)
          tap("Close"); shot("09-galaxy-list", 3)
          tap("Avatar"); shot("10-avatar-persisted", 15)
          PY
          cat > walk.sh <<'EOF'
          #!/bin/bash
          set -u
          mkdir -p screens
          adb shell input keyevent KEYCODE_WAKEUP; adb shell wm dismiss-keyguard || true
          adb install -r -g app.apk || exit 2
          PKG=com.diegonmarcos.cgomniverse
          adb logcat -v threadtime "*:W" chromium:I > screens/logcat.txt 2>&1 &
          python3 walk.py "$PKG"; rc=$?
          adb shell dumpsys package "$PKG" | grep -E "versionName|codePath" > screens/package.txt || true
          ls -la app.apk >> screens/package.txt
          exit $rc
          EOF
          chmod +x walk.sh
      - name: Boot emulator + walk
        timeout-minutes: 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_5
          ram-size: 4096M
          cores: 4
          emulator-options: -no-window -gpu swangle_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: ./walk.sh
      - name: Upload the screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cg-omniverse-screens
          path: screens
          retention-days: 30
