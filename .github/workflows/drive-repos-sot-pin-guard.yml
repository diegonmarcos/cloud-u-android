name: "drive repos.sot.json pin guard"

# WHY (#1073). ac_cloud-drive/build.gradle bakes data/repos.sot.json and fails the
# Drive build when its sha256 differs from build.json storage.repos_source.sha256.
# Copies of git-repos-master/repos.json are pushed here without re-pinning
# (nothing automated syncs this repo), so the break only showed at build time.
# This job fails first, on every push, and names the fix.

on:
  push:
    # ── MANAGED-GUARD-TRIGGERS: injected by cloud-android-guard-triggers.py from 1_cicd/src/data/guard-triggers.json ──
    paths:
      - "1_cicd/src/cicd/drive-repos-sot-pin-guard.yml"
      - "ab_cloud-libs-shared/libs/repos/**"
      - "ac_cloud-drive/build.json"
      - "ac_cloud-drive/data/**"
      - "ac_cloud-drive/tools/**"
    # ── end MANAGED-GUARD-TRIGGERS ──
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# ── MANAGED-GUARD-CONCURRENCY: injected by cloud-android-guard-triggers.py ──
concurrency:
  group: drive-repos-sot-pin-guard-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# ── end MANAGED-GUARD-CONCURRENCY ──

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: repos.sot.json copies match the build.json pin
        run: |
          fix='FIX: bash ac_cloud-drive/tools/sync-repos-sot.sh && git add -A ac_cloud-drive ab_cloud-libs-shared && git commit && git push'
          app=ac_cloud-drive
          want="$(node -e 'console.log(require(process.argv[1]).storage.repos_source.sha256)' "$PWD/$app/build.json")"
          have="$(sha256sum "$app/data/repos.sot.json" | cut -d' ' -f1)"
          rc=0
          [ "$want" = "$have" ] || { echo "::error::$app/data/repos.sot.json sha256 $have != build.json pin $want"; rc=1; }
          cmp -s "$app/data/repos.sot.json" ab_cloud-libs-shared/libs/repos/repos.sot.json \
            || { echo "::error::ab_cloud-libs-shared/libs/repos/repos.sot.json differs from $app/data/repos.sot.json"; rc=1; }
          node "$app/tools/gen-drive-git-repos.js" --check >/dev/null 2>&1 \
            || { echo "::error::$app/data/drive-git-repos.json is not what gen-drive-git-repos.js makes from the copy"; rc=1; }
          [ "$rc" = 0 ] || echo "$fix"
          exit $rc
