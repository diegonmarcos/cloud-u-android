# ╔═══════════════════════════════════════════════════════════════════════╗
# ║ Test -> Git engine All files access (emulator) #1358                   ║
# ║ engine-proof: the git sync engine's own calls (GitCalls) on SHARED     ║
# ║   STORAGE after `appops set <pkg> MANAGE_EXTERNAL_STORAGE allow`:      ║
# ║   clone a public repo, commit, push to a local bare remote, pull.      ║
# ║ drive-banner: Cloud Drive + the engine, engine NOT granted: the        ║
# ║   first-run prompt, ONE Git page banner, its button opens Settings,    ║
# ║   the banner goes after the grant. Screenshots uploaded.               ║
# ║ termux-bare-clone: cld.termux + Drive (fleet IPC as root): the old job ║
# ║   start under fish (its real stderr), then Drive bare clones 3 repos. ║
# ║ Scripts: ab_cloud-libs-shared/libs/git-sync-engine/src/androidTest,    ║
# ║          ac_cloud-drive/test/emulator-engine-grant.sh.                 ║
# ╚═══════════════════════════════════════════════════════════════════════╝
name: "Test -> Git engine All files access (emulator)"

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Ship cloud-drive run id whose x86_64 APK artifact to test (empty = the latest release asset)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  engine-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 platforms;android-35 platforms;android-34 build-tools;36.0.0 build-tools;35.0.0 build-tools;34.0.0 platform-tools"

      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14"
      # ── MANAGED-GRADLE-CACHE-HYGIENE: injected by cloud-android-gradle-cache-hygiene.py ──
      # Edit 1_cicd/src/actions/gradle-cache-hygiene, never this block.
      - name: Gradle cache hygiene (retry failed resolution, never cache a failed lookup)
        uses: ./.github/actions/gradle-cache-hygiene
      # ── end MANAGED-GRADLE-CACHE-HYGIENE ──

      - name: Build the engine's instrumented test APK
        run: |
          set -eu
          gradle -p ab_cloud-libs-shared/lib-apks :libs:git-sync-engine:assembleDebugAndroidTest --no-daemon --stacktrace
          mkdir -p apk
          find ab_cloud-libs-shared -path '*androidTest*' -name '*.apk' -print -exec cp {} apk/engine-test.apk \;
          ls -l apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Boot emulator + grant + clone / commit / push / pull on shared storage
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash ab_cloud-libs-shared/libs/git-sync-engine/test/emulator-engine-proof.sh apk/engine-test.apk out

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-proof-evidence
          path: out/
          if-no-files-found: warn

  drive-banner:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch the Drive and engine APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -eu
          mkdir -p apk
          if [ -n "$RUN_ID" ]; then
            gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --paginate \
              --jq '.artifacts[] | select(.name|startswith("Cloud-Drive-x86_64-")) | .name' |
            while read -r name; do gh run download "$RUN_ID" -R "$REPO" -n "$name" -D "apk/dl-$name"; done
            find apk -name '*.apk' -path '*dl-*' | head -1 | xargs -I{} cp {} apk/drive.apk
          else
            gh release download latest -R "$REPO" -p Cloud-Drive-x86_64.apk -O apk/drive.apk
          fi
          gh release download latest -R "$REPO" -p Cloud-Lib-Git-Sync-Engine.apk -O apk/engine.apk
          ls -l apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Boot emulator + missing grant banner (attempt 1)
        id: try1
        continue-on-error: true
        timeout-minutes: 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash ac_cloud-drive/test/emulator-engine-grant.sh apk/drive.apk apk/engine.apk out

      # The runner sometimes hands over an emulator adb reports offline; a second boot is the remedy, not a weaker test.
      - name: Boot emulator + missing grant banner (attempt 2)
        if: steps.try1.outcome != 'success'
        timeout-minutes: 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash ac_cloud-drive/test/emulator-engine-grant.sh apk/drive.apk apk/engine.apk out

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drive-engine-grant-evidence
          path: out/
          if-no-files-found: warn

  termux-bare-clone:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Drive and cld.termux (+ rootfs lib)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -eu
          mkdir -p apk
          if [ -n "$RUN_ID" ]; then
            gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --paginate \
              --jq '.artifacts[] | select(.name|startswith("Cloud-Drive-x86_64-")) | .name' |
            while read -r name; do gh run download "$RUN_ID" -R "$REPO" -n "$name" -D "apk/dl-$name"; done
            find apk -name '*.apk' -path '*dl-*' | head -1 | xargs -I{} cp {} apk/drive.apk
          else
            gh release download latest -R "$REPO" -p Cloud-Drive-x86_64.apk -O apk/drive.apk
          fi
          gh release download latest -R "$REPO" -p cloud-terminal-x86_64.apk -O apk/terminal.apk
          gh release download latest -R "$REPO" -p Cloud-Lib-Rootfs-Termux-x86_64.apk -O apk/rootfs.apk
          ls -l apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Boot emulator + the pre-#1353 job start (expected to fail) + Drive's bare clone of three public repos
        timeout-minutes: 45
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disk-size: 8000M
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash ac_cloud-drive/test/emulator-termux-bare-clone.sh apk/drive.apk apk/terminal.apk apk/rootfs.apk out

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: termux-bare-clone-evidence
          path: out/
          if-no-files-found: warn
