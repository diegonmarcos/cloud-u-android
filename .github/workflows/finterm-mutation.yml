# Capital-Stack-FinTerminal mutation runs (mini-Bloomberg, model panels): each applies ONE deliberate break to the Kotlin of
# ad_Capital-Stack-FinTerminal and runs its JVM unit suite. A RED run is the expected result (the suite catches the break); a green
# run means the suite is blind to it. Manual only. The static rules (data, routes, S1-S8) are proven by test/test-finterm-sources.sh's
# own planted mutants on every Ship run.
name: finterm-mutation
on:
  workflow_dispatch:
    inputs:
      name:
        description: 'ff-utc | ff-importance | merge | container-first | event-window | watchlist | alert-side | ics-dst | sdmx-key | jsonstat-stride | cache-ttl | fin-sort | fin-cell-dash | fin-engine-dash | fin-nav-back | fin-default | fin-keyrows-last | fin-afp | fin-spread'
        required: true
permissions:
  contents: read
env:
  WORK_DIR: ad_Capital-Stack-FinTerminal
jobs:
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Apply mutation ${{ inputs.name }}
        run: |
          K=ad_Capital-Stack-FinTerminal/app/src/main/java/com/diegonmarcos/capitalfinterm
          case "${{ inputs.name }}" in
            ff-utc)          sed -i 's/OffsetDateTime.parse(raw).atZoneSameInstant(ZoneOffset.UTC)/OffsetDateTime.parse(raw).toZonedDateTime()/' $K/Feeds.kt ;;
            ff-importance)   sed -i 's/"high" -> 3; "medium" -> 2/"high" -> 2; "medium" -> 2/' $K/Feeds.kt ;;
            merge)           sed -i 's/                if (!merge) break/                break/' $K/Engine.kt ;;
            container-first) sed -i 's/if (c.api != null \&\& p != null \&\& Catalog.str(p, "api").isNotEmpty()) {/if (c.api != null \&\& p != null \&\& Catalog.str(p, "api").isNotEmpty() \&\& false) {/' $K/Engine.kt ;;
            event-window)    sed -i 's/it.ts.take(10) in from..to \&\& it.importance >= min/it.importance >= min/' $K/Engine.kt ;;
            watchlist)       sed -i 's/if (Catalog.str(f, "each_user") == "watchlist" \&\& user.watchlist.isNotEmpty()) return user.watchlist/if (false) return user.watchlist/' $K/Engine.kt ;;
            alert-side)      sed -i 's/if (r.kind == ABOVE) it.value > r.level else it.value < r.level/if (r.kind == ABOVE) it.value < r.level else it.value > r.level/' $K/Alerts.kt ;;
            ics-dst)         sed -i 's/-> ZoneId.of("America\/New_York")/-> ZoneOffset.ofHours(-5)/' $K/Feeds.kt ;;
            sdmx-key)        sed -i 's/sk.split(":").getOrNull(k)/sk.split(":").getOrNull(0)/' $K/Feeds.kt ;;
            jsonstat-stride) sed -i 's/for (d in size.indices.reversed())/for (d in size.indices)/' $K/Feeds.kt ;;
            cache-ttl)       sed -i 's/private fun ttl(url: String): Long = maxOf(ttlMs, ttlFor(url) ?: 0L)/private fun ttl(url: String): Long = ttlMs/' $K/Http.kt ;;
            # UI spec mutants (FinTerm UI overhaul): each breaks one rule a JVM test pins.
            fin-sort)        sed -i 's/return (if (step % 3 == 1) first else first.reversed()) + absent/return first + absent/' $K/FinLogic.kt ;;
            fin-cell-dash)   sed -i 's/fun cell(s: String?): String = if (missing(s)) FinFormat.DASH else s!!.trim()/fun cell(s: String?): String = s.orEmpty().trim()/' $K/FinLogic.kt ;;
            fin-engine-dash) sed -i 's/if (bp) FinFormat.DASH else pctText(p)/if (bp) "-" else pctText(p)/' $K/Engine.kt ;;
            fin-nav-back)    sed -i 's/if (top.startsWith("quote:")) return stack.dropLast(1)/if (top.startsWith("quote:")) return initial(defaultDashboard)/' $K/FinNavStack.kt ;;
            fin-default)     sed -i 's/ids.firstOrNull { id -> list.any { it.id == id \&\& it.isDefault } } ?: //' $K/Dashboards.kt ;;
            fin-keyrows-last) sed -i 's/return shown.filter { it.isLive || it.isStatic } + shown.filterNot { it.isLive || it.isStatic }/return shown/' $K/Dashboards.kt ;;
            fin-afp)         sed -i 's/at(Regex("forecast|cons|estimate|eps est"))/at(Regex("forecast|consensus|estimate|eps est"))/' $K/FinLogic.kt ;;
            fin-spread)      sed -i 's/return if (bp) Math.round((x - y) \* 100.0).toDouble() else x - y/return if (bp) Math.round((y - x) * 100.0).toDouble() else x - y/' $K/FinLogic.kt ;;
            *) echo "unknown mutation"; exit 2 ;;
          esac
          git diff --stat
          # a mutation that changed nothing would prove nothing
          test -n "$(git diff --name-only)" || { echo "mutation target missing"; exit 3; }
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 platforms;android-35 platforms;android-26 build-tools;35.0.0 build-tools;34.0.0 platform-tools"
      - name: Set up Gradle 8.10.2 (cached)
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"
      # ── MANAGED-GRADLE-CACHE-HYGIENE: injected by cloud-android-gradle-cache-hygiene.py ──
      # Edit 1_cicd/src/actions/gradle-cache-hygiene, never this block.
      - name: Gradle cache hygiene (retry failed resolution, never cache a failed lookup)
        uses: ./.github/actions/gradle-cache-hygiene
      # ── end MANAGED-GRADLE-CACHE-HYGIENE ──
      - name: Checkout vault (shared Android signing key, read by app/build.gradle at configuration)
        uses: actions/checkout@v4
        with:
          repository: diegonmarcos/cloud-me-pvt-vault
          token: ${{ secrets.ANDROID_SIGNING_VAULT_TOKEN }}
          path: .vault
      - name: Install jq
        run: sudo apt-get update -y && sudo apt-get install -y jq
      - name: Install ORAS + sops (pinned)
        uses: ./.github/actions/install-pinned-tools
        with:
          tools: oras sops
      - name: JVM unit tests (RED expected)
        env:
          BYPASS_NIX: "1"
          VAULT_DIR: ${{ github.workspace }}/.vault
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: sh 1_cicd/dist/scripts/cloud-android-test-engine.sh unit "$WORK_DIR"
