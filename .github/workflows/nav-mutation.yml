# Nav-bar mutation runs (#1355): each applies ONE deliberate break to libs:bottomnav's dropdown sizing or per-gesture scroll-hide
# and runs the JVM suite that must catch it (Cloud Store's storeUnitTests, which includes :libs:bottomnav:testDebugUnitTest:
# NavDropdownSizingTest, NavUiTest, NavDropdownInkTest). A RED run is the expected result; a green run means the suite is blind. Manual only.
name: nav-mutation
on:
  workflow_dispatch:
    inputs:
      name:
        description: 'gesture-latch | gesture-new | dropdown-cap | dropdown-ink | top-underlay'
        required: true
permissions:
  contents: read
env:
  WORK_DIR: ac_cloud-store
jobs:
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Apply mutation ${{ inputs.name }}
        run: |
          K=ab_cloud-libs-shared/libs/bottomnav/src/commonMain/kotlin/com/diegonmarcos/superapp/bottomnav
          case "${{ inputs.name }}" in
            gesture-latch) sed -i '/if (policy == ChromeScrollPolicy.Hide \&\& delta < 0f \&\& latch != NO_GESTURE \&\& latch == gesture) return ChromeGestureStep(state, latch)/d' $K/NavUi.kt ;;
            gesture-new)   sed -i 's/if (down \&\& !fingerDown) { gesture++; awaitingGesture = false }/if (down \&\& !fingerDown) { awaitingGesture = false }/' $K/BottomNavBar.kt ;;
            dropdown-cap)  sed -i 's/return below.coerceIn(minOf(minPx, whole), whole)/return 520/' $K/NavDropdownSizing.kt ;;
            # the dropdown's child entries back to a dark ink on the dark dropdown: NavDropdownInkTest must go red
            dropdown-ink)  sed -i 's/DropdownEntryRole.Child -> dropdownOnSurface.copy(alpha = dropdownChildAlpha)/DropdownEntryRole.Child -> Color(0xFF1D1B20)/' $K/NavTokens.kt ;;
            # the first row's underlay back to the light Material surface (the white-on-white bar): TopChromeUnderlayTest must go red.
            # libs:ui-nav-bars is not in Cloud Store's build, so this one runs Cloud Calc's unit suite (every module).
            top-underlay)  sed -i 's/^public fun topChromeUnderlay(dark: Boolean): Color = ThemeBackground.colors(dark).island$/public fun topChromeUnderlay(dark: Boolean): Color = Color(0xFFFEF7FF)/' ab_cloud-libs-shared/libs/ui-nav-bars/src/main/kotlin/com/diegonmarcos/superapp/navbartop1/NavBarTopFirstRow.kt
                           echo "WORK_DIR=ac_cloud-calc" >> "$GITHUB_ENV" ;;
            *) echo "unknown mutation"; exit 2 ;;
          esac
          git diff --stat
          # a mutation that changed nothing would prove nothing
          test -n "$(git diff --name-only)" || { echo "mutation target missing"; exit 3; }
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 platforms;android-35 platforms;android-26 build-tools;35.0.0 build-tools;34.0.0 platform-tools"
      - name: Set up Gradle 8.10.2 (cached)
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"
      # ── MANAGED-GRADLE-CACHE-HYGIENE: injected by cloud-android-gradle-cache-hygiene.py ──
      # Edit 1_cicd/src/actions/gradle-cache-hygiene, never this block.
      - name: Gradle cache hygiene (retry failed resolution, never cache a failed lookup)
        uses: ./.github/actions/gradle-cache-hygiene
      # ── end MANAGED-GRADLE-CACHE-HYGIENE ──
      - name: Checkout vault (shared Android signing key, read by app/build.gradle at configuration)
        uses: actions/checkout@v4
        with:
          repository: diegonmarcos/cloud-me-pvt-vault
          token: ${{ secrets.ANDROID_SIGNING_VAULT_TOKEN }}
          path: .vault
      - name: Install jq
        run: sudo apt-get update -y && sudo apt-get install -y jq
      - name: Install ORAS + sops (pinned)
        uses: ./.github/actions/install-pinned-tools
        with:
          tools: oras sops
      - name: JVM unit tests (RED expected)
        env:
          BYPASS_NIX: "1"
          VAULT_DIR: ${{ github.workspace }}/.vault
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: sh 1_cicd/dist/scripts/cloud-android-test-engine.sh unit "$WORK_DIR"
      # the evidence: which nav test caught it
      - name: Failed tests
        if: always()
        run: grep -rl "<failure" --include="TEST-*.xml" ab_cloud-libs-shared/libs/bottomnav/build ab_cloud-libs-shared/libs/ui-nav-bars/build 2>/dev/null | xargs -r grep -h -o 'testcase name="[^"]*"' | head -40 || true
