name: "generated files are up to date"

# WHY THIS EXISTS.
# The pipeline is 1_cicd/src/** -> 1_cicd/dist/** -> .github/workflows/, and
# everyone works under the rule "edit the source, never the generated file,
# because a change to a generated file is inert". That rule only holds while
# the generated files are actually what the sources produce. When they drift,
# three things become possible at once and all three are silent:
#
#   - an edit to the source never reaches CI, because the committed output that
#     GitHub reads still says the old thing. The author sees green and believes
#     the change landed.
#   - an unrelated commit regenerates, and the drifted differences land inside
#     someone else's diff, attributed to them.
#   - a fix made directly in the generated file works, so it stays there, and
#     the next regeneration destroys it. ship-cloud-libs.yml had exactly this:
#     a firestack Go module cache step that existed only in .github/workflows.
#
# This job regenerates and fails if anything differs from what is committed.
#
# NO PATH FILTER, deliberately. Drift is not caused only by edits under 1_cicd:
# a build.json module map, a .gitignore source, an app directory appearing or
# disappearing all change what the generator emits. A filter here would leave
# the gate blind to the majority of its own inputs.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Two runs of this job can both want to push the refreshed inventory (see the
# comparison step), and the loser of that race would be a red main for a
# regeneration that already landed. Keep one run per ref; a cancelled older run
# is superseded, not a verdict.
concurrency:
  group: generated-up-to-date-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  regenerate-and-compare:
    runs-on: ubuntu-latest
    # Write, for two kinds of path: 1_cicd/dist/data/test-coverage.json and the
    # script copies under 1_cicd/dist/scripts/, pushed back to main by the
    # comparison step below. Every other kind of drift is still read-only and
    # still red.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The generator reads a sibling repository when one is present, to refresh
      # the Claude agent dotfiles from their source of truth. A runner has no
      # such checkout, but relying on that is relying on an accident: point the
      # override at a path that cannot exist so this job's inputs are exactly
      # the contents of this repository and nothing else.
      # Before regenerating, so it judges the COMMITTED workflows: every
      # setup-gradle step must be followed by the gradle-cache-hygiene block
      # (a cached failed dependency lookup broke ship-cloud-calc and then
      # ship-cloud-store x86_64 on every run). A workflow added straight into
      # .github/workflows without the generator fails here by name.
      - name: Every setup-gradle step carries gradle cache hygiene
        run: python3 1_cicd/src/scripts/cloud-android-gradle-cache-hygiene.py check .

      - name: Regenerate everything from source
        env:
          CLAUDE_SOT_DIR: /nonexistent/claude-source-of-truth
        run: ./build.sh workflow

      # A step of its own, so the generator's exit status is the step's exit
      # status. Reading it through a pipe -- `./build.sh workflow | tail` --
      # would report tail's status instead, and this repository has shipped
      # that exact false green before.

      # WHY ONE FILE IS DERIVED HERE AND NOT BY THE AUTHOR.
      #
      # Every other generated file in this repository is derived from
      # 1_cicd/src, so "you edited the source and forgot to regenerate" is one
      # person's omission inside one directory, and a red gate teaching them is
      # both correct and cheap.
      #
      # 1_cicd/dist/data/test-coverage.json is not that shape. Its inputs are
      # EVERY app's test directory, so the commit that makes it stale is a
      # commit that adds a tester — somewhere else entirely, by an author with
      # no reason to be thinking about 1_cicd. That happened three times in one
      # day (#673, #676, #669), each time costing a full red-main cycle that
      # blocked every ship, and the instruction this step used to print made it
      # worse: './build.sh workflow' purges and rebuilds the whole of
      # 1_cicd/dist and races everyone else working in the tree (it emptied 55
      # files under 1_cicd/dist/cicd on 2026-09-30).
      #
      # So for that one artefact the derivation is the engine's job. Same shape
      # as cloud-infra's ship-gen-configs, which has refreshed its dist/ this
      # way for months. Deliberately NOT a commit-time hook: this tree is
      # worked by several agents at once, and a hook would derive the inventory
      # from whatever untracked files happened to be lying in their working
      # copies — measured, not feared (an uncommitted FleetGitTest.kt made the
      # count read 13 where the committed tree says 12). A runner's checkout is
      # the only place the inputs are unambiguous.
      #
      # The relaxation is exactly these paths: the inventory above and 1_cicd/dist/scripts/.
      # The scripts directory is a verbatim copy of 1_cicd/src/scripts behind a one-line header, so
      # it can only drift when someone edits a source script and does not carry the copy along
      # (three red mains in one day, 2026-10-22: fleet-nsc, guard-triggers, ...). It is derived
      # here for the same reason as the inventory. 1_cicd/dist/cicd (the verbatim mirror of
      # 1_cicd/src/cicd) is derived too: it drifted four times on 2026-10-22 when an author
      # changed a workflow source and its .github copy but not the mirror. NOT included,
      # deliberately: .github/workflows. A workflow file cannot be pushed with GITHUB_TOKEN
      # (GitHub refuses a token without the `workflows` scope), and what a workflow says decides
      # what runs, so a drifted one stays red and is fixed by the author.
      # Anything else that drifts is still red, and on a pull request even these paths are red
      # — with the NARROW command named, because there is nothing safe to push to.
      # #1168: constellation-fleet.json carries each rootfs lib's content
      # address (sha256 over identity_files such as ab_cloud-terminal-store/*),
      # so an edit there by an author thinking about the terminal made the
      # manifest stale and turned the fleet manifest guard red. The gradle build
      # re-derives it but never commits it. Derive it here, same shape as the
      # inventory above, from the same generator the build runs.
      - name: Derive the fleet manifest from its sources
        run: bash aa_cloud-superapp/data/regen.sh --constellation-only

      - name: Committed output matches what the sources produce
        run: |
          set -euo pipefail

          derived="1_cicd/dist/data/test-coverage.json"
          fleet="aa_cloud-superapp/data/constellation-fleet.json"
          derived_re='^.. (1_cicd/dist/data/test-coverage\.json|1_cicd/dist/scripts/|1_cicd/dist/cicd/|aa_cloud-superapp/data/constellation-fleet\.json)'
          derived_paths="$derived 1_cicd/dist/scripts 1_cicd/dist/cicd $fleet"

          # --porcelain and NOT `git diff --exit-code`: a plain diff sees only
          # tracked files, and the largest single piece of drift found when this
          # gate was written was a file MISSING from 1_cicd/dist entirely
          # (ship-c3-morpheus.yml). Regeneration recreates it as an untracked
          # file, which `git diff` reports as nothing at all.
          drift="$(git status --porcelain)"

          if [ -z "$drift" ]; then
            echo "Generated output matches the committed tree."
            exit 0
          fi

          # grep -v, so a run where the inventory drifted ALONGSIDE something
          # else still reports the something else and still goes red.
          other="$(printf '%s\n' "$drift" | grep -Ev -- "$derived_re" || true)"

          if [ -n "$other" ]; then
            echo "::error::Generated files are out of date. Run './build.sh workflow' and commit the result."
            echo
            echo "Paths that differ from what the sources produce:"
            printf '%s\n' "$other"
            echo
            git --no-pager diff
            exit 1
          fi

          echo "Only the derived paths drifted (test-coverage inventory, dist/scripts and dist/cicd copies):"
          git --no-pager diff -- $derived_paths

          if [ "${GITHUB_EVENT_NAME}" != "push" ] || [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::derived files are out of date: $(printf '%s' "$drift" | tr '\n' ' '). Copy 1_cicd/src/scripts/<name> to 1_cicd/dist/scripts/<name> (keeping its first header line) or 1_cicd/src/cicd/<name> to 1_cicd/dist/cicd/<name> or run './build.sh test-coverage' for the inventory, or run 'bash aa_cloud-superapp/data/regen.sh --constellation-only' for the fleet manifest (#1168), and commit those files. Do NOT run './build.sh workflow' for this -- it rebuilds all of 1_cicd/dist and races other work in the tree."
            exit 1
          fi

          # Stage the ONE path, explicitly. `git add -A` here would sweep in
          # anything the generator happened to leave behind.
          git add -- $derived_paths

          # Why this cannot loop: a commit pushed with GITHUB_TOKEN does not
          # trigger workflows, and [skip ci] says so a second time.
          git \
            -c user.name="Claude" \
            -c user.email="noreply@anthropic.com" \
            commit -m "ci(generated): refresh the derived files from ${GITHUB_SHA::8} via run ${GITHUB_RUN_ID} [skip ci]"

          # Agents push to main every few minutes, so the first push often loses the race.
          # The checkout is shallow, so rather than rebase, take the new main and lay this
          # run's one derived file onto it again (the commit is that file and nothing else),
          # bounded to 5 tries with backoff. A newer main whose own test-coverage.json
          # differs from this run's is simply overwritten with the content this run derived
          # from its sources; the next run on that main re-derives it again.
          pushed=0
          for try in 1 2 3 4 5; do
            if git push origin HEAD:main; then pushed=1; break; fi
            echo "push $try lost the race; re-applying the inventory on the new main"
            sleep $((try * 5))
            git diff --name-only HEAD~1 HEAD > "$RUNNER_TEMP/derived.list"
            tar cf "$RUNNER_TEMP/derived.tar" -T "$RUNNER_TEMP/derived.list"
            git fetch --depth=1 origin main
            git reset -q --hard origin/main
            tar xf "$RUNNER_TEMP/derived.tar"
            if git diff --quiet -- $derived_paths && [ -z "$(git status --porcelain -- $derived_paths)" ]; then pushed=1; echo "main already carries these files"; break; fi
            git add -- $derived_paths
            git -c user.name="github-actions[bot]" -c user.email="noreply@anthropic.com" \
              commit -q -m "ci(generated): refresh the derived files from ${GITHUB_SHA::8} via run ${GITHUB_RUN_ID} [skip ci]"
          done
          if [ "$pushed" != 1 ]; then
            echo "::error::could not push the refreshed files after 5 tries -- main kept moving. Commit the derived files named above yourself."
            exit 1
          fi

          echo "Refreshed the derived files and pushed them to main."

      # A gate that has never been watched failing is decoration. This proves,
      # on every run, that the comparison above can actually go red: it edits a
      # source, regenerates, and requires the change to show up in
      # .github/workflows. If the generator silently stopped emitting, or the
      # comparison stopped seeing, this step fails and says so.
      - name: The gate is not vacuous - a source edit must reach .github/workflows
        env:
          CLAUDE_SOT_DIR: /nonexistent/claude-source-of-truth
        run: |
          set -euo pipefail

          printf '\n# Deliberate drift introduced by the up-to-date gate, reverted below.\n' \
            >> 1_cicd/src/cicd/health.yml

          if ! ./build.sh workflow > /tmp/vacuity-proof.log 2>&1; then
            echo "::error::the generator failed while proving the gate is live"
            cat /tmp/vacuity-proof.log
            git checkout -- .
            exit 1
          fi

          drift="$(git status --porcelain)"

          # Restore BEFORE asserting, so a failed assertion cannot leave the
          # working tree dirty for anything that runs after it.
          git checkout -- .
          git clean -fd 1_cicd 0_apps 0_git > /dev/null

          case "$drift" in
            *".github/workflows/health.yml"*) ;;
            *)
              echo "::error::a source edit did not reach .github/workflows - this gate proves nothing"
              echo "drift observed was:"
              printf '%s\n' "$drift"
              exit 1
              ;;
          esac

          echo "Proven: a source edit left unregenerated makes this gate go red."
