# Cloud Mail mutation runs: each applies ONE deliberate break to the list's default grouping (By sender)
# and runs the mail JVM suite that must catch it (ListViewControlsTest). A RED run is the expected
# result; a green run means the suite is blind. Manual only.
name: mail-mutation
on:
  workflow_dispatch:
    inputs:
      name:
        description: 'default-group | decode-default'
        required: true
permissions:
  contents: read
env:
  WORK_DIR: ac_cloud-mail
jobs:
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Apply mutation ${{ inputs.name }}
        run: |
          K=ac_cloud-mail/app/src/main/kotlin/app/sterna/ui/inbox
          case "${{ inputs.name }}" in
            default-group)  sed -i 's/val group: GroupMode? = GroupMode.SENDER,/val group: GroupMode? = null,/' $K/ListViewPrefs.kt ;;
            decode-default) sed -i 's/ ?: ListView().group,/,/' $K/ListViewPrefs.kt ;;
            *) echo "unknown mutation"; exit 2 ;;
          esac
          git diff --stat
          # a mutation that changed nothing would prove nothing
          test -n "$(git diff --name-only)" || { echo "mutation target missing"; exit 3; }
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 platforms;android-35 platforms;android-26 build-tools;35.0.0 build-tools;34.0.0 platform-tools"
      - name: Set up Gradle 8.10.2 (cached)
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"
      # ── MANAGED-GRADLE-CACHE-HYGIENE: injected by cloud-android-gradle-cache-hygiene.py ──
      # Edit 1_cicd/src/actions/gradle-cache-hygiene, never this block.
      - name: Gradle cache hygiene (retry failed resolution, never cache a failed lookup)
        uses: ./.github/actions/gradle-cache-hygiene
      # ── end MANAGED-GRADLE-CACHE-HYGIENE ──
      - name: Checkout vault (shared Android signing key, read by app/build.gradle at configuration)
        uses: actions/checkout@v4
        with:
          repository: diegonmarcos/cloud-me-pvt-vault
          token: ${{ secrets.ANDROID_SIGNING_VAULT_TOKEN }}
          path: .vault
      - name: Install jq
        run: sudo apt-get update -y && sudo apt-get install -y jq
      - name: Install ORAS + sops (pinned)
        uses: ./.github/actions/install-pinned-tools
        with:
          tools: oras sops
      - name: JVM unit tests (RED expected)
        env:
          BYPASS_NIX: "1"
          VAULT_DIR: ${{ github.workspace }}/.vault
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: sh 1_cicd/dist/scripts/cloud-android-test-engine.sh unit "$WORK_DIR"
      # the evidence: which mail test caught it
      - name: Failed tests
        if: always()
        run: grep -rl "<failure" --include="TEST-*.xml" ac_cloud-mail/app/build 2>/dev/null | xargs -r grep -h -o 'testcase name="[^"]*"' | head -40 || true
