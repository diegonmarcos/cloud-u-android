<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Avatar</title>
<style>
  html, body, #cgc { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #121212; }
  canvas { display: block; touch-action: none; }
</style>
<!-- The Avatar editor's scene: libs:cgc-3d (assets/cgc, merged from the library) over three.js. three.js and OrbitControls are
     Cloud Nav's copies (ac_cloud-nav/app/src/main/assets/space, merged in by app/build.gradle). The scene config is
     data/avatar.json::scene, handed over synchronously by the app's CgcHost bridge; scene ops arrive through window.cgc.apply. -->
<script type="importmap">{ "imports": { "three": "../space/three.module.min.js" } }</script>
</head>
<body>
<div id="cgc"></div>
<script type="module">
  import { boot } from '../cgc/cgc.js';
  const host = window.CgcHost;
  boot(host && host.config ? JSON.parse(host.config()) : { model: { url: 'models/owner.glb' } });
</script>
</body>
</html>
