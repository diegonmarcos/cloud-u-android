# Performance + AndroidX. Mirrors aa_cloud-superapp / ea_cloud-comms.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# OFF: stageServer (app/build.gradle) reads build.json and the environment at
# execution time in a doLast closure, which the configuration cache refuses to
# serialise.
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
kotlin.incremental=true
