<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>cloud-c3-webserver</title>
<style>
  :root { --bg:#0b0e14; --panel:#131824; --line:#1e2634; --fg:#e6e9ef; --dim:#8b95a7; --acc:#7cc4ff; --nav:56px; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.4 system-ui, sans-serif; }
  header { position:sticky; top:0; background:var(--bg); border-bottom:1px solid var(--line); padding:10px 14px; display:flex; align-items:baseline; gap:10px; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .sub { color:var(--dim); font-size:12px; }
  main { padding:12px 12px calc(var(--nav) + 16px); }
  nav { position:fixed; left:0; right:0; bottom:0; height:var(--nav); display:flex; background:var(--panel); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom); }
  nav button { flex:1; background:none; border:0; color:var(--dim); font:12px system-ui; padding:6px 0; }
  nav button.on { color:var(--acc); font-weight:600; }
  section { background:var(--panel); border:1px solid var(--line); border-radius:10px; margin-bottom:12px; overflow:hidden; }
  section h2 { font-size:13px; margin:0; padding:8px 12px; color:var(--dim); text-transform:uppercase; letter-spacing:.04em; border-bottom:1px solid var(--line); }
  .row { display:flex; gap:12px; padding:8px 12px; border-bottom:1px solid var(--line); word-break:break-word; }
  .row:last-child { border-bottom:0; }
  .row .k { flex:0 0 38%; color:var(--dim); }
  .row .v { flex:1; }
  a { color:var(--acc); text-decoration:none; }
  code { font:13px ui-monospace, monospace; color:var(--fg); }
  .path { font:13px ui-monospace, monospace; }
  .sum { color:var(--dim); font-size:13px; margin-top:2px; }
  .tool { display:flex; gap:8px; align-items:center; padding:8px 12px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .tool input, .tool select { background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px 8px; font:14px system-ui; }
  .tool input[type=search] { flex:1; min-width:120px; }
  .crumb a { margin-right:2px; }
  .entry { display:flex; gap:10px; padding:9px 12px; border-bottom:1px solid var(--line); align-items:center; }
  .entry .n { flex:1; word-break:break-all; }
  .entry .s { color:var(--dim); font-size:12px; }
  .entry.dir .n::before { content:"▸ "; color:var(--acc); }
  pre { margin:0; padding:12px; overflow:auto; font:12px ui-monospace, monospace; white-space:pre-wrap; word-break:break-word; }
  .err { color:#ff8a8a; padding:12px; }
  h2.macro { font-size:14px; margin:18px 2px 8px; color:var(--acc); letter-spacing:.04em; }
  .index .cells { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:8px; padding:10px 12px; }
  .index .cell { background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:10px 8px; font:13px system-ui; text-align:left; }
  .index .tool button, .back a { color:var(--acc); background:none; border:1px solid var(--line); border-radius:6px; padding:6px 10px; font:13px system-ui; }
  .back { margin:-4px 0 12px; text-align:right; }
  .badge { font-size:11px; color:var(--dim); border:1px solid var(--line); border-radius:4px; padding:1px 6px; margin-left:6px; }
  header { align-items:center; }
  header .sub { flex:1; }
  #gear { background:none; border:1px solid var(--line); color:var(--dim); border-radius:8px; width:34px; height:34px; font:18px system-ui; padding:0; }
  #gear.on { color:var(--acc); border-color:var(--acc); }
  .seg { display:flex; gap:6px; padding:8px 12px; border-bottom:1px solid var(--line); }
  .seg button { flex:1; background:var(--bg); color:var(--dim); border:1px solid var(--line); border-radius:8px; padding:8px 0; font:600 13px system-ui; }
  .seg button.on { color:var(--acc); border-color:var(--acc); }
  .served { display:grid; grid-template-columns:auto 1fr; gap:2px 10px; align-items:center; }
  .served .dot { width:9px; height:9px; border-radius:50%; background:var(--dim); display:inline-block; }
  .served .dot.up { background:#7ee2a8; } .served .dot.down { background:#ff8a8a; }
  .served .links { display:flex; flex-wrap:wrap; gap:6px 14px; }
  .served .links a { padding:7px 0; min-height:32px; display:inline-flex; align-items:center; }
  .served .head { font-weight:600; }
  .note { color:var(--dim); font-size:12px; padding:8px 12px; }
  .eng { display:flex; gap:10px; padding:8px 12px; border-bottom:1px solid var(--line); align-items:flex-start; }
  .eng:last-child { border-bottom:0; }
  .eng .t { flex:1; min-width:0; }
  .eng .nm { font-weight:600; }
  .eng .cv { color:var(--acc); font:12px ui-monospace, monospace; word-break:break-word; }
  .eng .why { color:#e6c07b; font-size:12px; margin-top:2px; }
  .sw { flex:0 0 auto; width:46px; height:28px; border-radius:14px; border:1px solid var(--line); background:var(--bg); position:relative; padding:0; }
  .sw::after { content:""; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:var(--dim); transition:transform .12s; }
  .sw[aria-checked=true] { border-color:var(--acc); background:#10304a; }
  .sw[aria-checked=true]::after { transform:translateX(18px); background:var(--acc); }
  .sw[disabled] { opacity:.35; }
  .toast { position:fixed; left:12px; right:12px; bottom:calc(var(--nav) + 10px); background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:9px 12px; font-size:13px; z-index:5; }
  .toast.bad { border-color:#ff8a8a; color:#ff8a8a; }
</style>
</head>
<body>
<header><h1 id="title">cloud-c3-webserver</h1><span class="sub" id="sub"></span><button id="gear" aria-label="Settings" title="Settings: Configs">⚙</button></header>
<main id="main"><div class="err" id="boot">Connecting to the server…</div></main>
<nav id="nav" aria-label="tabs"></nav>

<script id="pure">
// PURE: no browser object is touched here. Every function maps server JSON to
// an HTML string, so the tester can run this block under node and prove that
// what the tabs draw is exactly what the route table said, no more and no less.
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function fmtBytes(n) {
  if (n == null) return '';
  var u = ['B', 'KiB', 'MiB', 'GiB', 'TiB']; var i = 0; var v = Number(n);
  while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
  return i === 0 ? v + ' B' : v.toFixed(1) + ' ' + u[i];
}
// The bottom nav is the route table's tab rows, in table order.
function tabsFrom(routes) {
  return routes.filter(function (r) { return r.tab; }).map(function (r) {
    return { id: r.path.split('/').pop(), label: r.tab, path: r.path };
  });
}
function tabFromPath(pathname) {
  var m = /^\/__tab__\/([a-z0-9-]+)\/?$/.exec(pathname || '');
  return m ? m[1] : null;
}
function defaultTab(tabs) {
  var home = tabs.filter(function (t) { return t.id === 'home'; })[0];
  return home ? home.id : (tabs[0] ? tabs[0].id : null);
}
function renderNav(tabs, current) {
  return tabs.map(function (t) {
    return '<button data-tab="' + esc(t.id) + '"' + (t.id === current ? ' class="on"' : '') + '>' + esc(t.label) + '</button>';
  }).join('');
}
// Pages and API tabs: one section, one row per route of that kind.
function renderRoutes(routes, kind) {
  var rows = routes.filter(function (r) { return r.kind === kind; });
  var title = kind === 'page' ? rows.length + ' pages this server serves' : rows.length + ' API routes this server serves';
  var body = rows.map(function (r) {
    var href = r.path === '/*' ? '/' : r.path;
    var tab = r.tab ? '<span class="badge">tab: ' + esc(r.tab) + '</span>' : '';
    return '<div class="row"><div class="v"><a class="path" href="' + esc(href) + '">' + esc(r.path) + '</a>' + tab +
      '<div class="sum">' + esc(r.summary) + '</div></div></div>';
  }).join('');
  return '<section><h2>' + esc(title) + '</h2>' + body + '</section>';
}
// Home: sections of key/value rows, the Configs ▸ About shape.
function renderSections(sections) {
  return sections.map(function (s) {
    var rows = s.rows.map(function (kv) {
      return '<div class="row"><div class="k">' + esc(kv[0]) + '</div><div class="v">' + esc(kv[1]) + '</div></div>';
    }).join('');
    return '<section><h2>' + esc(s.title) + '</h2>' + rows + '</section>';
  }).join('');
}
// Home: the cloud-superapp Configs ▸ About shape — an Index of the macro
// groups first, then each group's sections, every group closing with the way
// back up to the Index. Groups, labels and order are the server's
// (/__api__/about); nothing here names one.
function renderAbout(groups) {
  var cells = groups.map(function (g, i) {
    return '<button class="cell" data-jump="macro-' + i + '">' + esc(g.macro) + '</button>';
  }).join('');
  var out = '<section class="index" id="about-index"><h2>Index</h2><div class="cells">' + cells + '</div>' +
    '<div class="tool"><button data-copy-about>Copy All Infos</button></div></section>';
  groups.forEach(function (g, i) {
    out += '<h2 class="macro" id="macro-' + i + '">' + esc(g.macro) + '</h2>' + renderSections(g.sections) +
      '<div class="back"><a data-jump="about-index">Go Back Up to Index</a></div>';
  });
  return out;
}
// "Copy All Infos": the whole page as text, macro → section → key: value.
function aboutText(groups) {
  return groups.map(function (g) {
    return '== ' + g.macro + ' ==\n' + g.sections.map(function (s) {
      return '# ' + s.title + '\n' + s.rows.map(function (kv) { return kv[0] + ': ' + kv[1]; }).join('\n');
    }).join('\n\n');
  }).join('\n\n') + '\n';
}
// Configs: a flat object, nested objects one level deep as their own sections.
function renderConfig(cfg) {
  var top = []; var nested = [];
  Object.keys(cfg).forEach(function (k) {
    var v = cfg[k];
    if (v !== null && typeof v === 'object' && !Array.isArray(v)) nested.push([k, v]);
    else top.push([k, Array.isArray(v) ? v.join(', ') : String(v)]);
  });
  var out = renderSections([{ title: 'Server', rows: top }]);
  nested.forEach(function (kv) {
    out += renderSections([{ title: kv[0], rows: Object.keys(kv[1]).map(function (k) { return [k, String(kv[1][k])]; }) }]);
  });
  return out;
}
function joinPath(dir, name) {
  return (dir === '/' ? '' : dir.replace(/\/$/, '')) + '/' + name;
}
function renderCrumbs(dir) {
  var parts = dir.split('/').filter(Boolean); var acc = ''; var out = '<a data-dir="/">/</a>';
  parts.forEach(function (p) { acc += '/' + p; out += '<a data-dir="' + esc(acc) + '">' + esc(p) + '</a>/'; });
  return '<span class="crumb">' + out + '</span>';
}
function renderListing(entries, dir) {
  if (!entries.length) return '<div class="err">empty directory</div>';
  return entries.map(function (e) {
    var full = joinPath(dir, e.name);
    if (e.isDir) return '<div class="entry dir" data-dir="' + esc(full) + '"><span class="n">' + esc(e.name) + '</span></div>';
    var size = e.broken ? 'broken link → ' + esc(e.target || '?') : fmtBytes(e.size);
    return '<div class="entry" data-file="' + esc(full) + '"><span class="n">' + esc(e.name) + '</span><span class="s">' + size + '</span></div>';
  }).join('');
}
function renderResults(results, base, partial) {
  var head = partial ? '<div class="err">partial: the search stopped at its time, entry or result budget</div>' : '';
  if (!results.length) return head + '<div class="err">no match</div>';
  return head + results.map(function (r) {
    var full = joinPath(base, r.path);
    var attr = r.isDir ? 'data-dir' : 'data-file';
    return '<div class="entry' + (r.isDir ? ' dir' : '') + '" ' + attr + '="' + esc(full) + '"><span class="n">' + esc(r.path) + '</span></div>';
  }).join('');
}
function renderFile(file) {
  return '<section><h2>' + esc(file.path) + ' <span class="badge">' + esc(fmtBytes(file.size)) + '</span> <a href="' +
    esc(file.path) + '" target="_blank">open</a></h2><pre>' + esc(file.content) + '</pre></section>';
}
// Pages: every served page of the phone, by port and by its private DNS name. The data is /__api__/serving
// (build.json::serving); a link here hands the URL to cloud-browser (data-open), it never navigates this view.
function renderServed(sv) {
  var rows = sv.endpoints.map(function (e) {
    var state = e.up === true ? 'up' : (e.up === false ? 'down' : '');
    var label = e.up === true ? 'answering' : (e.up === false ? 'not answering' : '');
    return '<div class="row"><div class="v served">' +
      '<span class="dot ' + state + '" title="' + esc(label) + '"></span>' +
      '<span class="head">' + esc(e.title) + '<span class="badge">:' + esc(e.port) + '</span><span class="badge">' + esc(e.role) + '</span></span>' +
      '<span></span><span class="links">' +
        '<a data-open="' + esc(e.id) + '" data-via="name" href="' + esc(e.url_name) + '">' + esc(e.name) + '</a>' +
        '<a data-open="' + esc(e.id) + '" data-via="ip" href="' + esc(e.url_ip) + '">127.0.0.1:' + esc(e.port) + '</a></span>' +
      '<span></span><span class="sum">' + esc(e.summary) + '</span></div></div>';
  }).join('');
  return '<section><h2>Served pages · tap to open in cloud-browser</h2>' + rows +
    '<div class="note">Names resolve through this app\'s private DNS (udp ' + esc(sv.dns.host) + ':' + esc(sv.dns.port) + '), only inside our apps.</div></section>';
}
function renderCfgTabs(current) {
  return '<div class="seg" role="tablist">' + [['about', 'About'], ['engines', 'Engines']].map(function (t) {
    return '<button role="tab" data-cfg="' + t[0] + '"' + (t[0] === current ? ' class="on" aria-selected="true"' : '') + '>' + t[1] + '</button>';
  }).join('') + '</div>';
}
// Configs > About: what the app serves, its ports, DNS names and versions.
function renderServing(sv, cfg) {
  var drive = sv.endpoints.filter(function (e) { return e.role === 'drive'; })[0];
  var diag = sv.endpoints.filter(function (e) { return e.role === 'diag'; })[0];
  var serves = [
    ['Emulated drive', drive ? drive.name + '  →  127.0.0.1:' + drive.port + '  ·  ' + (cfg.root || '') + ' and nothing else' : '—'],
    ['Fleet diagnostics', diag ? diag.name + '  →  127.0.0.1:' + diag.port + '  ·  the SuperApp\'s About, Logcat and Diagnose' : '—'],
    ['Reads', 'loopback only; any other peer is refused'],
    ['Methods', (cfg.methods || []).join(', ') + ' (+ the Engines switch and the browser opener, guarded)']
  ];
  var ports = sv.endpoints.map(function (e) {
    return [e.name, '127.0.0.1:' + e.port + '  ·  ' + e.role + (e.up === true ? '  ·  answering' : (e.up === false ? '  ·  not answering' : '')) + '  ·  ' + e.owner];
  });
  var dns = [
    ['Server', 'udp ' + sv.dns.host + ':' + sv.dns.port],
    ['Answers', sv.dns.answer + ' (TTL ' + sv.dns.ttl_s + ' s) for the four names above, nothing else'],
    ['Scope', sv.dns.scope],
    ['Browser', sv.opener]
  ];
  var versions = [
    ['App', sv.app + ' ' + sv.version_name + ' (code ' + sv.version_code + ')'],
    ['Server crate', sv.crate_version],
    ['Bridge', sv.bridge.authority]
  ].concat((sv.bundled || []).map(function (b) { return [b.name, b.version]; }))
   .concat([['Platform', (cfg.os || '') + ' / ' + (cfg.arch || '')]]);
  return renderSections([
    { title: 'What this app serves', rows: serves },
    { title: 'Ports and DNS names', rows: ports },
    { title: 'Private DNS', rows: dns },
    { title: 'Versions', rows: versions }
  ]);
}
// Configs > Engines: the registry, grouped, each row with its description and a switch where one makes sense.
function renderEngines(list) {
  var groups = [['render', 'Render engines'], ['feature', 'Feature engines'], ['core', 'Core (always on)'], ['not-portable', 'Not portable to the phone']];
  return groups.map(function (g) {
    var rows = list.filter(function (e) { return e.group === g[0]; });
    if (!rows.length) return '';
    var body = rows.map(function (e) {
      var sw = e.toggle
        ? '<button class="sw" role="switch" data-engine="' + esc(e.id) + '" aria-checked="' + (e.on ? 'true' : 'false') + '" aria-label="' + esc(e.name) + '"></button>'
        : '';
      return '<div class="eng"><div class="t"><div class="nm">' + esc(e.name) + '<span class="badge">' + esc(e.id) + '</span></div>' +
        '<div class="cv">' + esc(e.covers) + '</div><div class="sum">' + esc(e.summary) + '</div>' +
        (e.reason ? '<div class="why">Not portable: ' + esc(e.reason) + '</div>' : '') + '</div>' + sw + '</div>';
    }).join('');
    return '<section><h2>' + esc(g[1]) + ' (' + rows.length + ')</h2>' + body + '</section>';
  }).join('');
}
if (typeof module !== 'undefined') {
  module.exports = { renderServed: renderServed, renderCfgTabs: renderCfgTabs, renderServing: renderServing, renderEngines: renderEngines, esc: esc, tabsFrom: tabsFrom, tabFromPath: tabFromPath, defaultTab: defaultTab, renderNav: renderNav,
    renderRoutes: renderRoutes, renderSections: renderSections, renderAbout: renderAbout, aboutText: aboutText, renderConfig: renderConfig, renderListing: renderListing,
    renderResults: renderResults, renderFile: renderFile, fmtBytes: fmtBytes };
}
</script>

<script>
// GLUE: fetch, state, DOM. The only source of tabs, pages and API rows is
// /__api__/routes — nothing here lists a route or a tab by name.
(function () {
  var $main = document.getElementById('main');
  var $nav = document.getElementById('nav');
  var $sub = document.getElementById('sub');
  var ROUTES = [];
  var TABS = [];
  var files = { dir: '/', dot: false, q: '', mode: 'filename' };
  var ABOUT = [];
  var SERVING = null;
  var cfgPage = 'about';

  function j(url) {
    return fetch(url, { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error(r.status + ' ' + url);
      return r.json().then(function (body) { return { body: body, headers: r.headers }; });
    });
  }
  function fail(e) { $main.innerHTML = '<div class="err">' + esc(e && e.message ? e.message : e) + '</div>'; }

  var views = {
    pages: function () {
      return j('/__api__/serving').then(function (r) { SERVING = r.body; return renderServed(r.body) + renderRoutes(ROUTES, 'page'); });
    },
    api: function () { return Promise.resolve(renderRoutes(ROUTES, 'api')); },
    home: function () { return j('/__api__/about').then(function (r) { ABOUT = r.body; return renderAbout(ABOUT); }); },
    files: function () { return renderFiles(); },
    configs: function () { return renderConfigs(); }
  };

  function renderConfigs() {
    var head = renderCfgTabs(cfgPage);
    if (cfgPage === 'engines') {
      return j('/__api__/engines').then(function (r) { return head + renderEngines(r.body); });
    }
    return Promise.all([j('/__api__/serving'), j('/__api__/config')]).then(function (rs) {
      SERVING = rs[0].body;
      return head + renderServing(rs[0].body, rs[1].body) + renderConfig(rs[1].body);
    });
  }

  function toast(text, bad) {
    var t = document.createElement('div'); t.className = 'toast' + (bad ? ' bad' : ''); t.textContent = text;
    document.body.appendChild(t); setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 2600);
  }
  function post(url, body) {
    return fetch(url, { method: 'POST', headers: { 'content-type': 'application/json', 'x-c3-write': '1' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (b) { if (!r.ok) throw new Error((b && b.error) || (r.status + ' ' + url)); return b; }); });
  }

  function renderFiles() {
    var qs = '?path=' + encodeURIComponent(files.dir) + (files.dot ? '&dot=1' : '');
    var tool = '<div class="tool">' + renderCrumbs(files.dir) +
      '<label><input type="checkbox" id="dot"' + (files.dot ? ' checked' : '') + '> dotfiles</label></div>' +
      '<div class="tool"><input type="search" id="q" aria-label="search under ' + esc(files.dir) + '" title="search under ' + esc(files.dir) + '" value="' + esc(files.q) + '">' +
      '<select id="mode"><option value="filename">name</option><option value="folder">folder</option><option value="content">content</option></select></div>';
    if (files.q) {
      return j('/__api__/search' + qs + '&q=' + encodeURIComponent(files.q) + '&mode=' + files.mode).then(function (r) {
        return '<section>' + tool + renderResults(r.body, files.dir, r.headers.get('x-search-partial') === '1') + '</section>';
      });
    }
    return j('/__api__/ls' + qs).then(function (r) { return '<section>' + tool + renderListing(r.body, files.dir) + '</section>'; });
  }

  function show(tabId, push) {
    var tab = TABS.filter(function (t) { return t.id === tabId; })[0] || TABS.filter(function (t) { return t.id === defaultTab(TABS); })[0];
    if (!tab) { fail('the route table declares no tabs'); return; }
    var view = views[tab.id];
    if (!view) { fail('tab ' + tab.id + ' is declared by the server but this shell has no view for it'); return; }
    $nav.innerHTML = renderNav(TABS, tab.id);
    $sub.textContent = tab.label;
    $gear.className = tab.id === 'configs' ? 'on' : '';
    if (push) history.pushState(null, '', tab.path);
    view().then(function (html) { $main.innerHTML = html; wireFiles(); }).catch(fail);
  }

  function wireFiles() {
    var q = document.getElementById('q'); var mode = document.getElementById('mode'); var dot = document.getElementById('dot');
    if (mode) { mode.value = files.mode; mode.onchange = function () { files.mode = mode.value; if (files.q) show('files', false); }; }
    if (dot) dot.onchange = function () { files.dot = dot.checked; show('files', false); };
    if (q) q.onkeydown = function (ev) { if (ev.key === 'Enter') { files.q = q.value.trim(); show('files', false); } };
  }

  function copyText(text, button) {
    var done = function () { button.textContent = 'Copied'; };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { legacyCopy(text); done(); });
    } else { legacyCopy(text); done(); }
  }
  function legacyCopy(text) {
    var t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); } finally { document.body.removeChild(t); }
  }

  $main.addEventListener('click', function (ev) {
    var open = ev.target.closest('[data-open]');
    if (open) {
      ev.preventDefault();
      post('/__api__/open', { id: open.getAttribute('data-open'), via: open.getAttribute('data-via') })
        .then(function (b) { toast('Opening ' + b.url + ' in cloud-browser'); })
        .catch(function (e) { toast(e.message, true); });
      return;
    }
    var sw = ev.target.closest('[data-engine]');
    if (sw) {
      var want = sw.getAttribute('aria-checked') !== 'true';
      post('/__api__/engines', { id: sw.getAttribute('data-engine'), on: want })
        .then(function () { show('configs', false); })
        .catch(function (e) { toast(e.message, true); });
      return;
    }
    var cfg = ev.target.closest('[data-cfg]');
    if (cfg) { cfgPage = cfg.getAttribute('data-cfg'); try { history.replaceState(null, '', '#' + cfgPage); } catch (x) {} show('configs', false); return; }
    var jump = ev.target.closest('[data-jump]'); var copy = ev.target.closest('[data-copy-about]');
    if (jump) { var to = document.getElementById(jump.getAttribute('data-jump')); if (to) to.scrollIntoView(); ev.preventDefault(); return; }
    if (copy) { copyText(aboutText(ABOUT), copy); return; }
    var dir = ev.target.closest('[data-dir]'); var file = ev.target.closest('[data-file]');
    if (dir) { files.dir = dir.getAttribute('data-dir'); files.q = ''; show('files', false); ev.preventDefault(); }
    else if (file) {
      ev.preventDefault();
      j('/__api__/read?path=' + encodeURIComponent(file.getAttribute('data-file')))
        .then(function (r) { $main.innerHTML = renderFile(r.body) + $main.innerHTML; window.scrollTo(0, 0); }).catch(fail);
    }
  });
  $nav.addEventListener('click', function (ev) {
    var b = ev.target.closest('button[data-tab]');
    if (b) show(b.getAttribute('data-tab'), true);
  });
  var $gear = document.getElementById('gear');
  $gear.addEventListener('click', function () { show('configs', true); });
  if (location.hash === '#engines') cfgPage = 'engines';
  window.addEventListener('popstate', function () { show(tabFromPath(location.pathname) || defaultTab(TABS), false); });

  j('/__api__/routes').then(function (r) {
    ROUTES = r.body; TABS = tabsFrom(ROUTES);
    show(tabFromPath(location.pathname) || defaultTab(TABS), false);
  }).catch(function (e) {
    fail(e); setTimeout(function () { location.reload(); }, 1500);
  });
})();
</script>
</body>
</html>
