apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

def buildJson = new groovy.json.JsonSlurper().parse(file("${rootDir}/build.json"))
def a = buildJson.android
def srv = buildJson.server
def rt = buildJson.runtime

// versionCode: minutes since 2026-01-01 UTC over a 3,000,000 base, the same
// encoding as ac_c3-watchtower and the rest of the fleet, so it only ever moves
// forward whichever workflow built it. COMMS_BUILD_TIMESTAMP wins when CI sets it.
def codeFinal = { ->
    def base  = java.time.LocalDateTime.of(2026, 1, 1, 0, 0)
    def built = java.time.LocalDateTime.now(java.time.ZoneOffset.UTC)
    def stamp = System.getenv('COMMS_BUILD_TIMESTAMP')
    if (stamp) {
        try {
            built = java.time.LocalDateTime.parse(stamp,
                java.time.format.DateTimeFormatter.ofPattern('yyyyMMdd.HHmmss'))
        } catch (ignored) { }
    }
    long mins = java.time.Duration.between(base, built).toMinutes()
    return mins > 0 ? (int) (3000000L + mins) : 3000000
}()

// The variant's ABIs (CLOUDNAV_ABIS, exported by build.sh), else the default
// build.json::android.abi_filters. One server binary per ABI.
def serverJniDir = new File(buildDir, "generated/server-jni")

def selectedAbis = { ->
    def selected = System.getenv("CLOUDNAV_ABIS")
    return (selected?.trim()) ? selected.split(",").collect { it.trim() } : a.abi_filters
}

android {
    namespace 'com.diegonmarcos.cloudwebserver'
    compileSdk a.compile_sdk

    defaultConfig {
        // Launcher label = build.json::name, the application's one name (#351).
        resValue "string", "app_name", buildJson.name
        resConfigs "en"
        applicationId a.application_id
        minSdk        a.min_sdk
        targetSdk     a.target_sdk
        versionCode   codeFinal
        versionName   a.version_name
        ndk { abiFilters selectedAbis() as String[] }
        // Everything the app knows about its server comes from build.json.
        buildConfigField "String", "SERVER_JNI_NAME", "\"${srv.jni_name}\""
        buildConfigField "int",    "SERVER_PORT",     "${rt.port}"
        buildConfigField "String", "SERVE_ROOT",      "\"${rt.serve_root}\""
    }

    buildFeatures { buildConfig = true }

    // The server is EXEC'D from nativeLibraryDir, and only extracted libraries
    // are there: AGP's default keeps .so files compressed inside the APK and
    // mmaps them, extracting nothing, so without this the binary would be in
    // the APK and absent from the directory the app execs from.
    packaging { jniLibs { useLegacyPackaging = true } }

    sourceSets { main { jniLibs.srcDirs += serverJniDir } }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    lint {
        // targetSdk 28 is the storage model, see build.json::android._doc_target_sdk.
        disable.add('ExpiredTargetSdkVersion')
    }

    buildTypes {
        release { minifyEnabled false }
    }
}

// ---------------------------------------------------------------------------
// stageServer — land the Rust server as jniLibs/<abi>/<jni_name>.
//
// The binary is built by cargo (server/, the crate build.json::server names),
// per ABI, as a static musl executable: in CI by the ship workflow's `server`
// job on a runner of that architecture, locally by `build.sh server`. This task
// takes it from C3_WEBSERVER_BIN_DIR/<abi>/<bin_name> when CI hands one over,
// else from the crate's own target/<rust target>/release/, refuses a missing
// file and refuses a PT_INTERP (a dynamically linked binary would die ENOENT on
// bionic, naming the binary rather than the missing loader), and copies it
// under the lib*.so name that is the only shape the installer extracts.
// ---------------------------------------------------------------------------

boolean hasProgramInterpreter(File elf) {
    def raf = new RandomAccessFile(elf, 'r')
    try {
        def magic = new byte[4]; raf.readFully(magic)
        if (magic[0] != (byte) 0x7f || magic[1] != (byte) 'E' || magic[2] != (byte) 'L' || magic[3] != (byte) 'F')
            throw new GradleException("stageServer: " + elf + " is not an ELF file")
        def order = java.nio.ByteOrder.LITTLE_ENDIAN
        def header = new byte[64]; raf.seek(0); raf.readFully(header)
        def bb = java.nio.ByteBuffer.wrap(header).order(order)
        long phoff = bb.getLong(0x20); int phentsize = bb.getShort(0x36) & 0xffff; int phnum = bb.getShort(0x38) & 0xffff
        for (int i = 0; i < phnum; i++) {
            raf.seek(phoff + (long) i * phentsize)
            def ph = new byte[4]; raf.readFully(ph)
            int type = java.nio.ByteBuffer.wrap(ph).order(order).getInt(0)
            if (type == 3) return true   // PT_INTERP
        }
        return false
    } finally {
        raf.close()
    }
}

task stageServer() {
    outputs.dir serverJniDir
    outputs.upToDateWhen { false }
    doLast {
        def spec = new groovy.json.JsonSlurper().parse(file("${rootDir}/build.json")).server
        if (spec == null)
            throw new GradleException("build.json has no server block; this APK is nothing without it")
        def binDir = System.getenv("C3_WEBSERVER_BIN_DIR")
        for (abi in selectedAbis()) {
            def target = spec.targets[abi]
            if (target == null)
                throw new GradleException("build.json::server.targets has no Rust target for ABI " + abi)
            def src = binDir ? new File(binDir, abi + "/" + spec.bin_name)
                             : new File(rootDir, spec.crate_dir + "/target/" + target + "/release/" + spec.bin_name)
            if (!src.isFile())
                throw new GradleException("stageServer: " + src + " is missing. Build the server first:\n"
                        + "  cd " + spec.crate_dir + " && cargo build --release --target " + target + "\n"
                        + "or point C3_WEBSERVER_BIN_DIR at a directory holding <abi>/" + spec.bin_name)
            if (hasProgramInterpreter(src))
                throw new GradleException("stageServer: " + src + " carries a PT_INTERP — it is dynamically linked and will not run under bionic; build it for " + target)
            def out = new File(serverJniDir, abi + "/" + spec.jni_name)
            out.parentFile.mkdirs()
            java.nio.file.Files.copy(src.toPath(), out.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            out.setExecutable(true, false)
            logger.quiet("stageServer: " + abi + "/" + spec.jni_name + " <- " + src + " (" + out.length() + " B, static)")
        }
    }
}

preBuild.dependsOn stageServer
