[package]
name = "cloud-c3-webserver"
version = "0.2.0"
edition = "2021"
description = "The cloud-c3-webserver app: the c3-webserver library started in-process, and a Tauri webview opened on it. Rust plus the server's own web UI; the only Kotlin is the glue Tauri generates."

[lib]
# The name Tauri's generated activity loads (System.loadLibrary) and the one
# build.json::tauri.lib_name declares.
name = "cloud_c3_webserver_lib"
crate-type = ["cdylib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }
# Reads build.json::runtime once at build time; already in tauri-build's tree.
serde_json = "1"

[dependencies]
# No default features: compression, dynamic ACL, x11/dbus and the Windows
# controls are for desktop apps or for IPC this app never makes. wry is the
# webview.
tauri = { version = "=2.12.1", default-features = false, features = ["wry"] }
c3-webserver = { path = "../server" }

[target.'cfg(target_os = "android")'.dependencies]
# The same major tauri/wry link against: the storage-permission request is a
# JNI call on the activity Tauri hands over.
jni = "0.21"

[profile.release]
# The library is the APK: size, not speed, is what a phone downloads.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
