// libs:git-sync-engine — the GIT SYNC ENGINE (#871, engine-apk-split move 11): JGit and the verbs the git
// manager offers over it (status, stage, commit, push/pull, branches, log, diff, remotes, conflicts, clone),
// shipped only as Cloud-Lib-Git-Sync-Engine.apk. Cloud Drive compiles libs:git-sync (the contract half:
// the IGitSyncEngine wire, the GitEngine client, the models, the registry, the credential store, the
// auth-chain walker and the screen) and does not compile this module, so a JGit bump or a change to how a
// verb runs republishes this APK and no app. Do not add this module to an app's module map or ship watch
// list: the engine contract guard's K6 fails it.
//
// A REPOSITORY IN THE SHARED STORE (cld.termux's private home) IS NOT REACHABLE FROM HERE: this is another uid, so
// the caller runs those through cld.termux (CLOUD_EXEC). Trees in shared storage still work: the manifest declares MANAGE_EXTERNAL_STORAGE and the Store's "Grant missing" gives it, like every
// constellation-signed APK that declares it. The credentials are the caller's too: a token, or an ssh key and
// known_hosts text, travel in each request, live in this process for that one call (the ssh files in a private
// temp dir, deleted after) and are never kept or logged.
//
// An app with no engine installed loses nothing but the git verbs: each call answers an error the screen
// shows ("install it from Store"), never a crash.
plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.diegonmarcos.cloudlib.gitsync.engine'
    compileSdk 36

    defaultConfig {
        minSdk 26
        // The JGit this engine runs, so the engine can state it without opening a repository.
        buildConfigField 'String', 'JGIT_VERSION', '"7.8.0"'
        // #1358 the on-device proof (EngineSharedStorageTest): run by test-engine-grant-emulator.yml after an appops grant.
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures {
        buildConfig = true
    }

    testOptions {
        unitTests {
            all {
                testLogging {
                    events 'failed'
                    exceptionFormat 'full'
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    // CONSTELLATION_DATA (the signature permission guarding the service) is declared by core.
    implementation project(':libs:core')
    // The wire (IGitSyncEngine), the models and the wire codec this service answers in.
    implementation project(':libs:git-sync')
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'

    // THE ENGINE. JGit is the maintained pure-Java git (Eclipse), the same
    // engine the original Kotlin GitSync used before it moved to Flutter + git2.
    // Verified against the 7.8.0 sources jar on 2026-09-24: every command this
    // module calls (status/add/rm/reset/commit/push/pull/fetch/branchList/log/
    // diff/remote*/checkout stage) exists with the signature used. Its POM pulls
    // JavaEWAH, slf4j-api and commons-codec; nothing native, nothing Android
    // cannot load on minSdk 26 (java.nio.file, java.time, javax.net.ssl).
    implementation 'org.eclipse.jgit:org.eclipse.jgit:7.8.0.202609011348-r'
    // SSH transport over jsch. JGit's own ssh.jsch module declares the ORIGINAL
    // com.jcraft:jsch (0.1.55, unmaintained since 2018); it is excluded and the
    // maintained mwiede fork — same com.jcraft.jsch package, drop-in — is what
    // ships. That fork is what understands StrictHostKeyChecking=accept-new,
    // which JGitEngine.sshCallback relies on to record a host key on first
    // contact and refuse a changed one after.
    implementation('org.eclipse.jgit:org.eclipse.jgit.ssh.jsch:7.8.0.202609011348-r') {
        exclude group: 'com.jcraft', module: 'jsch'
    }
    implementation 'com.github.mwiede:jsch:2.28.7'
    // slf4j-api arrives through JGit; without a binding slf4j 2 prints one
    // "no providers" line and discards everything, which is the wanted outcome
    // on a phone. The nop binding makes that explicit instead of accidental.
    implementation 'org.slf4j:slf4j-nop:2.0.16'

    androidTestImplementation 'androidx.test:runner:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    testImplementation 'junit:junit:4.13.2'
    // The real org.json: android.jar's copy is a stub that throws on the JVM.
    testImplementation 'org.json:json:20240303'
}
