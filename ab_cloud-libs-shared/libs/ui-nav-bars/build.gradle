// libs:ui-nav-bars: THE shared navigation chrome of every app (#1189): the first row (breadcrumb title, AI / Profile / Configs), the second
// row (sub-page strips: one row, two rows, and the vertical left side menu with its semi-collapsed rail), the bottom nav, the
// three-state scroll machine's bars, and the Configs card that lets a user choose how each section's child pages are navigated.
// It replaces libs:ui-nav-bars, libs:ui-nav-bars and libs:ui-nav-bars (one lib, the Kotlin packages are
// unchanged: navbartop1, navbartop2, navbarbottom). The declaration it draws (NavDecl, the scroll machine, the mode store) stays in
// libs:bottomnav. Built like libs:bottomnav (same toolchain, same compose BOM) so it compiles under whichever AGP the consuming app
// uses. TESTED through the consumer: the unit task of an app that links it (cloud-mail's testReleaseUnitTest) runs src/test/ here.
plugins {
    id 'com.android.library'
}
apply from: 'fleet-configs.gradle'
if (project.extensions.findByName('kotlin') == null) {
    apply plugin: 'org.jetbrains.kotlin.android'
}
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace 'com.diegonmarcos.superapp.uinavbars'
    compileSdk 36

    defaultConfig {
        minSdk 26
        // Configs > General and Configs > About (FleetConfigs.kt): the CONSUMING app's build.json::configs_pages, resolved here
        // (fleet-configs.gradle) and baked as one base64 JSON. This module is compiled inside each app's own build, so the app is
        // whichever build.json sits at or above rootDir; nothing per app is written in Kotlin.
        buildConfigField 'String', 'FLEET_CONFIGS_B64', '"' + fleetConfigsB64() + '"'
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                testLogging {
                    events 'failed', 'standardOut'
                    exceptionFormat 'full'
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    api project(':libs:bottomnav')
    api project(':libs:ui-icons')
    api project(':libs:theme-background')
    // #1360 Configs ▸ General ▸ Perms is libs:perms' AppPermsSection; every app on this scaffold links libs:perms.
    implementation project(':libs:fleetconfig-model')   // BuiltFrom: the one reader of the release .source sidecar
    api project(':libs:perms')
    implementation platform('androidx.compose:compose-bom:2025.11.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.core:core-ktx:1.15.0'
    // FleetConfigsActivity: Configs > General / About for the apps drawn with Views or a WebView
    implementation 'androidx.activity:activity-compose:1.9.3'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.activity:activity-compose:1.9.3'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation platform('androidx.compose:compose-bom:2025.11.01')
    testImplementation 'androidx.compose.ui:ui-test-junit4'
}
