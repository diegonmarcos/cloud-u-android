// libs:auth — THE sign-in of the fleet, shared by reference (#587).
//
// Lifted out of aa_cloud-superapp's profile package (#573/#578/#585) so that cloud-superapp
// (Configs ▸ Profile ▸ Connect) and cloud-drive (Configs ▸ Sign in) offer the SAME four ways in —
// Authelia bearer, Authelia web-auth, GitHub device grant, Google device grant — from ONE
// declaration and ONE code path, the way libs:bottomnav is the one bottom nav. Nothing here is
// copied into an app: an app hosts SignInWays (Compose) and receives what the sign-in fetched.
//
// THE DECLARATION IS THE SHARED ONE, ALWAYS. This module reads ab_cloud-libs-shared/build.json::auth
// (../../build.json from here) and never the consuming app's build.json: two apps reading two
// files is two provider lists, which is exactly the drift #587 removes. The block is baked whole
// into this module's own BuildConfig, decoded once by AuthDeclaration.
//
// Deliberately sparse on the independent-version axis (text-tools / core / bottomnav precedent):
// it builds under whichever AGP the app that pulls it in uses.
//
// TESTED where it builds: src/test/ (JVM + Robolectric) runs as :libs:auth:test inside each
// consuming app's own unit phase (build.json::tests.unit) and in lib-apks.

plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    // SignInUi.kt is @Composable; the compose compiler is resolved from the consuming app's root
    // build (every consumer declares it `apply false` there, like libs:bottomnav's).
    id 'org.jetbrains.kotlin.plugin.compose'
}

def sharedJson = new groovy.json.JsonSlurper().parse(file("${projectDir}/../../build.json"))
def authDecl = sharedJson.auth
if (!(authDecl instanceof Map) || !(authDecl.sign_in?.providers instanceof List) || authDecl.sign_in.providers.isEmpty()) {
    throw new GradleException("ab_cloud-libs-shared/build.json::auth.sign_in.providers must declare the fleet's sign-in providers (#587)")
}
// `_doc*` keys are prose for the reader of the JSON, not data the phone needs.
def stripDocs
stripDocs = { obj ->
    if (obj instanceof Map) return obj.findAll { k, v -> !(k instanceof String && k.startsWith('_doc')) }.collectEntries { k, v -> [(k): stripDocs(v)] }
    if (obj instanceof List) return obj.collect { stripDocs(it) }
    return obj
}
def authTree = stripDocs(authDecl)

// Google's device-grant token exchange takes a client_secret (#611). Google itself
// documents it as NOT secret for a 'TV and Limited Input' client, but cloud-u-android
// is a PUBLIC repository so it is never committed to build.json (the google provider's
// client_secret stays ""). It is baked in here at build time from the PRIVATE vault —
// exactly how libs:media bakes its GIF-provider keys — with the env winning over the
// vault (GitHub-secret delivery), then the vault checkout ($VAULT_DIR, present in every
// ship build for the shared signing key), else empty. An empty secret still builds: the
// client_id is present, so the flow starts and only the token exchange fails.
def googleSecret = (System.getenv('GOOGLE_DEVICE_CLIENT_SECRET') ?: '').trim()
if (!googleSecret) {
    def vaultDir = System.getenv('VAULT_DIR')
    if (vaultDir) {
        def sf = file("${vaultDir}/A_A0-Providers/B_SERVICES-CLOUD/b15-google-oauth/device_client_secret")
        if (sf.exists()) googleSecret = sf.text.trim()
    }
}
if (googleSecret) {
    authTree.sign_in?.providers?.each { p -> if (p.id == 'google') p.client_secret = googleSecret }
}

// #684 THE GITHUB WEB CLIENT'S SECRET, on the SAME seam as Google's — but with the env name
// and the vault path DECLARED on the rung (web_client.secret_env / secret_vault_path) instead
// of typed here. The authorization-code exchange needs client_id + client_secret; the id is
// public and committed, the secret is never committed (public repository). Env wins (GitHub-
// secret delivery), then the vault checkout every ship build already has for the signing key,
// else it stays EMPTY — and an empty client is a DECLARED ABSENCE the Sync ▸ Git GitHub card
// renders as a disabled button with one line, never a dead button.
def ghRung = authTree.git_chain?.providers?.github
def ghWeb = ghRung?.web_client
if (ghWeb instanceof Map) {
    def secretEnv = (ghWeb.secret_env ?: '').toString()
    def ghSecret = secretEnv ? (System.getenv(secretEnv) ?: '').trim() : ''
    if (!ghSecret) {
        def vaultDir = System.getenv('VAULT_DIR')
        def rel = (ghWeb.secret_vault_path ?: '').toString()
        if (vaultDir && rel) {
            def sf = file("${vaultDir}/${rel}")
            if (sf.exists()) ghSecret = sf.text.trim()
        }
    }
    if (ghSecret) ghWeb.client_secret = ghSecret
    // The seam names are for the bake, not the phone.
    ghWeb.remove('secret_env'); ghWeb.remove('secret_vault_path')
}

// #684 THE BROWSER AUTH MISSION's package, resolved from the constellation fleet manifest —
// the SAME manifest cloud-drive resolves its terminal handoff against — so the browser's id
// is written down once, as a fleet id, and every {package} in the contract is substituted
// from that one answer. A fleet id the manifest lacks is a hard error: baking an intent aimed
// at no package is the silent no-op the mission exists to make impossible.
def mission = authTree.browser_mission
if (mission instanceof Map) {
    def fleetFile = file("${projectDir}/../../../aa_cloud-superapp/data/constellation-fleet.json")
    if (!fleetFile.exists()) {
        throw new GradleException("auth.browser_mission declares fleet '${mission.fleet}' but the constellation fleet manifest is missing at ${fleetFile}")
    }
    def fleetEntry = new groovy.json.JsonSlurper().parse(fleetFile).apps.find { it.id == mission.fleet }
    if (fleetEntry == null || !fleetEntry.package) {
        throw new GradleException("auth.browser_mission.fleet '${mission.fleet}' is not in the constellation fleet manifest (${fleetFile}) — the mission would be aimed at no package")
    }
    def pkg = fleetEntry.package.toString()
    def subst
    subst = { obj ->
        if (obj instanceof Map) return obj.collectEntries { k, v -> [(k): subst(v)] }
        if (obj instanceof List) return obj.collect { subst(it) }
        if (obj instanceof String) return obj.replace('{package}', pkg)
        return obj
    }
    mission = subst(mission)
    mission.package = pkg
    mission.remove('fleet')
    authTree.browser_mission = mission
}
def authB64 = groovy.json.JsonOutput.toJson(authTree).bytes.encodeBase64().toString()

android {
    namespace 'com.diegonmarcos.cloudlib.auth'
    compileSdk 36

    defaultConfig {
        minSdk 26
        buildConfigField "String", "AUTH_B64", "\"${authB64}\""
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                testLogging {
                    events 'failed', 'standardOut'
                    exceptionFormat 'full'
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    // ConfigSyncClient: the one HTTP client with the named-failure taxonomy every route shares.
    // `api` because a host receives ConfigSyncClient.Outcome through SignInHost.
    api project(':libs:core')

    implementation platform('androidx.compose:compose-bom:2025.01.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    // rememberLauncherForActivityResult: "Import token from file…" in the bearer dialog.
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'org.robolectric:robolectric:4.16.1'
}
