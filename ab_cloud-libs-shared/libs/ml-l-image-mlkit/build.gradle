// libs:ml-l-image-mlkit — the ONE shared image-scan ENGINE (task #459/#460), shipped
// only as Cloud-Lib-Ml-L-Image-Mlkit.apk since engine-apk-split move 6. ZXing decodes
// the barcodes and ML Kit text-recognition reads the pixels, inside this APK's process;
// Drive, Mail, Camera, Media Center and Office compile the CONTRACT half (libs:ml-l-image:
// the IImageScanEngine wire, the typed payload and the client) and hand this engine a file
// descriptor. So no app links ZXing, ML Kit or the native OCR pipeline, and an edit here
// republishes this APK alone. Do not add this module back to an app's module map: the
// engine contract guard's K6 fails it.
//
// ZXing was already a dependency of libs/wallet + the wallet + superapp APKs,
// so no new ML runtime enters the fleet for barcode decoding. ML Kit already
// ships in libs:ml-l-text-mlkit (translate + language-id) with its ProGuard
// rules and model-download path proven; text-recognition is the same family.
// ML Kit's OWN barcode-scanning API is deliberately NOT used: ZXing is already
// carried, and a second decoder for the same job is exactly the duplication
// this module exists to prevent.
plugins {
    id 'com.android.library'
    // `apply false`: resolve the plugin onto the classpath WITHOUT applying it.
    // The apply is conditional below, exactly like libs:analytics: this module
    // is consumed by AGP 8 apps (cloud-drive, lib-apks) where the Kotlin plugin
    // must be applied explicitly, AND BY media-center which is AGP 9 — where
    // Kotlin is built in and applying the plugin is a hard error. The `kotlin`
    // extension is what actually collides, so that is what gets tested.
    id 'org.jetbrains.kotlin.android' apply false
}

if (project.extensions.findByName('kotlin') == null) {
    apply plugin: 'org.jetbrains.kotlin.android'
}

// #798 the pinned full-label classifier object detection names boxes with, fetched and verified
// by the engines' one shared script (data/models.json; never committed).
apply from: '../ml-models.gradle'
def detectModel = models.detect
if (detectModel == null) throw new GradleException("libs:ml-l-image-mlkit: data/models.json declares no detect model")

android {
    namespace 'com.diegonmarcos.superapp.image.mlkit'
    compileSdk 36

    defaultConfig {
        minSdk 26
        consumerProguardFiles 'consumer-rules.pro'
        buildConfigField "String", "DETECT_MODEL_ASSET", "\"${detectModel.asset}\""
        buildConfigField "String", "DETECT_MODEL_NAME",  "\"${detectModel.name}\""
    }

    sourceSets {
        main { assets.srcDirs += modelAssetsDir }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // #772 the recognizer's suite decodes golden images through Robolectric's native graphics.
    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                // #798 the suite reads the real, verified classifier (its label list and size).
                systemProperty 'detect.model', new File(modelAssetsDir, detectModel.asset).path
                testLogging {
                    events 'failed'
                    exceptionFormat 'full'
                }
            }
        }
    }
}

// jvmTarget must match the Java 17 compileOptions above. Set via the top-level
// `kotlin` extension, NOT android.kotlinOptions: AGP 9 removed kotlinOptions
// from the android extension and this module is consumed by both AGP 8 and
// AGP 9 apps. The `kotlin` extension exists in both (added by the Kotlin
// plugin on AGP 8, by AGP itself on AGP 9), so one path covers both.
kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    // ZXing core — pure-Java QR/barcode decoder. RGBLuminanceSource +
    // MultiFormatReader decode a Bitmap with no camera pipeline and no native
    // code. Same pin as libs:wallet / superapp / wallet APKs.
    implementation 'com.google.zxing:core:3.5.3'

    // ML Kit text-recognition — on-device OCR. The DEFAULT options use the
    // unbundled Latin model (ES/EN/PT/DE in one artifact), downloaded lazily on
    // first OCR call exactly like mlkit-translate's models, so the model's tens
    // of MB never sit in the APK.
    implementation 'com.google.mlkit:text-recognition:16.0.1'

    // #772 image recognition's on-device route: ML Kit image labelling and object detection,
    // the BUNDLED models (in this APK, so the route works offline from the first run).
    implementation 'com.google.mlkit:image-labeling:17.0.9'
    implementation 'com.google.mlkit:object-detection:17.0.2'
    // #798 live identification: the same detector with a full-label classifier (data/models.json),
    // single-image and stream mode (tracking ids across a caller's frames).
    implementation 'com.google.mlkit:object-detection-custom:17.0.2'
    // #772 the OpenRouter route speaks the fleet's one Decisions client (Cloud Calc's Jev uses it too),
    implementation project(':libs:decisions')
    // and reads the fleet Account's OpenRouter token over the ITextTools binder (a contract lib).
    implementation project(':libs:text-tools')

    // CONSTELLATION_DATA (the signature permission guarding the service) is declared by core.
    implementation project(':libs:core')
    // The wire (IImageScanEngine) this service implements.
    implementation project(':libs:ml-l-image')

    // #772 the recognizer against golden images (Robolectric bitmaps) and a mock Decisions server.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.robolectric:robolectric:4.16.1'
}
