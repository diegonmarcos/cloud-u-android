// libs:decisions — THE fleet's client of OpenRouter's Decisions API (#772), shared BY REFERENCE:
// Cloud Calc's Jev section (#770, ac_cloud-calc/jev) and the image engine's OpenRouter route
// (libs:ml-l-image-mlkit) compile this one directory, so the protocol, its failure reasons and
// the token mask cannot drift between them. Plain JVM: no Android here, so its suite drives a
// real loopback HTTP server as the mock Decisions API and PIT mutation-tests it. It installs
// nothing (lib-apks build.json::lib_apks.exclude) and classifies as a contract — the thin client
// of a remote engine (1_cicd/src/data/lib-classes.json).
plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'info.solidsoft.pitest'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    // Android's own org.json at runtime; the real library for the JVM suite and PIT.
    compileOnly 'org.json:json:20240303'
    testImplementation 'org.json:json:20240303'
    testImplementation 'junit:junit:4.13.2'
}

pitest {
    pitestVersion = '1.22.1'
    targetClasses = ['com.diegonmarcos.superapp.decisions.*']
    excludedMethods = ['equals', 'hashCode', 'toString', 'copy', 'copy$default', 'component*']
    avoidCallsTo = ['kotlin.jvm.internal']
    threads = 2
    outputFormats = ['XML', 'HTML']
    timestampedReports = false
    mutationThreshold = 80
}

tasks.named('test') { finalizedBy 'pitest' }
