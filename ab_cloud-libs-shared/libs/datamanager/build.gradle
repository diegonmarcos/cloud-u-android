// libs:datamanager — the "data-manager" for per-app usage + network
// metrics. Pure DATA providers (no UI): AppUsageProvider reads
// UsageStatsManager (recency / active-window / launch-count) and
// AppNetworkProvider reads NetworkStatsManager (per-app bytes). Both
// gated on the PACKAGE_USAGE_STATS special-access already granted for the
// Battery & Usage screen. Sibling to libs:battery (the "battery-manager",
// which owns per-app energy via EnergyWatchdog.perAppEstimate). Consumed
// by app/apps (Phone smart folders + Suite/Phone Active Apps section).

plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    // 2026-10-16 owner decision: all apps must be Compose. DataUsageDialog is a ComposeView under CloudKitTheme;
    // the compiler is resolved from the consuming app's root build (declared `apply false` there).
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.diegonmarcos.superapp.datamanager'
    compileSdk 36
    defaultConfig {
        minSdk 26
        consumerProguardFiles 'consumer-rules.pro'
    }
    buildFeatures {
        buildConfig = true
        compose = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation project(':libs:core')
    api project(':libs:ui-kit')   // CloudKitTheme

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'   // DataUsageDialog
    // The dialog is a ComposeView; the BOM is the one every Compose module in the fleet resolves.
    implementation platform('androidx.compose:compose-bom:2025.11.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
}
