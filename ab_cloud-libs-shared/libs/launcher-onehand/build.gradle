plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

// ── One-Hand config ─────────────────────────────────────────────────
// Read build.json once at config time, base64-encode the `onehand`
// block, and expose it as BuildConfig.ONEHAND_CONFIG_B64. OneHandConfig
// decodes it once at runtime. Tuning the edge handle / gesture→action
// map is a build.json edit — no Kotlin change (Pillar: DATA-DRIVEN).
// Consumer-wins-with-fallback. This module is shared BY REFERENCE into other
// repos (ab_cloud-libs-shared/lib-apks ships it as its own APK), so it must read the CONSUMING
// app's build.json first - a module-relative path always resolves to superapp's
// and the consumer's config would be silently ignored. The `onehand` block is
// superapp-owned content that a wrapper repo has no reason to redeclare, so when
// the consumer does not define it we fall back to this module's home repo (same
// pattern as libs/voice).
def ohBuildJson = new groovy.json.JsonSlurper().parse(file("${rootDir}/build.json"))
if (ohBuildJson.onehand == null) ohBuildJson = new groovy.json.JsonSlurper().parse(file('../../build.json'))
def ohCfg       = ohBuildJson.onehand ?: [:]

// ── Sector label + icon, resolved ONCE from the app's own tile catalogue ──
// The edge menu draws every sector with a label AND an icon, and it had
// neither for `action:` sectors. The label was matched by RAW STRING against
// circular_menu.actions — a MENU, not the set of things a sector may point at
// — and the icon only ever came from PackageManager, which has nothing to give
// a target that names no package. A sector missing from that list rendered as
// its own title-cased URL with no glyph, which is how the first left sector
// read as "missing AI Claude" three times (#111, #127, and again today), and
// why Drive shows a label and no icon.
//
// Resolved here instead, at build time, against ui.sections — the SAME tile
// data the Cloud pages draw — and emitted as `action_catalogue`, which BOTH
// surfaces read (the accessibility overlay and the Configs picker). The
// declaration and the catalogue can no longer disagree, because the catalogue
// is DERIVED FROM the declaration rather than maintained beside it.
//
// `action:` is decoration, not identity: GestureAction.serialize() re-adds it,
// so it is stripped on both sides before comparing and `action:section:drive`
// and `section:drive` can never again be two different destinations.
def ohKey = { t -> 'action:' + (t ?: '').toString().replaceFirst(/^action:/, '') }

// target -> [label, icon] for every tile the app declares. `tiles_*` covers the
// per-page tile arrays; tile_groups is the themed variant the Cloud section
// uses, and it is where the AI Claude tile lives.
def ohTiles = [:]
ohBuildJson.ui?.sections?.each { sec ->
    def lists = []
    sec.each { k, v -> if (k.toString().startsWith('tiles_') && v instanceof List) lists << v }
    sec.tile_groups?.each { g -> if (g.tiles instanceof List) lists << g.tiles }
    lists.each { tl -> tl.each { t ->
        if (t instanceof Map && !t.separator && t.target && t.label) {
            ohTiles.putIfAbsent(ohKey(t.target), [label: t.label, icon: t.icon ?: ''])
        }
    } }
}
// `section:<id>` falls through to the SECTION itself. That is the only place
// Drive's glyph exists: Drive is the SuperApp's OWN section, so there is no
// installed application for the launcher to borrow an icon from.
def ohSections = [:]
ohBuildJson.ui?.sections?.each { s ->
    if (s.id) ohSections[s.id.toString()] = [label: s.label ?: s.id, icon: s.icon ?: '']
}
def ohResolve = { t ->
    def hit = ohTiles[ohKey(t)]
    if (hit != null) return hit
    def bare = (t ?: '').toString().replaceFirst(/^action:/, '')
    if (bare.startsWith('section:')) return ohSections[bare.substring('section:'.length())]
    return null
}

// Start from circular_menu.actions, keeping each entry's OWN label — the menu
// names its entries, the tile only lends its glyph — and give it the icon it
// never carried.
def ohCatalogue = []
def ohSeen = [] as Set
(ohCfg.circular_menu?.actions ?: []).each { a ->
    if (!a.target || !a.label) return
    if (!ohSeen.add(ohKey(a.target))) return
    ohCatalogue << [label: a.label, target: a.target, icon: a.icon ?: (ohResolve(a.target)?.icon ?: '')]
}
// Then every target the handles actually DECLARE, so a declared sector can
// never be absent from the list it is looked up in. An unresolvable one fails
// the BUILD here rather than rendering as a raw URL on the phone — that is the
// whole point: this defect shipped green three times.
ohCfg.handles?.each { h ->
    h.gestures?.each { slot, v ->
        def t = (v ?: '').toString()
        if (!t.startsWith('action:')) return
        if (!ohSeen.add(ohKey(t))) return
        def r = ohResolve(t)
        if (r == null) throw new GradleException(
            "onehand: handle '${h.id}' sector '${slot}' targets '${t}', which no tile in " +
            "ui.sections and no section id resolves. The edge menu would draw it as a raw " +
            "URL with no icon. Give it a tile, or fix the target — do not ship it unnamed.")
        ohCatalogue << [label: r.label, target: t, icon: r.icon ?: '']
    }
}
ohCfg.action_catalogue = ohCatalogue
def ohCfgB64    = groovy.json.JsonOutput.toJson(ohCfg).bytes.encodeBase64().toString()

android {
    namespace 'com.diegonmarcos.superapp.onehand'
    compileSdk 36
    defaultConfig {
        minSdk 26
        consumerProguardFiles 'consumer-rules.pro'
        buildConfigField "String", "ONEHAND_CONFIG_B64", "\"${ohCfgB64}\""
    }
    buildFeatures {
        buildConfig = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation project(':libs:core')
    // Centauri star's recent-apps arc-menu reads AppUsageProvider.recentUsed
    // (UsageStatsManager ranking) — same provider app/apps' RecentAppsFragment
    // and Phone Smart Folders already use. libs:datamanager has no deps beyond
    // core+ktx+appcompat, so this stays a clean one-directional edge in the
    // module graph (onehand -> datamanager -> core, no cycle).
    implementation project(':libs:datamanager')
    implementation 'androidx.core:core-ktx:1.13.1'

    // JVM unit test for the PURE SwipeClassifier (no Android deps).
    testImplementation 'junit:junit:4.13.2'
}
