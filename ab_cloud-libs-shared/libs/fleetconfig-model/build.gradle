// libs:fleetconfig-model — #825 the fleet configuration manifest (fleet-config.json) parsed into
// stores, classes and apps, and the migration policy over it (what an export carries, what an
// import writes or refuses). It used to be libs:core's FleetConfig, compiled into all 32 apps;
// only two things read it: the Cloud-Lib-Fleetconfig engine (which every app's provider asks over
// IPC) and the SuperApp (which plans and diffs the whole fleet). So an edit here rebuilds those
// two and nothing else. Pure over SharedPreferences + org.json: no component, no UI.
plugins {
    id 'com.android.library'
    // Conditional apply, the libs:core pattern: AGP 9 consumers register `kotlin` themselves.
    id 'org.jetbrains.kotlin.android' apply false
}

if (project.extensions.findByName('kotlin') == null) {
    apply plugin: 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.diegonmarcos.superapp.fleetconfig.model'
    compileSdk 36

    defaultConfig {
        minSdk 26
    }

    // #873 the setup contract's JVM suite (SetupProviderTest) runs a real provider under Robolectric.
    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                testLogging {
                    events 'passed', 'failed', 'skipped'
                    exceptionFormat 'full'
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    // #873 the default handler opens an app's EncryptedSharedPreferences through the app's own
    // cipher. compileOnly, the libs:core FleetConfig pattern: only an app that keeps an encrypted
    // store ships the cipher, and opening one in an app that does not is reported for that store alone.
    compileOnly 'androidx.security:security-crypto:1.1.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation 'androidx.security:security-crypto:1.1.0'
}
