// libs:disk-scan — the arithmetic of the Disk Management engine (#813), plain JVM so its suite
// runs without Android and PIT mutation-tests it: the walk of a tree into sized entries, the
// storage map by top-level folder, the huge-file threshold, duplicate detection (size, then a
// partial hash, then the full hash), the keep-one choice, and the clean plan whose dry run is
// the bytes the real run reclaims. Compiled by libs:disk only, which cloud-drive links; it
// installs nothing (lib-apks build.json::lib_apks.exclude). Classified in
// 1_cicd/src/data/lib-classes.json.
plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'info.solidsoft.pitest'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

pitest {
    pitestVersion = '1.22.1'
    targetClasses = ['com.diegonmarcos.cloudlib.diskscan.*']
    excludedMethods = ['equals', 'hashCode', 'toString', 'copy', 'copy$default', 'component*']
    avoidCallsTo = ['kotlin.jvm.internal']
    threads = 2
    outputFormats = ['XML', 'HTML']
    timestampedReports = false
    mutationThreshold = 80
}

tasks.named('test') { finalizedBy 'pitest' }
