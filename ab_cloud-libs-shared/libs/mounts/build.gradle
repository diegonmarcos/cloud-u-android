// libs:mounts — the mounts engine — ftp / sftp / ssh / webdav connections with browse-through, download, upload (push 4 lands the engine).
//
// ONE OF THE FOUR cloud-drive ENGINE LIBRARIES (#567). The owner's rule for that
// application: the main APK is chrome, every tooling is its own library, and the
// module boundary is law — this module imports NOTHING from any application
// (lib -> app is forbidden; ac_cloud-drive/test/test-drive-engine-modules.sh
// fails the build on the first such import). Compose only (#565): the screen
// this module exports is a @Composable, hosted by whichever app links it.
//
// Shared BY REFERENCE the way every module on this shelf is: cloud-drive names
// this directory in build.json::modules, and lib-apks discovers it and ships
// cloud-lib-mounts as its own installable APK (#474 naming, from the one
// declaration in aa_cloud-superapp/data/regen.sh).
//
// Deliberately sparse on the independent-version axis (bottomnav / text-tools
// precedent): it builds under whichever AGP the app that pulls it in uses —
// cloud-drive's 8.7.3 and lib-apks' 8.13.2 both. Compose BOM and versions match
// libs:bottomnav so the two compose against one toolchain inside one app.
//
// TESTED where it builds: src/test/ (JVM, no emulator) runs inside the consuming
// app's own `gradle test` (ac_cloud-drive/build.json::tests.unit is enabled), and
// that app's ship workflow watches this directory, so a change here re-runs it.

plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    // MountSpec is persisted as JSON by MountStore (kotlinx-serialization, like
    // libs:updater), so the JVM suite exercises the real (de)serialisation.
    id 'org.jetbrains.kotlin.plugin.serialization'
}

android {
    namespace 'com.diegonmarcos.cloudlib.mounts'
    compileSdk 36

    defaultConfig {
        minSdk 26
    }

    buildFeatures {
        compose = true
    }

    testOptions {
        unitTests {
            all {
                testLogging {
                    events 'failed'
                    exceptionFormat 'full'
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2025.01.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'
    // Compose's file picker for upload (rememberLauncherForActivityResult).
    implementation 'androidx.activity:activity-compose:1.9.3'

    // THE ENGINES — maintained Java libraries, never a shelled-out binary
    // (#567 brief: "ssh/sftp: prefer a maintained Java/Kotlin lib"):
    //  - sftp / ssh: sshj 0.41.1 (hierynomus), verified against its sources jar
    //    on 2026-09-24 — SSHClient.connect/authPassword/authPublickey/loadKeys/
    //    newSFTPClient/startSession, SFTPClient.ls/get/put/mkdirs/rm/rmdir/rename,
    //    HostKeyVerifier.verify + findExistingAlgorithms. Pulls bcprov/bcpkix
    //    (runtime), slf4j-api, asn-one.
    //  - ftp / ftps: commons-net 3.11.1 FTPClient / FTPSClient.
    //  - webdav: OkHttp 4.12.0 for the PROPFIND/MKCOL/MOVE verbs
    //    HttpURLConnection refuses; the multistatus is parsed with javax.xml,
    //    which Android ships.
    implementation 'com.hierynomus:sshj:0.41.1'
    implementation 'commons-net:commons-net:3.11.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.slf4j:slf4j-nop:2.0.16'
    // Passwords / passphrases at rest (MountCredentialStore), keystore-backed.
    implementation 'androidx.security:security-crypto:1.1.0'

    testImplementation 'junit:junit:4.13.2'
}
