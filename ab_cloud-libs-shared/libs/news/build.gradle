plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

// NewsEngine ships inside Cloud-Lib-News.apk and cannot see the app's
// BuildConfig, so the three config files are baked into THIS module. Paths are
// ac_cloud-news/data/*, and BOTH builds that consume this module have to be
// able to find it. That is what every previous attempt got wrong:
//
//   '../../data/*' relative to this module only worked while the module sat
//   under ac_cloud-news/libs/; after the consolidation it pointed at
//   ab_cloud-libs-shared/data/, which does not exist.
//
//   '${rootDir}/data/*' assumed rootDir is the CONSUMING app. It never is —
//   the app does not even link this module (see the news app's build.gradle),
//   it talks to NewsBackendService inside Cloud-Lib-News.apk, and that APK is
//   built by ab_cloud-libs-shared/lib-apks, whose rootDir has no data/ either.
//
// Both times b64Of's `f.exists()` turned the miss into '{}' with no error, so
// the shipped news APK carried no topics, no sources, no media and no events
// and the app fell back to its single synthetic gdelt-self source.
//
// Anchor on projectDir instead: this module's own location is the one thing
// that does not move, and ac_cloud-news is its sibling in the same repository.
// Keep ${rootDir}/data first so an app that DOES vendor the module still wins.
def b64Of = { String rel ->
    def candidates = [
        file("${rootDir}/data/${rel}"),
        file("${projectDir}/../../../ac_cloud-news/data/${rel}"),
    ]
    def f = candidates.find { it.exists() }
    // Fail, do not warn. A warning in a Gradle log is exactly how this shipped
    // empty twice without anyone noticing — the APK builds green and the app
    // just quietly has no sources and no media.
    if (f == null) throw new GradleException("libs:news: ${rel} not found at any of ${candidates} — refusing to bake an empty news engine")
    f.text.bytes.encodeBase64().toString()
}
def topicsB64  = b64Of('topics.json')
def sourcesB64 = b64Of('sources.json')
def mediaB64   = b64Of('media.json')
def eventsB64  = b64Of('events.json')

android {
    namespace 'com.diegonmarcos.superapp.news'
    compileSdk 36

    defaultConfig {
        buildConfigField "String", "TOPICS_B64",  "\"${topicsB64}\""
        buildConfigField "String", "SOURCES_B64", "\"${sourcesB64}\""
        buildConfigField "String", "MEDIA_B64",   "\"${mediaB64}\""
        buildConfigField "String", "EVENTS_B64",  "\"${eventsB64}\""
        minSdk 26
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    // api: NewsBackendService extends core's DataBackendService.
    api project(':libs:core')

    implementation 'androidx.core:core-ktx:1.13.1'
}
