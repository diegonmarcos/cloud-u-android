// libs:git-sync — the git manager's CONTRACT and its screen: the IGitSyncEngine wire, the GitEngine client
// (a thin face over the engine, the same verbs the screens were written against), the models, the
// repository registry, the credential store, the auth-chain walker and GitSyncScreen.
//
// #871 engine-apk-split move 11: JGIT AND THE PROCESS THAT RUNS IT ARE NOT HERE. The git verbs
// (status, stage/unstage, commit, push/pull, branches, log, diff, remotes, conflicts, clone) run in
// libs:git-sync-engine, shipped only as Cloud-Lib-Git-Sync-Engine.apk; this module is what Cloud Drive
// compiles, so a JGit bump or a change to how a verb runs republishes that one APK and no app. Same
// module name, so Drive's wiring did not change.
//
// ONE OF THE FOUR cloud-drive ENGINE LIBRARIES (#567). The owner's rule for that
// application: the main APK is chrome, every tooling is its own library, and the
// module boundary is law — this module imports NOTHING from any application
// (lib -> app is forbidden; ac_cloud-drive/test/test-drive-engine-modules.sh
// fails the build on the first such import). Compose only (#565): the screen
// this module exports is a @Composable, hosted by whichever app links it.
//
// Shared BY REFERENCE the way every module on this shelf is: cloud-drive names
// this directory in build.json::modules, and lib-apks discovers it and ships
// cloud-lib-git-sync as its own installable APK (#474 naming, from the one
// declaration in aa_cloud-superapp/data/regen.sh).
//
// Deliberately sparse on the independent-version axis (bottomnav / text-tools
// precedent): it builds under whichever AGP the app that pulls it in uses —
// cloud-drive's 8.7.3 and lib-apks' 8.13.2 both. Compose BOM and versions match
// libs:bottomnav so the two compose against one toolchain inside one app.
//
// TESTED where it builds: src/test/ (JVM, no emulator) runs inside the consuming
// app's own `gradle test` (ac_cloud-drive/build.json::tests.unit is enabled), and
// that app's ship workflow watches this directory, so a change here re-runs it.

plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    // ManagedRepo and the models are @Serializable (RepoRegistry persists ManagedRepo as JSON; the models
    // cross the binder to and from the engine); kotlinx-serialization, like libs:updater, so the JVM
    // tests exercise the real (de)serialisation rather than android.jar's org.json stubs.
    id 'org.jetbrains.kotlin.plugin.serialization'
}

// #871 THE ENGINE THIS CLIENT BINDS: engine-client.json beside this file, its package from the
// constellation fleet manifest. Anchored on this module's own (canonical) directory, the one thing
// that does not move: consumers link this directory from their own trees and the canonical path
// still leads back here.
def moduleDir   = projectDir.canonicalFile
def engineDecl  = new groovy.json.JsonSlurper().parse(new File(moduleDir, 'engine-client.json')).engines?.gitsync
if (engineDecl == null) throw new GradleException("libs:git-sync: engine-client.json::engines.gitsync is not declared")
def fleetFile   = new File(moduleDir, '../../../aa_cloud-superapp/data/constellation-fleet.json')
if (!fleetFile.isFile()) throw new GradleException("libs:git-sync: the fleet manifest is not at ${fleetFile}")
def engineFleet = new groovy.json.JsonSlurper().parse(fleetFile).apps.find { it.id == engineDecl.fleet }
if (engineFleet == null) {
    throw new GradleException(
        "libs:git-sync: engine-client.json::engines.gitsync.fleet '${engineDecl.fleet}' is not in ${fleetFile} — " +
        "every consumer would bind a package no Store row installs")
}
def gitsyncEnginePackage = engineFleet.package.toString()
def gitsyncAction        = engineDecl.action.toString().replace('{package}', gitsyncEnginePackage)
def gitsyncMinContract   = engineDecl.min_contract as int
if (gitsyncMinContract < 1) throw new GradleException("libs:git-sync: engines.gitsync.min_contract must be >= 1")

android {
    namespace 'com.diegonmarcos.cloudlib.gitsync'
    compileSdk 36

    defaultConfig {
        minSdk 26
        // #871 the git sync engine that runs JGit (Cloud-Lib-Git-Sync-Engine.apk).
        buildConfigField "String", "GITSYNC_ENGINE_PACKAGE",      "\"${gitsyncEnginePackage}\""
        buildConfigField "String", "GITSYNC_ENGINE_ACTION",       "\"${gitsyncAction}\""
        buildConfigField "int",    "GITSYNC_ENGINE_MIN_CONTRACT", "${gitsyncMinContract}"
        // Resolved in THIS library's manifest, so every consumer's merged manifest queries the
        // engine: on Android 11+ an unqueried package reads exactly like "not installed".
        manifestPlaceholders = [gitsyncEnginePackage: gitsyncEnginePackage]
    }

    buildFeatures {
        compose = true
        buildConfig = true
        aidl = true
    }

    testOptions {
        unitTests {
            all {
                testLogging {
                    events 'failed'
                    exceptionFormat 'full'
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2025.11.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'

    // Tokens and passphrases at rest (GitCredentialStore): keystore-backed,
    // the same dependency libs:mail / libs:chat / libs:ops already carry.
    implementation 'androidx.security:security-crypto:1.1.0'

    testImplementation 'junit:junit:4.13.2'
    // The real org.json: android.jar's copy is a stub that throws on the JVM.
    testImplementation 'org.json:json:20240303'
}
