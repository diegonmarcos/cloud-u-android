// SPDX-License-Identifier: Apache-2.0
//
// libs:browser — Cloud SuperApp's in-app web browser. WebView host
// + per-tab persistence + the tab strip Compose-free chrome. Was
// previously com.diegonmarcos.superapp.tabs in app/.../tabs/; lifted
// out following the libs:maps pattern so every "feature is an app
// engine" lives under libs/ — only thin dispatch stays in app/.
//
// Native deps: NONE. WebView is part of the Android framework so we
// don't ship a renderer. The host is still programmatic View code; #802's
// new surfaces (menu sheet, settings, find bar) are Compose via libs:ui-kit.
//
// Resources owned here:
//   • res/drawable/bg_gradient_black_purple.xml — the host chrome
//     background. Copied during the lift so libs:browser doesn't
//     reach back into app/'s R class.

plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.diegonmarcos.superapp.browser'
    compileSdk 36
    defaultConfig {
        minSdk 26
        consumerProguardFiles 'consumer-rules.pro'
    }
    buildFeatures {
        buildConfig = true
        // #802 the overflow sheet, settings page, find bar and panels are Compose (#773:
        // new UI is Compose), drawn over the Views host through libs:ui-kit's interop.
        compose = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation project(':libs:core')
    // #802 the fleet's Compose kit (theme, rows, switches) — the sheet and settings page draw with it.
    implementation project(':libs:ui-kit')
    // #802 "Translate page": the fleet's text-tools contract (a thin binder client; the
    // row is disabled with its reason when no app on the phone serves it).
    implementation project(':libs:text-tools')
    // #802 the autofill profile is an EncryptedSharedPreferences store (browser_autofill, class
    // secret) opened with the same MasterKey scheme FleetConfig imports it through. libs:core
    // only compileOnly-s the cipher, so the app that keeps the store ships it.
    implementation 'androidx.security:security-crypto:1.1.0'

    // WebAuthn in WebView (WebSettingsCompat.setWebAuthenticationSupport; feature WEB_AUTHENTICATION needs
    // androidx.webkit 1.12+ and a WebView that implements it). 1.14.0 = the fleet's pin.
    implementation 'androidx.webkit:webkit:1.14.0'

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.3'

    // Material — pulled in for the existing host's TextAppearance
    // refs (android.R.style.TextAppearance_Material_* are framework,
    // but the chrome rows want Material polish too). Matches app/'s
    // pin so version skew is impossible.
    implementation 'com.google.android.material:material:1.12.0'

    // RecyclerView — required by drag-to-reorder, not decoration.
    // ItemTouchHelper is Android's drag mechanism and it drives a
    // RecyclerView; the tab switcher used to be a GridLayout, which has
    // no position model to move cards around in. Declared explicitly
    // rather than leaned on transitively through material, so a material
    // bump cannot silently take the tab grid's drag away.
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
