// libs:appstore — the Constellation store: the fleet list, install/update
// actions and the background fleet pass.
//
// Split out of the app so the three functions the app used to blend are
// separable: libs:updater is the ENGINE (what installs), libs:appstore is the
// STORE (what you browse and act on), and the launcher is the launcher.
//
// This is UI - Fragments the host inflates - so unlike libs:net it cannot go
// out-of-process into its own APK. The win is an enforced boundary and
// independent shipping, not size. Being honest about that is the point: a
// store APK would still need the host to inflate its screens.

plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    // New store UI is Compose (the fleet ratchet): the progress row and the Search page.
    id 'org.jetbrains.kotlin.plugin.compose'
}

// The fleet manifest is baked HERE now rather than into the app: the store is
// what reads it, and a module that owns a screen should own that screen's
// data. Path is relative to this module, so it resolves to the same
// aa_cloud-superapp/data/constellation-fleet.json whether built by the app or
// shared by reference into ab_cloud-libs-shared/lib-apks.
// ${rootDir} = the CONSUMING app, so this is aa_cloud-superapp/data/ when the
// superapp builds it. It used to be '../../data/', module-relative, which
// resolved to aa_cloud-superapp/data/ only while this module lived under
// aa_cloud-superapp/libs/. After the consolidation it pointed at
// ab_cloud-libs-shared/data/, which does not exist — and the ternary below
// turned that into an EMPTY fleet with no error, so the Constellation page
// shipped with no apps and no libs at all. Hence the warning: a store with an
// empty catalogue must not be something you discover on the device.
//
// The warning was not enough. ab_cloud-libs-shared/lib-apks builds this module
// as its own library APK and its rootDir has no data/, so every one of those
// builds took the empty branch, logged one line into a Gradle log nobody reads
// and shipped a store with no catalogue. Fall back to the superapp sibling in
// the same repository, and fail outright when neither exists.
def constellationFleetFile = [
    file("${rootDir}/data/constellation-fleet.json"),
    file("${projectDir}/../../../aa_cloud-superapp/data/constellation-fleet.json"),
].find { it.exists() }
if (constellationFleetFile == null) throw new GradleException("libs:appstore: no constellation-fleet.json under ${rootDir}/data or aa_cloud-superapp/data — refusing to bake an empty fleet")
def constellationFleetB64  = constellationFleetFile.text.bytes.encodeBase64().toString()
// #878 who calls which lib (the Libs tab's two sections): data/lib-consumers.json, written by
// data/regen.sh beside the fleet file it sits next to. An absent file bakes empty and the tab
// draws no caller lines, so a build that lacks it still has its store.
def libConsumersFile = new File(constellationFleetFile.parentFile, "lib-consumers.json")
def libConsumersB64  = libConsumersFile.exists() ? libConsumersFile.text.bytes.encodeBase64().toString() : ""
// #ipc the fleet IPC registry (IpcMesh: Store > Access > IPC, SuperApp > Configs > Network > IPC):
// data/ipc-mesh.json, GENERATED by 1_cicd/src/scripts/cloud-android-ipc-mesh.py beside the fleet
// file. Absent bakes empty: the page then says it has no registry rather than failing the build.
def ipcMeshFile = new File(constellationFleetFile.parentFile, "ipc-mesh.json")
def ipcMeshB64  = ipcMeshFile.exists() ? ipcMeshFile.text.bytes.encodeBase64().toString() : ""
// Apps Mesh > Identity: each fleet app's Linux identity, declared in data/fleet-identity.json.
// Baked RESOLVED: the members are the IPC registry's, and each group's shared_user_id is read
// from the file+key that owns it (ac_cloud-termux/build.json::shared_store.shared_user_id), so
// the page and the manifests answer from one declaration. Absent files bake an empty roster.
def fleetIdentityB64 = {
    def idFile = new File(constellationFleetFile.parentFile, "fleet-identity.json")
    if (!idFile.exists() || !ipcMeshFile.exists()) return ""
    def slurp = new groovy.json.JsonSlurper()
    def decl = slurp.parse(idFile)
    def repoRoot = constellationFleetFile.parentFile.parentFile.parentFile
    def groups = (decl.groups ?: []).collect { g ->
        def ref = g.shared_user_id
        def value = null
        if (ref instanceof String) value = ref
        else if (ref?.from) {
            def src = new File(repoRoot, ref.from as String)
            if (src.exists()) {
                def cur = slurp.parse(src)
                for (k in (ref.key as String).split('\\.')) cur = (cur instanceof Map) ? cur[k] : null
                value = cur instanceof String ? cur : null
            }
        }
        // SharedUidMigration: `migration_plan` values may be {from, key} refs too (the backup paths
        // live in ac_cloud-termux/build.json::storage / ::shared_store.migration); baked resolved.
        def resolve = { v ->
            if (!(v instanceof Map) || !v.from) return v
            def src = new File(repoRoot, v.from as String)
            if (!src.exists()) return null
            def cur = slurp.parse(src)
            for (k in (v.key as String).split('\\.')) cur = (cur instanceof Map) ? cur[k] : null
            cur
        }
        def plan = (g.migration_plan instanceof Map) ? g.migration_plan.findAll { k, v -> !k.startsWith('_') }.collectEntries { k, v -> [(k): resolve(v)] } : null
        [id: g.id, label: g.label ?: g.id, shared_user_id: value, members: g.members ?: [], migration: g.migration, migration_plan: plan]
    }
    def members = (slurp.parse(ipcMeshFile).members ?: []).collect { m -> [id: m.id, pkg: m.pkg, label: m.label ?: m.id, dir: m.dir ?: ""] }
    groovy.json.JsonOutput.toJson([groups: groups, members: members]).bytes.encodeBase64().toString()
}()
// #866 The Store groups its shelves by the launcher's own taxonomy
// (ui.phone_folders / phone_sections / external_apps). The consuming app's
// build.json is the source when it declares the taxonomy (SuperApp); an app
// that does not (Cloud Store) reads the SuperApp's, so both stores draw the
// same shelves from ONE declaration.
def taxonomyFile = [
    file("${rootDir}/build.json"),
    file("${projectDir}/../../../aa_cloud-superapp/build.json"),
].find { it.exists() && new groovy.json.JsonSlurper().parse(it).ui?.phone_folders }
if (taxonomyFile == null) throw new GradleException("libs:appstore: no build.json with ui.phone_folders under ${rootDir} or aa_cloud-superapp — refusing to bake an empty taxonomy")
def taxonomyUi = new groovy.json.JsonSlurper().parse(taxonomyFile).ui
def taxB64 = { obj -> groovy.json.JsonOutput.toJson(obj ?: []).bytes.encodeBase64().toString() }
// bakeB64(): the ONE chunked bake (#654), owned by :libs:updater, which this module depends on.
apply from: '../updater/bake-b64.gradle'

android {
    namespace 'com.diegonmarcos.superapp.appstore'
    compileSdk 36

    defaultConfig {
        minSdk 26
        // javac caps ONE string constant at 65,535 UTF-8 bytes (JVMS 4.4.7, CONSTANT_Utf8).
        // The fleet manifest's base64 crossed that on 2026-09-24 — 68,072 bytes at 72
        // entries, once the four #567 engine libraries registered — and every consumer's
        // BuildConfig stopped compiling: "constant string too long". Baked as parts joined
        // at class-init time, which is NOT a constant expression and has no cap, so the
        // readers' one CONSTELLATION_FLEET_B64 String is unchanged and the manifest can
        // keep growing. The fleet-manifest guard fails any bake that goes back to one literal.
        buildConfigField "String", "CONSTELLATION_FLEET_B64", bakeB64(constellationFleetB64)
        buildConfigField "String", "LIB_CONSUMERS_B64",       bakeB64(libConsumersB64)
        buildConfigField "String", "IPC_MESH_B64",            bakeB64(ipcMeshB64)
        buildConfigField "String", "FLEET_IDENTITY_B64",      bakeB64(fleetIdentityB64)
        buildConfigField "String", "UI_PHONE_FOLDERS_B64",  bakeB64(taxB64(taxonomyUi.phone_folders))
        buildConfigField "String", "UI_PHONE_SECTIONS_B64", bakeB64(taxB64(taxonomyUi.phone_sections))
        buildConfigField "String", "UI_EXTERNAL_APPS_B64",  bakeB64(taxB64(taxonomyUi.external_apps))
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }

    // The play-anon rung's device profile, copied byte-for-byte from
    // AuroraOSS/gplayapi at the tag pinned in ../gplayapi/data/gplayapi-pin.json
    // (GPL-3.0-or-later; licence beside it). Data only — nothing is compiled.
    sourceSets {
        main {
            assets.srcDir "${projectDir}/../gplayapi/profiles"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2025.11.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation project(':libs:core')
    // The fleet's shared Compose kit: Store ▸ Phone ▸ Search draws its search field, state pills,
    // banners and empty state with it, the same parts every migrated fleet page uses.
    // api: the Store's fragments are KitComposeFragments, so a host that names one needs the kit's class.
    api project(':libs:ui-kit')
    // The store drives the updater; that direction is the whole separation.
    api project(':libs:updater')
    // Play Protect toggle + shell channel ladder on the store's header.
    implementation project(':libs:shizuku-adb-debug-tools')
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    // #866 the Store's own fleet-token entry (FleetBearer.Own), encrypted like libs:ops DaguPrefs.
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    // The theme attributes the fleet's View hosts resolve (and the APK detail sheet's ModalBottomSheet window).
    implementation 'com.google.android.material:material:1.12.0'
}
