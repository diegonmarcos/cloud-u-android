// SPDX-License-Identifier: Apache-2.0
//
// libs:wifi (#1263): the Wi-Fi analyzer as one shared lib, app-agnostic (a host injects WifiHostConfig; no host deps).
// The rules (ChannelMath, SecurityParser, OuiTable, ChannelRating, ApTracker, ScanThrottle, NetParsers, Pcap, Exporter: plain Kotlin,
// JVM-tested in the SuperApp) and the Android half (AndroidWifiSource: WifiManager scans, WifiRttManager ranging, ConnectivityManager
// link snapshot, NsdManager / SSDP / ping sweep discovery, ping, port scan, throughput) live here once, with the Compose page
// (WifiPanel: Scan, Channels, Link, Tools, Log). Vendors (assets/wifi/oui.tsv, the IEEE MA-L registry), channel plans per regulatory
// domain (assets/wifi/channel-plans.json) and thresholds / tool defaults (assets/wifi/wifi-config.json) are DATA. The SuperApp draws
// WifiPanel in Configs > Setup > Network > WiFi; Cloud Calc embeds the same panel. Runtime permissions are in this lib manifest.
plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    // The compiler is resolved from each consuming root build (declared `apply false` there).
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.diegonmarcos.superapp.wifi'
    compileSdk 36

    defaultConfig {
        minSdk 26
    }

    buildFeatures { compose = true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // The page icons come from the one catalog (the only lib dependency: the lib stays app-agnostic).
    implementation project(':libs:ui-icons')
    // #1274 the permission contract (PermsNeeds / PermsLink): the lib never asks for permissions itself.
    implementation project(':libs:core')
    implementation platform('androidx.compose:compose-bom:2025.11.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.core:core-ktx:1.13.1'
}
