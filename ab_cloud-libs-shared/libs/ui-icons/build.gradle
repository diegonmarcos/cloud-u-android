// libs:ui-icons: THE icon catalog of the fleet's navigation (#1160).
//
// One declarative table of icon NAMES to ImageVectors (UiIcons). Every nav-bar item of every app on the shared nav
// libs (libs:bottomnav, libs:nav-bar-bottom, libs:nav-bar-top-second-row) draws its glyph from here, so a name means
// the same glyph in every app and an app never reaches for a material icon in its nav declaration (the nav-icons guard,
// 1_cicd/src/scripts/cloud-android-nav-icons-guard.py, fails the build when one does). An entry is TINTED (the bar
// colours it, the default) or a BRAND icon (UiIcon.tinted = false: drawn in its own colours, e.g. the assistant's gradient).
//
// Deliberately sparse (text-tools / core precedent): it builds under whichever AGP the consuming app uses.
plugins {
    id 'com.android.library'
}
if (project.extensions.findByName('kotlin') == null) {
    apply plugin: 'org.jetbrains.kotlin.android'
}
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace 'com.diegonmarcos.superapp.uiicons'
    compileSdk 36

    defaultConfig {
        minSdk 26
    }

    buildFeatures {
        compose = true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                testLogging {
                    events 'failed', 'standardOut'
                    exceptionFormat 'full'
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2025.11.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.core:core-ktx:1.15.0'

    testImplementation 'junit:junit:4.13.2'
}
