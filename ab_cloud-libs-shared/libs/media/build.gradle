// libs:media — Sticker + GIF panel for the keyboard's emoji surface.
// Self-contained, lives OUTSIDE libs/keyboard/src/main — same layout as
// libs:translate / libs:voice.
//
// libs:keyboard depends on this module; EmojiPalettesView hosts MediaPanelView
// inside EmojiPalettesView and routes picks through the existing
// RichInputConnection.commitContent path. GIF search is data-driven
// (Tenor OR Giphy, chosen in build.json::keyboard_media; API keys via
// vault/sops → BuildConfig, pushed in at runtime by App → MediaRuntime).
// Stickers come from installed WhatsApp-compatible packs (content provider).

plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    // 2026-10-16 owner decision: all apps must be Compose. MediaPanelView is a Compose view under CloudKitTheme;
    // the compiler is resolved from each consuming root build (declared `apply false` there).
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.diegonmarcos.superapp.media'
    compileSdk 36
    defaultConfig {
        minSdk 26
        consumerProguardFiles 'consumer-rules.pro'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures {
        buildConfig false
        compose = true
    }
}

dependencies {
    api project(':libs:ui-kit')   // CloudKitTheme + the IME host MediaPanelView is built on
    // MediaPanelView is Compose; the BOM is the one every Compose module in the fleet resolves.
    implementation platform('androidx.compose:compose-bom:2025.11.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Image loading — Coil handles remote thumbnails AND animated GIF/WebP
    // frames (the reason we can't hand-roll it: minSdk 26 predates
    // ImageDecoder's animated support at 28). coil-gif adds the decoders.
    implementation 'io.coil-kt:coil:2.7.0'
    implementation 'io.coil-kt:coil-gif:2.7.0'
    // ponytail: GIF providers use HttpURLConnection + org.json (both in the
    // Android SDK) instead of pulling OkHttp/Retrofit for two GET calls.
}
