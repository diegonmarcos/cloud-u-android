// libs:translate — translate engine interface + Translator orchestrator.
// ML-Kit-free; the actual ML Kit implementation lives in libs:ml-l-text-mlkit
// so cloud-keyboard (standalone IME) can depend on libs:translate without
// bundling ML Kit (it binds the companion cloud-keyboard-libs service instead).
//
// libs:keyboard depends on this module; InputLogic's KeyCode.TRANSLATE
// handler calls Translator.translate(...).

plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    // 2026-10-16 owner decision: all apps must be Compose. TranslateBarView is a Compose view under CloudKitTheme;
    // the compiler is resolved from each consuming root build (declared `apply false` there).
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.diegonmarcos.superapp.translate'
    compileSdk 36
    defaultConfig {
        minSdk 26
        consumerProguardFiles 'consumer-rules.pro'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose = true }
}

dependencies {
    api project(':libs:ui-kit')   // CloudKitTheme + the IME host TranslateBarView is built on
    // TranslateBarView is Compose; the BOM is the one every Compose module in the fleet resolves.
    implementation platform('androidx.compose:compose-bom:2025.11.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.core:core-ktx:1.13.1'
}
