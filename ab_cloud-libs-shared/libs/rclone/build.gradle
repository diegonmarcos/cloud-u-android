// libs:rclone — the rclone CONTRACT and its screen: the IRcloneEngine wire, the RcloneRunner client
// (a thin face over the engine, with the rclone.conf and the job file kept HERE), remotes config,
// declared and ad-hoc sync/copy jobs with live progress, remote browsing.
//
// #871 engine-apk-split move 10: THE BINARY AND THE PROCESS THAT RUNS IT ARE NOT HERE. The pinned
// static rclone (data/rclone-binary.json, now in libs:rclone-engine) is exec'd by
// Cloud-Lib-Rclone-Engine.apk in its own uid; this module is what Cloud Drive compiles, so a change
// to the binary pin or to how rclone is run republishes that one APK and no app. Same module name,
// so no consumer wiring changed.
//
// ONE OF THE FOUR cloud-drive ENGINE LIBRARIES (#567). The owner's rule for that
// application: the main APK is chrome, every tooling is its own library, and the
// module boundary is law — this module imports NOTHING from any application
// (lib -> app is forbidden; ac_cloud-drive/test/test-drive-engine-modules.sh
// fails the build on the first such import). Compose only (#565): the screen
// this module exports is a @Composable, hosted by whichever app links it.
//
// Shared BY REFERENCE the way every module on this shelf is: cloud-drive names
// this directory in build.json::modules, and lib-apks discovers it and ships
// cloud-lib-rclone as its own installable APK (#474 naming, from the one
// declaration in aa_cloud-superapp/data/regen.sh).
//
// TESTED where it builds: src/test/ (JVM, no emulator) runs inside the consuming
// app's own `gradle test` (ac_cloud-drive/build.json::tests.unit is enabled), and
// that app's ship workflow watches this directory, so a change here re-runs it.

plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

// #871 THE ENGINE THIS CLIENT BINDS: engine-client.json beside this file, its package from the
// constellation fleet manifest. Anchored on this module's own (canonical) directory, the one thing
// that does not move: consumers link this directory from their own trees and the canonical path
// still leads back here.
def moduleDir   = projectDir.canonicalFile
def engineDecl  = new groovy.json.JsonSlurper().parse(new File(moduleDir, 'engine-client.json')).engines?.rclone
if (engineDecl == null) throw new GradleException("libs:rclone: engine-client.json::engines.rclone is not declared")
def fleetFile   = new File(moduleDir, '../../../aa_cloud-superapp/data/constellation-fleet.json')
if (!fleetFile.isFile()) throw new GradleException("libs:rclone: the fleet manifest is not at ${fleetFile}")
def engineFleet = new groovy.json.JsonSlurper().parse(fleetFile).apps.find { it.id == engineDecl.fleet }
if (engineFleet == null) {
    throw new GradleException(
        "libs:rclone: engine-client.json::engines.rclone.fleet '${engineDecl.fleet}' is not in ${fleetFile} — " +
        "every consumer would bind a package no Store row installs")
}
def rcloneEnginePackage = engineFleet.package.toString()
def rcloneAction        = engineDecl.action.toString().replace('{package}', rcloneEnginePackage)
def rcloneMinContract   = engineDecl.min_contract as int
if (rcloneMinContract < 1) throw new GradleException("libs:rclone: engines.rclone.min_contract must be >= 1")

android {
    namespace 'com.diegonmarcos.cloudlib.rclone'
    compileSdk 36

    defaultConfig {
        minSdk 26
        // #871 the rclone engine that execs the binary (Cloud-Lib-Rclone-Engine.apk).
        buildConfigField "String", "RCLONE_ENGINE_PACKAGE",      "\"${rcloneEnginePackage}\""
        buildConfigField "String", "RCLONE_ENGINE_ACTION",       "\"${rcloneAction}\""
        buildConfigField "int",    "RCLONE_ENGINE_MIN_CONTRACT", "${rcloneMinContract}"
        // Resolved in THIS library's manifest, so every consumer's merged manifest queries the
        // engine: on Android 11+ an unqueried package reads exactly like "not installed".
        manifestPlaceholders = [rcloneEnginePackage: rcloneEnginePackage]
    }

    buildFeatures {
        compose = true
        buildConfig = true
        aidl = true
    }

    testOptions {
        unitTests {
            all {
                testLogging {
                    events 'failed'
                    exceptionFormat 'full'
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2025.11.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'

    testImplementation 'junit:junit:4.13.2'
    // The real org.json: android.jar's copy is a stub that throws on the JVM.
    testImplementation 'org.json:json:20240303'
}
