plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

// Inject build.json::ui.sections[c3].pages[dagu].dagu_default_server
// into BuildConfig so the Dagu login form pre-fills the server URL
// without any caller passing it in. Data-driven — change the default
// in build.json, get a rebuilt BuildConfig.DAGU_DEFAULT_SERVER on the
// next gradle run. Same pattern libs/mail uses for JMAP_DEFAULT_SERVER
// and libs/chat for MATTERMOST_DEFAULT_SERVER.
// Consumer-wins-with-fallback. This module is shared BY REFERENCE into other
// repos (ab_cloud-libs-shared/lib-apks ships it as its own APK), so it must read the CONSUMING
// app's build.json first - a module-relative path always resolves to superapp's
// and the consumer's config would be silently ignored. The `ui` block is
// superapp-owned content that a wrapper repo has no reason to redeclare, so when
// the consumer does not define it we fall back to this module's home repo (same
// pattern as libs/voice).
def buildJson = new groovy.json.JsonSlurper().parse(file("${rootDir}/build.json"))
if (buildJson.ui == null) buildJson = new groovy.json.JsonSlurper().parse(file('../../build.json'))
// cloud-c3 carries the block as ui.carried_c3 (its ui.sections are its own nav, #868).
def c3Section = buildJson.ui.sections?.find { it.id == 'c3' } ?: buildJson.ui.carried_c3
def daguPage = c3Section?.pages?.find { it.id == 'dagu' }
def daguServer = daguPage?.dagu_default_server ?: ''

// #871 THE ENGINE THIS CLIENT BINDS: engine-client.json beside this file, its package from the
// constellation fleet manifest. Anchored on this module's own (canonical) directory, the one thing
// that does not move: consumers link this directory from their own trees and the canonical path
// still leads back here.
def moduleDir   = projectDir.canonicalFile
def engineDecl  = new groovy.json.JsonSlurper().parse(new File(moduleDir, 'engine-client.json')).engines?.ops
if (engineDecl == null) throw new GradleException("libs:ops: engine-client.json::engines.ops is not declared")
def fleetFile   = new File(moduleDir, '../../../aa_cloud-superapp/data/constellation-fleet.json')
if (!fleetFile.isFile()) throw new GradleException("libs:ops: the fleet manifest is not at ${fleetFile}")
def engineFleet = new groovy.json.JsonSlurper().parse(fleetFile).apps.find { it.id == engineDecl.fleet }
if (engineFleet == null) {
    throw new GradleException(
        "libs:ops: engine-client.json::engines.ops.fleet '${engineDecl.fleet}' is not in ${fleetFile} — " +
        "every consumer would bind a package no Store row installs")
}
def opsEnginePackage = engineFleet.package.toString()
def opsAction        = engineDecl.action.toString().replace('{package}', opsEnginePackage)
def opsMinContract   = engineDecl.min_contract as int
if (opsMinContract < 1) throw new GradleException("libs:ops: engines.ops.min_contract must be >= 1")

android {
    namespace 'com.diegonmarcos.superapp.ops'
    compileSdk 36

    defaultConfig {
        minSdk 26
        consumerProguardFiles 'consumer-rules.pro'
        buildConfigField "String", "DAGU_DEFAULT_SERVER", "\"${daguServer}\""
        // #871 the ops engine that makes the HTTPS calls to Dagu (Cloud-Lib-Ops-Engine.apk).
        buildConfigField "String", "OPS_ENGINE_PACKAGE",      "\"${opsEnginePackage}\""
        buildConfigField "String", "OPS_ENGINE_ACTION",       "\"${opsAction}\""
        buildConfigField "int",    "OPS_ENGINE_MIN_CONTRACT", "${opsMinContract}"
        // Resolved in THIS library's manifest, so every consumer's merged manifest queries the
        // engine: on Android 11+ an unqueried package reads exactly like "not installed".
        manifestPlaceholders = [opsEnginePackage: opsEnginePackage]
    }
    buildFeatures {
        buildConfig = true
        aidl = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation project(':libs:core')
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'
    // EncryptedSharedPreferences for bearer-token storage — same dep
    // libs/chat uses for MattermostPrefs.
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
}
