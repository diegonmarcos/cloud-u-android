plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
    // 2026-10-16 owner decision: all apps must be Compose. The mail pages are KitComposeFragments under
    // CloudKitTheme; the compiler is resolved from the consuming app's root build (declared `apply false` there).
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Inject build.json::ui.sections[mail].jmap_default_server into BuildConfig
// so the login screen can pre-fill the discovery URL without any caller
// passing it in. Data-driven — change the default in build.json, get a
// rebuilt BuildConfig.JMAP_DEFAULT_SERVER on the next gradle run.
// Consumer-wins-with-fallback. This module is shared BY REFERENCE into other
// repos (ab_cloud-libs-shared/lib-apks ships it as its own APK), so it must read the CONSUMING
// app's build.json first - a module-relative path always resolves to superapp's
// and the consumer's config would be silently ignored. The `ui` block is
// superapp-owned content that a wrapper repo has no reason to redeclare, so when
// the consumer does not define it we fall back to this module's home repo (same
// pattern as libs/voice).
def buildJson = new groovy.json.JsonSlurper().parse(file("${rootDir}/build.json"))
if (buildJson.ui == null) buildJson = new groovy.json.JsonSlurper().parse(file('../../build.json'))
def mailSection = buildJson.ui.sections.find { it.id == 'mail' }
def jmapDefault = mailSection?.jmap_default_server ?: ''

android {
    namespace 'com.diegonmarcos.superapp.mail'
    compileSdk 36
    defaultConfig {
        minSdk 26
        consumerProguardFiles 'consumer-rules.pro'
        buildConfigField "String", "JMAP_DEFAULT_SERVER", "\"${jmapDefault}\""
    }
    buildFeatures {
        buildConfig = true
        compose = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation project(':libs:core')
    api project(':libs:ui-kit')   // CloudKitTheme, KitComposeFragment
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'
    // The pages are composables; the BOM is the one every Compose module in the fleet resolves.
    implementation platform('androidx.compose:compose-bom:2025.11.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
}
