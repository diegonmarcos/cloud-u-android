plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

// CalEngine ships inside Cloud-Lib-Cal.apk and cannot see the app's
// BuildConfig, so the subscription list is baked into THIS module.
//
// AN ENGINE, NOT A LIBRARY AN APP COMPILES: lib-apks (Cloud-Lib-Cal.apk) is
// the only build that compiles this module. Cloud Agenda and Cloud Me bind
// CalBackendService over core's IDataBackend, so a change here republishes
// Cloud-Lib-Cal.apk and no app. Do not add it back to an app's
// build.json::modules (a0_docs/eng-specs/engine-apk-split.md, move 3).
//
// ${rootDir} is the CONSUMING build, not one fixed app — and
// ab_cloud-libs-shared/lib-apks, which builds Cloud-Lib-Cal.apk, has no
// data/ at all and never had one. The old
// ternary turned that miss into '{}' with no message whatsoever, so the
// standalone calendar library shipped with zero subscriptions and nothing
// anywhere said so. Same defect as libs:news had (see that module's comment).
//
// Fall back to this module's sibling in the same repository, and FAIL rather
// than warn: an empty calendar engine must not be something you discover on
// the device.
def calendarsFile = [
    file("${rootDir}/data/calendars.json"),
    file("${projectDir}/../../../ac_cloud-agenda/data/calendars.json"),
].find { it.exists() }
if (calendarsFile == null) throw new GradleException("libs:cal: no calendars.json under ${rootDir}/data or ac_cloud-agenda/data — refusing to bake an empty calendar engine")
def calendarsB64  = calendarsFile.text.bytes.encodeBase64().toString()

android {
    namespace 'com.diegonmarcos.superapp.cal'
    compileSdk 36

    defaultConfig {
        buildConfigField "String", "CALENDARS_B64", "\"${calendarsB64}\""
        minSdk 26
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    // api: CalBackendService extends core's DataBackendService.
    api project(':libs:core')
    api project(':libs:databackend')   // #825 the engine wire (DataBackendService), no longer in core

    implementation 'androidx.core:core-ktx:1.13.1'
}
