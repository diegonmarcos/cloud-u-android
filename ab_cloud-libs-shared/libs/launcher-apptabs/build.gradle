// libs:launcher-apptabs — "App Tabs" feature. Last-6 opened SuperApp
// sections / pages / external apps card grid. Sister module to
// libs:browser; same 2-col GRID UI shape, different content model
// (SectionEntry | PageEntry | ExternalAppEntry instead of URL tabs).
// Lives in its own libs/ module so the next App-Tabs UX iteration
// doesn't touch app/'s shell wiring.

plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    // 2026-10-16 owner decision: all apps must be Compose. AppTabsFragment is a ComposeView under CloudKitTheme;
    // the compiler is resolved from each consuming root build (declared `apply false` there).
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.diegonmarcos.superapp.apptabs'
    compileSdk 36
    defaultConfig {
        minSdk 26
        consumerProguardFiles 'consumer-rules.pro'
    }
    buildFeatures {
        buildConfig = true
        compose = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    // AppTabsFragment is a ComposeView; the BOM is the one every Compose module in the fleet resolves.
    implementation platform('androidx.compose:compose-bom:2025.11.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation project(':libs:core')
    api project(':libs:ui-kit')   // CloudKitTheme

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'

    // JVM unit test for the PURE pickRecentTabs filter (no Android deps) —
    // the Recent Tabs star's list, covered by RecentTabsTest.kt.
    testImplementation 'junit:junit:4.13.2'
}
