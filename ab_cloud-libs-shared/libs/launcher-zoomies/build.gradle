plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    // 2026-10-16 owner decision: all apps must be Compose. PetStrengthView is a Compose view over the decoded
    // GIF; the compiler is resolved from each consuming root build (declared `apply false` there).
    id 'org.jetbrains.kotlin.plugin.compose'
}

// ── Zoomies pets ────────────────────────────────────────────────────
// The animated status-bar companion (PetStrengthView) + its vendored GIF
// assets (assets/zoomies/<animal>/<variant>_<gait>.gif, CC BY-ND). Pure
// view module: no build.json config, no inter-lib deps — just Compose UI.
android {
    namespace 'com.diegonmarcos.superapp.zoomies'
    compileSdk 36
    defaultConfig {
        minSdk 26
        consumerProguardFiles 'consumer-rules.pro'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose = true }
}

dependencies {
    // The BOM is the one every Compose module in the fleet resolves, so app and library compose together.
    implementation platform('androidx.compose:compose-bom:2025.11.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
}
