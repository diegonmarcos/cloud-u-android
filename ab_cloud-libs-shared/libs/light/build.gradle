// SPDX-License-Identifier: Apache-2.0
//
// libs:light: the Light tool (#1155) as one shared lib. The rules (LightModel.kt, plain Kotlin), the Android half
// (real torch, clock, preferences, the Off-action foreground service) and the Compose page (LightPanel) live here once;
// the SuperApp's LightActivity and Cloud Calc's Toolkit > Light page both draw LightPanel over the one Light engine.
// The foreground service and its permissions are declared in this lib's manifest, so a host merges them in.
plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    // The compiler is resolved from each consuming root build (declared `apply false` there).
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.diegonmarcos.superapp.light'
    compileSdk 36

    defaultConfig {
        minSdk 26
    }

    buildFeatures { compose = true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2025.11.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.core:core-ktx:1.13.1'
}
