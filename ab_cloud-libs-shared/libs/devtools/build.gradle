apply plugin: 'com.android.library'
// Conditional: AGP 9 consumers self-register the 'kotlin' extension and
// hard-error on a second apply ("Cannot add extension with name 'kotlin'");
// AGP 8 consumers still need it. Same pattern as libs/analytics/build.gradle.
if (project.extensions.findByName('kotlin') == null) {
    apply plugin: 'org.jetbrains.kotlin.android'
}

// rootDir, NOT '../../': this module is shared by reference (projectDir) into
// every constellation app, so it must read the CONSUMING app's build.json.
// A module-relative path would resolve to superapp's build.json and every app
// would ship superapp's log stream — cloud-nav's diagnostics would land in the
// cloud-superapp stream and be indistinguishable from superapp's own.
// Walk UP from rootDir, exactly as libs:analytics does: a React Native app's
// gradle root is android/ and a Tauri app's is src-tauri/gen/android, while
// build.json stays at the app root. "${rootDir}/build.json" failed their
// configuration outright, which kept both out of the fleet mesh (#743).
// Six levels, not analytics' four: Cloud Notes' Capacitor root is
// packages/frontend/apps/android/App, five below its build.json. The first
// hit wins, so every app that found it at rootDir still finds the same file.
def buildJsonFile = { ->
    def d = rootDir
    for (int i = 0; i < 6 && d != null; i++) {
        def f = new File(d, "build.json")
        if (f.exists()) return f
        d = d.parentFile
    }
    throw new GradleException("libs:devtools: no build.json found at or above ${rootDir}")
}()
def buildJson = new groovy.json.JsonSlurper().parse(buildJsonFile)

// Data-driven from build.json::diagnostics; empty url = cloud push disabled.
// These used to be baked by each app's app/build.gradle, which is why every
// app also needed its own copy of DiagnosticsPush. The BuildConfig moves here
// with the code that reads it, so an app gets both or neither.
def logSinkUrl    = (buildJson.diagnostics?.log_sink_url    ?: '')
def logSinkStream = (buildJson.diagnostics?.log_sink_stream ?: 'cloud-app')
// Where the install-failure diagnose screen POSTs. {app} is substituted at
// send time with the fleet app id. Empty = the Send button is hidden and the
// report can still be copied or saved, which is the right degradation for a
// phone with no network rather than a dead button.
def diagReportUrl = (buildJson.diagnostics?.report_url ?: '')
// The full destination list (id/label/url) the Diagnose screen offers, one
// button each. base64 like every other blob so it survives buildConfigField
// quoting. An app that declares none gets [] and no Send buttons — Copy and
// Save still work, which is the right degradation for a phone with no network.
def diagTargetsB64 = groovy.json.JsonOutput.toJson(buildJson.diagnostics?.report_targets ?: [])
        .bytes.encodeBase64().toString()

// #792 every package's fixed debug-API port, from the ONE table beside this
// file (projectDir, not rootDir: it is the fleet's table, not the consuming
// app's). A duplicate or out-of-range port fails the build here, because two
// members baked onto one number is the exhaustion bug again in another shape.
def debugPorts = new groovy.json.JsonSlurper().parse(new File(projectDir, 'debug-ports.json'))
def (portFirst, portLast) = debugPorts.range
def portTable = debugPorts.ports.findAll { !it.key.startsWith('_') }
def portOwner = [:]
portTable.each { pkg, p ->
    if (p < portFirst || p > portLast) throw new GradleException("libs:devtools: debug-ports.json gives ${pkg} port ${p}, outside ${portFirst}..${portLast}")
    if (portOwner.containsKey(p)) throw new GradleException("libs:devtools: debug-ports.json gives port ${p} to both ${portOwner[p]} and ${pkg}")
    portOwner[p] = pkg
}
def portTableStr = portTable.collect { pkg, p -> "${pkg}=${p}" }.join(',')

android {
    namespace 'com.diegonmarcos.superapp.devtools'
    compileSdk 36

    defaultConfig {
        minSdk 26
        buildConfigField "String", "LOG_SINK_URL",    "\"${logSinkUrl}\""
        buildConfigField "String", "LOG_SINK_STREAM", "\"${logSinkStream}\""
        buildConfigField "String", "DIAG_REPORT_URL", "\"${diagReportUrl}\""
        buildConfigField "String", "DIAG_TARGETS_B64", "\"${diagTargetsB64}\""
        buildConfigField "int", "DEBUG_PORT_FIRST", "${portFirst}"
        buildConfigField "int", "DEBUG_PORT_LAST", "${portLast}"
        buildConfigField "String", "DEBUG_PORTS", "\"${portTableStr}\""
    }

    buildFeatures { buildConfig = true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// jvmTarget via the top-level `kotlin` extension, NOT android.kotlinOptions:
// AGP 9 removed kotlinOptions from the android extension and this module is
// consumed by both AGP 8 and AGP 9 apps. Same pattern as libs/analytics.
kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}


dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'

    // This module ships two JUnit test classes and declared nothing to compile
    // them against, so :libs:devtools:compileReleaseUnitTestKotlin failed on
    // "Unresolved reference 'junit'" in every consumer that runs the unit test
    // task — which nobody noticed until a consumer actually ran one. Same
    // version the six sibling libs already pin.
    testImplementation 'junit:junit:4.13.2'
}
