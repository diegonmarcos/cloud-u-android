// libs:perms (#1274): the permission contract. The host app's Permissions page is the ONE place that asks for,
// checks and opens the settings of any permission; feature libs (wifi, bluetooth, nfc, mounts, ...) declare their needs
// in assets/perms-catalogue.json `features`, read PermsNeeds.missing and deep-link with PermsLink.open. The only UI it
// renders is PermsActivity: the Permissions page of an app with no PermsHost page of its own (permissions are per package).
// Out of libs:core on purpose: core is the mesh lib every fleet app compiles under a line budget, and only the apps
// that host a Permissions page or a feature lib need this.
plugins {
    id 'com.android.library'
    // PermsActivity is Compose; the compiler is resolved from each consuming root build (declared `apply false` there).
    id 'org.jetbrains.kotlin.plugin.compose'
}
if (project.extensions.findByName('kotlin') == null) {
    apply plugin: 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.diegonmarcos.superapp.perms'
    compileSdk 36

    defaultConfig {
        minSdk 26
    }

    buildFeatures { compose = true }

    // PermsViewTest is plain JVM; the Android stubs answer defaults instead of throwing if a rule ever touches one.
    testOptions { unitTests.returnDefaultValues = true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation platform('androidx.compose:compose-bom:2025.11.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.9.3'
    // #1372 PermsViewTest: the Perms UI's view rules (grouping, chips, progress, folded groups, the walk), plain JVM.
    testImplementation 'junit:junit:4.13.2'
}
