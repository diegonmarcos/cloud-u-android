// Root build file — plugin declarations only. Module configs live per-module.
// Versions MUST match toolchain block in build.json (single source of truth).
plugins {
    id 'com.android.application'                    version '8.13.2' apply false
    id 'com.android.library'                        version '8.13.2' apply false
    id 'org.jetbrains.kotlin.android'               version '2.3.20' apply false
    id 'org.jetbrains.kotlin.plugin.serialization'  version '2.3.20' apply false
    id 'org.jetbrains.kotlin.plugin.compose'        version '2.3.20' apply false
    // #772 libs:decisions is plain JVM Kotlin, mutation-tested by PIT; the image engine compiles it.
    id 'org.jetbrains.kotlin.jvm'                   version '2.3.20' apply false
    id 'info.solidsoft.pitest'                      version '1.19.0' apply false
}
