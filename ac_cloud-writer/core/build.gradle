// :core — Cloud Writer's pure logic (#800) as a plain-JVM module: the Model/on-device routing and
// its fallback, the OpenRouter wire (translation and speech-to-text over libs:decisions' Http), the
// utterance segmenter and WAV container for Listen, dictation spacing and translation layout, the
// Markdown editor tools (outline, find, wrap, prefix, heading, live spans) and the document store.
// No Android here, so the suite runs on the JVM and PIT mutates it, as ac_cloud-calc's :measure.
// The microphone, the binders, the screens and the preferences are app/.
plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'info.solidsoft.pitest'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    // `api`: OpenRouter's signatures take libs:decisions' Http, so the app sees the type.
    api project(':libs:decisions')
    // Android's own org.json at runtime; the real library for the JVM suite and PIT.
    compileOnly 'org.json:json:20240303'
    testImplementation 'org.json:json:20240303'
    testImplementation 'junit:junit:4.13.2'
}

pitest {
    pitestVersion = '1.22.1'
    targetClasses = ['com.diegonmarcos.cloudwriter.core.*']
    excludedMethods = ['equals', 'hashCode', 'toString', 'copy', 'copy$default', 'component*']
    avoidCallsTo = ['kotlin.jvm.internal']
    threads = 2
    outputFormats = ['XML', 'HTML']
    timestampedReports = false
    mutationThreshold = 80
}

tasks.named('test') { finalizedBy 'pitest' }
