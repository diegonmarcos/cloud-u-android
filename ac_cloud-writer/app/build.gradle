apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
// THE COMPOSE COMPILER. Pinned to the Kotlin version in the root build.gradle,
// because since Kotlin 2.0 it ships with Kotlin rather than as a separately
// versioned artifact with a compatibility table to keep in step.
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

def buildJson = new groovy.json.JsonSlurper().parse(file("${rootDir}/build.json"))
def a = buildJson.android

// build.json::writer_ai — THIS APP'S OWN registry, read at run time by
// com.diegonmarcos.cloudwriter.WriterRegistry.
//
// Baked as BASE64, exactly as libs/keyboard bakes keyboard_ai and cloud-mail
// bakes mail_ai, and for the same reason: the prompts carry quotes, commas and
// newlines that a plain buildConfigField string does not survive.
//
// It FAILS THE BUILD rather than defaulting when the block is missing. A
// registry that silently resolved to empty would produce an app whose tool
// menu draws nothing and whose failure looks like a broken binder rather than
// a missing file.
def writerAi = buildJson.writer_ai
if (writerAi == null) {
    throw new GradleException(
        "build.json::writer_ai is missing. It is cloud-writer's own copy of the text-tool " +
        "registry (providers, models, Enhance prompts, Resume prompts, languages) and this app " +
        "reads no other. Restore it from git rather than pointing this build at keyboard_ai or " +
        "mail_ai - sharing one registry between two apps is exactly what made a second app's " +
        "Text settings uneditable (task 209).")
}
def writerAiB64 = groovy.json.JsonOutput.toJson(writerAi).bytes.encodeBase64().toString()

// versionCode MUST move on every build, or nothing lands.
//
// Same encoding as ac_c3-morpheus, ac_c3-watchdog, ac_cloud-mail and lib-apks,
// and for the same reason: minutes since 2026-01-01 UTC over a 3,000,000 base.
// A build counter (GITHUB_RUN_NUMBER) is per-WORKFLOW, so the moment an app is
// built by a different workflow than the one that produced the installed APK
// the number handed out can be SMALLER and Android refuses the update outright.
// Wall clock only moves forward and is identical for every workflow, runner and
// trigger. COMMS_BUILD_TIMESTAMP is honoured when CI provides one so the code
// matches the release tag; otherwise build time.
def codeFinal = { ->
    def base  = java.time.LocalDateTime.of(2026, 1, 1, 0, 0)
    def built = java.time.LocalDateTime.now(java.time.ZoneOffset.UTC)
    def stamp = System.getenv('COMMS_BUILD_TIMESTAMP')
    if (stamp) {
        try {
            built = java.time.LocalDateTime.parse(stamp,
                java.time.format.DateTimeFormatter.ofPattern('yyyyMMdd.HHmmss'))
        } catch (ignored) { }
    }
    long mins = java.time.Duration.between(base, built).toMinutes()
    return mins > 0 ? (int) (3000000L + mins) : 3000000
}()

android {
    namespace 'com.diegonmarcos.cloudwriter'
    compileSdk a.compile_sdk

    defaultConfig {
        // FLEET RULE (#299): English is the fleet's base language. Unlisted locales are
        // dropped from resources.arsc, so a Spanish phone resolves the English
        // in values/ instead of any values-es this module or a library ships.
        resConfigs "en"
        applicationId a.application_id
        minSdk        a.min_sdk
        targetSdk     a.target_sdk
        versionCode   codeFinal
        versionName   a.version_name
        ndk { abiFilters a.abi_filters as String[] }

        buildConfigField "String", "WRITER_AI_ROUTING_B64", "\"${writerAiB64}\""
    }

    buildFeatures { buildConfig = true; compose = true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    // THE ONLY CONSTELLATION LINK, and it is a boundary rather than an engine:
    // the ITextTools AIDL, TextToolsClient and the addresses. The engines, the
    // routing preferences and the provider API key stay in the serving app's
    // process; only text crosses the binder. Shared BY REFERENCE from
    // ab_cloud-libs-shared (build.json::modules."libs:text-tools".dir), so this
    // app links the same copy cloud-mail and cloud-keyboard link.
    implementation project(':libs:text-tools')

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'

    // JETPACK COMPOSE + MATERIAL 3, the same stack and the same BOM
    // ac_cloud-mail resolves. cloud-writer drew every screen by hand out of
    // LinearLayout and addView with a hardcoded four-colour palette and no
    // theme, which is what an app inherits when its screens are copied from an
    // IME: cloud-keyboard cannot use a layout file or an app theme, and
    // cloud-writer is not an IME and never had that constraint.
    //
    // A BOM rather than per-artifact versions, so ui, material3 and tooling
    // cannot be bumped independently into a combination nobody has built. The
    // version is build.json::toolchain.compose_bom and the toolchain tester
    // fails the build if the two disagree.
    implementation platform('androidx.compose:compose-bom:2025.01.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    // The per-feature icons on the home screen's four cards. The core set does
    // not carry Translate or Spellcheck, and a feature card without its icon is
    // the row of bare buttons this change exists to replace.
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.3'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
