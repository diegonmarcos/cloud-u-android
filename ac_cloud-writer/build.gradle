// Root build.gradle — plugin versions only. Per-module config lives in each
// module's own build.gradle. Versions mirrored in build.json::toolchain.
//
// com.android.library is applied by the shared :libs:text-tools module, so its
// version must be declared here even though no module in this directory uses it.
plugins {
    id 'com.android.application' version '8.7.3' apply false
    id 'com.android.library'     version '8.7.3' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
}
