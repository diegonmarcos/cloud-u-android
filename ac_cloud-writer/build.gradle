// Root build.gradle — plugin versions only. Per-module config lives in each
// module's own build.gradle.
//
// com.android.library is applied by the shared :libs:text-tools module, so its
// version must be declared here even though no module in this directory uses it.
//
// THESE VERSIONS ARE RESTATED FROM build.json::toolchain, NOT INVENTED HERE.
// Gradle's plugins{} block accepts string literals only — a variable is a
// configuration error — so the numbers cannot be interpolated out of the JSON
// the way settings.gradle interpolates the module list. What closes the gap is
// test-cloud-writer-toolchain-matches-build-json.sh, which reads both and fails
// the build when they disagree. A "mirror" nothing compares is a copy, and a
// copy is what lets a toolchain bump land in the JSON and never reach the build.
//
// org.jetbrains.kotlin.plugin.compose IS THE COMPOSE COMPILER, and it is pinned
// to the Kotlin version rather than to one of its own. Before Kotlin 2.0 the
// compiler was a separate artifact with its own version and a compatibility
// table to keep in step; from 2.0 it ships with Kotlin, at Kotlin's version.
// That is why one number here pins both and they cannot drift into a
// combination that does not exist.
plugins {
    id 'com.android.application'             version '8.7.3' apply false
    id 'com.android.library'                 version '8.7.3' apply false
    id 'org.jetbrains.kotlin.android'        version '2.1.0' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.1.0' apply false
}
