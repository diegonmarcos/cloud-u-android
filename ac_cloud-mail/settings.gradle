dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "cloud-mail"

// Data-driven from build.json::modules (FIRE RULE #6: never hardcode lists).
// Upstream keeps the include list as literals here; we cannot, because the same
// graph also drives the ship workflow's path triggers and the publish gate's
// source hash (cloud-android-ship-repo-workflow-engine.sh reads build.json::
// modules). A literal list here would be a second copy of the graph that
// neither of those two can see, and a module added to only one of them either
// fails to build or ships without ever triggering a build.
def buildJson = new groovy.json.JsonSlurper().parse(file('build.json'))
buildJson.modules.each { name, spec ->
    if (name.startsWith('_')) return  // skip _doc keys
    include ":${name}"
    // Gradle path :core:jmap -> core/jmap, unless the module declares an
    // explicit `dir` (how a module is shared BY REFERENCE from one canonical
    // directory instead of copy-pasted per app).
    project(":${name}").projectDir = file(spec?.dir ?: name.replace(':', '/'))
}
