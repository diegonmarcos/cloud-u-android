# Performance + AndroidX. Mirrors aa_cloud-superapp / ea_cloud-comms.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# OFF: bakeWebserver (app/build.gradle) reads build.json and runs resolve_runtime.py
# at execution time, the #348 bakeBootstrap shape, which the configuration cache
# refuses to serialise.
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
kotlin.incremental=true
