// code path; the manifest cannot read JSON, so the <uses-permission> and <queries> lines take
// the SAME answer the shared bake takes — the fleet id resolved against the SAME constellation
// manifest — as placeholders. A retyped package here would be the second copy this resolution
// exists to avoid. A declared fleet id the manifest lacks is a hard error, as for the terminal.
def authMissionPackage = ''
def authMissionPermission = ''
def sharedAuthFile = new File(rootDir, '../ab_cloud-libs-shared/build.json')
def sharedMission = sharedAuthFile.exists() ? new groovy.json.JsonSlurper().parse(sharedAuthFile).auth?.browser_mission : null
