// Stack scan — baked into BuildConfig for the About page.
def repoRoot = rootDir
def stackExtMap = [
    "kt": "Kotlin", "java": "Java", "xml": "XML (resources/manifest)",
    "json": "JSON (config)", "gradle": "Gradle (Groovy)", "kts": "Gradle (Kotlin DSL)",
    "sh": "Shell", "md": "Markdown", "nix": "Nix", "pro": "ProGuard",
]
def stackSkipDirs = ["build", ".gradle", ".idea", "dist", ".result"]
def stackStats = [:]
[new File(repoRoot, "app/src/main"), new File(repoRoot, "libs"),
 new File(repoRoot, "build.json"),   new File(repoRoot, "build.sh"),
 new File(repoRoot, "flake.nix"),    rootDir].each { root ->
    if (!root.exists()) return
    if (root.isFile()) {
        def ext = root.name.tokenize(".").last().toLowerCase()
        def label = stackExtMap[ext]
        if (label != null) {
            def loc = 0; try { loc = root.readLines("UTF-8").size() } catch (Throwable t) {}
            def b = stackStats[label] ?: [files: 0, loc: 0]; b.files += 1; b.loc += loc; stackStats[label] = b
        }
        return
    }
    root.eachFileRecurse { f ->
        if (!f.isFile()) return
        def rel = f.absolutePath.replace(rootDir.absolutePath + "/", "")
        if (stackSkipDirs.any { rel.startsWith(it) || rel.contains("/${it}/") }) return
        def ext = f.name.tokenize(".").last().toLowerCase()
        def label = stackExtMap[ext]; if (label == null) return
        def loc = 0; try { loc = f.readLines("UTF-8").size() } catch (Throwable t) { return }
        def b = stackStats[label] ?: [files: 0, loc: 0]; b.files += 1; b.loc += loc; stackStats[label] = b
    }
}
def stackLanguagesB64 = b64(stackStats)
def stackDeps = new TreeSet()
def depPattern = ~/\b(implementation|api|compileOnly|runtimeOnly)\s*[\(\s]\s*['"]([^'":]+:[^'":]+:[^'"]+)['"]/
[rootDir, new File(repoRoot, "libs")].findAll { it.exists() }.each { root ->
    root.eachFileRecurse { f ->
        if (!f.isFile() || !(f.name.endsWith(".gradle") || f.name.endsWith(".gradle.kts"))) return
        def text = ""; try { text = f.text } catch (Throwable t) { return }
        depPattern.matcher(text).each { m -> stackDeps.add(m[2]) }
    }
}
// The PDF engine's coordinates come from build.json, not a literal, so the scan above cannot see them.
pdfEngineCoordinates.each { stackDeps.add(it) }
def stackFrameworksB64 = b64(stackDeps.toList())
def stackTreeB64 = "—".bytes.encodeBase64().toString()

def buildHistorySecs = []
try {
    def ghOut = providers.exec {
        commandLine 'gh', 'run', 'list',
            '--workflow=ship-cloud-drive.yml',
            '--limit', '10', '--status', 'success',
            '--json', 'startedAt,updatedAt'
        ignoreExitValue = true
    }.standardOutput.asText.get().trim()
    if (ghOut.startsWith('[')) {
        new groovy.json.JsonSlurper().parseText(ghOut).each { r ->
            try {
                def s = java.time.Instant.parse(r.startedAt).epochSecond
                def e = java.time.Instant.parse(r.updatedAt).epochSecond
                if (e > s) buildHistorySecs << (e - s)
            } catch (Throwable t) {}
        }
    }
} catch (Throwable t) {}
def buildAvgSecs    = buildHistorySecs.isEmpty() ? -1L : (buildHistorySecs.sum() / buildHistorySecs.size()).longValue()
def buildLastSecs   = buildHistorySecs.isEmpty() ? -1L : (buildHistorySecs[0] as long)
def buildSampleSize = buildHistorySecs.size()

android {
    namespace 'com.diegonmarcos.clouddrive'
    compileSdk 36

    defaultConfig {
        // Launcher label = build.json::name, the application's one name (#351).
        // Never a strings.xml literal: that copy said "Cloud Browser" while
        // the fleet, the store and every roster said cloud-browser.
        resValue "string", "app_name", buildJson.name
        applicationId 'com.diegonmarcos.clouddrive'
        minSdk 26
        targetSdk 35
        // English is the fleet's base language, and the packaging step is the only
        // place that can enforce it: this also drops the locales arriving from the
        // libraries this app merges (:libs:analytics, :libs:core, :libs:updater).
        resConfigs "en"
        versionCode codeFinal
        versionName "${buildJson.android.version_name} (sha-${shortSha})"
        // #642 the manifest's <uses-permission> for the terminal's RUN_COMMAND cannot read
        // build.json, and a retyped package literal there would be the second copy this whole
        // resolution exists to avoid — so it interpolates the SAME answer the UI declaration got.
        manifestPlaceholders = [terminalPackage: terminalPackage,
                                authMissionPackage: authMissionPackage,
                                authMissionPermission: authMissionPermission,
                                ghEnginePackage: ghEnginePackage]
        ndk {
            def abiOverride = System.getenv('CLOUDDRIVE_ABIS')
            def abis = (abiOverride?.trim()) \
                ? abiOverride.split(',').collect { it.trim() }.findAll { it } \
                : (buildJson.android.abi_filters ?: ['arm64-v8a'])
            abiFilters.addAll(abis as List)
        }
        buildConfigField "String", "GIT_SHORT_SHA",   "\"${shortSha}\""
        buildConfigField "String", "GIT_SHA",         "\"${fullSha}\""
        buildConfigField "String", "BUILD_TIMESTAMP", "\"${buildTimestamp}\""
        buildConfigField "String", "LOG_SINK_URL",    "\"${logSinkUrl}\""
        buildConfigField "String", "LOG_SINK_STREAM", "\"${logSinkStream}\""
        buildConfigField "String", "DEBUG_LOG_DIR",   "\"${debugLogDir}\""
        buildConfigField "String", "CONNECTIONS_B64", "\"${connectionsB64}\""
        buildConfigField "String", "MIRROR_JOBS_B64", "\"${mirrorJobsB64}\""
        buildConfigField "String", "RCLONE_REMOTES_B64", "\"${rcloneRemotesB64}\""
        buildConfigField "String", "RCLONE_JOBS_B64",    "\"${rcloneJobsB64}\""
        buildConfigField "String", "GIT_REPOS_B64",      "\"${gitReposB64}\""
        buildConfigField "boolean", "SEED_ENABLED",       "${seedEnabled}"
        buildConfigField "int",     "SEED_DEPTH",         "${seedDepth}"
        buildConfigField "String",  "SHARED_ROOT",               "\"${sharedRoot}\""
        buildConfigField "String",  "GIT_SUBDIR",                "\"${gitSubdir}\""
        buildConfigField "long",    "GIT_SYNC_INTERVAL_MINUTES", "${gitSyncMinutes}L"
        buildConfigField "boolean", "GIT_SYNC_REQUIRE_UNMETERED", "${gitSyncUnmetered}"
        buildConfigField "String", "UI_APPS_B64",     "\"${driveAppsB64}\""
        buildConfigField "String", "UI_TABS_B64",     "\"${uiTabsB64}\""
        buildConfigField "String", "UI_DEFAULT_TAB",  "\"${uiDefaultTab}\""
        buildConfigField "String", "UI_CONFIGS_B64",  "\"${uiConfigsB64}\""
        buildConfigField "String", "UI_SYNC_B64",     "\"${uiSyncB64}\""
        // #705 the gh engine: where it is, how to find its service, the contract this build needs.
        buildConfigField "String", "GH_ENGINE_PACKAGE",      "\"${ghEnginePackage}\""
        buildConfigField "String", "GH_ENGINE_ACTION",       "\"${ghEngineAction}\""
        buildConfigField "int",    "GH_ENGINE_MIN_CONTRACT", "${ghEngineMinContract}"
        buildConfigField "long",   "GH_ENGINE_POLL_MS",      "${ghEnginePollMs}L"
        buildConfigField "long",   "GH_ENGINE_LOGIN_MAX_MS", "${ghEngineMaxMs}L"
        buildConfigField "String", "UI_FILES_B64",    "\"${uiFilesB64}\""
        buildConfigField "String", "UI_VOLUMES_B64",  "\"${uiVolumesB64}\""
        buildConfigField "String", "UI_CONSTELLATION_B64", "\"${constellationB64}\""
        buildConfigField "String", "SYNC_RULES_B64",  "\"${syncRulesB64}\""
        buildConfigField "String", "UI_ICON_DEFAULT", "\"${uiIconDefault}\""
        buildConfigField "String", "AUTH_APPLIES_B64", "\"${authAppliesB64}\""
        buildConfigField "String", "UI_PERMISSIONS_RUNTIME_B64", "\"${uiPermissionsRuntimeB64}\""
        buildConfigField "String", "UI_PERMISSIONS_ROLES_B64",   "\"${uiPermissionsRolesB64}\""
        buildConfigField "String", "UI_PROFILE_NAME",      "\"${profileName}\""
        buildConfigField "String", "UI_PROFILE_EMAIL",     "\"${profileEmail}\""
        buildConfigField "String", "UI_PROFILE_INITIALS",  "\"${profileInitials}\""
        buildConfigField "String", "UI_PROFILE_COMPANY",   "\"${profileCompany}\""
        buildConfigField "String", "UI_PROFILE_LOCATION",  "\"${profileLocation}\""
        buildConfigField "String", "UI_PROFILE_WEBSITE",   "\"${profileWebsite}\""
        buildConfigField "String", "UI_PROFILE_TITLES",    "\"${profileTitles}\""
        buildConfigField "String", "UI_PROFILE_REPOS_B64", "\"${profileReposB64}\""
        buildConfigField "String", "UI_CONSOLIDATED_CONFIG", "\"${consolidatedCfg}\""
        buildConfigField "String", "UI_STACK_LANGUAGES_JSON_B64",  "\"${stackLanguagesB64}\""
        buildConfigField "String", "UI_STACK_FRAMEWORKS_JSON_B64", "\"${stackFrameworksB64}\""
        buildConfigField "String", "UI_STACK_FOLDER_TREE_B64",     "\"${stackTreeB64}\""
        buildConfigField "long",   "STACK_GRADLE_CONFIG_MS",  "${System.currentTimeMillis() - gradleScriptStartMs}L"
        buildConfigField "long",   "STACK_BUILD_AVG_SECS",    "${buildAvgSecs}L"
        buildConfigField "long",   "STACK_BUILD_LAST_SECS",   "${buildLastSecs}L"
        buildConfigField "int",    "STACK_BUILD_SAMPLE",      "${buildSampleSize}"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures {
        buildConfig = true
        // #579 the whole chrome is Compose; EngineActivity hosts the engines' screens.
        compose = true
    }

    testOptions {
        unitTests {
            // #579 DriveShellTest is a Robolectric Compose layout-tree test: it renders
            // the shell and the Files pane against the app's real resources (the
            // libs:bottomnav precedent, BottomNavIslandTest).
            includeAndroidResources = true
            all {
                testLogging {
                    events 'failed'
                    exceptionFormat 'full'
                }
            }
        }
    }

    // ONE shared Cloud-constellation key — same key as SuperApp/Nav/Comms/Wallet/IDE.
    signingConfigs {
        debug {
            def envStore = System.getenv("ANDROID_KEYSTORE_FILE")
            if (envStore == null || envStore.isEmpty() || !file(envStore).exists()) {
                throw new GradleException("ONE shared constellation key required; run via build.sh / set ANDROID_KEYSTORE_FILE; no fallback")
            }
            storeFile     file(envStore)
            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
            keyAlias      System.getenv("ANDROID_KEY_ALIAS")
            keyPassword   System.getenv("ANDROID_KEY_PASSWORD")
        }
    }

    buildTypes {
        debug   { debuggable true;  signingConfig signingConfigs.debug }
        release { debuggable true; minifyEnabled false
                  proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  signingConfig signingConfigs.debug }
    }

    packaging {
        resources {
            // See build.json::android._doc_packaging_excludes — the engine
            // libraries' jars (JGit, jsch, …) collide on their notice files.
            excludes += (buildJson.android?.packaging_excludes ?: []) as List
        }
        jniLibs {
            // libs:rclone ships the static rclone binary as librclone.so and
            // execs it from nativeLibraryDir — the one place an app may exec
            // from on API 29+. AGP's default keeps .so files compressed inside
            // the APK and extracts NOTHING, so without this the file the runner
            // execs does not exist. See libs/rclone/data/rclone-binary.json.
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation project(':libs:analytics')
    implementation project(':libs:core')
    implementation project(':libs:updater')
    // The shared scan engine: ZXing barcode decode + ML Kit OCR for the image
    // viewer. Same module cloud-media-center compiles in (task #459/#460).
    implementation project(':libs:ml-l-image-mlkit')
    // The four engine libraries (#567): the main APK is chrome, each tooling is
    // its own module on the shared shelf. Linked from push 1 so every push after it
    // compiles the engine inside THIS app's toolchain, not only inside lib-apks'.
    implementation project(':libs:git-sync')
    implementation project(':libs:file-editor')
    implementation project(':libs:rclone')
    implementation project(':libs:mounts')
    // #579 the fleet's bottom-nav island: the five tabs are the same Compose pill
    // superapp, mail, wallet and me draw.
    implementation project(':libs:bottomnav')
    // #587 THE sign-in of the fleet: Configs ▸ Sign in hosts libs:auth's Compose surface
    // (the same one superapp's Profile ▸ Connect hosts) and applies the drive sections.
    implementation project(':libs:auth')
    // #646 THE DECLARED GIT AUTH+OPS CHAIN, one ordered declaration (libs-shared
    // build.json::auth.git_chain: fleet, then github) walked by libs:git-sync's
    // GitAuthChain. libs:gix clones and fetches in-process; it is not an engine —
    // no Compose surface, nothing for EngineActivity to host — and it lands a static
    // payload in jniLibs, which is why packaging.jniLibs.useLegacyPackaging is
    // load-bearing. #705 libs:gh is NOT here: gh runs in Cloud-Lib-Gh.apk and this
    // app binds it (sync/GhEngine.kt, build.json::engines.gh).
    implementation project(':libs:gix')
    // #567 push 5 / #579: the Compose toolchain of the WHOLE chrome. Same BOM the
    // libraries pin, so app and libraries compose against one toolchain.
    implementation platform('androidx.compose:compose-bom:2025.01.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'
    // #575 the scheduled git sync (GitSyncWorker) — the same WorkManager libs:updater
    // already schedules its own periodic check with, same version.
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    implementation 'androidx.core:core-ktx:1.15.0'
    // The chrome is Compose and needs neither of these — the #577 PDF reader does: PdfReaderActivity is
    // an AppCompatActivity with appcompat AlertDialogs, and Theme.CloudDrive's parent
    // (Theme.Material3.Dark.NoActionBar, the AppCompat-descended dark theme the whole app declares)
    // is a Material Components style. They stay for that one activity; test-drive-shell.sh D6 pins
    // that no other activity is an AppCompatActivity.
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    // Nothing in Drive is a secret today: FilesBridge only touches shared storage the
    // user already granted. Kept so a later remote back end has somewhere to put a token
    // that is not SharedPreferences in the clear.
    implementation 'androidx.security:security-crypto:1.1.0'
    // #577 the PDF reader's engine: pdfium through io.legere:pdfiumandroid, the ONLY in-process
    // PDF renderer in the fleet (#463). The coordinate is build.json::pdf.engine, read above —
    // and PdfEngine.kt is the only source file allowed to import it.
    pdfEngineCoordinates.each { implementation it }

    // The JVM unit phase (build.json::tests.unit) runs these on every ship: PdfConvertTest and
    // PdfLayoutTest execute the converter and the page layout, which no shell tester can.
    testImplementation 'junit:junit:4.13.2'

    androidTestImplementation 'androidx.test:runner:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'

    // #579 the app's own JVM suite (state reducers, plans, guards, history, schedule)
    // and the Robolectric Compose layout-tree test — the libs:bottomnav test stack.
    // (junit itself is declared once above, with #577's PDF tests.)
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation platform('androidx.compose:compose-bom:2025.01.00')
    testImplementation 'androidx.compose.ui:ui-test-junit4'
}
