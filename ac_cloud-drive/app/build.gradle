plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def gradleScriptStartMs = System.currentTimeMillis()

def buildJson  = new groovy.json.JsonSlurper().parse(file('../build.json'))
// Version code: minutes since 2026-01-01 UTC over a 3,000,000 base.
//
// This used to be build.json's version_code plus GITHUB_RUN_NUMBER, which is
// per-WORKFLOW. Every app here ships from its own ship-*.yml with its own
// independent counter, so the moment an app was built by a different workflow
// than the one that produced the installed APK -- or a workflow was re-created,
// or a dispatch cancelled a push-triggered run via the concurrency group -- the
// number handed out was SMALLER than the last published one and Android refused
// the update with "Update version code 190 is older than current 192". A build
// counter can only be monotonic for the one counter that issued it.
//
// Wall clock only ever moves forward and is identical for every workflow, every
// runner and every trigger, so this cannot go backwards again. Same encoding as
// ac_cloud-mail and ab_cloud-libs-shared/lib-apks, so the whole fleet is
// comparable: ~3.35M in Sep 2026, far above any version code in the field and
// inside the 2^31 limit for centuries. COMMS_BUILD_TIMESTAMP is honoured when
// CI provides one so the code matches the release tag; otherwise build time.
def codeFinal = { ->
    def base  = java.time.LocalDateTime.of(2026, 1, 1, 0, 0)
    def built = java.time.LocalDateTime.now(java.time.ZoneOffset.UTC)
    def stamp = System.getenv('COMMS_BUILD_TIMESTAMP')
    if (stamp) {
        try {
            built = java.time.LocalDateTime.parse(stamp,
                java.time.format.DateTimeFormatter.ofPattern('yyyyMMdd.HHmmss'))
        } catch (ignored) { }
    }
    long mins = java.time.Duration.between(base, built).toMinutes()
    return mins > 0 ? (int) (3000000L + mins) : 3000000
}()
def shortSha = (System.getenv('GITHUB_SHA')
                ?: providers.exec {
                       commandLine 'git', 'rev-parse', '--short=8', 'HEAD'
                       ignoreExitValue = true
                   }.standardOutput.asText.get().trim())
                .take(8)
def buildTimestamp = new java.text.SimpleDateFormat("yyyy-MM-dd HH:mm:ss 'UTC'").with {
    setTimeZone(java.util.TimeZone.getTimeZone('UTC'))
    format(new java.util.Date())
}
def logSinkUrl    = (buildJson.diagnostics?.log_sink_url    ?: '')
def logSinkStream = (buildJson.diagnostics?.log_sink_stream ?: 'cloud-drive')

def b64 = { obj -> groovy.json.JsonOutput.toJson(obj).bytes.encodeBase64().toString() }
// The storage back ends the Apps tab lists. They used to live in the SuperApp's
// build.json as ui.drive_connections and were read there through
// BuildConfig.DRIVE_CONNECTIONS_B64; task 302 moved the Drive surface out into
// this application, so the data moved with it. Same carrier as every other
// declarative list here: a repo data/*.json baked in at build time, so the APK
// needs no network to render the tab.
def connectionsFile = file('../data/drive-connections.json')
def connectionsB64  = b64(connectionsFile.exists()
    ? new groovy.json.JsonSlurper().parse(connectionsFile) : [])
// The mirror (rsync) jobs the Backups tab runs, on the same carrier. Only the `jobs`
// array crosses into the APK: the file's _doc_* keys are there for whoever edits it and
// would otherwise be shipped to a phone that cannot read them.
def mirrorJobsFile = file('../data/drive-mirror-jobs.json')
def mirrorJobsB64  = b64(mirrorJobsFile.exists()
    ? (new groovy.json.JsonSlurper().parse(mirrorJobsFile).jobs ?: []) : [])
// The rclone remotes and transfer jobs the Sync tab renders, on
// the same carrier as every other declarative list here: a repo data/*.json
// baked in at build time, so the APK needs no network to render the tab.
// Task 457c — credentials are NOT in any of these files (drive-remotes.json
// says so in _doc_auth); each entry names where the fleet keeps the
// credential, and the value lives only in the fleet's .secrets or a host
// rclone config, never in this repository.
def rcloneRemotesFile = file('../data/drive-remotes.json')
def rcloneRemotesB64  = b64(rcloneRemotesFile.exists()
    ? (new groovy.json.JsonSlurper().parse(rcloneRemotesFile).remotes ?: []) : [])
def rcloneJobsFile = file('../data/drive-rclone-jobs.json')
def rcloneJobsB64  = b64(rcloneJobsFile.exists()
    ? (new groovy.json.JsonSlurper().parse(rcloneJobsFile).jobs ?: []) : [])
// The Git subpage's repository family — the same curated 8 the SuperApp's
// GH Repos / Gitea Repos cards reuse — baked whole (instances + repos) so the
// page renders both remotes from the one declaration. Task 457c.
def gitReposFile = file('../data/drive-git-repos.json')
def gitReposB64  = b64(gitReposFile.exists()
    ? new groovy.json.JsonSlurper().parse(gitReposFile) : [:])
// The Apps tab grid. data/drive-apps.json declares WHICH apps the grid links to
// and how each tile looks; the constellation fleet manifest — the SAME canonical
// file :libs:updater bakes into CONSTELLATION_FLEET_B64 — supplies each entry's
// package identity. One declaration for the app list, one for identity, and no
// second list of packages to keep in step (the #170/#380/#381 defect shape).
// A declared fleet id that the manifest does not contain is a hard error here:
// resolving it would bake a tile that can never open anything.
def driveAppsFile  = file('../data/drive-apps.json')
def fleetAppsFile  = new File(rootDir, '../aa_cloud-superapp/data/constellation-fleet.json')
def fleetById      = [:]
if (fleetAppsFile.exists()) {
    new groovy.json.JsonSlurper().parse(fleetAppsFile).apps.each { fleetById[it.id] = it }
}
def resolvedDriveApps = []
if (driveAppsFile.exists()) {
    new groovy.json.JsonSlurper().parse(driveAppsFile).apps.each { entry ->
        def out = [label: entry.label, icon: entry.icon]
        if (entry.fleet) {
            def fleetEntry = fleetById[entry.fleet]
            if (fleetEntry == null) {
                throw new GradleException(
                    "data/drive-apps.json names fleet app '${entry.fleet}' which the " +
                    "constellation fleet manifest does not contain ($fleetAppsFile). " +
                    "Rename or remove the entry.")
            }
            out.package = fleetEntry.package
        } else {
            out.package = entry.package
            out.fallback_url = entry.fallback_url ?: ''
        }
        resolvedDriveApps << out
    }
}
def driveAppsB64  = b64(resolvedDriveApps)
def uiPermissionsRuntimeB64 = b64(buildJson.ui?.permissions?.runtime ?: [])
def uiPermissionsRolesB64   = b64(buildJson.ui?.permissions?.roles   ?: [])
def profileDefault   = buildJson.ui?.profile_default ?: [:]
def profileName      = (profileDefault.name      ?: '').toString()
def profileEmail     = (profileDefault.email     ?: '').toString()
def profileInitials  = (profileDefault.initials  ?: '').toString()
def profileCompany   = (profileDefault.company   ?: '').toString()
def profileLocation  = (profileDefault.location  ?: '').toString()
def profileWebsite   = (profileDefault.website   ?: '').toString()
def profileTitles    = (profileDefault.titles    ?: '').toString()
def profileReposB64  = b64(profileDefault.repos  ?: [])
def consolidatedCfg  = (profileDefault.consolidated_config ?: '').toString()

// Stack scan — baked into BuildConfig for the About page.
def repoRoot = rootDir
def stackExtMap = [
    "kt": "Kotlin", "java": "Java", "xml": "XML (resources/manifest)",
    "json": "JSON (config)", "gradle": "Gradle (Groovy)", "kts": "Gradle (Kotlin DSL)",
    "sh": "Shell", "md": "Markdown", "nix": "Nix", "pro": "ProGuard",
]
def stackSkipDirs = ["build", ".gradle", ".idea", "dist", ".result"]
def stackStats = [:]
[new File(repoRoot, "app/src/main"), new File(repoRoot, "libs"),
 new File(repoRoot, "build.json"),   new File(repoRoot, "build.sh"),
 new File(repoRoot, "flake.nix"),    rootDir].each { root ->
    if (!root.exists()) return
    if (root.isFile()) {
        def ext = root.name.tokenize(".").last().toLowerCase()
        def label = stackExtMap[ext]
        if (label != null) {
            def loc = 0; try { loc = root.readLines("UTF-8").size() } catch (Throwable t) {}
            def b = stackStats[label] ?: [files: 0, loc: 0]; b.files += 1; b.loc += loc; stackStats[label] = b
        }
        return
    }
    root.eachFileRecurse { f ->
        if (!f.isFile()) return
        def rel = f.absolutePath.replace(rootDir.absolutePath + "/", "")
        if (stackSkipDirs.any { rel.startsWith(it) || rel.contains("/${it}/") }) return
        def ext = f.name.tokenize(".").last().toLowerCase()
        def label = stackExtMap[ext]; if (label == null) return
        def loc = 0; try { loc = f.readLines("UTF-8").size() } catch (Throwable t) { return }
        def b = stackStats[label] ?: [files: 0, loc: 0]; b.files += 1; b.loc += loc; stackStats[label] = b
    }
}
def stackLanguagesB64 = b64(stackStats)
def stackDeps = new TreeSet()
def depPattern = ~/\b(implementation|api|compileOnly|runtimeOnly)\s*[\(\s]\s*['"]([^'":]+:[^'":]+:[^'"]+)['"]/
[rootDir, new File(repoRoot, "libs")].findAll { it.exists() }.each { root ->
    root.eachFileRecurse { f ->
        if (!f.isFile() || !(f.name.endsWith(".gradle") || f.name.endsWith(".gradle.kts"))) return
        def text = ""; try { text = f.text } catch (Throwable t) { return }
        depPattern.matcher(text).each { m -> stackDeps.add(m[2]) }
    }
}
def stackFrameworksB64 = b64(stackDeps.toList())
def stackTreeB64 = "—".bytes.encodeBase64().toString()

def buildHistorySecs = []
try {
    def ghOut = providers.exec {
        commandLine 'gh', 'run', 'list',
            '--workflow=ship-cloud-drive.yml',
            '--limit', '10', '--status', 'success',
            '--json', 'startedAt,updatedAt'
        ignoreExitValue = true
    }.standardOutput.asText.get().trim()
    if (ghOut.startsWith('[')) {
        new groovy.json.JsonSlurper().parseText(ghOut).each { r ->
            try {
                def s = java.time.Instant.parse(r.startedAt).epochSecond
                def e = java.time.Instant.parse(r.updatedAt).epochSecond
                if (e > s) buildHistorySecs << (e - s)
            } catch (Throwable t) {}
        }
    }
} catch (Throwable t) {}
def buildAvgSecs    = buildHistorySecs.isEmpty() ? -1L : (buildHistorySecs.sum() / buildHistorySecs.size()).longValue()
def buildLastSecs   = buildHistorySecs.isEmpty() ? -1L : (buildHistorySecs[0] as long)
def buildSampleSize = buildHistorySecs.size()

android {
    namespace 'com.diegonmarcos.clouddrive'
    compileSdk 36

    defaultConfig {
        // Launcher label = build.json::name, the application's one name (#351).
        // Never a strings.xml literal: that copy said "Cloud Browser" while
        // the fleet, the store and every roster said cloud-browser.
        resValue "string", "app_name", buildJson.name
        applicationId 'com.diegonmarcos.clouddrive'
        minSdk 26
        targetSdk 35
        // English is the fleet's base language, and the packaging step is the only
        // place that can enforce it: this also drops the locales arriving from the
        // libraries this app merges (:libs:analytics, :libs:core, :libs:updater).
        resConfigs "en"
        versionCode codeFinal
        versionName "${buildJson.android.version_name} (sha-${shortSha})"
        ndk {
            def abiOverride = System.getenv('CLOUDDRIVE_ABIS')
            def abis = (abiOverride?.trim()) \
                ? abiOverride.split(',').collect { it.trim() }.findAll { it } \
                : (buildJson.android.abi_filters ?: ['arm64-v8a'])
            abiFilters.addAll(abis as List)
        }
        buildConfigField "String", "GIT_SHORT_SHA",   "\"${shortSha}\""
        buildConfigField "String", "BUILD_TIMESTAMP", "\"${buildTimestamp}\""
        buildConfigField "String", "LOG_SINK_URL",    "\"${logSinkUrl}\""
        buildConfigField "String", "LOG_SINK_STREAM", "\"${logSinkStream}\""
        buildConfigField "String", "CONNECTIONS_B64", "\"${connectionsB64}\""
        buildConfigField "String", "MIRROR_JOBS_B64", "\"${mirrorJobsB64}\""
        buildConfigField "String", "RCLONE_REMOTES_B64", "\"${rcloneRemotesB64}\""
        buildConfigField "String", "RCLONE_JOBS_B64",    "\"${rcloneJobsB64}\""
        buildConfigField "String", "GIT_REPOS_B64",      "\"${gitReposB64}\""
        buildConfigField "String", "UI_APPS_B64",     "\"${driveAppsB64}\""
        buildConfigField "String", "UI_PERMISSIONS_RUNTIME_B64", "\"${uiPermissionsRuntimeB64}\""
        buildConfigField "String", "UI_PERMISSIONS_ROLES_B64",   "\"${uiPermissionsRolesB64}\""
        buildConfigField "String", "UI_PROFILE_NAME",      "\"${profileName}\""
        buildConfigField "String", "UI_PROFILE_EMAIL",     "\"${profileEmail}\""
        buildConfigField "String", "UI_PROFILE_INITIALS",  "\"${profileInitials}\""
        buildConfigField "String", "UI_PROFILE_COMPANY",   "\"${profileCompany}\""
        buildConfigField "String", "UI_PROFILE_LOCATION",  "\"${profileLocation}\""
        buildConfigField "String", "UI_PROFILE_WEBSITE",   "\"${profileWebsite}\""
        buildConfigField "String", "UI_PROFILE_TITLES",    "\"${profileTitles}\""
        buildConfigField "String", "UI_PROFILE_REPOS_B64", "\"${profileReposB64}\""
        buildConfigField "String", "UI_CONSOLIDATED_CONFIG", "\"${consolidatedCfg}\""
        buildConfigField "String", "UI_STACK_LANGUAGES_JSON_B64",  "\"${stackLanguagesB64}\""
        buildConfigField "String", "UI_STACK_FRAMEWORKS_JSON_B64", "\"${stackFrameworksB64}\""
        buildConfigField "String", "UI_STACK_FOLDER_TREE_B64",     "\"${stackTreeB64}\""
        buildConfigField "long",   "STACK_GRADLE_CONFIG_MS",  "${System.currentTimeMillis() - gradleScriptStartMs}L"
        buildConfigField "long",   "STACK_BUILD_AVG_SECS",    "${buildAvgSecs}L"
        buildConfigField "long",   "STACK_BUILD_LAST_SECS",   "${buildLastSecs}L"
        buildConfigField "int",    "STACK_BUILD_SAMPLE",      "${buildSampleSize}"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures { buildConfig = true }

    // ONE shared Cloud-constellation key — same key as SuperApp/Nav/Comms/Wallet/IDE.
    signingConfigs {
        debug {
            def envStore = System.getenv("ANDROID_KEYSTORE_FILE")
            if (envStore == null || envStore.isEmpty() || !file(envStore).exists()) {
                throw new GradleException("ONE shared constellation key required; run via build.sh / set ANDROID_KEYSTORE_FILE; no fallback")
            }
            storeFile     file(envStore)
            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
            keyAlias      System.getenv("ANDROID_KEY_ALIAS")
            keyPassword   System.getenv("ANDROID_KEY_PASSWORD")
        }
    }

    buildTypes {
        debug   { debuggable true;  signingConfig signingConfigs.debug }
        release { debuggable true; minifyEnabled false
                  proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  signingConfig signingConfigs.debug }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation project(':libs:analytics')
    implementation project(':libs:core')
    implementation project(':libs:updater')
    // The shared scan engine: ZXing barcode decode + ML Kit OCR for the image
    // viewer. Same module cloud-media-center compiles in (task #459/#460).
    implementation project(':libs:ml-l-image-mlkit')
    // The four engine libraries (#567): the main APK is chrome, each tooling is
    // its own module on the shared shelf. Linked from push 1 so every push after it
    // compiles the engine inside THIS app's toolchain, not only inside lib-apks'.
    implementation project(':libs:git-sync')
    implementation project(':libs:file-editor')
    implementation project(':libs:rclone')
    implementation project(':libs:mounts')
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    // Nothing in Drive is a secret today: FilesBridge only touches shared storage the
    // user already granted. Kept so a later remote back end has somewhere to put a token
    // that is not SharedPreferences in the clear.
    implementation 'androidx.security:security-crypto:1.1.0'

    androidTestImplementation 'androidx.test:runner:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
