plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    // #567 push 5 / #579: the whole chrome is Compose (DriveShell in MainActivity) and
    // EngineActivity hosts the four engine libraries' @Composable screens.
    id 'org.jetbrains.kotlin.plugin.compose'
    // #579 FilesUiState (pane tabs, selection, view mode) is saved across process death and
    // SyncHistory is persisted as JSON: kotlinx-serialization, like the engine libraries,
    // so the JVM suite exercises the real (de)serialisation.
    id 'org.jetbrains.kotlin.plugin.serialization'
}

def gradleScriptStartMs = System.currentTimeMillis()

def buildJson  = new groovy.json.JsonSlurper().parse(file('../build.json'))
// Version code: minutes since 2026-01-01 UTC over a 3,000,000 base.
//
// This used to be build.json's version_code plus GITHUB_RUN_NUMBER, which is
// per-WORKFLOW. Every app here ships from its own ship-*.yml with its own
// independent counter, so the moment an app was built by a different workflow
// than the one that produced the installed APK -- or a workflow was re-created,
// or a dispatch cancelled a push-triggered run via the concurrency group -- the
// number handed out was SMALLER than the last published one and Android refused
// the update with "Update version code 190 is older than current 192". A build
// counter can only be monotonic for the one counter that issued it.
//
// Wall clock only ever moves forward and is identical for every workflow, every
// runner and every trigger, so this cannot go backwards again. Same encoding as
// ac_cloud-mail and ab_cloud-libs-shared/lib-apks, so the whole fleet is
// comparable: ~3.35M in Sep 2026, far above any version code in the field and
// inside the 2^31 limit for centuries. COMMS_BUILD_TIMESTAMP is honoured when
// CI provides one so the code matches the release tag; otherwise build time.
def codeFinal = { ->
    def base  = java.time.LocalDateTime.of(2026, 1, 1, 0, 0)
    def built = java.time.LocalDateTime.now(java.time.ZoneOffset.UTC)
    def stamp = System.getenv('COMMS_BUILD_TIMESTAMP')
    if (stamp) {
        try {
            built = java.time.LocalDateTime.parse(stamp,
                java.time.format.DateTimeFormatter.ofPattern('yyyyMMdd.HHmmss'))
        } catch (ignored) { }
    }
    long mins = java.time.Duration.between(base, built).toMinutes()
    return mins > 0 ? (int) (3000000L + mins) : 3000000
}()
// The built commit, FULL 40 hex. A released APK used to carry only an 8-char short sha
// (and Cloud-Drive.apk.source is a content digest, not a git sha), so nobody could name
// the exact commit of the build installed on a phone. GITHUB_SHA first: Actions checks out
// shallow/detached and the env is the one value the runner guarantees; git is the local
// fallback. An empty answer (no git, no env) fails the build rather than baking "".
def fullSha = (System.getenv('GITHUB_SHA')
               ?: providers.exec {
                      commandLine 'git', 'rev-parse', 'HEAD'
                      ignoreExitValue = true
                  }.standardOutput.asText.get()).trim()
if (!(fullSha ==~ /[0-9a-f]{40}/)) {
    throw new GradleException("the built git sha must be 40 hex (GITHUB_SHA or git rev-parse HEAD), got '${fullSha}'")
}
def shortSha = fullSha.take(8)
def buildTimestamp = new java.text.SimpleDateFormat("yyyy-MM-dd HH:mm:ss 'UTC'").with {
    setTimeZone(java.util.TimeZone.getTimeZone('UTC'))
    format(new java.util.Date())
}
