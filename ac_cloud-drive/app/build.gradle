if (driveAppsFile.exists()) {
    new groovy.json.JsonSlurper().parse(driveAppsFile).apps.each { entry ->
        def out = [label: entry.label, icon: entry.icon]
        // #603 an in-app tile: `route` names a declared tab and sub-page (ui.tabs /
        // ui.configs.pages), so GitSync and RSync are shortcuts into the screens #567
        // and #330 already built, not a second copy of either.
        if (entry.route) { out.route = [tab: (entry.route.tab ?: ''), page: (entry.route.page ?: '')] }
        if (entry.fleet) {
            def fleetEntry = fleetById[entry.fleet]
            if (fleetEntry == null) {
                throw new GradleException(
                    "data/drive-apps.json names fleet app '${entry.fleet}' which the " +
                    "constellation fleet manifest does not contain ($fleetAppsFile). " +
                    "Rename or remove the entry.")
            }
            out.package = fleetEntry.package
        } else {
            out.package = entry.package
            out.fallback_url = entry.fallback_url ?: ''
        }
        resolvedDriveApps << out
    }
}
def driveAppsB64  = b64(resolvedDriveApps)
// #604/#630 Volumes ▸ Fleet Volumes: the fleet apps whose folder the class lists.
// #630 DERIVED, NEVER HAND-PICKED. data/drive-constellation.json used to BE the list and
// carried four entries, so the section showed four of the fleet's apps and looked like the
// whole fleet. The list is now every `kind: app` entry of the constellation fleet manifest
// — the SAME canonical file :libs:updater and the Store's Phone tab read — and
// drive-constellation.json is reduced to LABEL/ICON OVERRIDES for the few whose manifest
// label reads as a slug. An override naming a fleet id the manifest does not carry is still
// a hard error; a manifest app with no override simply takes its manifest label.
def constellationFile = file('../data/drive-constellation.json')
def constellationOverrides = [:]
if (constellationFile.exists()) {
    new groovy.json.JsonSlurper().parse(constellationFile).apps.each { entry ->
        def fleetEntry = fleetById[entry.fleet]
        if (fleetEntry == null) {
            throw new GradleException(
                "data/drive-constellation.json names fleet app '${entry.fleet}' which the " +
                "constellation fleet manifest does not contain ($fleetAppsFile). " +
                "Rename or remove the entry.")
        }
        constellationOverrides[entry.fleet] = entry
    }
}
def resolvedConstellation = []
fleetById.each { fleetId, fleetEntry ->
    if (fleetEntry.kind != 'app') return
    if (!fleetEntry.package) return
    def over = constellationOverrides[fleetId]
    resolvedConstellation << [
        label  : (over?.label ?: fleetEntry.label ?: fleetId),
        icon   : (over?.icon ?: 'apps'),
        package: fleetEntry.package,
    ]
}
resolvedConstellation.sort { it.label.toLowerCase() }
if (resolvedConstellation.isEmpty()) {
    throw new GradleException(
        "the constellation fleet manifest ($fleetAppsFile) yielded no `kind: app` entry: " +
        "Volumes ▸ Fleet Volumes would render an empty section.")
}
