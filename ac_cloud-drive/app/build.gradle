            "constellation fleet manifest ($fleetAppsFile) — the manifest would ask for a permission no package declares.")
    }
    authMissionPackage = missionFleet.package.toString()
    authMissionPermission = sharedMission.permission.toString().replace('{package}', authMissionPackage)
}
