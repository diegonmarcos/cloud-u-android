<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Cloud Drive</title>
    <script src="vendor/tailwind.js"></script>
    <style>
        :root {
            /* MainActivity overwrites these with the measured window insets. The env() values are
               the fallback for a desktop browser, where Chromium reports only the display cutout. */
            --sat: env(safe-area-inset-top, 0px);
            --sab: env(safe-area-inset-bottom, 0px);
            --sal: env(safe-area-inset-left, 0px);
            --sar: env(safe-area-inset-right, 0px);
        }

        html, body { margin: 0; padding: 0; background: #111827; height: 100%; }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            color: #e5e7eb;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Full-bleed app shell: the WebView IS the screen, no device bezel. */
        .app-container {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            padding-left: var(--sal);
            padding-right: var(--sar);
        }

        .app-header { padding-top: var(--sat); }
        .tab-bar { padding-bottom: var(--sab); }

        .tab-button.active { color: #60a5fa; border-color: #60a5fa; }
        .tab-button { color: #9ca3af; border-color: transparent; }

        .row:active { background: #1f2937; }
        .row.selected { background: #1e3a8a; }

        /* One line, ellipsised: a long file name must not push the size column off screen. */
        .clip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* ── the image viewer overlay (task #459/#460) ──
           A sibling of the app shell, painting above the tab bar, so the image
           actually owns the screen while it is open. The sheet below it is a
           bottom panel for scan results / OCR / EXIF; the sheet, not a new
           page, keeps the viewer and its folder context on screen. */
        .viewer { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column;
                  background: #030712; padding-top: var(--sat); padding-bottom: var(--sab); }
        .viewer.hidden { display: none; }
        .viewer-top-bar { display: flex; align-items: center; gap: 0.4rem; height: 3rem;
                          padding: 0 0.5rem; background: #0f172a; border-bottom: 1px solid #1f2937;
                          color: #9ca3af; }
        .viewer-top-bar .viewer-name { flex: 1; min-width: 0; font-size: 0.75rem; color: #e5e7eb; }
        .viewer-top-bar button { padding: 0.25rem 0.5rem; font-size: 1rem; background: none; border: none;
                                 color: #9ca3af; }
        .viewer-top-bar button:active { color: #60a5fa; }
        .viewer-stage { flex: 1; position: relative; overflow: hidden; touch-action: none;
                        background: #030712; }
        .viewer-stage img { position: absolute; left: 50%; top: 50%; max-width: none; max-height: none;
                            transform-origin: center center; user-select: none; -webkit-user-drag: none;
                            will-change: transform; }
        .viewer-sheet { max-height: 62%; overflow-y: auto; background: #111827;
                        border-top: 1px solid #1f2937; }
        .viewer-sheet.hidden { display: none; }
        .viewer-sheet .sheet-pad { padding: 0.75rem 1rem; }
        .scan-action { display: block; width: 100%; text-align: left; padding: 0.6rem 0.75rem;
                       margin-top: 0.4rem; border-radius: 0.5rem; background: #1f2937;
                       color: #e5e7eb; font-size: 0.8rem; }
        .scan-action:active { background: #374151; }
        .viewer-sheet textarea { width: 100%; min-height: 8rem; box-sizing: border-box;
                                 background: #0f172a; color: #e5e7eb; border: 1px solid #374151;
                                 border-radius: 0.5rem; padding: 0.5rem; font-size: 0.8rem; }
        .viewer-sheet .sheet-button { padding: 0.4rem 0.75rem; border-radius: 0.5rem;
                                      background: #2563eb; color: white; font-size: 0.75rem; }
        .image-thumb { width: 2rem; height: 2rem; border-radius: 0.375rem; object-fit: cover;
                       background: #1f2937; flex-shrink: 0; }
    </style>
</head>
<body>
<div class="app-container">

    <header class="app-header sticky top-0 z-20 bg-gray-900 border-b border-gray-700">
        <div class="flex items-center justify-between px-4 h-12">
            <h1 class="text-base font-semibold">Cloud Drive</h1>
            <div id="header-actions" class="flex items-center gap-3 text-gray-500"></div>
        </div>
    </header>

    <main id="panel" class="flex-1 overflow-y-auto hide-scrollbar"></main>

    <!-- Files | Apps | Sync | Backups | Configs. The separator between Files and the rest is a plain
         character, matching how the SuperApp's Data Apps row marks the same boundary. Sync is the
         home of the transfer surfaces: Rclone (the rclone remotes and the fleet's declared rclone
         operations), Mounted (the WireGuard mesh mounts) and Git (the declared repositories over the
         vendored GitSync lib, whose Flutter UI is embedded once the engine's add-to-app integration
         lands — see ab_cloud-libs-shared/libs/gitsync/VENDORED.md). -->
    <nav class="tab-bar sticky bottom-0 z-20 bg-gray-900 border-t border-gray-700 flex">
        <button data-tab="files"   class="tab-button active flex-1 py-3 text-sm font-medium border-t-2">Files</button>
        <span class="self-center text-gray-600 select-none">|</span>
        <button data-tab="apps"    class="tab-button flex-1 py-3 text-sm font-medium border-t-2">Apps</button>
        <button data-tab="sync"    class="tab-button flex-1 py-3 text-sm font-medium border-t-2">Sync</button>
        <button data-tab="backups" class="tab-button flex-1 py-3 text-sm font-medium border-t-2">Backups</button>
        <button data-tab="configs" class="tab-button flex-1 py-3 text-sm font-medium border-t-2">Configs</button>
    </nav>
</div>

<!-- The image viewer overlay (task #459/#460). Created once, filled per image;
     it is a sibling of the app shell so the image paints over the tab bar. -->
<div id="viewer-root" class="viewer hidden">
    <div class="viewer-top-bar">
        <button id="viewer-close" title="Close">✕</button>
        <div class="viewer-name clip" id="viewer-name"></div>
        <span id="viewer-counter" class="text-xs text-gray-600"></span>
        <button id="viewer-rotate" title="Rotate 90°">↻</button>
        <button id="viewer-scan" title="Scan barcode">⌗</button>
        <button id="viewer-ocr" title="Read text">T</button>
        <button id="viewer-info" title="Details">ⓘ</button>
        <button id="viewer-share" title="Share">⇪</button>
        <button id="viewer-delete" title="Delete">🗑</button>
    </div>
    <div id="viewer-stage" class="viewer-stage">
        <img id="viewer-img" alt="" draggable="false" />
    </div>
    <div id="viewer-sheet" class="viewer-sheet hidden"></div>
</div>

<script>
/* ── bridge ──────────────────────────────────────────────────────────────────────
   Every call into FilesBridge returns a JSON string. Missing bridge (a desktop browser
   opening the asset directly) is answered with a failure rather than a thrown
   TypeError, so the page still renders and says why it is empty. */
const Bridge = {
    available: typeof FilesBridge !== 'undefined',
    call(name, ...args) {
        if (!this.available) return { ok: false, error: 'the storage bridge is not attached' };
        try {
            return JSON.parse(FilesBridge[name](...args));
        } catch (error) {
            return { ok: false, error: String(error) };
        }
    },
    raw(name, ...args) {
        if (!this.available) return null;
        try { return FilesBridge[name](...args); } catch (error) { return null; }
    }
};

const state = {
    tab: 'files',
    path: '',
    parent: '',
    entries: [],
    selection: new Set(),
    clipboard: { paths: [], move: false },
    sort: 'name',
    descending: false,
    showHidden: false,
    /* { path, name, original } while a file is open in the editor, null otherwise. The
       editor is a mode of the Files tab rather than a fifth tab, because what it edits is
       whatever the Files tab is looking at. */
    editor: null,
    /* Which Sync subpage is showing: 'rclone', 'mounted' or 'git'. Session state,
       not a setting — a subpage is not a choice a user expects to survive a restart. */
    syncSub: 'rclone'
};

/* The handful of choices that are settings rather than session state. domStorageEnabled is
   on in MainActivity, so localStorage is the whole store — no bridge call, no file, nothing
   to keep in step. A sort order that resets on every launch is not a setting, and the
   Configs tab was describing three values that did exactly that. */
const Settings = {
    key: 'cloud-drive-settings',
    load() {
        try {
            const stored = JSON.parse(localStorage.getItem(this.key) || '{}');
            if (stored.sort) state.sort = stored.sort;
            if (typeof stored.descending === 'boolean') state.descending = stored.descending;
            if (typeof stored.showHidden === 'boolean') state.showHidden = stored.showHidden;
        } catch (error) {
            // A corrupt entry is not worth a broken app. The defaults already stand.
        }
    },
    save() {
        try {
            localStorage.setItem(this.key, JSON.stringify({
                sort: state.sort, descending: state.descending, showHidden: state.showHidden
            }));
        } catch (error) {
            // Storage refused. The session still works, it just will not remember.
        }
    }
};

const panel = document.getElementById('panel');
const headerActions = document.getElementById('header-actions');

/* ── formatting ─────────────────────────────────────────────────────────────── */

function humanSize(bytes) {
    if (!bytes) return '—';
    const units = ['B', 'KB', 'MB', 'GB', 'TB'];
    let value = bytes, unit = 0;
    while (value >= 1024 && unit < units.length - 1) { value /= 1024; unit++; }
    return (unit === 0 ? value : value.toFixed(1)) + ' ' + units[unit];
}

function humanDate(millis) {
    if (!millis) return '';
    const date = new Date(millis);
    return date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function escapeHtml(text) {
    return String(text).replace(/[&<>"']/g, c =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
}

/** A folder, or a glyph standing in for the file's kind. No icon font is vendored. */
function glyphFor(entry) {
    if (entry.directory) return '📁';
    const mime = entry.mime || '';
    if (mime.startsWith('image/')) return '🖼️';
    if (mime.startsWith('video/')) return '🎬';
    if (mime.startsWith('audio/')) return '🎵';
    if (mime.startsWith('text/')) return '📄';
    if (mime.indexOf('pdf') >= 0) return '📕';
    if (mime.indexOf('zip') >= 0 || mime.indexOf('compressed') >= 0) return '🗜️';
    return '📄';
}

/** The image kinds the viewer opens. The platform MIME map is the one truth. */
function isImage(entry) {
    return !entry.directory && (entry.mime || '').startsWith('image/');
}

/* ── files tab ──────────────────────────────────────────────────────────────── */

function openDirectory(path) {
    const result = Bridge.call('list', path, state.sort, state.descending, state.showHidden);
    if (!result.ok) { renderFilesError(result.error); return; }
    state.path = result.path;
    state.parent = result.parent;
    state.entries = result.entries;
    state.selection.clear();
    renderFiles();
}

function renderFilesError(message) {
    panel.innerHTML =
        '<div class="p-6 text-center text-sm text-gray-500">' + escapeHtml(message) + '</div>';
    renderHeaderActions();
}

function renderPermissionPrompt() {
    panel.innerHTML =
        '<div class="p-6 space-y-4 text-center">' +
        '<div class="text-4xl">🔒</div>' +
        '<p class="text-sm text-gray-300">Cloud Drive manages the files on this phone, so Android ' +
        'needs you to allow management of all files. Nothing is read until you do.</p>' +
        '<button id="grant" class="px-4 py-2 rounded bg-blue-600 text-white text-sm font-medium">' +
        'Open the Android setting</button></div>';
    document.getElementById('grant').onclick = () => Bridge.call('requestStorageAccess');
    headerActions.innerHTML = '';
}

function renderPlaces() {
    let places = [];
    try { places = JSON.parse(Bridge.raw('places') || '[]'); } catch (error) { places = []; }
    if (!places.length) return '';
    const chip = place => {
        const kind = place.kind || 'path';
        const glyph = kind === 'tree' ? '💾' : kind === 'connect' ? '➕' : '';
        const probe = kind === 'path' ? ' data-path="' + escapeHtml(place.path) + '"'
            : kind === 'tree' ? ' data-uri="' + escapeHtml(place.uri) + '"' : ' data-connect="1"';
        return '<button class="place shrink-0 px-3 py-1 rounded-full bg-gray-800 text-xs" ' +
            'data-kind="' + kind + '"' + probe + '>' + glyph + ' ' + escapeHtml(place.label) + '</button>';
    };
    return '<div class="flex gap-2 px-4 py-2 overflow-x-auto hide-scrollbar border-b border-gray-800">' +
        places.map(chip).join('') + '</div>';
}

function renderUsage() {
    const usage = Bridge.call('usage', state.path);
    if (!usage.ok || !usage.total) return '';
    const used = usage.total - usage.free;
    const percent = Math.round(used / usage.total * 100);
    return '<div class="px-4 py-2 border-b border-gray-800">' +
        '<div class="h-1 rounded bg-gray-700 overflow-hidden">' +
        '<div class="h-full bg-blue-500" style="width:' + percent + '%"></div></div>' +
        '<div class="mt-1 text-[11px] text-gray-500">' + humanSize(used) + ' of ' +
        humanSize(usage.total) + ' used</div></div>';
}

function renderFiles() {
    const crumbs = state.path.split('/').filter(Boolean);
    const rows = state.entries.map((entry, index) =>
        '<div class="row flex items-center gap-3 px-4 py-2 border-b border-gray-800 ' +
        (state.selection.has(entry.path) ? 'selected' : '') + '" data-index="' + index + '">' +
        (isImage(entry)
            ? '<img class="image-thumb" data-path="' + escapeHtml(entry.path) + '" alt="" />'
            : '<span class="text-xl">' + glyphFor(entry) + '</span>') +
        '<div class="flex-1 min-w-0">' +
        '<div class="clip text-sm">' + escapeHtml(entry.name) + '</div>' +
        '<div class="text-[11px] text-gray-500">' +
        (entry.directory ? 'folder' : humanSize(entry.size)) + ' · ' + humanDate(entry.modified) +
        '</div></div>' +
        '<button class="more px-2 text-gray-500" data-index="' + index + '">⋮</button>' +
        '</div>'
    ).join('');

    panel.innerHTML =
        renderPlaces() +
        '<div class="px-4 py-2 text-[11px] text-gray-500 clip">/' + escapeHtml(crumbs.join(' / ')) + '</div>' +
        renderUsage() +
        (state.entries.length
            ? rows
            : '<div class="p-6 text-center text-sm text-gray-500">This folder is empty</div>') +
        renderSelectionBar();

    bindFileRows();
    renderHeaderActions();
}

function renderSelectionBar() {
    const count = state.selection.size;
    const pending = state.clipboard.paths.length;
    if (!count && !pending) return '';
    return '<div class="sticky bottom-0 bg-gray-900 text-white flex items-center gap-3 px-4 py-2 text-sm">' +
        (count ? '<span>' + count + ' selected</span>' +
            '<button id="act-copy" class="ml-auto">Copy</button>' +
            '<button id="act-move">Move</button>' +
            '<button id="act-delete" class="text-red-300">Delete</button>'
            : '<span>' + pending + ' ready to ' + (state.clipboard.move ? 'move' : 'copy') + '</span>' +
            '<button id="act-paste" class="ml-auto">Paste here</button>' +
            '<button id="act-cancel">Cancel</button>') +
        '</div>';
}

function bindFileRows() {
    panel.querySelectorAll('.place').forEach(button => {
        button.onclick = () => {
            const kind = button.dataset.kind || 'path';
            if (kind === 'tree') safariSheet(button.dataset.uri);
            else if (kind === 'connect') connectTreeGrant();
            else openDirectory(button.dataset.path);
        };
    });
    panel.querySelectorAll('.row').forEach(row => {
        const entry = state.entries[Number(row.dataset.index)];
        row.onclick = () => {
            if (state.selection.size) { toggleSelection(entry); return; }
            if (entry.directory) openDirectory(entry.path);
            // #458/#577: cloud-drive reads PDFs itself, in the native reader (pdfium),
            // instead of handing them to another app.
            else if (isPdfEntry(entry)) openPdf(entry);

            // An image opens in the viewer (zoom, swipe, rotate, scan, OCR) — a
            // system gallery would be the app handing its one job to somebody
            // else, and the scan actions need this page's own bridge anyway.
            else if (isImage(entry)) openViewer(entry);
            else reportFailure(Bridge.call('open', entry.path));
        };
        // Long-press starts a selection, the way every file manager on this phone does.
        let timer = null;
        row.addEventListener('touchstart', () => {
            timer = setTimeout(() => toggleSelection(entry), 450);
        }, { passive: true });
        ['touchend', 'touchmove', 'touchcancel'].forEach(event =>
            row.addEventListener(event, () => clearTimeout(timer), { passive: true }));
    });
    // Thumbnails load lazily so a slow disk never stalls the list itself: the
    // row is on screen before the decode starts, and each one asks independently.
    panel.querySelectorAll('img.image-thumb').forEach(img => {
        const path = img.dataset.path;
        const thumb = Bridge.raw('imageThumb', path, 96);
        if (thumb) img.src = thumb;
    });
    panel.querySelectorAll('.more').forEach(button => {
        button.onclick = event => {
            event.stopPropagation();
            showEntryMenu(state.entries[Number(button.dataset.index)]);
        };
    });

    const bind = (id, handler) => { const el = document.getElementById(id); if (el) el.onclick = handler; };
    bind('act-copy', () => stageTransfer(false));
    bind('act-move', () => stageTransfer(true));
    bind('act-delete', deleteSelection);
    bind('act-paste', pasteHere);
    bind('act-cancel', () => { state.clipboard = { paths: [], move: false }; renderFiles(); });
}

function toggleSelection(entry) {
    if (state.selection.has(entry.path)) state.selection.delete(entry.path);
    else state.selection.add(entry.path);
    renderFiles();
}

function stageTransfer(move) {
    state.clipboard = { paths: [...state.selection], move: move };
    state.selection.clear();
    renderFiles();
}

function pasteHere() {
    const result = Bridge.call('transfer',
        JSON.stringify(state.clipboard.paths), state.path, state.clipboard.move);
    state.clipboard = { paths: [], move: false };
    reportFailure(result);
    openDirectory(state.path);
}

function deleteSelection() {
    const paths = [...state.selection];
    if (!paths.length) return;
    if (!confirm('Delete ' + paths.length + ' item' + (paths.length > 1 ? 's' : '') + '? This cannot be undone.')) return;
    reportFailure(Bridge.call('delete', JSON.stringify(paths)));
    openDirectory(state.path);
}

/* ── the bottom sheet ─────────────────────────────────────────────────────────
   One positioned <div>, owned here, that every menu in the app routes through:
   the per-entry ⋮ menu, the sort/view menu, the new-item menu and the tools menu
   all call openSheetMenu() and get the same slide-up panel, the same backdrop,
   and the same keyboard-close behaviour. No prompt(), no second component —
   a menu choice that needs text (rename, new file, a zip-pattern) opens a
   text input INSIDE the same sheet, so the numbered dialogs are gone entirely. */

const sheetRoot = (() => {
    let el = null;
    return () => {
        if (!el) {
            el = document.createElement('div');
            el.id = 'sheet-root';
            el.className = 'fixed inset-0 z-40 hidden';
            document.body.appendChild(el);
        }
        return el;
    };
})();

let sheetTimer = null;

function openSheet(html, onMount) {
    clearSheetTimer();
    const root = sheetRoot();
    root.innerHTML =
        '<div class="absolute inset-0 bg-black/60" data-sheet-close></div>' +
        '<div class="absolute bottom-0 left-0 right-0 bg-gray-900 border-t border-gray-700 ' +
        'rounded-t-2xl max-h-[75vh] overflow-y-auto hide-scrollbar" ' +
        'style="padding-bottom: calc(var(--sab) + 12px)">' +
        '<div class="sticky top-0 bg-gray-900 border-b border-gray-700 flex items-center ' +
        'justify-between px-4 py-3">' +
        '<span id="sheet-title" class="text-sm font-medium"></span>' +
        '<button data-sheet-close class="text-gray-500 text-xl leading-none">✕</button></div>' +
        '<div id="sheet-body" class="px-2"></div></div>';
    root.classList.remove('hidden');
    root.querySelector('#sheet-title').textContent = html.title || '';
    root.querySelector('#sheet-body').innerHTML = html.body || '';
    root.querySelectorAll('[data-sheet-close]').forEach(button => {
        button.onclick = () => closeSheet();
    });
    if (onMount) onMount(root);
}

function closeSheet() {
    clearSheetTimer();
    sheetRoot().classList.add('hidden');
    sheetRoot().innerHTML = '';
}

function clearSheetTimer() {
    if (sheetTimer) { clearInterval(sheetTimer); sheetTimer = null; }
}

function sheetMenu(title, items) {
    const rows = (items || []).map((item, index) =>
        '<button class="sheet-item w-full text-left px-4 py-3 text-sm flex items-center gap-3 ' +
        (item.disabled ? 'text-gray-600' : 'text-gray-200') + '" data-index="' + index + '" ' +
        (item.disabled ? 'disabled' : '') + '>' +
        '<span class="text-base w-6 text-center">' + escapeHtml(item.icon || '') + '</span>' +
        '<span class="flex-1">' + escapeHtml(item.label) + '</span>' +
        (item.note ? '<span class="text-[11px] text-gray-500">' + escapeHtml(item.note) + '</span>' : '') +
        '</button>').join('');
    openSheet({ title: title, body: rows }, root => {
        root.querySelectorAll('.sheet-item').forEach(button => {
            button.onclick = () => {
                const item = items[Number(button.dataset.index)];
                if (!item || item.disabled) return;
                if (!item.keepOpen) closeSheet();
                item.onPick();
            };
        });
    });
}

/** A text prompt in the sheet: used for rename, new-file and new-folder names, for the
 *  bulk-rename pattern and for searches. Replaces window.prompt() everywhere. */
function sheetPrompt(config) {
    const html = '<div class="px-4 py-4">' +
        (config.message ? '<p class="text-xs text-gray-400 mb-3">' + escapeHtml(config.message) + '</p>' : '') +
        '<input id="sheet-input" value="' + escapeHtml(config.value || '') + '" ' +
        'placeholder="' + escapeHtml(config.placeholder || '') + '" ' +
        'class="w-full px-3 py-2 rounded bg-gray-800 border border-gray-700 text-sm text-gray-200 outline-none">' +
        '<div class="mt-4 flex gap-2 justify-end">' +
        '<button data-sheet-close class="px-4 py-2 rounded bg-gray-800 text-sm text-gray-300">Cancel</button>' +
        '<button id="sheet-confirm" class="px-4 py-2 rounded bg-blue-600 text-white text-sm font-medium">' +
        escapeHtml(config.confirmLabel || 'OK') + '</button></div></div>';
    openSheet({ title: config.title || '', body: html }, root => {
        const input = root.querySelector('#sheet-input');
        input.focus();
        const confirm = () => {
            const value = input.value;
            closeSheet();
            config.onConfirm(value);
        };
        root.querySelector('#sheet-confirm').onclick = confirm;
        input.addEventListener('keydown', event => {
            if (event.key === 'Enter') confirm();
        });
    });
}

/** A confirm-or-cancel question in the sheet, for actions that destroy data. */
function sheetConfirm(config) {
    const html = '<div class="px-4 py-4">' +
        '<p class="text-sm text-gray-300">' + escapeHtml(config.message) + '</p>' +
        '<div class="mt-4 flex gap-2 justify-end">' +
        '<button data-sheet-close class="px-4 py-2 rounded bg-gray-800 text-sm text-gray-300">Cancel</button>' +
        '<button id="sheet-confirm" class="px-4 py-2 rounded bg-red-600 text-white text-sm font-medium">' +
        escapeHtml(config.confirmLabel || 'Delete') + '</button></div></div>';

/** The shared progress sheet for the long-running bridge jobs. Polls [statusMethod]
 *  until the job is done or cancelled; the sheet owns the one interval and the Cancel
 *  button, so every long job gets the same touchable surface. */
function pollJobPanel(token, statusMethod, runningText, finishFn) {
    openSheet({
        title: runningText,
        body: '<div class="px-4 py-6 text-center">' +
            '<div class="text-sm text-gray-400">Working…</div>' +
            '<button id="sheet-cancel" class="mt-4 px-4 py-2 rounded bg-gray-800 text-sm">Cancel</button></div>'
    }, root => {
        root.querySelector('#sheet-cancel').onclick = () => Bridge.call('cancelJob', token);
        sheetTimer = setInterval(() => {
            const status = Bridge.call(statusMethod, token);
            if (!status || status.ok === false) { clearSheetTimer(); return; }
            if (status.done) {
                clearSheetTimer();
                closeSheet();
                finishFn(status);
                return;
            }
            if (status.cancelled) {
                clearSheetTimer();
                sheetText('Cancelled', ['The job was cancelled before it finished.']);
                return;
            }
            const body = root.querySelector('#sheet-body');
            const progress = (status.scanned || 0) +
                (status.bytesProgress ? ' · ' + humanSize(status.bytesProgress) : '');
            if (body) body.innerHTML =
                '<div class="px-4 py-6 text-center">' +
                '<div class="text-sm text-gray-400">' + escapeHtml(runningText) + ' · ' + progress + '</div>' +
                '<button id="sheet-cancel" class="mt-4 px-4 py-2 rounded bg-gray-800 text-sm">Cancel</button></div>';
            const cancelButton = root.querySelector('#sheet-cancel');
            if (cancelButton) cancelButton.onclick = () => Bridge.call('cancelJob', token);
        }, 350);
    });
}

function openSearchPanel() {
    sheetPrompt({
        title: 'Search',
        placeholder: 'Search terms',
        confirmLabel: 'Search',
        onConfirm: query => {
            if (!query) return;
            const started = Bridge.call('search', state.path, query, true);
            if (!started.ok) { alert(started.error); return; }
            pollJobPanel(started.token, 'searchStatus', 'Searching…', status => {
                const rows = (status.entries || []).map(entry =>
                    (entry.directory ? '📁 ' : '') + entry.name +
                    (entry.matchedBy === 'content' ? '  (content match)' : ''));
                if (rows.length) {
                    rows.push(status.truncated ? '…results cut off at the search limit' : '');
                    sheetText('Search results', rows);
                } else {
                    sheetText('Search results', ['Nothing found under this folder.']);
                }
            });
        }
    });
}

function openPropertiesPanel(entry) {
    const started = Bridge.call('properties', entry.path);
    if (!started.ok) { alert(started.error); return; }
    pollJobPanel(started.token, 'propertiesStatus', 'Reading properties…', status => {
        const lines = ['Name: ' + entry.name];
        if (status.directory) {
            lines.push('Files: ' + (status.files || 0));
            lines.push('Folders: ' + (status.folders || 0));
        }
        lines.push('Size on disk: ' + humanSize(status.size));
        const perms = status.permissions || {};
        const bits = (perms.readable ? 'r' : '-') + (perms.writable ? 'w' : '-') +
            (perms.executable ? 'x' : '-');
        lines.push('Permission bits: ' + bits);
        if (status.md5) lines.push('MD5: ' + status.md5);
        if (status.sha256) lines.push('SHA-256: ' + status.sha256);
        sheetText('Properties', lines);
    });
}

function openPickForProperties() {
    const selected = [...state.selection];
    if (selected.length === 1) {
        const entry = state.entries.find(e => e.path === selected[0]);

function archiveSelection(paths) {
    const first = paths[0] || '';
    const base = first.split('/').pop() || 'archive';
    const defaultName = base.replace(/\.[^.]+$/, '') + '.zip';
    sheetPrompt({
        title: 'Archive',
        message: paths.length + ' item' + (paths.length === 1 ? '' : 's') + ' → one .zip in this folder',
        value: defaultName,
        confirmLabel: 'Create archive',
        onConfirm: name => {
            if (!name) return;
            if (!/\.zip$/i.test(name)) name = name + '.zip';
            const result = Bridge.call('archive', JSON.stringify(paths), state.path + '/' + name);
            reportFailure(result);
            openDirectory(state.path);

}

function promptExtract(zipPath) {
    const entry = state.entries.find(e => e.path === zipPath);
    const base = entry ? entry.name.replace(/\.zip$/i, '') : 'extracted';
    sheetPrompt({
        title: entry ? 'Extract ' + entry.name : 'Extract',
        value: base,
        confirmLabel: 'Extract',
        onConfirm: folderName => {
            if (!folderName) return;
            Bridge.call('createFolder', state.path, folderName);
            const destination = state.path + '/' + folderName;
            const result = Bridge.call('extract', zipPath, destination);
            reportFailure(result);
            if (result.count !== undefined) {
                openDirectory(state.path);
                sheetText('Extracted', [result.count + ' entries extracted into ' + folderName + '.']);
            }

function openBulkRenamePanel() {
    const selected = [...state.selection];
    if (selected.length < 2) { alert('Select at least two files first.'); return; }
    sheetPrompt({
        title: 'Rename by pattern',
        message: 'Tokens: {name} {n} {ext} {date} — for example: holiday-{n}',
        value: '{name}-{n}.{ext}',
        confirmLabel: 'Preview',
        onConfirm: pattern => {
            if (!pattern) { alert('A pattern is required.'); return; }
            const preview = Bridge.call('bulkRenamePreview', JSON.stringify(selected), pattern);
            if (!preview.ok) { alert(preview.error); return; }
            const plan = preview.plan || [];
            const blockedCount = plan.filter(row => row.reason && row.newName !== row.oldName).length;
            const rows = plan.map(row =>
                '<div class="px-4 py-1.5 text-xs border-b border-gray-800">' +
                '<span class="text-gray-500">' + escapeHtml(row.oldName) + '</span>' +
                ' → <span class="text-gray-200">' + escapeHtml(row.newName) + '</span>' +
                (row.reason && row.newName !== row.oldName
                    ? '<span class="text-amber-400"> (' + escapeHtml(row.reason) + ')</span>' : '') +
                '</div>').join('');
            openSheet({
                title: 'Rename preview',
                body: '<div class="max-h-[45vh] overflow-y-auto">' + rows + '</div>' +
                    '<div class="px-4 py-3 flex gap-2 justify-end">' +
                    '<button data-sheet-close class="px-4 py-2 rounded bg-gray-800 text-sm text-gray-300">Cancel</button>' +
                    '<button id="sheet-apply" class="px-4 py-2 rounded bg-blue-600 text-white text-sm font-medium"' +
                    (blockedCount ? ' disabled' : '') + '>Apply</button></div>' +
                    (blockedCount
                        ? '<div class="px-4 pb-3 text-xs text-amber-400">' +
                        blockedCount + ' conflict' + (blockedCount === 1 ? '' : 's') +
                        ' — nothing has been renamed yet.</div>'
                        : '')
            }, root => {
                const apply = root.querySelector('#sheet-apply');
                if (apply) apply.onclick = () => {
                    const applied = Bridge.call('bulkRename', JSON.stringify(selected), pattern);
                    closeSheet();
                    reportFailure(applied);
                    openDirectory(state.path);
                };

    });
}

function openDuplicatesPanel() {
    const started = Bridge.call('duplicates', state.path);
    if (!started.ok) { alert(started.error); return; }
    pollJobPanel(started.token, 'duplicatesStatus', 'Comparing files…', status => {
        const groups = Array.isArray(status.groups) ? status.groups : [];
        if (!groups.length) {
            sheetText('Duplicates', ['No duplicate files found under this folder.']);
            return;
        }
        const lines = groups.map(group =>
            humanSize(group.size) + ' × ' + group.paths.length + ' — ' + group.paths.join(' | '));
        sheetText('Duplicates', lines);
    });
}

/* ── the editor ─────────────────────────────────────────────────────────────────
   A textarea, deliberately. It is the platform's text editor: caret, selection,
   undo, autocorrect, the magnifier and the system clipboard all arrive for free and
   all behave the way they do in every other app on the phone. A syntax-highlighting
   editor component would be a vendored dependency re-implementing every one of them,
   and #228 exists because of exactly that kind of second private copy. */

function openEditor(entry) {
    const result = Bridge.call('readText', entry.path);
    // The bridge refuses a file that is too large or is not text, and says which.
    // Both refusals protect the file: an editor that opens what it cannot represent
    // writes back damage on the first save.
    if (!result.ok) { alert(result.error); return; }
    state.editor = { path: result.path, name: result.name, original: result.text };
    renderEditor();
}

function renderEditor() {
    panel.innerHTML =
        '<div class="px-4 py-2 text-[11px] text-gray-500 clip border-b border-gray-800">' +
        escapeHtml(state.editor.name) + '</div>' +
        '<textarea id="editor-text" spellcheck="false" autocapitalize="off" ' +
        'autocorrect="off" class="block w-full min-h-[70vh] p-4 font-mono text-xs ' +
        'leading-5 outline-none resize-none bg-gray-900 text-gray-200">' + escapeHtml(state.editor.original) +
        '</textarea>';
    renderHeaderActions();
}

/** True when the textarea holds something other than what was last read or written. */
function editorIsDirty() {
    const box = document.getElementById('editor-text');
    return !!box && box.value !== state.editor.original;
}

function saveEditor() {
    const box = document.getElementById('editor-text');
    if (!box) return;
    const text = box.value;
    const result = Bridge.call('writeText', state.editor.path, text);
    if (!result.ok) { alert(result.error); return; }
    // What is on disk is now the baseline, so closing no longer warns and a second
    // save of untouched text is still correct rather than being suppressed.
    state.editor.original = text;
    renderHeaderActions();
}

function closeEditor() {
    if (editorIsDirty() && !confirm('Close without saving? The changes are lost.')) return;
    state.editor = null;
    openDirectory(state.path);
}

/** Only speaks up when something went wrong: a silent failure is what makes a bridge feel broken. */
function reportFailure(result) {
    if (result && result.ok === false && result.error) alert(result.error);
}

/* ── the four engines (#567 push 5) ─────────────────────────────────────────────
   The main APK is chrome; each tooling is its own Compose library, hosted by
   EngineActivity. The page names an ENGINE ID and a target and the bridge does the
   rest. The ids here are the one vocabulary the bridge and the activity share —
   test/test-drive-engine-wiring.sh derives the set from these calls and checks the
   activity routes every one of them. */
function openEngine(engine, target, url) {
    reportFailure(Bridge.call('openEngine', engine, target || '', url || ''));
}

/* #575: `url` is only meaningful for the git engine — the repository to clone into
   `target` when that folder does not hold a clone yet. */
function engineButton(engine, target, label, url) {
    return '<button class="engine-open px-3 py-1.5 rounded bg-blue-600 text-white text-xs" ' +
        'data-engine="' + engine + '" data-target="' + escapeHtml(target || '') + '"' +
        ' data-url="' + escapeHtml(url || '') + '">' + escapeHtml(label) + '</button>';
}

/** Wire every engine button the current panel holds. Called by the renderers that draw one. */
function bindEngineButtons() {
    panel.querySelectorAll('.engine-open').forEach(button => {
        button.onclick = () => openEngine(button.dataset.engine, button.dataset.target, button.dataset.url);
    });
}

/* #575 THE ONE shared repo store, as the device resolves it from build.json's
   storage.shared_root. Read once; the page never holds the path itself. */
const SHARED_ROOT = (() => {
    let cache = null;
    return () => {
        if (cache === null) cache = Bridge.raw('sharedRoot') || '';
        return cache;
    };
})();

/** An engine handed a file back (download, reveal): show its folder in Files. */
window.revealPath = function (path) {
    if (!path) return;
    const parent = path.slice(0, path.lastIndexOf('/')) || '/';
    state.editor = null;
    showTab('files');
    openDirectory(parent);
};

function renderHeaderActions() {
    if (state.tab !== 'files') { headerActions.innerHTML = ''; return; }
    if (state.editor) {
        headerActions.innerHTML =
            '<button id="editor-full" class="text-sm" title="Open in the full editor">📝</button>' +
            '<button id="editor-save" class="text-sm font-medium text-blue-400">Save</button>' +
            '<button id="editor-close" class="text-sm">Close</button>';
        document.getElementById('editor-full').onclick = () => {
            if (editorIsDirty() && !confirm('Save first? The full editor reads the file from disk.')) return;
            if (editorIsDirty()) saveEditor();
            openEngine('editor', state.editor.path);
        };
        document.getElementById('editor-save').onclick = saveEditor;
        document.getElementById('editor-close').onclick = closeEditor;
        return;
    }
    headerActions.innerHTML =
        (state.parent ? '<button id="up" title="Up">⬆️</button>' : '') +
        '<button id="new-item" title="New folder or file">➕</button>' +
        '<button id="sort" title="Sort and view">↕️</button>' +
        '<button id="tools" title="Search, zip, properties">🧰</button>';
    const up = document.getElementById('up');
    if (up) up.onclick = () => openDirectory(state.parent);
    document.getElementById('new-item').onclick = newItemMenu;
    document.getElementById('sort').onclick = sortMenu;
    document.getElementById('tools').onclick = toolsMenu;
}

/* ── the other tabs (Apps, Sync, Backups, Configs) ───────────────────────────────────────────────────── */

function card(title, body) {
    return '<div class="mx-4 my-2 p-4 rounded-lg border border-gray-700">' +
        '<div class="text-sm font-medium">' + escapeHtml(title) + '</div>' +
        '<div class="mt-1 text-xs text-gray-500">' + body + '</div></div>';
}

/* The storage back ends, baked in from data/drive-connections.json. Read once: it is build-time
   data, so it cannot change while the app is open. Borg and Bup are backup repositories rather
   than live storage, which is exactly the Sync/Backups split — one list, one predicate, no second
   copy of the data to keep in step. */
const BACKUP_KINDS = ['borg', 'bup'];

let connectionsCache = null;
function connections() {
    if (connectionsCache === null) {
        const raw = Bridge.raw('connections');
        try {
            connectionsCache = raw ? JSON.parse(raw) : [];
        } catch (error) {
            connectionsCache = [];
        }
    }
    return connectionsCache;
}

function connectionCard(entry) {
    const ok = entry.status === 'ok';
    const facts = [
        ['Kind', entry.kind],
        ['Where', entry.endpoint],
        ['Auth', entry.auth],
        ['Host', entry.vm],
        ['Scope', entry.scope]
    ].filter(pair => pair[1]).map(pair =>
        '<div class="flex gap-2"><span class="w-12 shrink-0 text-gray-500">' + pair[0] + '</span>' +
        '<span class="break-all">' + escapeHtml(String(pair[1])) + '</span></div>').join('');
    const message = ok ? '' :
        '<div class="mt-2 text-xs text-amber-400">Cannot be reached — ' +
        escapeHtml(entry.reason || 'no reason is declared for this connection.') + '</div>';
    return '<div class="mx-4 my-2 p-4 rounded-lg border border-gray-700">' +
        '<div class="flex items-center gap-2">' +
        '<span class="w-2 h-2 rounded-full ' + (ok ? 'bg-green-500' : 'bg-red-500') + '"></span>' +
        '<span class="text-sm font-medium">' + escapeHtml(entry.name || 'Unnamed') + '</span>' +
        (ok ? '' : '<span class="text-xs text-red-400">unreachable</span>') + '</div>' +
        '<div class="mt-2 text-xs text-gray-500 space-y-0.5">' + facts + '</div>' + message +
        (entry.notes
            ? '<div class="mt-2 text-xs text-gray-500">' + escapeHtml(entry.notes) + '</div>'
            : '') +
        '</div>';
}

/* ── Apps: a grid of icon links out to the data apps ────────────────────────────────
   #437: the storage back ends that used to fill this tab live under Sync > Rclone now;
   this tab presents the fleet's data apps as icon links, matching how the SuperApp
   renders its tiles. The list comes from FilesBridge.apps() — built from
   data/drive-apps.json (selection + presentation) resolved against the constellation
   fleet manifest (identity) — so there is no second copy of the app list to keep in
   step. Tapping a tile launches the app; one that is not installed and carries a
   fallback URL opens that instead. */

function appTile(app, index) {
    return '<button class="app-tile flex flex-col items-center gap-1.5 w-1/4 p-2" data-index="' + index + '">' +
        '<span class="w-12 h-12 rounded-full bg-gray-800 flex items-center justify-center text-xl">' +
        escapeHtml(app.icon) + '</span>' +
        '<span class="text-[11px] text-gray-300 text-center leading-tight">' +
        escapeHtml(app.label) + '</span></button>';
}

function renderApps() {
    let apps = [];
    try { apps = JSON.parse(Bridge.raw('apps') || '[]'); } catch (error) { apps = []; }
    panel.innerHTML = '<div class="pt-2">' + (apps.length
        ? '<div class="flex flex-wrap px-2 py-2">' + apps.map(appTile).join('') + '</div>'
        : card('Nothing here', 'No apps are declared in this build.')) + '</div>';
    panel.querySelectorAll('.app-tile').forEach(tile => {
        tile.onclick = () => {
            const app = apps[Number(tile.dataset.index)];
            if (!app) return;
            reportFailure(Bridge.call('openApp', JSON.stringify(app)));
        };

}

function syncChoice(value, label) {

const RCLONE_REMOTES = (() => {

        }

const RCLONE_JOBS = (() => {

const GIT_REPOS = (() => {

function bindMirrorButtons(jobs) {
    panel.querySelectorAll('.run-mirror').forEach(button => {
        button.onclick = () => {
            const index = Number(button.dataset.index);
            const job = jobs[index];
            if (job.delete && !confirm(job.name + '\n\nThis job deletes anything in the ' +
                'destination that the source no longer has. Run it?')) return;

            const line = panel.querySelector('.mirror-result[data-index="' + index + '"]');
            line.className = 'mirror-result mt-2 text-xs text-gray-500';
            line.textContent = 'Running…';
            button.disabled = true;

            // The bridge call is synchronous and a full pass over a camera roll is not
            // instant, so hand the browser one frame to paint "Running…" before blocking
            // on it. ponytail: a frame, not a worker — move the walk onto a background
            // thread with a progress callback if a pass ever grows past a few seconds.
            setTimeout(() => {
                const result = Bridge.call('mirror', job.source, job.destination, !!job.delete);
                if (result.copied === undefined) {
                    line.className = 'mirror-result mt-2 text-xs text-red-400';
                    line.textContent = result.error || 'the mirror failed';
                } else {
                    line.className = 'mirror-result mt-2 text-xs ' +
                        (result.failed ? 'text-amber-400' : 'text-gray-500');
                    line.textContent =
                        result.copied + ' copied · ' + result.skipped + ' already there · ' +
                        result.deleted + ' removed · ' + result.failed + ' failed';
                }
                button.disabled = false;
            }, 0);
        };
    });
}

/* ── the PDF reader ─────────────────────────────────────────────────────────────
   #577: the reader is NATIVE. PdfReaderActivity draws pages with pdfium (the one
   in-process PDF engine of the fleet, #463) — continuous and paged scrolling,
   pinch zoom, search, outline, night mode, share and print all live there, and
   this page only names the file. Nothing about a PDF crosses the bridge any more:
   the old pdf.js reader shipped the whole file into the WebView as base64. */

function isPdfEntry(entry) {
    const mime = (entry.mime || '').toLowerCase();
    const name = entry.name || '';
    return mime === 'application/pdf' || /\.pdf$/i.test(name);
}

function openPdf(entry) {
    const result = Bridge.call('openPdf', entry.path);
    if (!result.ok) alert(result.error);
}

/* ── conversion on device ──────────────────────────────────────────────────────
   A PDF's text layer is not a document model: extracting it to txt, markdown,
   html or csv is honest — those formats ARE text. docx/xlsx/odt are layout
   reconstruction, which is a different feature and is NOT shipped here: the
   targets appear, disabled, with the one-line reason, until the fleet converter
   exists as a separate service. A scan (no text layer) gets a loud refusal,
   never an empty file. The extraction, the builders and the atomic write are all
   native (FilesBridge.convertPdf over the same pdfium engine as the reader). */

function convertPdfFromEntry(entry, target) {
    const outcome = Bridge.call('convertPdf', entry.path, target);
    if (!outcome.ok) { alert(outcome.error); return; }
    // The conversion is written as a sibling of the PDF, so the Files tab itself
    // is the success surface: re-list the directory and the new file is there.
    openDirectory(state.path);
    alert('Converted: ' + outcome.name);
}

/* ── the image viewer and the scan sheet (task #459/#460) ──────────────────
   An overlay above the app shell, fed by the same FilesBridge the rest of the
   page uses. Pinch and double-tap zoom, swipe between the folder's images,
   EXIF rotate, an EXIF panel, share/delete, and the two scan surfaces built
   on the ONE shared engine (libs:ml-l-image-mlkit): barcode decode rendered
   as typed actions (copy, open URL, join WiFi, add contact, add calendar
   event, dial, mail, map) and OCR with select/copy/share and save as .txt or
   .md beside the image. */

function viewerEl(id) { return document.getElementById(id); }

/* The viewer's whole session state, in one object so a gesture started on one
   image never writes into the state of another: images is the folder's image
   list, index points at the one on screen, and scale/offset/base are what the
   zoom and pan gestures mutate. reset is set by closeViewer so the next open
   starts at fit instead of carrying someone's zoom across sessions. */
const viewer = {
    images: [],
    index: 0,
    scale: 1,
    offset: { x: 0, y: 0 },
    base: null,
    lastTap: 0,
    tapPoint: null,
    sheet: null,
    reset: true
};

function viewerCurrent() {
    return viewer.images[viewer.index] || null;
}

function openViewer(entry) {
    viewer.images = state.entries.filter(isImage).map(image => ({ path: image.path, name: image.name }));
    const found = viewer.images.findIndex(image => image.path === entry.path);
    viewer.index = found >= 0 ? found : 0;
    if (!viewer.images.length) { alert('No images in this folder.'); return; }
    viewerHideSheet();
    viewerEl('viewer-root').classList.remove('hidden');
    viewerLoad();
    history.pushState(null, '');
}

function closeViewer() {
    viewerEl('viewer-root').classList.add('hidden');
    viewerHideSheet();
    viewer.reset = true; // the next image starts at fit, not at someone's zoom
}

function viewerLoad() {
    const current = viewerCurrent();
    if (!current) return;
    // A new image is a NEW context. The sheet (scan result, OCR text, EXIF
    // facts) describes whatever image it was opened for — leaving it open
    // across a swipe/rotate/delete would show one image's result and actions
    // over another's pixels, and the fake action would act on the wrong file.
    // The double-tap bookkeeping is likewise per-tap and per-image, so a fast
    // double tap right after a swipe must start a fresh pair, not inherit the
    // previous image's tap. Long-press delete relies on this too: after a
    // delete the next image loads and must open with an empty sheet.
    viewerHideSheet();
    viewer.lastTap = 0;
    viewer.tapPoint = null;
    const img = viewerEl('viewer-img');
    img.onload = () => {
        // A fresh open starts at fit; swiping between images keeps the zoom so
        // comparing two details does not re-fit on every step. reset is set by
        // closeViewer and consumed once here.
        if (viewer.reset) {
            viewer.scale = 1;
            viewer.offset = { x: 0, y: 0 };
            viewer.reset = false;
        }
        fitImage();
    };
    // The query string busts WebView's cache after an EXIF rotate, where the
    // pixels on disk are unchanged but the decoded orientation is not.
    img.src = 'file://' + encodeURI(current.path) + '?v=' + Date.now();
    viewerEl('viewer-name').textContent = current.name;
    viewerEl('viewer-name').title = current.path;
    const counter = viewerEl('viewer-counter');
    if (counter) counter.textContent = (viewer.index + 1) + ' / ' + viewer.images.length;
}

function viewerStep(delta) {
    const next = viewer.index + delta;
    if (next < 0 || next >= viewer.images.length) return;
    viewer.index = next;
    viewerLoad();
}

function fitImage() {
    const stage = viewerEl('viewer-stage');
    const img = viewerEl('viewer-img');
    const stageW = stage.clientWidth;
    const stageH = stage.clientHeight;
    const naturalW = img.naturalWidth || 1;
    const naturalH = img.naturalHeight || 1;
    const fit = Math.min(stageW / naturalW, stageH / naturalH);
    viewer.base = { w: naturalW * fit, h: naturalH * fit };
    applyTransform();
}

function applyTransform() {
    const img = viewerEl('viewer-img');
    if (!viewer.base) return;
    img.style.width = viewer.base.w + 'px';
    img.style.height = viewer.base.h + 'px';
    const centeredX = -viewer.base.w / 2 + viewer.offset.x;
    const centeredY = -viewer.base.h / 2 + viewer.offset.y;
    img.style.transform = 'translate(' + centeredX + 'px,' + centeredY + 'px) scale(' + viewer.scale + ')';
}

function clampOffset() {
    const stage = viewerEl('viewer-stage');
    const maxX = Math.max(0, (viewer.base.w * viewer.scale - stage.clientWidth) / 2);
    const maxY = Math.max(0, (viewer.base.h * viewer.scale - stage.clientHeight) / 2);
    viewer.offset.x = Math.max(-maxX, Math.min(maxX, viewer.offset.x));
    viewer.offset.y = Math.max(-maxY, Math.min(maxY, viewer.offset.y));
}

/* Gestures: one finger pans when zoomed and swipes images when not; two fingers
   pinch-zoom; a double tap toggles between fit and 2.25x. All state is in the
   closure object so a rotate/close/load mid-gesture cannot leave stale fingers
   stuck to the stage. */
let gesture = null;
function gestureBegin() {
    gesture = null;
}
viewerEl('viewer-stage').addEventListener('touchstart', event => {
    event.preventDefault();
    gesture = {
        startX: 0, startY: 0, lastX: 0, lastY: 0,
        mode: 'none',
        pinchStart: 1, scaleStart: 1,
        moved: false,
        tapAt: 0
    };
    if (event.touches.length === 1) {
        const touch = event.touches[0];
        gesture.mode = viewer.scale > 1 ? 'pan' : 'swipe';
        gesture.startX = gesture.lastX = touch.clientX;
        gesture.startY = gesture.lastY = touch.clientY;
        gesture.tapAt = Date.now();
    } else if (event.touches.length === 2) {
        gesture.mode = 'pinch';
        gesture.pinchStart = distance(event.touches[0], event.touches[1]);
        gesture.scaleStart = viewer.scale;
    }
}, { passive: false });

viewerEl('viewer-stage').addEventListener('touchmove', event => {
    event.preventDefault();
    if (!gesture) return;
    if (event.touches.length === 2 && gesture.mode === 'pinch') {
        const current = distance(event.touches[0], event.touches[1]);
        if (gesture.pinchStart > 0) {
            viewer.scale = Math.max(1, Math.min(6, gesture.scaleStart * current / gesture.pinchStart));
            applyTransform();
        }
        return;
    }
    if (event.touches.length !== 1) return;
    const touch = event.touches[0];
    const dx = touch.clientX - gesture.lastX;
    const dy = touch.clientY - gesture.lastY;
    if (!gesture.moved) {
        const fromStart = Math.hypot(touch.clientX - gesture.startX, touch.clientY - gesture.startY);
        if (fromStart > 10) gesture.moved = true;
    }
    if (gesture.mode === 'pan') {
        viewer.offset.x += dx;
        viewer.offset.y += dy;
        clampOffset();
        applyTransform();
    }
    gesture.lastX = touch.clientX;
    gesture.lastY = touch.clientY;
}, { passive: false });

viewerEl('viewer-stage').addEventListener('touchend', event => {
    if (!gesture) return;
    const wasSwipe = gesture.mode === 'swipe' && !gesture.moved;
    const swipeDx = gesture.lastX - gesture.startX;
    const swipeDy = gesture.lastY - gesture.startY;
    const quick = Date.now() - gesture.tapAt < 250 && Math.hypot(swipeDx, swipeDy) < 10;
    const ended = gesture;
    gesture = null;
    if (wasSwipe && Math.abs(swipeDx) > 60 && Math.abs(swipeDx) > Math.abs(swipeDy)) {
        viewerStep(swipeDx < 0 ? 1 : -1);
        return;
    }
    if (quick) {
        // A double tap toggles zoom between fit and 2.25x; a second quick tap on
        // the same spot after zoom is what lets the user zoom back out.
        const now = Date.now();
        if (viewer.lastTap && now - viewer.lastTap < 300 && viewer.tapPoint &&
            Math.hypot(swipeDx - viewer.tapPoint.x, swipeDy - viewer.tapPoint.y) < 30) {
            viewer.scale = viewer.scale > 1 ? 1 : 2.25;
            viewer.offset = { x: 0, y: 0 };
            applyTransform();
            viewer.lastTap = 0;
        } else {
            viewer.lastTap = now;
            viewer.tapPoint = { x: swipeDx, y: swipeDy };
        }
    }
}, { passive: false });

viewerEl('viewer-stage').addEventListener('touchcancel', () => {
    gesture = null;
}, { passive: false });

function distance(a, b) {
    return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
}

/* ── the sheet: scan, OCR and EXIF panels ────────────────────────────────── */

function viewerHideSheet() {
    viewer.sheet = null;
    viewerEl('viewer-sheet').classList.add('hidden');
    viewerEl('viewer-sheet').innerHTML = '';
}

function viewerShowSheet(kind, html) {
    viewer.sheet = kind;
    const sheet = viewerEl('viewer-sheet');
    sheet.innerHTML = html;
    sheet.classList.remove('hidden');
}

function sheetLine(label, value) {
    return '<div class="flex gap-2"><span class="w-16 shrink-0 text-gray-500">' + label +
        '</span><span class="break-all">' + escapeHtml(value == null ? '' : String(value)) + '</span></div>';
}

function actionButton(label, callback) {
    // Buttons are collected as {label, callback} pairs and bound AFTER the
    // sheet's HTML is injected, because innerHTML cannot carry closures: a
    // button rendered with an inline onclick would be eval'd strings, and an
    // unbound button is a hollow green — it LOOKS actionable and does nothing.
    return { label: escapeHtml(label), callback };
}

function renderScanSheet() {
    const current = viewerCurrent();
    if (!current) return;
    viewerShowSheet('scan',
        '<div class="sheet-pad"><div class="text-sm font-medium">Scan</div>' +
        '<div class="mt-1 text-xs text-gray-500">Looking for a barcode in ' +
        escapeHtml(current.name) + '…</div></div>');
    // Hand the browser a frame so "Looking…" paints before the decode blocks.
    setTimeout(() => {
        const result = Bridge.call('decodeBarcode', current.path);
        if (!result.ok) {
            viewerEl('viewer-sheet').innerHTML =
                '<div class="sheet-pad text-sm text-gray-400">' + escapeHtml(result.error || 'no barcode found') + '</div>';
            return;
        }
        const p = result.payload;
        const actions = [];
        if (p.type === 'url') {
            actions.push(actionButton('Open the web address', () => Bridge.call('openUrl', p.url)));
            actions.push(actionButton('Copy the address', () => copyToClipboard(result.raw)));
        } else if (p.type === 'wifi') {
            actions.push(actionButton('Join ' + p.ssid, () => Bridge.call('joinWifi', p.ssid, p.password)));
            actions.push(actionButton('Copy the password', () => copyToClipboard(p.password)));
        } else if (p.type === 'contact') {
            actions.push(actionButton('Add contact' + (p.name ? ': ' + p.name : ''), () => Bridge.call('addContact', p.vcard, p.name)));
            actions.push(actionButton('Copy the card', () => copyToClipboard(result.raw)));
        } else if (p.type === 'calendar') {
            actions.push(actionButton('Add calendar event' + (p.summary ? ': ' + p.summary : ''), () => Bridge.call('addCalendarEvent', p.summary, p.location, Number(p.start) || 0, Number(p.end) || 0)));
            actions.push(actionButton('Copy the event', () => copyToClipboard(result.raw)));
        } else if (p.type === 'phone') {
            actions.push(actionButton('Call ' + p.number, () => Bridge.call('dial', p.number)));
            actions.push(actionButton('Copy the number', () => copyToClipboard(p.number)));
        } else if (p.type === 'email') {
            actions.push(actionButton('E-mail ' + p.address, () => Bridge.call('sendEmail', p.address, p.subject, p.body)));
            actions.push(actionButton('Copy the address', () => copyToClipboard(p.address)));
        } else if (p.type === 'geo') {
            actions.push(actionButton('Open the map', () => Bridge.call('openGeo', p.latitude, p.longitude)));
            actions.push(actionButton('Copy the coordinates', () => copyToClipboard(p.latitude + ',' + p.longitude)));
        } else {
            actions.push(actionButton('Copy the text', () => copyToClipboard(p.text)));
        }
        viewerEl('viewer-sheet').innerHTML =
            '<div class="sheet-pad">' +
            '<div class="text-sm font-medium">' + escapeHtml(result.format) + ' barcode</div>' +
            '<div class="mt-2 text-xs text-gray-500 break-all">' + escapeHtml(result.raw) + '</div>' +
            '<div class="mt-2 space-y-1">' + actions.map((action, index) =>
                '<button class="scan-action" data-action="' + index + '">' + action.label + '</button>'
            ).join('') + '</div>' +
            '</div>';
        // The action objects were stashed in the closure because innerHTML
        // cannot carry them; each rendered button resolves its own by index.
        viewerEl('viewer-sheet').querySelectorAll('.scan-action').forEach(button => {
            const action = actions[Number(button.dataset.action)];
            if (action) button.onclick = action.callback;
        });
    }, 0);
}

function copyToClipboard(text) {
    const result = Bridge.call('copyText', text);
    alert(result.ok ? 'Copied.' : (result.error || 'Could not copy.'));
}

function renderOcrSheet() {
    const current = viewerCurrent();
    if (!current) return;
    viewerShowSheet('ocr',
        '<div class="sheet-pad"><div class="text-sm font-medium">Read text</div>' +
        '<div class="mt-1 text-xs text-gray-500">Reading ' + escapeHtml(current.name) + '…</div></div>');
    setTimeout(() => {
        const result = Bridge.call('recognizeText', current.path);
        if (!result.ok) {
            viewerEl('viewer-sheet').innerHTML =
                '<div class="sheet-pad text-sm text-gray-400">' + escapeHtml(result.error || 'could not read this image') + '</div>';
            return;
        }
        if (!result.text) {
            viewerEl('viewer-sheet').innerHTML =
                '<div class="sheet-pad text-sm text-gray-400">No text found in this image.</div>';
            return;
        }
        viewerEl('viewer-sheet').innerHTML =
            '<div class="sheet-pad">' +
            '<div class="text-sm font-medium">Text in ' + escapeHtml(current.name) + '</div>' +
            '<textarea id="ocr-text" readonly spellcheck="false">' + escapeHtml(result.text) + '</textarea>' +
            '<div class="mt-2 flex flex-wrap gap-2">' +
            '<button class="sheet-button" id="ocr-select">Select all</button>' +
            '<button class="sheet-button" id="ocr-copy">Copy</button>' +
            '<button class="sheet-button" id="ocr-share">Share</button>' +
            '<button class="sheet-button" id="ocr-save-txt">Save .txt</button>' +
            '<button class="sheet-button" id="ocr-save-md">Save .md</button>' +
            '</div>' +
            '<div class="mt-2 text-xs text-gray-500" id="ocr-status"></div>' +
            '</div>';
        const textBox = viewerEl('ocr-text');
        viewerEl('ocr-select').onclick = () => { textBox.select(); };
        viewerEl('ocr-copy').onclick = () => copyToClipboard(textBox.value);
        viewerEl('ocr-share').onclick = () => Bridge.call('shareText', current.name + ' — recognized text', textBox.value);
        viewerEl('ocr-save-txt').onclick = () => saveOcr(textBox.value, 'txt');
        viewerEl('ocr-save-md').onclick = () => saveOcr(textBox.value, 'md');
    }, 0);
}

function saveOcr(text, extension) {
    const current = viewerCurrent();
    if (!current) return;
    const result = Bridge.call('saveTextBeside', current.path, text, extension);
    const status = viewerEl('ocr-status');
    if (!status) return;
    if (result.ok) {
        status.textContent = 'Saved as ' + result.name + ' next to the image.';
        status.className = 'mt-2 text-xs text-gray-500';
    } else {
        status.textContent = result.error || 'Could not save.';
        status.className = 'mt-2 text-xs text-red-400';
    }
}

function renderInfoSheet() {
    const current = viewerCurrent();
    if (!current) return;
    viewerShowSheet('info',
        '<div class="sheet-pad"><div class="text-sm font-medium">Details</div>' +
        '<div class="mt-1 text-xs text-gray-500">Reading ' + escapeHtml(current.name) + '…</div></div>');
    setTimeout(() => {
        const detail = Bridge.call('imageInfo', current.path);
        if (!detail.ok) {
            viewerEl('viewer-sheet').innerHTML =
                '<div class="sheet-pad text-sm text-gray-400">' + escapeHtml(detail.error || 'no details') + '</div>';
            return;
        }
        const facts = [
            ['File', current.name],
            ['Size', detail.size != null ? humanSize(detail.size) : ''],
            ['Type', detail.mime],
            ['Width', detail.width],
            ['Height', detail.height],
            ['Taken', detail.date],
            ['Camera', [detail.make, detail.model].filter(Boolean).join(' ')],
            ['GPS', detail.latitude != null ? detail.latitude.toFixed(5) + ', ' + detail.longitude.toFixed(5) : '']
        ];
        viewerEl('viewer-sheet').innerHTML =
            '<div class="sheet-pad"><div class="text-sm font-medium">' + escapeHtml(current.name) + '</div>' +
            '<div class="mt-2 text-xs text-gray-500 space-y-0.5">' +
            facts.filter(pair => pair[1]).map(pair => sheetLine(pair[0], pair[1])).join('') +
            '</div></div>';
    }, 0);
}

viewerEl('viewer-close').onclick = () => closeViewer();
viewerEl('viewer-rotate').onclick = () => {
    const current = viewerCurrent();
    if (!current) return;
    const result = Bridge.call('rotateImage', current.path);
    if (!result.ok) { alert(result.error || 'Could not rotate.'); return; }
    viewerLoad();
};
viewerEl('viewer-scan').onclick = () => renderScanSheet();
viewerEl('viewer-ocr').onclick = () => renderOcrSheet();
viewerEl('viewer-info').onclick = () => renderInfoSheet();
viewerEl('viewer-share').onclick = () => {
    const current = viewerCurrent();
    if (current) reportFailure(Bridge.call('share', current.path));
};
viewerEl('viewer-delete').onclick = () => {
    const current = viewerCurrent();
    if (!current) return;
    if (!confirm('Delete ' + current.name + '? This cannot be undone.')) return;
    reportFailure(Bridge.call('delete', JSON.stringify([current.path])));
    viewer.images.splice(viewer.index, 1);
    if (!viewer.images.length) { closeViewer(); openDirectory(state.path); return; }
    if (viewer.index >= viewer.images.length) viewer.index = viewer.images.length - 1;
    viewerLoad();
};

/* ── shell ──────────────────────────────────────────────────────────────────── */

function showTab(tab) {
    state.tab = tab;
    document.querySelectorAll('.tab-button').forEach(button =>
        button.classList.toggle('active', button.dataset.tab === tab));
    if (tab === 'files') {
        if (Bridge.available && Bridge.raw('hasStorageAccess') !== true) renderPermissionPrompt();
        // An open file outlives a look at another tab. Losing unsaved edits to a stray tap
        // on "Configs" is the kind of thing an editor is judged on.
        else if (state.editor) renderEditor();
        else if (state.path) renderFiles();
        else startAtFirstPlace();
    } else if (tab === 'apps') renderApps();
    else if (tab === 'sync') renderSync();
    else if (tab === 'backups') renderBackups();
    else renderConfigs();
}

function startAtFirstPlace() {
    let places = [];
    try { places = JSON.parse(Bridge.raw('places') || '[]'); } catch (error) { places = []; }
    if (!places.length) { renderFilesError('No storage is readable on this phone.'); return; }
    openDirectory(places[0].path);
}

document.querySelectorAll('.tab-button').forEach(button => {
    button.onclick = () => showTab(button.dataset.tab);
});

// The hardware back button: close the editor, then step up a directory, and only
// then leave the app. (The PDF reader is its own activity: back closes it there.)
window.addEventListener('popstate', () => {
    if (state.tab !== 'files') return;
    if (state.editor) { closeEditor(); history.pushState(null, ''); }
    else if (state.parent) { openDirectory(state.parent); history.pushState(null, ''); }
});
history.pushState(null, '');

Settings.load();
showTab('files');
</script>
</body>
</html>
