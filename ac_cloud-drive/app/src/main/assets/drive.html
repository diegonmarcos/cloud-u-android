<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Cloud Drive</title>
    <script src="vendor/tailwind.js"></script>
    <!-- The PDF reader's one engine (#458). Classic scripts, same as tailwind.js:
         pdf.worker.min.js sets globalThis.pdfjsWorker, which pdf.min.js consumes
         as the MAIN-THREAD message handler — no Worker object, no fetch(), both
         blocked on file:// origins. Pinned version + hashes: vendor/VENDORED.md. -->
    <script src="vendor/pdf.min.js"></script>
    <script src="vendor/pdf.worker.min.js"></script>
    <style>
        :root {
            /* MainActivity overwrites these with the measured window insets. The env() values are
               the fallback for a desktop browser, where Chromium reports only the display cutout. */
            --sat: env(safe-area-inset-top, 0px);
            --sab: env(safe-area-inset-bottom, 0px);
            --sal: env(safe-area-inset-left, 0px);
            --sar: env(safe-area-inset-right, 0px);
        }

        html, body { margin: 0; padding: 0; background: #111827; height: 100%; }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            color: #e5e7eb;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Full-bleed app shell: the WebView IS the screen, no device bezel. */
        .app-container {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            padding-left: var(--sal);
            padding-right: var(--sar);
        }

        .app-header { padding-top: var(--sat); }
        .tab-bar { padding-bottom: var(--sab); }

        .tab-button.active { color: #60a5fa; border-color: #60a5fa; }
        .tab-button { color: #9ca3af; border-color: transparent; }

        .row:active { background: #1f2937; }
        .row.selected { background: #1e3a8a; }

        /* One line, ellipsised: a long file name must not push the size column off screen. */
        .clip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* ── the PDF reader (#458) ──────────────────────────────────────────────── */

        /* The zoomed page. transform-origin 0 0 keeps every scale round the page's
           own top-left corner, so the pinch/double-tap maths in the reader only has
           to track one point. The canvas and the text layer live inside and move
           together; the canvas bitmap is NEVER re-drawn by a zoom gesture. */
        #reader-stage { touch-action: none; }
        #reader-surface { touch-action: none; }

        /* Night mode is a CSS filter on the rendered page, exactly as #458 demands:
           the canvas is not re-rendered, the bitmap is untouched. hue-rotate(180deg)
           rides along so colours come back roughly right after inversion instead of
           turning cyan-and-magenta. The text layer (transparent text divs) inverts
           with the same filter so it stays readable and highlights stay visible. */
        .reader-night { filter: invert(1) hue-rotate(180deg); }

        /* The find-in-document highlight, drawn over the pdf.js text layer. */
        .pdf-mark { background: #fbbf24; color: #000; border-radius: 1px; }

        /* A disabled conversion target (docx/xlsx/odt) is visible but inert, with
           its one-line reason shown next to it — never a fake button that looks
           like it works. */
        .convert-target[disabled] { opacity: 0.4; }

        /* ── the image viewer overlay (task #459/#460) ──
           A sibling of the app shell, painting above the tab bar, so the image
           actually owns the screen while it is open. The sheet below it is a
           bottom panel for scan results / OCR / EXIF; the sheet, not a new
           page, keeps the viewer and its folder context on screen. */
        .viewer { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column;
                  background: #030712; padding-top: var(--sat); padding-bottom: var(--sab); }
        .viewer.hidden { display: none; }
        .viewer-top-bar { display: flex; align-items: center; gap: 0.4rem; height: 3rem;
                          padding: 0 0.5rem; background: #0f172a; border-bottom: 1px solid #1f2937;
                          color: #9ca3af; }
        .viewer-top-bar .viewer-name { flex: 1; min-width: 0; font-size: 0.75rem; color: #e5e7eb; }
        .viewer-top-bar button { padding: 0.25rem 0.5rem; font-size: 1rem; background: none; border: none;
                                 color: #9ca3af; }
        .viewer-top-bar button:active { color: #60a5fa; }
        .viewer-stage { flex: 1; position: relative; overflow: hidden; touch-action: none;
                        background: #030712; }
        .viewer-stage img { position: absolute; left: 50%; top: 50%; max-width: none; max-height: none;
                            transform-origin: center center; user-select: none; -webkit-user-drag: none;
                            will-change: transform; }
        .viewer-sheet { max-height: 62%; overflow-y: auto; background: #111827;
                        border-top: 1px solid #1f2937; }
        .viewer-sheet.hidden { display: none; }
        .viewer-sheet .sheet-pad { padding: 0.75rem 1rem; }
        .scan-action { display: block; width: 100%; text-align: left; padding: 0.6rem 0.75rem;
                       margin-top: 0.4rem; border-radius: 0.5rem; background: #1f2937;
                       color: #e5e7eb; font-size: 0.8rem; }
        .scan-action:active { background: #374151; }
        .viewer-sheet textarea { width: 100%; min-height: 8rem; box-sizing: border-box;
                                 background: #0f172a; color: #e5e7eb; border: 1px solid #374151;
                                 border-radius: 0.5rem; padding: 0.5rem; font-size: 0.8rem; }
        .viewer-sheet .sheet-button { padding: 0.4rem 0.75rem; border-radius: 0.5rem;
                                      background: #2563eb; color: white; font-size: 0.75rem; }
        .image-thumb { width: 2rem; height: 2rem; border-radius: 0.375rem; object-fit: cover;
                       background: #1f2937; flex-shrink: 0; }
    </style>
</head>
<body>
<div class="app-container">

    <header class="app-header sticky top-0 z-20 bg-gray-900 border-b border-gray-700">
        <div class="flex items-center justify-between px-4 h-12">
            <h1 class="text-base font-semibold">Cloud Drive</h1>
            <div id="header-actions" class="flex items-center gap-3 text-gray-500"></div>
        </div>
    </header>

    <main id="panel" class="flex-1 overflow-y-auto hide-scrollbar"></main>

    <!-- Files | Apps | Sync | Backups | Configs. The separator between Files and the rest is a plain
         character, matching how the SuperApp's Data Apps row marks the same boundary. Sync is the
         new home of the transfer surfaces: Rclone (the storage back ends that used to fill the Apps
         tab) and Git (the vendored GitSync lib's screen, once its Flutter UI is embedded). -->
    <nav class="tab-bar sticky bottom-0 z-20 bg-gray-900 border-t border-gray-700 flex">
        <button data-tab="files"   class="tab-button active flex-1 py-3 text-sm font-medium border-t-2">Files</button>
        <span class="self-center text-gray-600 select-none">|</span>
        <button data-tab="apps"    class="tab-button flex-1 py-3 text-sm font-medium border-t-2">Apps</button>
        <button data-tab="sync"    class="tab-button flex-1 py-3 text-sm font-medium border-t-2">Sync</button>
        <button data-tab="backups" class="tab-button flex-1 py-3 text-sm font-medium border-t-2">Backups</button>
        <button data-tab="configs" class="tab-button flex-1 py-3 text-sm font-medium border-t-2">Configs</button>
    </nav>
</div>

<!-- The image viewer overlay (task #459/#460). Created once, filled per image;
     it is a sibling of the app shell so the image paints over the tab bar. -->
<div id="viewer-root" class="viewer hidden">
    <div class="viewer-top-bar">
        <button id="viewer-close" title="Close">✕</button>
        <div class="viewer-name clip" id="viewer-name"></div>
        <span id="viewer-counter" class="text-xs text-gray-600"></span>
        <button id="viewer-rotate" title="Rotate 90°">↻</button>
        <button id="viewer-scan" title="Scan barcode">⌗</button>
        <button id="viewer-ocr" title="Read text">T</button>
        <button id="viewer-info" title="Details">ⓘ</button>
        <button id="viewer-share" title="Share">⇪</button>
        <button id="viewer-delete" title="Delete">🗑</button>
    </div>
    <div id="viewer-stage" class="viewer-stage">
        <img id="viewer-img" alt="" draggable="false" />
    </div>
    <div id="viewer-sheet" class="viewer-sheet hidden"></div>
</div>

<script>
/* ── bridge ──────────────────────────────────────────────────────────────────────
   Every call into FilesBridge returns a JSON string. Missing bridge (a desktop browser
   opening the asset directly) is answered with a failure rather than a thrown
   TypeError, so the page still renders and says why it is empty. */
const Bridge = {
    available: typeof FilesBridge !== 'undefined',
    call(name, ...args) {
        if (!this.available) return { ok: false, error: 'the storage bridge is not attached' };
        try {
            return JSON.parse(FilesBridge[name](...args));
        } catch (error) {
            return { ok: false, error: String(error) };
        }
    },
    raw(name, ...args) {
        if (!this.available) return null;
        try { return FilesBridge[name](...args); } catch (error) { return null; }
    }
};

const state = {
    tab: 'files',
    path: '',
    parent: '',
    entries: [],
    selection: new Set(),
    clipboard: { paths: [], move: false },
    sort: 'name',
    descending: false,
    showHidden: false,
    /* { path, name, original } while a file is open in the editor, null otherwise. The
       editor is a mode of the Files tab rather than a fifth tab, because what it edits is
       whatever the Files tab is looking at. */
    editor: null,
    /* Which Sync subpage is showing: 'rclone' or 'git'. Session state, not a setting —
       a subpage is not a choice a user expects to survive a restart. */
    syncSub: 'rclone',
    /* { path, name, base64, doc, page, ... } while a PDF is open in the reader, null
       otherwise. path is null when the PDF arrived through an "Open with" hand-off
       rather than from the Files tab. */
    reader: null,
    /* Night/invert mode of the reader. A setting: a reader that forgets it inverts to
       a white flash every time a document closes. */
    readerNight: false
};

/* The handful of choices that are settings rather than session state. domStorageEnabled is
   on in MainActivity, so localStorage is the whole store — no bridge call, no file, nothing
   to keep in step. A sort order that resets on every launch is not a setting, and the
   Configs tab was describing three values that did exactly that. */
const Settings = {
    key: 'cloud-drive-settings',
    load() {
        try {
            const stored = JSON.parse(localStorage.getItem(this.key) || '{}');
            if (stored.sort) state.sort = stored.sort;
            if (typeof stored.descending === 'boolean') state.descending = stored.descending;
            if (typeof stored.showHidden === 'boolean') state.showHidden = stored.showHidden;
            if (typeof stored.readerNight === 'boolean') state.readerNight = stored.readerNight;
        } catch (error) {
            // A corrupt entry is not worth a broken app. The defaults already stand.
        }
    },
    save() {
        try {
            localStorage.setItem(this.key, JSON.stringify({
                sort: state.sort, descending: state.descending, showHidden: state.showHidden,
                readerNight: state.readerNight
            }));
        } catch (error) {
            // Storage refused. The session still works, it just will not remember.
        }
    }
};

const panel = document.getElementById('panel');
const headerActions = document.getElementById('header-actions');

/* ── formatting ─────────────────────────────────────────────────────────────── */

function humanSize(bytes) {
    if (!bytes) return '—';
    const units = ['B', 'KB', 'MB', 'GB', 'TB'];
    let value = bytes, unit = 0;
    while (value >= 1024 && unit < units.length - 1) { value /= 1024; unit++; }
    return (unit === 0 ? value : value.toFixed(1)) + ' ' + units[unit];
}

function humanDate(millis) {
    if (!millis) return '';
    const date = new Date(millis);
    return date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function escapeHtml(text) {
    return String(text).replace(/[&<>"']/g, c =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
}

/** A folder, or a glyph standing in for the file's kind. No icon font is vendored. */
function glyphFor(entry) {
    if (entry.directory) return '📁';
    const mime = entry.mime || '';
    if (mime.startsWith('image/')) return '🖼️';
    if (mime.startsWith('video/')) return '🎬';
    if (mime.startsWith('audio/')) return '🎵';
    if (mime.startsWith('text/')) return '📄';
    if (mime.indexOf('pdf') >= 0) return '📕';
    if (mime.indexOf('zip') >= 0 || mime.indexOf('compressed') >= 0) return '🗜️';
    return '📄';
}

/** The image kinds the viewer opens. The platform MIME map is the one truth. */
function isImage(entry) {
    return !entry.directory && (entry.mime || '').startsWith('image/');
}

/* ── files tab ──────────────────────────────────────────────────────────────── */

function openDirectory(path) {
    const result = Bridge.call('list', path, state.sort, state.descending, state.showHidden);
    if (!result.ok) { renderFilesError(result.error); return; }
    state.path = result.path;
    state.parent = result.parent;
    state.entries = result.entries;
    state.selection.clear();
    renderFiles();
}

function renderFilesError(message) {
    panel.innerHTML =
        '<div class="p-6 text-center text-sm text-gray-500">' + escapeHtml(message) + '</div>';
    renderHeaderActions();
}

function renderPermissionPrompt() {
    panel.innerHTML =
        '<div class="p-6 space-y-4 text-center">' +
        '<div class="text-4xl">🔒</div>' +
        '<p class="text-sm text-gray-300">Cloud Drive manages the files on this phone, so Android ' +
        'needs you to allow management of all files. Nothing is read until you do.</p>' +
        '<button id="grant" class="px-4 py-2 rounded bg-blue-600 text-white text-sm font-medium">' +
        'Open the Android setting</button></div>';
    document.getElementById('grant').onclick = () => Bridge.call('requestStorageAccess');
    headerActions.innerHTML = '';
}

function renderPlaces() {
    let places = [];
    try { places = JSON.parse(Bridge.raw('places') || '[]'); } catch (error) { places = []; }
    if (!places.length) return '';
    const chip = place => {
        const kind = place.kind || 'path';
        const glyph = kind === 'tree' ? '💾' : kind === 'connect' ? '➕' : '';
        const probe = kind === 'path' ? ' data-path="' + escapeHtml(place.path) + '"'
            : kind === 'tree' ? ' data-uri="' + escapeHtml(place.uri) + '"' : ' data-connect="1"';
        return '<button class="place shrink-0 px-3 py-1 rounded-full bg-gray-800 text-xs" ' +
            'data-kind="' + kind + '"' + probe + '>' + glyph + ' ' + escapeHtml(place.label) + '</button>';
    };
    return '<div class="flex gap-2 px-4 py-2 overflow-x-auto hide-scrollbar border-b border-gray-800">' +
        places.map(chip).join('') + '</div>';
}

function renderUsage() {
    const usage = Bridge.call('usage', state.path);
    if (!usage.ok || !usage.total) return '';
    const used = usage.total - usage.free;
    const percent = Math.round(used / usage.total * 100);
    return '<div class="px-4 py-2 border-b border-gray-800">' +
        '<div class="h-1 rounded bg-gray-700 overflow-hidden">' +
        '<div class="h-full bg-blue-500" style="width:' + percent + '%"></div></div>' +
        '<div class="mt-1 text-[11px] text-gray-500">' + humanSize(used) + ' of ' +
        humanSize(usage.total) + ' used</div></div>';
}

function renderFiles() {
    const crumbs = state.path.split('/').filter(Boolean);
    const rows = state.entries.map((entry, index) =>
        '<div class="row flex items-center gap-3 px-4 py-2 border-b border-gray-800 ' +
        (state.selection.has(entry.path) ? 'selected' : '') + '" data-index="' + index + '">' +
        (isImage(entry)
            ? '<img class="image-thumb" data-path="' + escapeHtml(entry.path) + '" alt="" />'
            : '<span class="text-xl">' + glyphFor(entry) + '</span>') +
        '<div class="flex-1 min-w-0">' +
        '<div class="clip text-sm">' + escapeHtml(entry.name) + '</div>' +
        '<div class="text-[11px] text-gray-500">' +
        (entry.directory ? 'folder' : humanSize(entry.size)) + ' · ' + humanDate(entry.modified) +
        '</div></div>' +
        '<button class="more px-2 text-gray-500" data-index="' + index + '">⋮</button>' +
        '</div>'
    ).join('');

    panel.innerHTML =
        renderPlaces() +
        '<div class="px-4 py-2 text-[11px] text-gray-500 clip">/' + escapeHtml(crumbs.join(' / ')) + '</div>' +
        renderUsage() +
        (state.entries.length
            ? rows
            : '<div class="p-6 text-center text-sm text-gray-500">This folder is empty</div>') +
        renderSelectionBar();

    bindFileRows();
    renderHeaderActions();
}

function renderSelectionBar() {
    const count = state.selection.size;
    const pending = state.clipboard.paths.length;
    if (!count && !pending) return '';
    return '<div class="sticky bottom-0 bg-gray-900 text-white flex items-center gap-3 px-4 py-2 text-sm">' +
        (count ? '<span>' + count + ' selected</span>' +
            '<button id="act-copy" class="ml-auto">Copy</button>' +
            '<button id="act-move">Move</button>' +
            '<button id="act-delete" class="text-red-300">Delete</button>'
            : '<span>' + pending + ' ready to ' + (state.clipboard.move ? 'move' : 'copy') + '</span>' +
            '<button id="act-paste" class="ml-auto">Paste here</button>' +
            '<button id="act-cancel">Cancel</button>') +
        '</div>';
}

function bindFileRows() {
    panel.querySelectorAll('.place').forEach(button => {
        button.onclick = () => {
            const kind = button.dataset.kind || 'path';
            if (kind === 'tree') safariSheet(button.dataset.uri);
            else if (kind === 'connect') connectTreeGrant();
            else openDirectory(button.dataset.path);
        };
    });
    panel.querySelectorAll('.row').forEach(row => {
        const entry = state.entries[Number(row.dataset.index)];
        row.onclick = () => {
            if (state.selection.size) { toggleSelection(entry); return; }
            if (entry.directory) openDirectory(entry.path);
            // #458: cloud-drive reads PDFs itself instead of handing them to another
            // app — that is the point of being "a real PDF reader".
            else if (isPdfEntry(entry)) openReader(entry);

            // An image opens in the viewer (zoom, swipe, rotate, scan, OCR) — a
            // system gallery would be the app handing its one job to somebody
            // else, and the scan actions need this page's own bridge anyway.
            else if (isImage(entry)) openViewer(entry);
            else reportFailure(Bridge.call('open', entry.path));
        };
        // Long-press starts a selection, the way every file manager on this phone does.
        let timer = null;
        row.addEventListener('touchstart', () => {
            timer = setTimeout(() => toggleSelection(entry), 450);
        }, { passive: true });
        ['touchend', 'touchmove', 'touchcancel'].forEach(event =>
            row.addEventListener(event, () => clearTimeout(timer), { passive: true }));
    });
    // Thumbnails load lazily so a slow disk never stalls the list itself: the
    // row is on screen before the decode starts, and each one asks independently.
    panel.querySelectorAll('img.image-thumb').forEach(img => {
        const path = img.dataset.path;
        const thumb = Bridge.raw('imageThumb', path, 96);
        if (thumb) img.src = thumb;
    });
    panel.querySelectorAll('.more').forEach(button => {
        button.onclick = event => {
            event.stopPropagation();
            showEntryMenu(state.entries[Number(button.dataset.index)]);
        };
    });

    const bind = (id, handler) => { const el = document.getElementById(id); if (el) el.onclick = handler; };
    bind('act-copy', () => stageTransfer(false));
    bind('act-move', () => stageTransfer(true));
    bind('act-delete', deleteSelection);
    bind('act-paste', pasteHere);
    bind('act-cancel', () => { state.clipboard = { paths: [], move: false }; renderFiles(); });
}

function toggleSelection(entry) {
    if (state.selection.has(entry.path)) state.selection.delete(entry.path);
    else state.selection.add(entry.path);
    renderFiles();
}

function stageTransfer(move) {
    state.clipboard = { paths: [...state.selection], move: move };
    state.selection.clear();
    renderFiles();
}

function pasteHere() {
    const result = Bridge.call('transfer',
        JSON.stringify(state.clipboard.paths), state.path, state.clipboard.move);
    state.clipboard = { paths: [], move: false };
    reportFailure(result);
    openDirectory(state.path);
}

function deleteSelection() {
    const paths = [...state.selection];
    if (!paths.length) return;
    if (!confirm('Delete ' + paths.length + ' item' + (paths.length > 1 ? 's' : '') + '? This cannot be undone.')) return;
    reportFailure(Bridge.call('delete', JSON.stringify(paths)));
    openDirectory(state.path);
}

/* ── the bottom sheet ─────────────────────────────────────────────────────────
   One positioned <div>, owned here, that every menu in the app routes through:
   the per-entry ⋮ menu, the sort/view menu, the new-item menu and the tools menu
   all call openSheetMenu() and get the same slide-up panel, the same backdrop,
   and the same keyboard-close behaviour. No prompt(), no second component —
   a menu choice that needs text (rename, new file, a zip-pattern) opens a
   text input INSIDE the same sheet, so the numbered dialogs are gone entirely. */

const sheetRoot = (() => {
    let el = null;
    return () => {
        if (!el) {
            el = document.createElement('div');
            el.id = 'sheet-root';
            el.className = 'fixed inset-0 z-40 hidden';
            document.body.appendChild(el);
        }
        return el;
    };
})();

let sheetTimer = null;

function openSheet(html, onMount) {
    clearSheetTimer();
    const root = sheetRoot();
    root.innerHTML =
        '<div class="absolute inset-0 bg-black/60" data-sheet-close></div>' +
        '<div class="absolute bottom-0 left-0 right-0 bg-gray-900 border-t border-gray-700 ' +
        'rounded-t-2xl max-h-[75vh] overflow-y-auto hide-scrollbar" ' +
        'style="padding-bottom: calc(var(--sab) + 12px)">' +
        '<div class="sticky top-0 bg-gray-900 border-b border-gray-700 flex items-center ' +
        'justify-between px-4 py-3">' +
        '<span id="sheet-title" class="text-sm font-medium"></span>' +
        '<button data-sheet-close class="text-gray-500 text-xl leading-none">✕</button></div>' +
        '<div id="sheet-body" class="px-2"></div></div>';
    root.classList.remove('hidden');
    root.querySelector('#sheet-title').textContent = html.title || '';
    root.querySelector('#sheet-body').innerHTML = html.body || '';
    root.querySelectorAll('[data-sheet-close]').forEach(button => {
        button.onclick = () => closeSheet();
    });
    if (onMount) onMount(root);
}

function closeSheet() {
    clearSheetTimer();
    sheetRoot().classList.add('hidden');
    sheetRoot().innerHTML = '';
}

function clearSheetTimer() {
    if (sheetTimer) { clearInterval(sheetTimer); sheetTimer = null; }
}

function sheetMenu(title, items) {
    const rows = (items || []).map((item, index) =>
        '<button class="sheet-item w-full text-left px-4 py-3 text-sm flex items-center gap-3 ' +
        (item.disabled ? 'text-gray-600' : 'text-gray-200') + '" data-index="' + index + '" ' +
        (item.disabled ? 'disabled' : '') + '>' +
        '<span class="text-base w-6 text-center">' + escapeHtml(item.icon || '') + '</span>' +
        '<span class="flex-1">' + escapeHtml(item.label) + '</span>' +
        (item.note ? '<span class="text-[11px] text-gray-500">' + escapeHtml(item.note) + '</span>' : '') +
        '</button>').join('');
    openSheet({ title: title, body: rows }, root => {
        root.querySelectorAll('.sheet-item').forEach(button => {
            button.onclick = () => {
                const item = items[Number(button.dataset.index)];
                if (!item || item.disabled) return;
                if (!item.keepOpen) closeSheet();
                item.onPick();
            };
        });
    });
}

/** A text prompt in the sheet: used for rename, new-file and new-folder names, for the
 *  bulk-rename pattern and for searches. Replaces window.prompt() everywhere. */
function sheetPrompt(config) {
    const html = '<div class="px-4 py-4">' +
        (config.message ? '<p class="text-xs text-gray-400 mb-3">' + escapeHtml(config.message) + '</p>' : '') +
        '<input id="sheet-input" value="' + escapeHtml(config.value || '') + '" ' +
        'placeholder="' + escapeHtml(config.placeholder || '') + '" ' +
        'class="w-full px-3 py-2 rounded bg-gray-800 border border-gray-700 text-sm text-gray-200 outline-none">' +
        '<div class="mt-4 flex gap-2 justify-end">' +
        '<button data-sheet-close class="px-4 py-2 rounded bg-gray-800 text-sm text-gray-300">Cancel</button>' +
        '<button id="sheet-confirm" class="px-4 py-2 rounded bg-blue-600 text-white text-sm font-medium">' +
        escapeHtml(config.confirmLabel || 'OK') + '</button></div></div>';
    openSheet({ title: config.title || '', body: html }, root => {
        const input = root.querySelector('#sheet-input');
        input.focus();
        const confirm = () => {
            const value = input.value;
            closeSheet();
            config.onConfirm(value);
        };
        root.querySelector('#sheet-confirm').onclick = confirm;
        input.addEventListener('keydown', event => {
            if (event.key === 'Enter') confirm();
        });
    });
}

/** A confirm-or-cancel question in the sheet, for actions that destroy data. */
function sheetConfirm(config) {
    const html = '<div class="px-4 py-4">' +
        '<p class="text-sm text-gray-300">' + escapeHtml(config.message) + '</p>' +
        '<div class="mt-4 flex gap-2 justify-end">' +
        '<button data-sheet-close class="px-4 py-2 rounded bg-gray-800 text-sm text-gray-300">Cancel</button>' +
        '<button id="sheet-confirm" class="px-4 py-2 rounded bg-red-600 text-white text-sm font-medium">' +
        escapeHtml(config.confirmLabel || 'Delete') + '</button></div></div>';
    openSheet({ title: config.title || 'Please confirm', body: html }, root => {
        root.querySelector('#sheet-confirm').onclick = () => { closeSheet(); config.onConfirm(); };
    });
}

/** A read-only text sheet: the old details dialog, the search results and the duplicate
 *  report all render as paragraphs and/or rows here. */
function sheetText(title, lines) {
    const html = '<div class="px-4 py-4 space-y-2 text-sm text-gray-300">' +
        (lines || []).map(line => '<div>' + escapeHtml(line) + '</div>').join('') + '</div>';
    openSheet({ title: title, body: html });
}

/** The shared progress sheet for the long-running bridge jobs. Polls [statusMethod]
 *  until the job is done or cancelled; the sheet owns the one interval and the Cancel
 *  button, so every long job gets the same touchable surface. */
function pollJobPanel(token, statusMethod, runningText, finishFn) {
    openSheet({
        title: runningText,
        body: '<div class="px-4 py-6 text-center">' +
            '<div class="text-sm text-gray-400">Working…</div>' +
            '<button id="sheet-cancel" class="mt-4 px-4 py-2 rounded bg-gray-800 text-sm">Cancel</button></div>'
    }, root => {
        root.querySelector('#sheet-cancel').onclick = () => Bridge.call('cancelJob', token);
        sheetTimer = setInterval(() => {
            const status = Bridge.call(statusMethod, token);
            if (!status || status.ok === false) { clearSheetTimer(); return; }
            if (status.done) {
                clearSheetTimer();
                closeSheet();
                finishFn(status);
                return;
            }
            if (status.cancelled) {
                clearSheetTimer();
                sheetText('Cancelled', ['The job was cancelled before it finished.']);
                return;
            }
            const body = root.querySelector('#sheet-body');
            const progress = (status.scanned || 0) +
                (status.bytesProgress ? ' · ' + humanSize(status.bytesProgress) : '');
            if (body) body.innerHTML =
                '<div class="px-4 py-6 text-center">' +
                '<div class="text-sm text-gray-400">' + escapeHtml(runningText) + ' · ' + progress + '</div>' +
                '<button id="sheet-cancel" class="mt-4 px-4 py-2 rounded bg-gray-800 text-sm">Cancel</button></div>';
            const cancelButton = root.querySelector('#sheet-cancel');
            if (cancelButton) cancelButton.onclick = () => Bridge.call('cancelJob', token);
        }, 350);
    });
}

function openSearchPanel() {
    sheetPrompt({
        title: 'Search',
        placeholder: 'Search terms',
        confirmLabel: 'Search',
        onConfirm: query => {
            if (!query) return;
            const started = Bridge.call('search', state.path, query, true);
            if (!started.ok) { alert(started.error); return; }
            pollJobPanel(started.token, 'searchStatus', 'Searching…', status => {
                const rows = (status.entries || []).map(entry =>
                    (entry.directory ? '📁 ' : '') + entry.name +
                    (entry.matchedBy === 'content' ? '  (content match)' : ''));
                if (rows.length) {
                    rows.push(status.truncated ? '…results cut off at the search limit' : '');
                    sheetText('Search results', rows);
                } else {
                    sheetText('Search results', ['Nothing found under this folder.']);
                }
            });
        }
    });
}

function openPropertiesPanel(entry) {
    const started = Bridge.call('properties', entry.path);
    if (!started.ok) { alert(started.error); return; }
    pollJobPanel(started.token, 'propertiesStatus', 'Reading properties…', status => {
        const lines = ['Name: ' + entry.name];
        if (status.directory) {
            lines.push('Files: ' + (status.files || 0));
            lines.push('Folders: ' + (status.folders || 0));
        }
        lines.push('Size on disk: ' + humanSize(status.size));
        const perms = status.permissions || {};
        const bits = (perms.readable ? 'r' : '-') + (perms.writable ? 'w' : '-') +
            (perms.executable ? 'x' : '-');
        lines.push('Permission bits: ' + bits);
        if (status.md5) lines.push('MD5: ' + status.md5);
        if (status.sha256) lines.push('SHA-256: ' + status.sha256);
        sheetText('Properties', lines);
    });
}

function openPickForProperties() {
    const selected = [...state.selection];
    if (selected.length === 1) {
        const entry = state.entries.find(e => e.path === selected[0]);
        if (entry) { openPropertiesPanel(entry); return; }
    }
    openPropertiesPanel({ name: state.path.split('/').pop() || state.path, path: state.path });
}

function archiveSelection(paths) {
    const first = paths[0] || '';
    const base = first.split('/').pop() || 'archive';
    const defaultName = base.replace(/\.[^.]+$/, '') + '.zip';
    sheetPrompt({
        title: 'Archive',
        message: paths.length + ' item' + (paths.length === 1 ? '' : 's') + ' → one .zip in this folder',
        value: defaultName,
        confirmLabel: 'Create archive',
        onConfirm: name => {
            if (!name) return;
            if (!/\.zip$/i.test(name)) name = name + '.zip';
            const result = Bridge.call('archive', JSON.stringify(paths), state.path + '/' + name);
            reportFailure(result);
            openDirectory(state.path);
        }
    });
}

function promptExtract(zipPath) {
    const entry = state.entries.find(e => e.path === zipPath);
    const base = entry ? entry.name.replace(/\.zip$/i, '') : 'extracted';
    sheetPrompt({
        title: entry ? 'Extract ' + entry.name : 'Extract',
        value: base,
        confirmLabel: 'Extract',
        onConfirm: folderName => {
            if (!folderName) return;
            Bridge.call('createFolder', state.path, folderName);
            const destination = state.path + '/' + folderName;
            const result = Bridge.call('extract', zipPath, destination);
            reportFailure(result);
            if (result.count !== undefined) {
                openDirectory(state.path);
                sheetText('Extracted', [result.count + ' entries extracted into ' + folderName + '.']);
            }
        }
    });
}

function openBulkRenamePanel() {
    const selected = [...state.selection];
    if (selected.length < 2) { alert('Select at least two files first.'); return; }
    sheetPrompt({
        title: 'Rename by pattern',
        message: 'Tokens: {name} {n} {ext} {date} — for example: holiday-{n}',
        value: '{name}-{n}.{ext}',
        confirmLabel: 'Preview',
        onConfirm: pattern => {
            if (!pattern) { alert('A pattern is required.'); return; }
            const preview = Bridge.call('bulkRenamePreview', JSON.stringify(selected), pattern);
            if (!preview.ok) { alert(preview.error); return; }
            const plan = preview.plan || [];
            const blockedCount = plan.filter(row => row.reason && row.newName !== row.oldName).length;
            const rows = plan.map(row =>
                '<div class="px-4 py-1.5 text-xs border-b border-gray-800">' +
                '<span class="text-gray-500">' + escapeHtml(row.oldName) + '</span>' +
                ' → <span class="text-gray-200">' + escapeHtml(row.newName) + '</span>' +
                (row.reason && row.newName !== row.oldName
                    ? '<span class="text-amber-400"> (' + escapeHtml(row.reason) + ')</span>' : '') +
                '</div>').join('');
            openSheet({
                title: 'Rename preview',
                body: '<div class="max-h-[45vh] overflow-y-auto">' + rows + '</div>' +
                    '<div class="px-4 py-3 flex gap-2 justify-end">' +
                    '<button data-sheet-close class="px-4 py-2 rounded bg-gray-800 text-sm text-gray-300">Cancel</button>' +
                    '<button id="sheet-apply" class="px-4 py-2 rounded bg-blue-600 text-white text-sm font-medium"' +
                    (blockedCount ? ' disabled' : '') + '>Apply</button></div>' +
                    (blockedCount
                        ? '<div class="px-4 pb-3 text-xs text-amber-400">' +
                        blockedCount + ' conflict' + (blockedCount === 1 ? '' : 's') +
                        ' — nothing has been renamed yet.</div>'
                        : '')
            }, root => {
                const apply = root.querySelector('#sheet-apply');
                if (apply) apply.onclick = () => {
                    const applied = Bridge.call('bulkRename', JSON.stringify(selected), pattern);
                    closeSheet();
                    reportFailure(applied);
                    openDirectory(state.path);
                };
            });
        }
    });
}

function openDuplicatesPanel() {
    const started = Bridge.call('duplicates', state.path);
    if (!started.ok) { alert(started.error); return; }
    pollJobPanel(started.token, 'duplicatesStatus', 'Comparing files…', status => {
        const groups = Array.isArray(status.groups) ? status.groups : [];
        if (!groups.length) {
            sheetText('Duplicates', ['No duplicate files found under this folder.']);
            return;
        }
        const lines = groups.map(group =>
            humanSize(group.size) + ' × ' + group.paths.length + ' — ' + group.paths.join(' | '));
        sheetText('Duplicates', lines);
    });
}

/* ── the editor ─────────────────────────────────────────────────────────────────
   A textarea, deliberately. It is the platform's text editor: caret, selection,
   undo, autocorrect, the magnifier and the system clipboard all arrive for free and
   all behave the way they do in every other app on the phone. A syntax-highlighting
   editor component would be a vendored dependency re-implementing every one of them,
   and #228 exists because of exactly that kind of second private copy. */

function openEditor(entry) {
    const result = Bridge.call('readText', entry.path);
    // The bridge refuses a file that is too large or is not text, and says which.
    // Both refusals protect the file: an editor that opens what it cannot represent
    // writes back damage on the first save.
    if (!result.ok) { alert(result.error); return; }
    state.editor = { path: result.path, name: result.name, original: result.text };
    renderEditor();
}

function renderEditor() {
    panel.innerHTML =
        '<div class="px-4 py-2 text-[11px] text-gray-500 clip border-b border-gray-800">' +
        escapeHtml(state.editor.name) + '</div>' +
        '<textarea id="editor-text" spellcheck="false" autocapitalize="off" ' +
        'autocorrect="off" class="block w-full min-h-[70vh] p-4 font-mono text-xs ' +
        'leading-5 outline-none resize-none bg-gray-900 text-gray-200">' + escapeHtml(state.editor.original) +
        '</textarea>';
    renderHeaderActions();
}

/** True when the textarea holds something other than what was last read or written. */
function editorIsDirty() {
    const box = document.getElementById('editor-text');
    return !!box && box.value !== state.editor.original;
}

function saveEditor() {
    const box = document.getElementById('editor-text');
    if (!box) return;
    const text = box.value;
    const result = Bridge.call('writeText', state.editor.path, text);
    if (!result.ok) { alert(result.error); return; }
    // What is on disk is now the baseline, so closing no longer warns and a second
    // save of untouched text is still correct rather than being suppressed.
    state.editor.original = text;
    renderHeaderActions();
}

function closeEditor() {
    if (editorIsDirty() && !confirm('Close without saving? The changes are lost.')) return;
    state.editor = null;
    openDirectory(state.path);
}

/** Only speaks up when something went wrong: a silent failure is what makes a bridge feel broken. */
function reportFailure(result) {
    if (result && result.ok === false && result.error) alert(result.error);
}

function renderHeaderActions() {
    if (state.tab !== 'files') { headerActions.innerHTML = ''; return; }
    if (state.reader) {
        // The reader bar has its own ← Close; the persistent header keeps one too
        // so the top-right corner never goes dead while a document is open.
        headerActions.innerHTML = '<button id="reader-close-top" class="text-sm">Close</button>';
        document.getElementById('reader-close-top').onclick = closeReader;
        return;
    }
    if (state.editor) {
        headerActions.innerHTML =
            '<button id="editor-save" class="text-sm font-medium text-blue-400">Save</button>' +
            '<button id="editor-close" class="text-sm">Close</button>';
        document.getElementById('editor-save').onclick = saveEditor;
        document.getElementById('editor-close').onclick = closeEditor;
        return;
    }
    headerActions.innerHTML =
        (state.parent ? '<button id="up" title="Up">⬆️</button>' : '') +
        '<button id="new-item" title="New folder or file">➕</button>' +
        '<button id="sort" title="Sort and view">↕️</button>' +
        '<button id="tools" title="Search, zip, properties">🧰</button>';
    const up = document.getElementById('up');
    if (up) up.onclick = () => openDirectory(state.parent);
    document.getElementById('new-item').onclick = newItemMenu;
    document.getElementById('sort').onclick = sortMenu;
    document.getElementById('tools').onclick = toolsMenu;
}

/* ── the other tabs (Apps, Sync, Backups, Configs) ───────────────────────────────────────────────────── */

function card(title, body) {
    return '<div class="mx-4 my-2 p-4 rounded-lg border border-gray-700">' +
        '<div class="text-sm font-medium">' + escapeHtml(title) + '</div>' +
        '<div class="mt-1 text-xs text-gray-500">' + body + '</div></div>';
}

/* The storage back ends, baked in from data/drive-connections.json. Read once: it is build-time
   data, so it cannot change while the app is open. Borg and Bup are backup repositories rather
   than live storage, which is exactly the Sync/Backups split — one list, one predicate, no second
   copy of the data to keep in step. */
const BACKUP_KINDS = ['borg', 'bup'];

let connectionsCache = null;
function connections() {
    if (connectionsCache === null) {
        const raw = Bridge.raw('connections');
        try {
            connectionsCache = raw ? JSON.parse(raw) : [];
        } catch (error) {
            connectionsCache = [];
        }
    }
    return connectionsCache;
}

function connectionCard(entry) {
    const light = entry.status === 'ok' ? 'bg-green-500'
        : entry.status === 'down' ? 'bg-red-500' : 'bg-gray-400';
    const facts = [
        ['Kind', entry.kind],
        ['Where', entry.endpoint],
        ['Auth', entry.auth],
        ['Host', entry.vm],
        ['Scope', entry.scope]
    ].filter(pair => pair[1]).map(pair =>
        '<div class="flex gap-2"><span class="w-12 shrink-0 text-gray-500">' + pair[0] + '</span>' +
        '<span class="break-all">' + escapeHtml(String(pair[1])) + '</span></div>').join('');
    return '<div class="mx-4 my-2 p-4 rounded-lg border border-gray-700">' +
        '<div class="flex items-center gap-2">' +
        '<span class="w-2 h-2 rounded-full ' + light + '"></span>' +
        '<span class="text-sm font-medium">' + escapeHtml(entry.name || 'Unnamed') + '</span></div>' +
        '<div class="mt-2 text-xs text-gray-500 space-y-0.5">' + facts + '</div>' +
        (entry.notes
            ? '<div class="mt-2 text-xs text-gray-500">' + escapeHtml(entry.notes) + '</div>'
            : '') +
        '</div>';
}

/* ── Apps: a grid of icon links out to the data apps ────────────────────────────────
   #437: the storage back ends that used to fill this tab live under Sync > Rclone now;
   this tab presents the fleet's data apps as icon links, matching how the SuperApp
   renders its tiles. The list comes from FilesBridge.apps() — built from
   data/drive-apps.json (selection + presentation) resolved against the constellation
   fleet manifest (identity) — so there is no second copy of the app list to keep in
   step. Tapping a tile launches the app; one that is not installed and carries a
   fallback URL opens that instead. */

function appTile(app, index) {
    return '<button class="app-tile flex flex-col items-center gap-1.5 w-1/4 p-2" data-index="' + index + '">' +
        '<span class="w-12 h-12 rounded-full bg-gray-800 flex items-center justify-center text-xl">' +
        escapeHtml(app.icon) + '</span>' +
        '<span class="text-[11px] text-gray-300 text-center leading-tight">' +
        escapeHtml(app.label) + '</span></button>';
}

function renderApps() {
    let apps = [];
    try { apps = JSON.parse(Bridge.raw('apps') || '[]'); } catch (error) { apps = []; }
    panel.innerHTML = '<div class="pt-2">' + (apps.length
        ? '<div class="flex flex-wrap px-2 py-2">' + apps.map(appTile).join('') + '</div>'
        : card('Nothing here', 'No apps are declared in this build.')) + '</div>';
    panel.querySelectorAll('.app-tile').forEach(tile => {
        tile.onclick = () => {
            const app = apps[Number(tile.dataset.index)];
            if (!app) return;
            reportFailure(Bridge.call('openApp', JSON.stringify(app)));
        };
    });
    headerActions.innerHTML = '';
}

/* ── Sync ───────────────────────────────────────────────────────────────────────────
   #437: Sync owns the transfer surfaces. Two subpages, switched by the chips at the
   top, exactly like the Configs choices: Rclone — the storage back ends that used to
   fill the Apps tab, rendered with the same connectionCard() as the Backups tab so
   there is no second copy of that renderer — and Git, which hosts the vendored
   GitSync lib's screen. Until the Flutter engine is embedded (see
   ab_cloud-libs-shared/libs/gitsync/VENDORED.md) the Git subpage states the honest
   state of the lib instead of a fake-populated screen. */

function syncChoice(value, label) {
    const active = state.syncSub === value;
    return '<button class="sync-choice px-3 py-1 rounded text-xs ' +
        (active ? 'bg-blue-600 text-white' : 'bg-gray-800 text-gray-300') + '" ' +
        'data-sub="' + value + '">' + escapeHtml(label) + '</button>';
}

function syncSubHeader() {
    return '<div class="flex gap-2 px-4 pt-3 pb-1">' +
        syncChoice('rclone', 'Rclone') +
        syncChoice('git', 'Git') +
        '</div>';
}

function renderSync() {
    const sub = state.syncSub === 'git' ? renderGitSubpage() : renderRcloneSubpage();
    panel.innerHTML = syncSubHeader() + sub;
    panel.querySelectorAll('.sync-choice').forEach(button => {
        button.onclick = () => {
            state.syncSub = button.dataset.sub;
            renderSync();
        };
    });
    headerActions.innerHTML = '';
}

function renderRcloneSubpage() {
    const rows = connections().filter(entry => !BACKUP_KINDS.includes(entry.kind));
    return '<div class="pt-2">' + (rows.length
        ? rows.map(connectionCard).join('')
        : card('Nothing here', 'No storage back ends are declared in this build.')) + '</div>';
}

function renderGitSubpage() {
    return '<div class="pt-2">' +
        card('Git sync',
            'The GitSync sync engine is vendored as a library in this repository at ' +
            'ab_cloud-libs-shared/libs/gitsync (GPL-3.0, pinned upstream revision ' +
            '0f4902fc). Its Flutter user interface is not embedded in this tab yet; the ' +
            'embedding work is tracked in VENDORED.md at that path. Until it lands, this ' +
            'subpage deliberately shows nothing that pretends to be a repository list.') +
        '</div>';
}

/* ── the Backups tab ─────────────────────────────────────────────────────────────
   build.json says this tab covers ON-DEVICE backup sets, and until now it showed the
   fleet's borg and bup repositories — remote repositories under a heading that
   promised local ones. Both belong here, so both are shown and each is labelled for
   what it is: the mirror jobs this app can actually run, and the repositories that
   are somebody else's process.

   The mirror jobs are #330's Rsync. It lives in this tab rather than in a fifth one
   because a scheduled one-way folder copy IS an on-device backup set — the surface
   the tab was already named for. */

const MIRROR_JOBS = (() => {
    let cache = null;
    return () => {
        if (cache === null) {
            try { cache = JSON.parse(Bridge.raw('mirrorJobs') || '[]'); } catch (error) { cache = []; }
        }
        return cache;
    };
})();

function mirrorJobCard(job, index) {
    const fact = (label, value) =>
        '<div class="flex gap-2"><span class="w-10 shrink-0 text-gray-500">' + label +
        '</span><span class="break-all">' + escapeHtml(String(value)) + '</span></div>';
    return '<div class="mx-4 my-2 p-4 rounded-lg border border-gray-700">' +
        '<div class="flex items-center gap-2">' +
        '<span class="flex-1 text-sm font-medium">' + escapeHtml(job.name || 'Unnamed') + '</span>' +
        '<button class="run-mirror px-3 py-1 rounded bg-blue-600 text-white text-xs" ' +
        'data-index="' + index + '">Run</button></div>' +
        '<div class="mt-2 text-xs text-gray-500 space-y-0.5">' +
        fact('From', job.source) + fact('To', job.destination) + '</div>' +
        (job.delete
            ? '<div class="mt-2 text-xs text-amber-400">Removes whatever the source no longer has.</div>'
            : '') +
        (job.notes ? '<div class="mt-2 text-xs text-gray-500">' + escapeHtml(job.notes) + '</div>' : '') +
        '<div class="mirror-result mt-2 text-xs text-gray-500" data-index="' + index + '"></div>' +
        '</div>';
}

function heading(text) {
    return '<div class="px-4 pt-4 pb-1 text-[11px] font-medium uppercase tracking-wide text-gray-500">' +
        escapeHtml(text) + '</div>';
}

function renderBackups() {
    const jobs = MIRROR_JOBS();
    const repositories = connections().filter(entry => BACKUP_KINDS.includes(entry.kind));
    panel.innerHTML =
        heading('On-device mirrors') +
        (jobs.length
            ? jobs.map(mirrorJobCard).join('')
            : card('Nothing here', 'No mirror jobs are declared in this build.')) +
        heading('Fleet repositories') +
        (repositories.length
            ? repositories.map(connectionCard).join('')
            : card('Nothing here', 'No backup repositories are declared in this build.')) +
        '<div class="h-4"></div>';
    bindMirrorButtons(jobs);
    headerActions.innerHTML = '';
}

function bindMirrorButtons(jobs) {
    panel.querySelectorAll('.run-mirror').forEach(button => {
        button.onclick = () => {
            const index = Number(button.dataset.index);
            const job = jobs[index];
            if (job.delete && !confirm(job.name + '\n\nThis job deletes anything in the ' +
                'destination that the source no longer has. Run it?')) return;

            const line = panel.querySelector('.mirror-result[data-index="' + index + '"]');
            line.className = 'mirror-result mt-2 text-xs text-gray-500';
            line.textContent = 'Running…';
            button.disabled = true;

            // The bridge call is synchronous and a full pass over a camera roll is not
            // instant, so hand the browser one frame to paint "Running…" before blocking
            // on it. ponytail: a frame, not a worker — move the walk onto a background
            // thread with a progress callback if a pass ever grows past a few seconds.
            setTimeout(() => {
                const result = Bridge.call('mirror', job.source, job.destination, !!job.delete);
                if (result.copied === undefined) {
                    line.className = 'mirror-result mt-2 text-xs text-red-400';
                    line.textContent = result.error || 'the mirror failed';
                } else {
                    line.className = 'mirror-result mt-2 text-xs ' +
                        (result.failed ? 'text-amber-400' : 'text-gray-500');
                    line.textContent =
                        result.copied + ' copied · ' + result.skipped + ' already there · ' +
                        result.deleted + ' removed · ' + result.failed + ' failed';
                }
                button.disabled = false;
            }, 0);
        };
    });
}

/* Settings, not a read-out. The three values here were shown as text and could only be
   changed from the Files tab's sort prompt, which made this tab a description of state
   rather than the place that holds it — and none of it survived a restart. */
function renderConfigs() {
    const granted = Bridge.available && Bridge.raw('hasStorageAccess') === true;
    const chip = (attribute, value, label, active) =>
        '<button class="cfg-choice px-2 py-1 rounded text-xs ' +
        (active ? 'bg-blue-600 text-white' : 'bg-gray-800 text-gray-300') + '" ' +
        'data-' + attribute + '="' + value + '">' + escapeHtml(label) + '</button>';

    panel.innerHTML =
        '<div class="pt-2">' +
        card('All-files access', granted
            ? 'Granted — the Files tab can manage this phone\'s storage.'
            : 'Not granted. <button id="cfg-grant" class="underline text-blue-400">Open the Android setting</button>') +
        card('Default sort',
            '<div class="flex flex-wrap gap-2 mt-2">' +
            chip('sort', 'name', 'Name', state.sort === 'name') +
            chip('sort', 'size', 'Size', state.sort === 'size') +
            chip('sort', 'modified', 'Modified', state.sort === 'modified') +
            chip('sort', 'type', 'Type', state.sort === 'type') +
            '</div><div class="flex flex-wrap gap-2 mt-2">' +
            chip('descending', 'false', 'Ascending', !state.descending) +
            chip('descending', 'true', 'Descending', state.descending) +
            '</div>') +
        card('Hidden files',
            '<div class="flex flex-wrap gap-2 mt-2">' +
            chip('hidden', 'false', 'Hidden', !state.showHidden) +
            chip('hidden', 'true', 'Shown', state.showHidden) +
            '</div>') +
        '</div>';

    const grant = document.getElementById('cfg-grant');
    if (grant) grant.onclick = () => Bridge.call('requestStorageAccess');
    panel.querySelectorAll('.cfg-choice').forEach(button => {
        button.onclick = () => {
            if (button.dataset.sort) state.sort = button.dataset.sort;
            else if (button.dataset.descending) state.descending = button.dataset.descending === 'true';
            else state.showHidden = button.dataset.hidden === 'true';
            Settings.save();
            // The Files tab re-lists on its next visit, so nothing to refresh but this one.
            renderConfigs();
        };
    });
    headerActions.innerHTML = '';
}

/* ── the PDF reader ─────────────────────────────────────────────────────────────
   #458: cloud-drive reads PDFs itself, with pdf.js vendored at assets/vendor/
   (pinned version + hashes in VENDORED.md). One mechanism only — Android's
   PdfRenderer is never used, and pdf.js never receives a URL: FilesBridge.readPdf
   carries base64 over the bridge and the page hands getDocument({ data }) bytes,
   because Chromium blocks fetch() on file:// origins.

   The canvas is rendered once per page; every zoom gesture (pinch, double-tap) is
   a CSS transform on #reader-stage, so zoom never re-renders the page. Re-render
   happens on page change, and on zoom-settle only when the zoom has moved far
   enough to matter (keeps pages crisp instead of blurry at 2x+). Night mode is a
   CSS filter on that same stage — invert(1) hue-rotate(180deg) — the bitmap is
   untouched, as the task requires. */

const NO_TEXT_LAYER_MESSAGE =
    'This PDF has no text layer, so a scan cannot be converted on the phone — ' +
    'nothing was written.';

function isPdfEntry(entry) {
    const mime = (entry.mime || '').toLowerCase();
    const name = entry.name || '';
    return mime === 'application/pdf' || /\.pdf$/i.test(name);
}

function base64ToBytes(base64) {
    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);
    for (let index = 0; index < binary.length; index++) bytes[index] = binary.charCodeAt(index);
    return bytes;
}

/** One shape for a reader session, whichever route opened it (row, boot, hand-off). */
function makeReaderState(base64, name, path, returnPath) {
    return {
        path: path, returnPath: returnPath, name: name, base64: base64,
        doc: null, loadingTask: null, page: 1, pageCount: 0,
        fitScale: 1, baseWidth: 0, baseHeight: 0, renderZoom: 1,
        t: { x: 0, y: 0, s: 1 },
        renderTask: null, findQuery: '', findResults: []
    };
}

function openReader(entry) {
    // The whole document arrives as one base64 string — the same carrier that made
    // the file:// fetch question disappear. readPdf enforces a size ceiling on the
    // native side so this cannot become an out-of-memory kill.
    const result = Bridge.call('readPdf', entry.path);
    if (!result.ok) { alert(result.error); return; }
    state.reader = makeReaderState(result.base64, result.name, result.path, state.path);
    renderReader();
}

function closeReader() {
    if (!state.reader) return;
    // A loading or open document owns a worker-side document; destroy it so the
    // next document does not ride on stale state.
    try { if (state.reader.loadingTask) state.reader.loadingTask.destroy(); } catch (error) { /* best effort */ }
    const returnPath = state.reader.returnPath;
    state.reader = null;
    if (returnPath) openDirectory(returnPath);
    else startAtFirstPlace();
}

function readerStatus(text, isError) {
    const status = document.getElementById('reader-status');
    if (!status) return;
    status.textContent = text || '';
    status.classList.toggle('text-red-400', !!isError);
    status.classList.toggle('text-gray-400', !isError);
}

function renderReader() {
    const reader = state.reader;
    panel.innerHTML =
        '<div class="flex flex-col h-full">' +
        '<div class="flex items-center gap-2 px-3 py-2 border-b border-gray-700 bg-gray-900">' +
        '<button id="reader-back" class="px-1 text-lg leading-none">‹</button>' +
        '<div class="flex-1 min-w-0 clip text-sm font-medium">' + escapeHtml(reader.name) + '</div>' +
        '<button id="reader-find" title="Find in document" class="text-sm">🔍</button>' +
        '<button id="reader-outline" title="Document outline" class="text-sm">☰</button>' +
        '<button id="reader-night" title="Night / invert" class="text-sm">🌙</button>' +
        '<button id="reader-convert" title="Convert" class="text-sm">⇄</button>' +
        '</div>' +
        '<div id="reader-tools" class="border-b border-gray-800 bg-gray-900"></div>' +
        '<div id="reader-surface" class="relative flex-1 overflow-hidden bg-gray-950">' +
        '<div id="reader-stage" class="absolute" style="transform-origin:0 0">' +
        '<canvas id="reader-canvas" style="position:absolute;left:0;top:0"></canvas>' +
        '<div id="reader-text-layer" style="position:absolute;left:0;top:0;overflow:hidden"></div>' +
        '</div></div>' +
        '<div class="flex items-center gap-2 px-3 py-1.5 border-t border-gray-700 bg-gray-900 text-xs">' +
        '<button id="reader-prev" class="px-1">‹</button>' +
        '<input id="reader-page-input" class="w-10 text-center bg-gray-800 rounded text-gray-200" ' +
        'inputmode="numeric" value="' + reader.page + '">' +
        '<span id="reader-page-count" class="text-gray-500">/ ' + (reader.pageCount || '?') + '</span>' +
        '<button id="reader-next" class="px-1">›</button>' +
        '<span class="flex-1"></span>' +
        '<button id="reader-zoom-out" class="px-1">−</button>' +
        '<span id="reader-zoom-label" class="text-gray-500 w-10 text-center">100%</span>' +
        '<button id="reader-zoom-in" class="px-1">+</button>' +
        '</div>' +
        '<div id="reader-status" class="px-3 py-1 text-[11px] text-gray-400 bg-gray-900"></div>' +
        '</div>';

    bindReaderControls();
    if (state.readerNight) {
        // The filter is a persistent preference; re-apply it to the rebuilt stage.
        document.getElementById('reader-stage').classList.add('reader-night');
    }
    readerOpenDocument();
    renderHeaderActions();
}

function bindReaderControls() {
    const surface = document.getElementById('reader-surface');
    const reader = state.reader;

    document.getElementById('reader-back').onclick = closeReader;
    document.getElementById('reader-find').onclick = readerToggleFind;
    document.getElementById('reader-outline').onclick = readerToggleOutline;
    document.getElementById('reader-night').onclick = readerToggleNight;
    document.getElementById('reader-convert').onclick = readerToggleConvert;
    document.getElementById('reader-prev').onclick = () => readerGoToPage(reader.page - 1);
    document.getElementById('reader-next').onclick = () => readerGoToPage(reader.page + 1);
    document.getElementById('reader-zoom-in').onclick = () => readerAnchoredZoom(surface.clientWidth / 2, surface.clientHeight / 2, 1.5);
    document.getElementById('reader-zoom-out').onclick = () => readerAnchoredZoom(surface.clientWidth / 2, surface.clientHeight / 2, 0.6667);
    document.getElementById('reader-page-input').addEventListener('keydown', event => {
        if (event.key !== 'Enter') return;
        const value = Number(event.target.value);
        if (value >= 1) readerGoToPage(Math.round(value));
        else event.target.value = String(reader.page);
    });

    // ── gestures ────────────────────────────────────────────────────
    // touch-action: none on the surface keeps Chromium's own pinch and double-tap
    // zoom from fighting the reader's (the page's preventDefault alone is not
    // enough when the browser decides the gesture first). Every handler is
    // passive:false so preventDefault is legal.
    let pinch = null;
    let pan = null;
    let lastTap = { at: 0, x: 0, y: 0 };

    const distance = (a, b) => Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    const midpoint = (a, b) => ({ x: (a.clientX + b.clientX) / 2, y: (a.clientY + b.clientY) / 2 });

    surface.addEventListener('touchstart', event => {
        if (event.touches.length === 2) {
            // A pinch anchors the stage point that was under the initial midpoint to
            // the moving midpoint, which is the gesture users expect: the page stays
            // under the fingers while it grows.
            const [a, b] = [event.touches[0], event.touches[1]];
            pinch = { startDistance: distance(a, b), startScale: reader.t.s, startMid: midpoint(a, b), startT: { x: reader.t.x, y: reader.t.y } };
            event.preventDefault();
        } else if (event.touches.length === 1) {
            pan = { startX: event.touches[0].clientX, startY: event.touches[0].clientY, startT: { x: reader.t.x, y: reader.t.y } };
            event.preventDefault();
        }
    }, { passive: false });

    surface.addEventListener('touchmove', event => {
        if (pinch && event.touches.length === 2) {
            event.preventDefault();
            const [a, b] = [event.touches[0], event.touches[1]];
            const next = midpoint(a, b);
            const scale = clamp(pinch.startScale * distance(a, b) / pinch.startDistance, 0.5, 8);
            // Anchor math: the stage coordinate that sat under the starting midpoint
            // (startMid - startT) / startScale must sit under the current midpoint.
            const stageX = (pinch.startMid.x - pinch.startT.x) / pinch.startScale;
            const stageY = (pinch.startMid.y - pinch.startT.y) / pinch.startScale;
            reader.t.s = scale;
            reader.t.x = next.x - stageX * scale;
            reader.t.y = next.y - stageY * scale;
            readerApplyTransform();
        } else if (pan && event.touches.length === 1) {
            event.preventDefault();
            reader.t.x = pan.startT.x + (event.touches[0].clientX - pan.startX);
            reader.t.y = pan.startT.y + (event.touches[0].clientY - pan.startY);
            readerApplyTransform();
        }
    }, { passive: false });

    surface.addEventListener('touchend', event => {
        if (event.touches.length === 0) {
            if (pinch) {
                readerSettleZoom(surface.clientWidth / 2, surface.clientHeight / 2);
                pinch = null;
            }
            // Double-tap toggles between fit and 2.5x around the tap point. Two
            // quick taps are NOT two pans, so this is recognised before pan resets.
            if (pan && event.changedTouches.length) {
                const touch = event.changedTouches[0];
                const now = Date.now();
                if (now - lastTap.at < 320 && Math.hypot(touch.clientX - lastTap.x, touch.clientY - lastTap.y) < 40) {
                    const zoomTarget = (reader.t.s * reader.renderZoom) >= 2 ? 1 : 2.5;
                    readerZoomAt(touch.clientX, touch.clientY, zoomTarget);
                    readerSettleZoom(touch.clientX, touch.clientY);
                    lastTap.at = 0;
                } else {
                    lastTap = { at: now, x: touch.clientX, y: touch.clientY };
                }
            }
            pan = null;
        }
    }, { passive: true });

    surface.addEventListener('touchcancel', () => {
        pinch = null;
        pan = null;
    }, { passive: true });
}

function clamp(value, minimum, maximum) {
    return Math.min(maximum, Math.max(minimum, value));
}

function readerApplyTransform() {
    const reader = state.reader;
    const stage = document.getElementById('reader-stage');
    if (!stage || !reader) return;
    readerClamp();
    stage.style.transform = 'translate(' + reader.t.x + 'px, ' + reader.t.y + 'px) scale(' + reader.t.s + ')';
    const label = document.getElementById('reader-zoom-label');
    if (label) label.textContent = Math.round(reader.t.s * reader.renderZoom * 100) + '%';
}

function readerClamp() {
    const reader = state.reader;
    const surface = document.getElementById('reader-surface');
    if (!surface || !reader || !reader.baseWidth) return;
    const canvasCssX = reader.baseWidth * reader.fitScale * reader.renderZoom;
    const canvasCssY = reader.baseHeight * reader.fitScale * reader.renderZoom;
    // The page may never be flung fully off screen: keep at least part of it
    // under the surface on every axis.
    reader.t.x = clamp(reader.t.x, surface.clientWidth - canvasCssX - 8, 8);
    reader.t.y = clamp(reader.t.y, surface.clientHeight - canvasCssY - 8, 8);
}

/** Zoom so the stage point under (anchorX, anchorY) stays under that point. */
function readerZoomAt(anchorX, anchorY, targetTotal) {
    const reader = state.reader;
    if (!reader.baseWidth) return;
    const stageX = (anchorX - reader.t.x) / reader.t.s;
    const stageY = (anchorY - reader.t.y) / reader.t.s;
    const total = clamp(targetTotal, 0.5, 8);
    reader.t.s = total / reader.renderZoom;
    reader.t.x = anchorX - stageX * reader.t.s;
    reader.t.y = anchorY - stageY * reader.t.s;
    readerApplyTransform();
}

/** Button zoom: same anchor maths, fixed factor, from the surface centre. */
function readerAnchoredZoom(anchorX, anchorY, factor) {
    const reader = state.reader;
    readerZoomAt(anchorX, anchorY, (reader.t.s * reader.renderZoom) * factor);
    readerSettleZoom(anchorX, anchorY);
}

/**
 * When a zoom gesture settles, a CSS-transformed bitmap gets blurry quickly. If the
 * total zoom has moved meaningfully since the last render (more than ~11% in either
 * direction), re-render at the new zoom — capped at 4x because a canvas for an A4
 * page at 8x on a 3x-density screen is past the hardware texture limit. The
 * document point that was under the surface centre stays under it.
 */
async function readerSettleZoom(anchorX, anchorY) {
    const reader = state.reader;
    if (!reader.baseWidth || !reader.doc) return;
    const total = reader.t.s * reader.renderZoom;
    const nextRender = clamp(total, 0.5, 4);
    if (nextRender === reader.renderZoom) return;
    const stageX = (anchorX - reader.t.x) / reader.t.s;
    const stageY = (anchorY - reader.t.y) / reader.t.s;
    const docX = stageX / (reader.fitScale * reader.renderZoom);
    const docY = stageY / (reader.fitScale * reader.renderZoom);
    reader.renderZoom = nextRender;
    reader.t.s = total / nextRender;
    reader.t.x = anchorX - docX * reader.fitScale * nextRender;
    reader.t.y = anchorY - docY * reader.fitScale * nextRender;
    readerApplyTransform();
    await readerRenderPage(reader.page);
}

/** Ask pdf.js for the text-layer content of one page, as plain text. */
async function pagePlainText(page) {
    const textContent = await page.getTextContent();
    let text = '';
    for (const item of textContent.items) {
        if (typeof item.str !== 'string') continue; // marked-content nodes carry no string
        text += item.str;
        // hasEOL is set by pdf.js when the text item ends a line; without it the
        // next item continues the same visual line, so a space is the honest join.
        text += item.hasEOL ? '\n' : ' ';
    }
    return text;
}

async function readerOpenDocument() {
    const reader = state.reader;
    if (typeof pdfjsLib === 'undefined') {
        readerStatus('the PDF engine is missing from this build', true);
        return;
    }
    // A tab round trip rebuilt the DOM but the document stayed alive on state
    // (it is only destroyed by closeReader), so repaint instead of re-decoding
    // the base64 and re-parsing the PDF.
    if (reader.doc) {
        const countLabel = document.getElementById('reader-page-count');
        if (countLabel) countLabel.textContent = '/ ' + reader.pageCount;
        const input = document.getElementById('reader-page-input');
        if (input) input.value = String(reader.page);
        await readerRenderPage(reader.page);
        readerApplyTransform();
        return;
    }
    try {
        // The worker is already loaded as a classic script (vendor/pdf.worker.min.js
        // sets globalThis.pdfjsWorker), so pdf.js uses its main-thread message
        // handler and never constructs a Worker or fetches anything. Declaring
        // workerSrc is documentation only, to keep the fallback path honest.
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'vendor/pdf.worker.min.js';
        const loadingTask = pdfjsLib.getDocument({ data: base64ToBytes(reader.base64) });
        reader.loadingTask = loadingTask;
        const documentProxy = await loadingTask.promise;
        reader.doc = documentProxy;
        reader.pageCount = documentProxy.numPages;
        document.getElementById('reader-page-count').textContent = '/ ' + reader.pageCount;
        document.getElementById('reader-page-input').value = String(reader.page);
        await readerRenderPage(1);
        readerApplyTransform();
        readerStatus(reader.pageCount + (reader.pageCount === 1 ? ' page' : ' pages'));
    } catch (error) {
        // A render cancelled by a page turn is not a failure; everything else is.
        readerStatus('cannot open this PDF: ' + error.message, true);
    }
}

async function readerGoToPage(pageNumber) {
    const reader = state.reader;
    if (!reader.doc) return;
    const target = clamp(Math.round(pageNumber), 1, reader.pageCount || 1);
    reader.page = target;
    const input = document.getElementById('reader-page-input');
    if (input) input.value = String(target);
    await readerRenderPage(target);
}

async function readerRenderPage(pageNumber) {
    const reader = state.reader;
    if (!reader.doc || pageNumber < 1) return;
    const surface = document.getElementById('reader-surface');
    const stage = document.getElementById('reader-stage');
    const canvas = document.getElementById('reader-canvas');
    const textLayer = document.getElementById('reader-text-layer');
    if (!surface || !stage || !canvas || !textLayer) return;

    // A previous page's render must not paint over this one: cancel it, losing a
    // settled frame is better than a torn one.
    if (reader.renderTask) {
        try { reader.renderTask.cancel(); } catch (error) { /* cancelled is fine */ }
        reader.renderTask = null;
    }

    const page = await reader.doc.getPage(pageNumber);
    const viewport1 = page.getViewport({ scale: 1 });
    reader.baseWidth = viewport1.width;
    reader.baseHeight = viewport1.height;
    // Fit-to-width is the reader's "100%": a page as wide as the surface. It is
    // recomputed per page so a page that is wider or narrower than the first one
    // still fits, but only while the user has not zoomed or panned — once they
    // have, the zoom they chose keeps applying page to page.
    const baseFit = surface.clientWidth > 0 ? surface.clientWidth / viewport1.width : 1;
    if (reader.renderZoom === 1 &&
        reader.t.s === 1 && reader.t.x === 0 && reader.t.y === 0) {
        reader.fitScale = baseFit;
    }
    const cssScale = reader.fitScale * reader.renderZoom;
    const deviceScale = (window.devicePixelRatio || 1);
    // Backing store at the device's pixel density so a 1:1 CSS page is sharp.
    const renderViewport = page.getViewport({ scale: cssScale * deviceScale });

    canvas.width = Math.max(1, Math.round(renderViewport.width));
    canvas.height = Math.max(1, Math.round(renderViewport.height));
    canvas.style.width = Math.round(viewport1.width * cssScale) + 'px';
    canvas.style.height = Math.round(viewport1.height * cssScale) + 'px';
    stage.style.width = canvas.style.width;
    stage.style.height = canvas.style.height;
    textLayer.style.width = canvas.style.width;
    textLayer.style.height = canvas.style.height;

    const context = canvas.getContext('2d');
    const task = page.render({ canvasContext: context, viewport: renderViewport });
    reader.renderTask = task;
    try {
        await task.promise;
    } catch (error) {
        // A cancelled render is not a failure: a page turn, zoom-settle or close
        // superseded this frame, and the caller already started the next one.
        return;
    } finally {
        if (reader.renderTask === task) reader.renderTask = null;
    }

    await readerRenderTextLayer(page, cssScale, textLayer);
}

/** Renders pdf.js's transparent text divs over the canvas — the layer find reads. */
async function readerRenderTextLayer(page, cssScale, container) {
    const reader = state.reader;
    if (!reader.doc) return;
    container.innerHTML = '';
    const textDivs = [];
    const textContent = await page.getTextContent();
    // A text layer is what makes find-in-document visible and text selectable;
    // a scan has nothing to draw, which is fine — the search surface says so.
    pdfjsLib.renderTextLayer({
        textContent: textContent,
        container: container,
        viewport: page.getViewport({ scale: cssScale }),
        textDivs: textDivs
    });
    if (reader.findQuery) readerHighlightMatches(container, reader.findQuery);
}

function readerToggleNight() {
    state.readerNight = !state.readerNight;
    const stage = document.getElementById('reader-stage');
    if (stage) stage.classList.toggle('reader-night', state.readerNight);
    Settings.save();
}

/* ── find in document over the text layer ─────────────────────────────────── */

function readerToggleFind() {
    const tools = document.getElementById('reader-tools');
    if (!tools) return;
    if (tools.dataset.mode === 'find') { tools.dataset.mode = ''; tools.innerHTML = ''; return; }
    tools.dataset.mode = 'find';
    tools.innerHTML =
        '<input id="find-input" class="m-2 mb-1 w-[calc(100%-1rem)] bg-gray-800 rounded px-2 py-1 text-sm text-gray-200" ' +
        'placeholder="Find in document">' +
        '<div id="find-results" class="max-h-36 overflow-y-auto border-t border-gray-800"></div>';
    document.getElementById('find-input').oninput = event => {
        const query = event.target.value.trim();
        if (!query) { state.reader.findQuery = ''; clearFindHighlights(); return; }
        readFindDebounce(query);
    };
}

let findDebounceTimer = null;
function readFindDebounce(query) {
    clearTimeout(findDebounceTimer);
    findDebounceTimer = setTimeout(() => readerRunFind(query), 250);
}

async function readerRunFind(query) {
    const reader = state.reader;
    if (!reader.doc) return;
    reader.findQuery = query;
    const results = document.getElementById('find-results');
    if (!results) return;
    results.innerHTML = '<div class="px-3 py-2 text-xs text-gray-500">Searching…</div>';
    const matches = [];
    const needle = query.toLowerCase();
    for (let pageNumber = 1; pageNumber <= reader.pageCount; pageNumber++) {
        const page = await reader.doc.getPage(pageNumber);
        const text = await pagePlainText(page);
        const lower = text.toLowerCase();
        let at = lower.indexOf(needle);
        while (at !== -1 && matches.length < 500) {
            const start = Math.max(0, at - 30);
            const end = Math.min(text.length, at + query.length + 30);
            const snippet = text.slice(start, end).replace(/\s+/g, ' ').trim();
            matches.push({ page: pageNumber, snippet: snippet, at: at });
            at = lower.indexOf(needle, at + query.length);
        }
        // Yield between pages so a long scan does not freeze the UI thread.
        if (pageNumber % 5 === 0) await new Promise(resolve => setTimeout(resolve, 0));
    }
    reader.findResults = matches;
    renderFindResults(matches);
    // Highlight the matches that are on the page being viewed, right away.
    readerRenderPage(reader.page);
}

function renderFindResults(matches) {
    const results = document.getElementById('find-results');
    if (!results) return;
    if (!matches.length) {
        results.innerHTML = '<div class="px-3 py-2 text-xs text-gray-500">No matches</div>';
        return;
    }
    results.innerHTML = '<div class="px-3 py-1 text-[11px] text-gray-500">' + matches.length +
        (matches.length === 1 ? ' match' : ' matches') + '</div>' +
        matches.map((match, index) =>
            '<button class="find-hit block w-full text-left px-3 py-1.5 border-b border-gray-800 text-xs ' +
            '" data-index="' + index + '">' +
            '<span class="text-blue-400">p.' + match.page + '</span> ' +
            escapeHtml(match.snippet) + '</button>'
        ).join('');
    results.querySelectorAll('.find-hit').forEach(button => {
        button.onclick = () => {
            const match = matches[Number(button.dataset.index)];
            readerGoToPage(match.page);
        };
    });
}

function readerHighlightMatches(container, query) {
    const needle = query.toLowerCase();
    Array.from(container.querySelectorAll('div')).forEach(div => {
        const text = div.textContent || '';
        const lower = text.toLowerCase();
        if (!lower.includes(needle)) return;
        const mark = document.createElement('mark');
        mark.className = 'pdf-mark';
        const pieces = [];
        let cursor = 0;
        let at = lower.indexOf(needle);
        while (at !== -1) {
            if (at > cursor) pieces.push(document.createTextNode(text.slice(cursor, at)));
            const span = mark.cloneNode();
            span.textContent = text.slice(at, at + query.length);
            pieces.push(span);
            cursor = at + query.length;
            at = lower.indexOf(needle, cursor);
        }
        if (cursor < text.length) pieces.push(document.createTextNode(text.slice(cursor)));
        div.textContent = '';
        pieces.forEach(piece => div.appendChild(piece));
    });
}

async function clearFindHighlights() {
    const reader = state.reader;
    const layer = document.getElementById('reader-text-layer');
    if (!layer || !reader.doc) return;
    // Re-running the text layer render is the honest reset: it rebuilds the divs
    // without the marks, and the divs are the layer — nothing else keeps a copy.
