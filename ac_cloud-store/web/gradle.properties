org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.caching=false
kotlin.code.style=official
# The wasm compiler (K2 + Compose + skiko) needs a few GB; compile inside the gradle JVM so it
# shares one heap setting instead of a second, default-sized Kotlin daemon.
kotlin.compiler.execution.strategy=in-process
