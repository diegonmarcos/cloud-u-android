// :clock — the Clock section's rules (#768) as a plain-JVM module: alarm recurrence, timers,
// stopwatch, interval phases, what each wakeup does, and the stored JSON. No Android here, so
// the suite runs in milliseconds and PIT can mutate it — the app's Robolectric suites cannot be
// mutation-run at a sane cost.
plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'info.solidsoft.pitest'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    // Android's own org.json at runtime; the real library for the JVM suite and PIT.
    compileOnly 'org.json:json:20240303'
    testImplementation 'org.json:json:20240303'
    testImplementation 'junit:junit:4.13.2'
}

// MUTATION TESTING. PIT plants mutants (flipped comparisons, removed calls, swapped returns) in
// ClockLogic and ClockCodec and runs ClockLogicTest against each; a mutant the suite does not
// kill is a rule nothing checks. Below mutationThreshold the build fails. Kotlin's generated
// data-class members are excluded: equality is the language's, not ours.
pitest {
    pitestVersion = '1.22.1'
    targetClasses = ['com.diegonmarcos.cloudcalc.clock.ClockLogic*', 'com.diegonmarcos.cloudcalc.clock.ClockCodec*']
    excludedMethods = ['equals', 'hashCode', 'toString', 'copy', 'copy$default', 'component*']
    avoidCallsTo = ['kotlin.jvm.internal']
    threads = 2
    outputFormats = ['XML', 'HTML']
    timestampedReports = false
    mutationThreshold = 85
}

// `gradle test` is what CI runs (build.json::tests.unit.task): the mutation run rides on it.
tasks.named('test') { finalizedBy 'pitest' }
