// :tools-core — everything Cloud Tools Small LLMs decides or computes, as a plain-JVM module: the
// build.json::tools parser, the task registry priced by the shared catalogue, the Jev and chat
// router requests and the parsing of their decisions, the worker call, the cost of a call from
// OpenRouter's usage, the day / month ledger and the token vault's rules. No Android here, so its
// suite runs against RECORDED OpenRouter JSON (src/test/resources/fixtures) and PIT can mutate it.
plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'info.solidsoft.pitest'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

// The registry suite prices every task against the fleet's ONE catalogue: libs:model-catalogue's
// logic package (ModelCatalogue.parse, no UI import in it) and its catalogue.json, compiled into
// the TEST source set by reference (Cloud Code compiles the same directory into its app), never a copy.
def catalogueLib = new File(projectDir, '../../ab_cloud-libs-shared/libs/model-catalogue')
sourceSets {
    test {
        kotlin.srcDirs += new File(catalogueLib, 'src/main/kotlin/com/diegonmarcos/superapp/modelcatalogue')
        resources.srcDirs += new File(catalogueLib, 'src/main/assets')
    }
}

dependencies {
    // The fleet's Decisions API client and its Http door (shared with Cloud Calc and the image engine).
    implementation project(':libs:decisions')
    // Android's own org.json at runtime; the real library for the JVM suite and PIT.
    compileOnly 'org.json:json:20240303'
    testImplementation 'org.json:json:20240303'
    testImplementation 'junit:junit:4.13.2'
}

pitest {
    pitestVersion = '1.22.1'
    targetClasses = ['com.diegonmarcos.cloudtoolssmallllms.core.*']
    excludedMethods = ['equals', 'hashCode', 'toString', 'copy', 'copy$default', 'component*']
    avoidCallsTo = ['kotlin.jvm.internal']
    threads = 2
    outputFormats = ['XML', 'HTML']
    timestampedReports = false
    mutationThreshold = 70
}

// `gradle test` is what CI runs (build.json::tests.unit.task): the mutation run rides on it.
tasks.named('test') { finalizedBy 'pitest' }
