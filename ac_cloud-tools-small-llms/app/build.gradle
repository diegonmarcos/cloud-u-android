plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def buildJson = new groovy.json.JsonSlurper().parse(file('../build.json'))

// Version code: minutes since 2026-01-01 UTC over a 3,000,000 base — the fleet encoding
// (ac_cloud-calc / ac_cloud-c3), so an update is never refused as older.
def codeFinal = { ->
    def base  = java.time.LocalDateTime.of(2026, 1, 1, 0, 0)
    def built = java.time.LocalDateTime.now(java.time.ZoneOffset.UTC)
    def stamp = System.getenv('COMMS_BUILD_TIMESTAMP')
    if (stamp) {
        try {
            built = java.time.LocalDateTime.parse(stamp,
                java.time.format.DateTimeFormatter.ofPattern('yyyyMMdd.HHmmss'))
        } catch (ignored) { }
    }
    long mins = java.time.Duration.between(base, built).toMinutes()
    return mins > 0 ? (int) (3000000L + mins) : 3000000
}()

def shortSha = (System.getenv('GITHUB_SHA')
                ?: providers.exec {
                       commandLine 'git', 'rev-parse', '--short=8', 'HEAD'
                       ignoreExitValue = true
                   }.standardOutput.asText.get().trim())
                .take(8)

def buildTimestamp = new java.text.SimpleDateFormat("yyyy-MM-dd HH:mm:ss 'UTC'").with {
    setTimeZone(java.util.TimeZone.getTimeZone('UTC'))
    format(new java.util.Date())
}

def logSinkUrl    = (buildJson.diagnostics?.log_sink_url    ?: '')
def logSinkStream = (buildJson.diagnostics?.log_sink_stream ?: 'cloud-tools-small-llms')

def b64 = { obj -> groovy.json.JsonOutput.toJson(obj).bytes.encodeBase64().toString() }

// ── the declarations, baked ────────────────────────────────────────────────
// #868 ui.bottom_nav + ui.sections + ui.default_section are THE navigation declaration
// (libs:bottomnav's NavDecl); build.json::tools is THE task / router declaration, parsed and
// validated on the phone by :tools-core's ToolsConfig. Decl.kt is the only decoder.
if (!buildJson.ui?.bottom_nav || !buildJson.ui?.sections)
    throw new GradleException("build.json::ui.bottom_nav / ui.sections missing — the island would draw nothing (#868)")
if (buildJson.tools == null)
    throw new GradleException("build.json::tools missing — the app would have no task to route to")
def uiSectionsB64    = b64(buildJson.ui.sections)
def uiBottomNav      = buildJson.ui.bottom_nav.join(',')
def uiDefaultSection = (buildJson.ui.default_section ?: buildJson.ui.bottom_nav[0]).toString()
def toolsConfigB64   = b64(buildJson.tools)

android {
    namespace 'com.diegonmarcos.cloudtoolssmallllms'
    compileSdk 36

    defaultConfig {
        // Launcher label = build.json::name, the application's one name (#351).
        resValue "string", "app_name", buildJson.name
        applicationId 'com.diegonmarcos.cloudtoolssmallllms'
        minSdk 26
        targetSdk 35
        // English is the fleet's base language (#299).
        resConfigs "en"
        versionCode codeFinal
        versionName "${buildJson.android.version_name} (sha-${shortSha})"
        ndk {
            def abiOverride = System.getenv('CLOUDTOOLS_ABIS')
            def abis = (abiOverride?.trim()) \
                ? abiOverride.split(',').collect { it.trim() }.findAll { it } \
                : (buildJson.android.abi_filters ?: ['arm64-v8a'])
            abiFilters.addAll(abis as List)
        }
        buildConfigField "String", "GIT_SHORT_SHA",      "\"${shortSha}\""
        buildConfigField "String", "BUILD_TIMESTAMP",    "\"${buildTimestamp}\""
        buildConfigField "String", "LOG_SINK_URL",       "\"${logSinkUrl}\""
        buildConfigField "String", "LOG_SINK_STREAM",    "\"${logSinkStream}\""
        buildConfigField "String", "UI_SECTIONS_B64",    "\"${uiSectionsB64}\""
        buildConfigField "String", "UI_BOTTOM_NAV",      "\"${uiBottomNav}\""
        buildConfigField "String", "UI_DEFAULT_SECTION", "\"${uiDefaultSection}\""
        buildConfigField "String", "TOOLS_CONFIG_B64",   "\"${toolsConfigB64}\""
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures {
        buildConfig = true
        compose = true
    }

    // ONE shared Cloud-constellation key — same key as every other app in the fleet.
    signingConfigs {
        debug {
            def envStore = System.getenv("ANDROID_KEYSTORE_FILE")
            if (envStore == null || envStore.isEmpty() || !file(envStore).exists()) {
                throw new GradleException("ONE shared constellation key required; run via build.sh / set ANDROID_KEYSTORE_FILE; no fallback")
            }
            storeFile     file(envStore)
            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
            keyAlias      System.getenv("ANDROID_KEY_ALIAS")
            keyPassword   System.getenv("ANDROID_KEY_PASSWORD")
        }
    }

    buildTypes {
        debug   { debuggable true;  signingConfig signingConfigs.debug }
        release { debuggable true; minifyEnabled false
                  proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
                  signingConfig signingConfigs.debug }
    }

    packaging {
        resources {
            excludes += ['META-INF/NOTICE.md', 'META-INF/LICENSE.md',
                         'META-INF/NOTICE',    'META-INF/LICENSE']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation project(':libs:core')
    // The fleet's bottom-nav island; this app supplies its own entries from ui.bottom_nav.
    implementation project(':libs:bottomnav')
    // Every decision and every number: plain JVM, mutation-tested on its own (core/build.gradle).
    implementation project(':tools-core')
    // The Decisions API client and its Http door (UrlHttp over Android's resolver, so the fleet DNS menu applies).
    implementation project(':libs:decisions')
    // The AI tab's chat: libs:ai's page, sessions and contract over this app's own router backend (ToolsModel).
    implementation project(':libs:ai')
    // The shared model catalogue: the workers' and routers' prices (live, cached, the snapshot offline).
    implementation project(':libs:model-catalogue')
    // The fleet Account over the ITextTools binder: only WHETHER it holds an OpenRouter key, never the key.
    implementation project(':libs:text-tools')
    // The user's own token: EncryptedSharedPreferences over an Android Keystore key.
    implementation 'androidx.security:security-crypto:1.1.0'

    implementation platform('androidx.compose:compose-bom:2025.11.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'   // lifecycleScope: the model's coroutines end with the Activity
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.core:core-ktx:1.15.0'
    // themes.xml's parent, Theme.Material3.Dark.NoActionBar, lives here.
    implementation 'com.google.android.material:material:1.12.0'

    testImplementation 'junit:junit:4.13.2'
}
