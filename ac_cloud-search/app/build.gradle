plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def buildJson = new groovy.json.JsonSlurper().parse(file('../build.json'))

// Version code: minutes since 2026-01-01 UTC over a 3,000,000 base — the fleet encoding
// (ac_cloud-calc / ac_cloud-drive), so an update is never refused as older.
def codeFinal = { ->
    def base  = java.time.LocalDateTime.of(2026, 1, 1, 0, 0)
    def built = java.time.LocalDateTime.now(java.time.ZoneOffset.UTC)
    def stamp = System.getenv('COMMS_BUILD_TIMESTAMP')
    if (stamp) {
        try {
            built = java.time.LocalDateTime.parse(stamp,
                java.time.format.DateTimeFormatter.ofPattern('yyyyMMdd.HHmmss'))
        } catch (ignored) { }
    }
    long mins = java.time.Duration.between(base, built).toMinutes()
    return mins > 0 ? (int) (3000000L + mins) : 3000000
}()

def shortSha = (System.getenv('GITHUB_SHA')
                ?: providers.exec {
                       commandLine 'git', 'rev-parse', '--short=8', 'HEAD'
                       ignoreExitValue = true
                   }.standardOutput.asText.get().trim())
                .take(8)

def buildTimestamp = new java.text.SimpleDateFormat("yyyy-MM-dd HH:mm:ss 'UTC'").with {
    setTimeZone(java.util.TimeZone.getTimeZone('UTC'))
    format(new java.util.Date())
}

def b64 = { obj -> groovy.json.JsonOutput.toJson(obj).bytes.encodeBase64().toString() }

// ── the declaration, baked ─────────────────────────────────────────────────
// build.json::search is the ONE declaration of verticals, sources, feeds, engines, calculators and
// the AI chat; core/Config.kt parses and validates it on the phone (and in the JVM suite).
if (buildJson.search == null) throw new GradleException("build.json::search missing — the app would have nothing to search")
def searchConfigB64 = b64(buildJson.search)
// #913b the agents catalogue (definitions + templates), build.json::agents, baked apart: one Java string constant holds at
// most 65535 bytes, and Cloud Browser bakes build.json::search whole. Decl.kt puts it back under search.agents.
def agentsB64 = b64(buildJson.agents ?: [:])
[searchConfigB64, agentsB64].each { if (it.length() > 65000) throw new GradleException("a baked declaration is ${it.length()} bytes: a Java string constant holds 65535") }
// #868 the nav declaration: ui.bottom_nav (the island), ui.sections (what each item opens), ui.default_section.
def uiBottomNav      = (buildJson.ui?.bottom_nav ?: []).join(',')
def uiSectionsB64    = b64(buildJson.ui?.sections ?: [])
def uiDefaultSection = (buildJson.ui?.default_section ?: '').toString()
// The one declared exception to the fleet island (nav-shape.json::variants): the owner's HTML mockup bar.
def uiStyle          = (buildJson.ui?.style ?: '').toString()
def debugGroup = (buildJson.ui?.debug_api?.group ?: '').toString()
if (!debugGroup) throw new GradleException("build.json::ui.debug_api.group missing — /api/<group>/* would register under no name")
def darkDefault = (buildJson.ui?.dark_default ?: false) as boolean

// Where results open (build.json::open_with): the fleet row's package, for the intent AND the
// manifest's <queries> — on API 30+ an unqueried package reads exactly like "not installed".
def fleetAppsFile = new File(rootDir, '../aa_cloud-superapp/data/constellation-fleet.json')
def openWithId = buildJson.open_with?.fleet
if (!openWithId) throw new GradleException("build.json::open_with.fleet missing — results would open nowhere in particular")
def openWithRow = new groovy.json.JsonSlurper().parse(fleetAppsFile).apps.find { it.id == openWithId }
if (openWithRow == null)
    throw new GradleException("build.json::open_with.fleet '${openWithId}' is not in the constellation fleet manifest ($fleetAppsFile)")
def browserPackage = openWithRow.package.toString()
// #913 Cloud Mail's package (the agent door's authority is <package>.<search.agents.engines.mail.authority_suffix>) and the
// fleet's own app rows (Cloud Search ▸ Apps), both read from the constellation manifest.
def fleetManifest = new groovy.json.JsonSlurper().parse(fleetAppsFile)
def agentMailFleet = buildJson.search?.agents?.engines?.mail?.fleet
if (!agentMailFleet) throw new GradleException("build.json::search.agents.engines.mail.fleet missing — the Agents tab would not know whose mail to read")
def agentMailRow = fleetManifest.apps.find { it.id == agentMailFleet }
if (agentMailRow == null)
    throw new GradleException("build.json::search.agents.engines.mail.fleet '${agentMailFleet}' is not in the constellation fleet manifest ($fleetAppsFile)")
def mailPackage = agentMailRow.package.toString()
def fleetAppsB64 = b64(fleetManifest.apps.findAll { it.kind == 'app' }.collect { [id: it.id, label: it.label, package: it.package] })

android {
    namespace 'com.diegonmarcos.cloudsearch'
    compileSdk 36

    defaultConfig {
        // Launcher label = build.json::name, the application's one name (#351).
        resValue "string", "app_name", buildJson.name
        applicationId 'com.diegonmarcos.cloudsearch'
        minSdk 26
        targetSdk 35
        // English is the fleet's base language (#299).
        resConfigs "en"
        versionCode codeFinal
        versionName "${buildJson.android.version_name} (sha-${shortSha})"
        ndk {
            def abiOverride = System.getenv('CLOUDSEARCH_ABIS')
            def abis = (abiOverride?.trim()) \
                ? abiOverride.split(',').collect { it.trim() }.findAll { it } \
                : (buildJson.android.abi_filters ?: ['arm64-v8a'])
            abiFilters.addAll(abis as List)
        }
        buildConfigField "String",  "GIT_SHORT_SHA",     "\"${shortSha}\""
        buildConfigField "String",  "BUILD_TIMESTAMP",   "\"${buildTimestamp}\""
        buildConfigField "String",  "UI_BOTTOM_NAV",     "\"${uiBottomNav}\""
        buildConfigField "String",  "UI_SECTIONS_B64",   "\"${uiSectionsB64}\""
        buildConfigField "String",  "UI_DEFAULT_SECTION", "\"${uiDefaultSection}\""
        buildConfigField "String",  "UI_STYLE",          "\"${uiStyle}\""
        buildConfigField "String",  "SEARCH_CONFIG_B64", "\"${searchConfigB64}\""
        buildConfigField "String",  "AGENTS_B64",        "\"${agentsB64}\""
        buildConfigField "String",  "DEBUG_API_GROUP",   "\"${debugGroup}\""
        buildConfigField "boolean", "DARK_DEFAULT",      "${darkDefault}"
        buildConfigField "String",  "BROWSER_PACKAGE",   "\"${browserPackage}\""
        buildConfigField "String",  "MAIL_PACKAGE",      "\"${mailPackage}\""
        buildConfigField "String",  "FLEET_APPS_B64",    "\"${fleetAppsB64}\""
        manifestPlaceholders = [browserPackage: browserPackage, mailPackage: mailPackage]
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures {
        buildConfig = true
        compose = true
    }

    // ONE shared Cloud-constellation key — same key as every other app in the fleet.
    signingConfigs {
        debug {
            def envStore = System.getenv("ANDROID_KEYSTORE_FILE")
            if (envStore == null || envStore.isEmpty() || !file(envStore).exists()) {
                throw new GradleException("ONE shared constellation key required; run via build.sh / set ANDROID_KEYSTORE_FILE; no fallback")
            }
            storeFile     file(envStore)
            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
            keyAlias      System.getenv("ANDROID_KEY_ALIAS")
            keyPassword   System.getenv("ANDROID_KEY_PASSWORD")
        }
    }

    buildTypes {
        debug   { debuggable true;  signingConfig signingConfigs.debug }
        release { debuggable true; minifyEnabled false
                  proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  signingConfig signingConfigs.debug }
    }

    packaging {
        resources {
            excludes += ['META-INF/NOTICE.md', 'META-INF/LICENSE.md',
                         'META-INF/NOTICE',    'META-INF/LICENSE']
        }
    }

    testOptions {
        unitTests {
            // SearchShellTest composes every vertical and subpage under Robolectric against the
            // app's real resources (the CalcShellTest precedent).
            includeAndroidResources = true
            all {
                testLogging {
                    events 'failed'
                    exceptionFormat 'full'
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation project(':libs:core')
    // #797 no libs:ui-kit: Cloud Search draws its OWN chrome from the owner's mockup (ui/Glass.kt —
    // glass theme, top bar; Phosphor icons in res/drawable). #868 its bottom nav and sub-page strips
    // are the fleet's: libs:bottomnav (BottomNavIsland, PageTabs), declared by build.json::ui.
    implementation project(':libs:bottomnav')
    // The fleet Account's OpenRouter token, read over the ITextTools binder (a contract lib).
    implementation project(':libs:text-tools')
    // Everything computed or parsed: plain JVM, mutation-tested on its own (core/build.gradle).
    implementation project(':search-core')
    // #823 the Search page (engine boxes + AI chat), shared with Cloud Browser; this app hosts and themes it.
    implementation project(':libs:search-page')

    implementation platform('androidx.compose:compose-bom:2025.11.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.core:core-ktx:1.15.0'
    // themes.xml's parent, Theme.Material3.Dark.NoActionBar, lives here.
    implementation 'com.google.android.material:material:1.12.0'

    // The JVM unit phase (build.json::tests.unit) runs these on every ship.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation platform('androidx.compose:compose-bom:2025.11.01')
    testImplementation 'androidx.compose.ui:ui-test-junit4'

    androidTestImplementation 'androidx.test:runner:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
